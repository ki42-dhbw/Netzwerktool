      const fileDigits = (norm.match(/\d+/g) || []).join(',');
      const aliasDigits = (best.alias.match(/\d+/g) || []).join(',');
      const labelDigits = (normalize(C.typeLabel(best.type)).match(/\d+/g) || []).join(',');
      const digitsAgree = !fileDigits || !labelDigits || fileDigits.indexOf(labelDigits) >= 0 ||
                          aliasDigits === fileDigits;
      return {
        type: best.type,
        confidence: digitsAgree ? 'hoch' : 'mittel',
        why: digitsAgree
          ? 'über bekannte Bezeichnung „' + best.alias + '“'
          : 'ähnliche Bezeichnung, aber abweichende Ziffer — bitte prüfen',
        variant: variant
      };
    }

    /* 3. Unscharf: gemeinsame Wortteile mit der Bezeichnung */
    let fuzzy = null;
    allTypes.forEach(id => {
      const labelTokens = tokens(C.typeLabel(id));
      if (!labelTokens.length) return;
      let hits = 0;
      labelTokens.forEach(lt => {
        if (lt.length < 3) return;
        if (meaningful.some(t => t === lt || (t.length > 3 && lt.indexOf(t) === 0) ||
                                  (lt.length > 3 && t.indexOf(lt) === 0))) hits++;
      });
      if (!hits) return;
      const score = hits / labelTokens.length;
      if (!fuzzy || score > fuzzy.score) fuzzy = { type: id, score: score };
    });
    if (fuzzy && fuzzy.score >= 0.5) {
      return {
        type: fuzzy.type, confidence: 'niedrig',
        why: 'nur teilweise Übereinstimmung (' + Math.round(fuzzy.score * 100) + ' %) — bitte prüfen',
        variant: variant
      };
    }
    return none;
  }

  /* ------------------------------------------------------------ Bestand */

  /** Eingebaute Sammlung aus bilder/ plus zur Laufzeit eingelesene Bilder. */
  function all() {
    const built = Array.isArray(window.__NWT_IMAGE_LIBRARY__) ? window.__NWT_IMAGE_LIBRARY__ : [];
    return built.map(e => ({ name: e.name, data: e.data, source: 'eingebaut' }))
      .concat(runtime.map(e => ({ name: e.name, data: e.data, source: 'eingelesen' })));
  }

  function isEmpty() { return all().length === 0; }

  /** Alle Bilder mit ihrem Zuordnungsvorschlag. */
  function analyze() {
    return all().map(e => {
      const m = match(e.name);
      return {
        name: e.name, data: e.data, source: e.source,
        type: m.type, confidence: m.confidence, why: m.why, variant: m.variant
      };
    });
  }

  /** Bilder, die einem Typ zugeordnet würden. */
  function candidates(typeId) {
    return analyze().filter(x => x.type === typeId);
  }

  /**
   * Bild aus der Bibliothek für einen Typ — erst die Auswahl des Anwenders
   * (project.libraryPicks), sonst der sicherste automatische Treffer.
   */
  function imageFor(typeId) {
    const picks = S.project.libraryPicks || {};
    if (cachedBuilt !== window.__NWT_IMAGE_LIBRARY__ || cachedCustom !== C.customTypes()) {
      invalidate(); cachedBuilt = window.__NWT_IMAGE_LIBRARY__; cachedCustom = C.customTypes();
    }
    const key = JSON.stringify([typeId, picks[typeId] || '']);
    if (imageCache.has(key)) return imageCache.get(key);
    const list = all();
    if (picks[typeId]) {
      const chosen = list.find(e => e.name === picks[typeId]);
      const value = chosen ? chosen.data : '';
      imageCache.set(key, value); return value;
    }
    const rank = { hoch: 3, mittel: 2, niedrig: 1 };
    let best = null;
    analyze().forEach(x => {
      if (x.type !== typeId || !x.confidence) return;
      const r = rank[x.confidence] || 0;
      /* Nur sichere Treffer werden ungefragt verwendet. */
      if (r < 3) return;
      if (!best || r > best.r) best = { r: r, data: x.data };
    });
    const value = best ? best.data : '';
    imageCache.set(key, value); return value;
  }

  function pick(typeId, filename) {
    if (!S.project.libraryPicks) S.project.libraryPicks = {};
    if (filename) S.project.libraryPicks[typeId] = filename;
    else delete S.project.libraryPicks[typeId];
    S.touch();
    NWT.emit('change', { structural: true });
  }

  /* --------------------------------------------------- Ordner einlesen */

  /** Liest eine Dateiliste (Ordnerauswahl oder Ablage) ein und verkleinert sie. */
  function importFiles(fileList) {
    const files = Array.prototype.slice.call(fileList || [])
      .filter(f => IMAGE_RE.test(f.name) || (f.type && f.type.indexOf('image/') === 0));
    if (!files.length) {
      NWT.Modal.error('In der Auswahl waren keine Bilddateien.');
      return Promise.resolve(0);
    }
    if (files.length > 400) {
      NWT.Modal.error('Es wurden ' + files.length + ' Dateien übergeben. Bitte höchstens 400 auf einmal.');
      return Promise.resolve(0);
    }

    U.toast(files.length + ' Bild(er) werden verkleinert …');
    const results = new Array(files.length);
    let next = 0;
    const worker = async () => {
      while (next < files.length) {
        const i = next++, f = files[i];
        try { const res = await NWT.Images.processFile(f); results[i] = { name: f.name, data: res.dataUrl }; }
        catch (e) { results[i] = null; }
      }
    };
    return Promise.all([worker(), worker(), worker(), worker()]).then(() => {
      const good = results.filter(Boolean);
      good.forEach(entry => {
        const i = runtime.findIndex(x => x.name === entry.name);
        if (i >= 0) runtime[i] = entry; else runtime.push(entry);
      });
      const failed = results.length - good.length;
      if (failed) U.toast(failed + ' Datei(en) konnten nicht gelesen werden.', 'warn');
      NWT.emit('library');
      return good.length;
    });
  }

  function clearRuntime() {
    runtime = [];
    NWT.emit('library');
  }

  function runtimeCount() { return runtime.length; }

  /* ------------------------------------------------------- Prüfliste */

  /**
   * Zeigt alle Bilder mit ihrem Vorschlag und lässt jede Zeile ändern.
   * onlyOpen: nur Bilder ohne sichere Zuordnung.
   */
  function reviewDialog(onlyOpen) {
    const entries = analyze();
    if (!entries.length) {
      return NWT.Modal.alert({
        title: 'Keine Bilder vorhanden',
        html: '<div class="msg-body"><p>Es sind weder Bilder eingebettet noch eingelesen.</p>' +
          '<p>Legen Sie Bilder in den Ordner <code>bilder/</code> und bauen Sie mit ' +
          '<code>node build.js</code> neu — oder lesen Sie einen Ordner über ' +
          '<b>Bildordner einlesen …</b> ein.</p></div>'
      });
    }

    const shown = onlyOpen ? entries.filter(e => e.confidence !== 'hoch') : entries;
    const opts = typeOptionsGrouped();
    const state = shown.map(e => ({ name: e.name, type: e.type, use: !!e.type }));

    const rows = shown.map((e, i) => {
      const tag = e.confidence === 'hoch' ? '<span class="tag tag-new">hoch</span>'
        : e.confidence === 'mittel' ? '<span class="tag tag-warn">mittel</span>'
        : e.confidence === 'niedrig' ? '<span class="tag tag-warn">niedrig</span>'
        : '<span class="tag tag-known">offen</span>';
      return '<tr>' +
        '<td><input type="checkbox" data-lib-use="' + i + '"' + (e.type ? ' checked' : '') + '></td>' +
        '<td><img class="lib-thumb" src="' + U.escapeHtml(e.data) + '" alt=""></td>' +
        '<td><div class="lib-file">' + U.escapeHtml(e.name) + '</div>' +
          '<div class="why">' + U.escapeHtml(e.source) +
          (e.variant ? ' · Variante ' + U.escapeHtml(e.variant) : '') + '</div></td>' +
        '<td><select data-lib-type="' + i + '">' +
          '<option value="">— nicht zuordnen —</option>' +
          buildTypeOptions(opts, e.type) + '</select></td>' +
        '<td>' + tag + '<div class="why">' + U.escapeHtml(e.why) + '</div></td>' +
      '</tr>';
    }).join('');

    return NWT.Modal.open({
      title: 'Bilder zuordnen',
      subtitle: shown.length + ' von ' + entries.length + ' Bildern' +
        (onlyOpen ? ' · nur unsichere und offene' : ''),
      width: '960px',
      bodyHtml:
        '<div class="lib-review">' +
          '<table class="dash-table wide"><thead><tr>' +
            '<th></th><th>Bild</th><th>Datei</th><th>Gerätetyp</th><th>Zuordnung</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table>' +
          '<div class="dash-note">Übernommen werden nur angehakte Zeilen. Die Zuordnung wird als ' +
          'Auswahl gespeichert, die Bilddaten bleiben in der Bibliothek — die Projektdatei wächst ' +
          'dadurch nicht.</div>' +
        '</div>',
      buttons: [
        { label: onlyOpen ? 'Alle Bilder zeigen' : 'Nur unsichere zeigen', value: { __toggle: true }, left: true },
        { label: 'Abbrechen', value: null },
        {
          label: 'Zuordnung übernehmen', primary: true,
          onClick: (api) => {
            state.forEach((s, i) => {
              const cb = api.root.querySelector('[data-lib-use="' + i + '"]');
              const sel = api.root.querySelector('[data-lib-type="' + i + '"]');
              s.use = cb ? cb.checked : false;
              s.type = sel ? sel.value : '';
            });
            return { picks: state.filter(s => s.use && s.type) };
          }
        }
      ],
      onMount: (root) => {
        /* Häkchen automatisch setzen, sobald ein Typ gewählt wird. */
        root.querySelectorAll('[data-lib-type]').forEach(sel => {
          sel.addEventListener('change', () => {
            const cb = root.querySelector('[data-lib-use="' + sel.getAttribute('data-lib-type') + '"]');
            if (cb) cb.checked = !!sel.value;
          });
        });
      }
    }).then(res => {
      if (!res) return null;
      if (res.__toggle) return reviewDialog(!onlyOpen);

      NWT.History.record('Bilder zuordnen');
      if (!S.project.libraryPicks) S.project.libraryPicks = {};
      res.picks.forEach(p => { S.project.libraryPicks[p.type] = p.name; });
      S.touch();
      NWT.emit('change', { structural: true });
      U.toast(res.picks.length + ' Zuordnung(en) übernommen', 'ok');
      return res.picks.length;
    });
  }

  function buildTypeOptions(opts, selected) {
    let out = '';
    let current = null;
    opts.forEach(o => {
      const g = o.group || '';
      if (g !== current) {
        if (current !== null) out += '</optgroup>';
        out += '<optgroup label="' + U.escapeHtml(g) + '">';
        current = g;
      }
      out += '<option value="' + U.escapeHtml(o.value) + '"' +
        (o.value === selected ? ' selected' : '') + '>' + U.escapeHtml(o.label) + '</option>';
    });
    if (current !== null) out += '</optgroup>';
    return out;
  }

  /** Gerätetypen als nach Kategorie gruppierte Auswahloptionen. */
  function typeOptionsGrouped() {
    const out = [];
    C.CATEGORIES.forEach(cat => {
      C.typesIn(cat.id).forEach(id =>
        out.push({ value: id, label: C.typeLabel(id), group: cat.label }));
    });
    return out;
  }

  return {
    ALIASES, match, normalize, tokens,
    all, isEmpty, analyze, candidates, imageFor, pick,
    importFiles, clearRuntime, runtimeCount, reviewDialog, typeOptionsGrouped
  };
})();


/* ======================= 26-setups.js ======================= */
/* ============================================================
   26 — Setups: benannte Einstellungssätze

   Ein Setup ist eine Momentaufnahme der Einstellungen, nicht des
   Netzplans. Damit lässt sich zwischen Szenarien umschalten —
   „Arbeiten“, „Präsentation“, „Druck“ — ohne das Projekt oder
   die Zeichnung anzufassen.

   Setups liegen in NWT.Prefs, also am Arbeitsplatz und nicht im
   Projekt. Nur so gelten sie über alle Projekte hinweg; genau
   dafür sind sie gedacht.

   Bewusst NICHT enthalten: Geräte, Verbindungen, eigene Symbole
   und Typbilder. Das erste ist Inhalt, das letzte wäre zu groß.
   ============================================================ */

NWT.Setups = (function () {
  const U = NWT.Util;
  const S = NWT.Store;

  /* Welche Projekteinstellungen ein Setup mitnimmt. Absichtlich ohne
     zoom/panX/panY — ein Setup soll den Bildausschnitt nicht verreißen. */
  /* privacy ist ein Objekt und wird deshalb kopiert, nicht zugewiesen —
     sonst teilten sich Setup und Projekt denselben Datensatz. */
  const KEYS = ['grid', 'snap', 'gridSize', 'routing', 'avoidObstacles', 'photos', 'hardware',
                'minimap', 'defaultConnType', 'privacy'];

  function all() {
    const raw = NWT.Prefs.get('setups', {});
    return (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
  }

  function names() { return Object.keys(all()).sort((a, b) => a.localeCompare(b, 'de')); }

  function active() { return NWT.Prefs.get('activeSetup', ''); }

  /** Aktuellen Zustand als Setup-Objekt einsammeln. */
  function capture() {
    const st = S.project.settings;
    const settings = {};
    KEYS.forEach(k => {
      if (st[k] === undefined) return;
      settings[k] = (st[k] && typeof st[k] === 'object') ? U.clone(st[k]) : st[k];
    });
    return {
      settings: settings,
      connStyles: U.clone(S.project.connStyles || {}),
      libraryPicks: U.clone(S.project.libraryPicks || {}),
      prefs: {
        tooltips: NWT.Prefs.get('tooltips', true),
        theme: NWT.Theme.get()
      },
      saved: U.nowIso()
    };
  }

  function save(name) {
    const clean = String(name || '').trim();
    if (!clean) throw new Error('Bitte einen Namen angeben.');
    if (clean.length > 60) throw new Error('Der Name ist zu lang (höchstens 60 Zeichen).');
    const list = all();
    list[clean] = capture();
    NWT.Prefs.set('setups', list);
    NWT.Prefs.set('activeSetup', clean);
    NWT.emit('setups');
    return clean;
  }

  function remove(name) {
    const list = all();
    if (!list[name]) return false;
    delete list[name];
    NWT.Prefs.set('setups', list);
    if (active() === name) NWT.Prefs.set('activeSetup', '');
    NWT.emit('setups');
    return true;
  }

  function rename(oldName, newName) {
    const clean = String(newName || '').trim();
    const list = all();
    if (!list[oldName] || !clean) return false;
    if (list[clean] && clean !== oldName) throw new Error('Ein Setup mit diesem Namen gibt es bereits.');
    list[clean] = list[oldName];
    if (clean !== oldName) delete list[oldName];
    NWT.Prefs.set('setups', list);
    if (active() === oldName) NWT.Prefs.set('activeSetup', clean);
    NWT.emit('setups');
    return true;
  }

  /** Wendet ein Setup an. Ein einziger Undo-Schritt. */
  function apply(name) {
    const setup = all()[name];
    if (!setup) return false;

    NWT.History.record('Setup „' + name + '“');
    const st = S.project.settings;
    KEYS.forEach(k => {
      const v = setup.settings && setup.settings[k];
      if (v === undefined) return;
      st[k] = (v && typeof v === 'object') ? U.clone(v) : v;
    });
    if (setup.connStyles) S.project.connStyles = U.clone(setup.connStyles);
    if (setup.libraryPicks) S.project.libraryPicks = U.clone(setup.libraryPicks);

    if (setup.prefs) {
      if (setup.prefs.tooltips !== undefined) NWT.Tooltip.setEnabled(!!setup.prefs.tooltips);
      if (setup.prefs.theme) NWT.Theme.set(setup.prefs.theme);
    }

    NWT.Prefs.set('activeSetup', name);
    S.touch();
    NWT.Viewport.apply();
    NWT.emit('change', { structural: true });
    NWT.emit('settings');
    NWT.emit('setups');
    U.toast('Setup „' + name + '“ angewendet', 'ok');
    return true;
  }

  /** Kurzbeschreibung für die Liste. */
  function describe(name) {
    const s = all()[name];
    if (!s) return '';
    const st = s.settings || {};
    const bits = [];
    bits.push(st.hardware ? 'Hardware-Ansicht' : (st.photos === false ? 'ohne Bilder' : 'Bilder'));
    bits.push(st.grid === false ? 'ohne Raster' : 'Raster');
    if (st.minimap === false) bits.push('ohne Minimap');
    if (s.prefs && s.prefs.theme && s.prefs.theme !== 'light') {
      bits.push(NWT.Theme.LABELS[s.prefs.theme] || s.prefs.theme);
    }
    if (s.prefs && s.prefs.tooltips === false) bits.push('ohne Tipps');
    if (st.privacy && st.privacy.on) bits.push('maskiert');
    const n = Object.keys(s.connStyles || {}).length;
    if (n) bits.push(n + ' eigene Verbindungsart' + (n === 1 ? '' : 'en'));
    return bits.join(' · ');
  }

  /**
   * Legt drei gebrauchsfertige Setups an, wenn noch keine da sind.
   * Sie sind ganz normale Setups — änderbar und löschbar.
   */
  function createExamples() {
    const beforeTheme = NWT.Theme.get();
    const beforeTips = NWT.Prefs.get('tooltips', true);
    const st = S.project.settings;
    const list = all();

    const make = (name, settings, prefs) => {
      list[name] = {
        settings: Object.assign({}, KEYS.reduce((o, k) => {
          o[k] = st[k]; return o;
        }, {}), settings),
        connStyles: U.clone(S.project.connStyles || {}),
        libraryPicks: U.clone(S.project.libraryPicks || {}),
        prefs: Object.assign({ tooltips: beforeTips, theme: beforeTheme }, prefs || {}),
        saved: U.nowIso()
      };
    };

    make('Arbeiten', { grid: true, snap: true, photos: true, hardware: false, minimap: true },
      { tooltips: true, theme: 'light' });
    make('Präsentation', { grid: false, snap: true, photos: true, hardware: true, minimap: false },
      { tooltips: false, theme: 'dark' });
    make('Druck', { grid: false, snap: true, photos: false, hardware: false, minimap: false },
      { tooltips: false, theme: 'light' });
    /* Für Unterlagen, die das Haus verlassen: Adressen und Namen raus,
       Struktur bleibt. */
    make('Weitergabe', { grid: false, snap: true, photos: true, hardware: false, minimap: false,
        privacy: { on: true, style: 'dots', ip: true, mac: true, host: true,
                   names: false, ports: false, labels: false, notes: false } },
      { tooltips: false, theme: 'light' });

    NWT.Prefs.set('setups', list);
    NWT.emit('setups');
    return ['Arbeiten', 'Präsentation', 'Druck', 'Weitergabe'];
  }

  return { all, names, active, capture, save, remove, rename, apply, describe, createExamples, KEYS };
})();


/* ======================= 27-decor.js ======================= */
/* ============================================================
   27 — Text und Dekoration: Schrift, Rahmen, Kreise, Pfeile

   Jede Figur ist eine reine Funktion (w, h) → Pfaddaten. Damit
   bleibt die Form die einzige Stelle, die Geometrie kennt; Render,
   Dialog und Export greifen nur darauf zu. Ebenso ist textStyle()
   die einzige Stelle, die über Schriftart, Größe und Farbe eines
   Textes entscheidet — für Textfeld, Notiz und Formbeschriftung.

   Dekoration ist kein Netzobjekt: Sie zählt nicht als Gerät, hat
   keine Ports und lässt sich nicht verbinden.
   ============================================================ */

NWT.Decor = (function () {

  /* Rundung eines abgerundeten Rechtecks — nie mehr als die halbe
     kürzere Seite, sonst überschlägt sich der Pfad. */
  function corner(w, h) { return Math.min(18, w / 2, h / 2); }

  function rect(w, h) {
    return 'M0 0 H' + w + ' V' + h + ' H0 Z';
  }

  function round(w, h) {
    const r = corner(w, h);
    return 'M' + r + ' 0 H' + (w - r) + ' A' + r + ' ' + r + ' 0 0 1 ' + w + ' ' + r +
           ' V' + (h - r) + ' A' + r + ' ' + r + ' 0 0 1 ' + (w - r) + ' ' + h +
           ' H' + r + ' A' + r + ' ' + r + ' 0 0 1 0 ' + (h - r) +
           ' V' + r + ' A' + r + ' ' + r + ' 0 0 1 ' + r + ' 0 Z';
  }

  function ellipse(w, h) {
    const rx = w / 2, ry = h / 2;
    return 'M0 ' + ry + ' A' + rx + ' ' + ry + ' 0 1 1 ' + w + ' ' + ry +
           ' A' + rx + ' ' + ry + ' 0 1 1 0 ' + ry + ' Z';
  }

  function diamond(w, h) {
    return 'M' + (w / 2) + ' 0 L' + w + ' ' + (h / 2) + ' L' + (w / 2) + ' ' + h + ' L0 ' + (h / 2) + ' Z';
  }

  function triangle(w, h) {
    return 'M' + (w / 2) + ' 0 L' + w + ' ' + h + ' L0 ' + h + ' Z';
  }

  function hexagon(w, h) {
    const q = Math.min(w / 4, h / 2);
    return 'M' + q + ' 0 H' + (w - q) + ' L' + w + ' ' + (h / 2) + ' L' + (w - q) + ' ' + h +
           ' H' + q + ' L0 ' + (h / 2) + ' Z';
  }

  function star(w, h) {
    const cx = w / 2, cy = h / 2, rx = w / 2, ry = h / 2;
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const f = i % 2 ? 0.42 : 1;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      pts.push(round2(cx + Math.cos(a) * rx * f) + ' ' + round2(cy + Math.sin(a) * ry * f));
    }
    return 'M' + pts.join(' L') + ' Z';
  }

  /* Linie und Pfeile liegen waagerecht auf halber Höhe. Andere
     Richtungen entstehen über den Drehwinkel — ein Zahlenfeld
     statt vier fast gleicher Figuren. */
  function line(w, h) {
    return 'M0 ' + (h / 2) + ' H' + w;
  }

  function headSize(w, h, sw) {
    return Math.max(6, Math.min(h / 2, w / 3, 5 + sw * 2.6));
  }

  function arrow(w, h, sw) {
    const s = headSize(w, h, sw);
    return 'M0 ' + (h / 2) + ' H' + (w - s * 1.5);
  }

  function arrow2(w, h, sw) {
    const s = headSize(w, h, sw);
    return 'M' + (s * 1.5) + ' ' + (h / 2) + ' H' + (w - s * 1.5);
  }

  /* Spitzen werden gefüllt gezeichnet, nicht als Strich — sonst
     bliebe bei dünner Linie ein hohles Dreieck übrig. */
  function arrowTip(w, h, sw) {
    const s = headSize(w, h, sw), cy = h / 2;
    return 'M' + w + ' ' + cy + ' L' + (w - s * 1.7) + ' ' + (cy - s) + ' L' + (w - s * 1.7) + ' ' + (cy + s) + ' Z';
  }

  function arrow2Tip(w, h, sw) {
    const s = headSize(w, h, sw), cy = h / 2;
    return arrowTip(w, h, sw) +
           ' M0 ' + cy + ' L' + (s * 1.7) + ' ' + (cy - s) + ' L' + (s * 1.7) + ' ' + (cy + s) + ' Z';
  }

  /* Geschweifte Klammer, Spitze links auf halber Höhe. */
  function bracket(w, h) {
    const k = Math.min(w, h / 4), m = h / 2;
    return 'M' + w + ' 0' +
           ' C' + (w - k) + ' 0 ' + (w / 2) + ' ' + (k * 0.15) + ' ' + (w / 2) + ' ' + k +
           ' L' + (w / 2) + ' ' + (m - k * 0.6) +
           ' C' + (w / 2) + ' ' + (m - k * 0.15) + ' ' + (w / 3) + ' ' + m + ' 0 ' + m +
           ' C' + (w / 3) + ' ' + m + ' ' + (w / 2) + ' ' + (m + k * 0.15) + ' ' + (w / 2) + ' ' + (m + k * 0.6) +
           ' L' + (w / 2) + ' ' + (h - k) +
           ' C' + (w / 2) + ' ' + (h - k * 0.15) + ' ' + (w - k) + ' ' + h + ' ' + w + ' ' + h;
  }

  function round2(n) { return Math.round(n * 100) / 100; }

  /* closed: kann gefüllt werden. Offene Figuren (Linie, Pfeil,
     Klammer) setzen die Beschriftung darüber, damit sie nicht auf der
     Linie liegt.
     labelTop: Rechtecke sind Rahmen um etwas — ihre Beschriftung
     gehört wie bei einem Bereich nach oben, mittig verschwände sie
     hinter dem, was sie einrahmen. Marker wie Kreis, Raute oder Stern
     tragen sie dagegen in der Mitte. */
  const FIGURES = {
    rect:     { label: 'Rechteck',        closed: true,  path: rect,  labelTop: true },
    round:    { label: 'Abgerundet',      closed: true,  path: round, labelTop: true },
    ellipse:  { label: 'Ellipse / Kreis', closed: true,  path: ellipse },
    diamond:  { label: 'Raute',           closed: true,  path: diamond },
    triangle: { label: 'Dreieck',         closed: true,  path: triangle },
    hexagon:  { label: 'Sechseck',        closed: true,  path: hexagon },
    star:     { label: 'Stern',           closed: true,  path: star },
    line:     { label: 'Linie',           closed: false, path: line },
    arrow:    { label: 'Pfeil',           closed: false, path: arrow,  tip: arrowTip },
    arrow2:   { label: 'Doppelpfeil',     closed: false, path: arrow2, tip: arrow2Tip },
    bracket:  { label: 'Geschweifte Klammer', closed: false, path: bracket }
  };

  const DEFAULT_STROKE = '#64748b';   // trägt in hellem wie dunklem Design

  /* ------------------------------------------------------- Schrift */

  /**
   * Schriftfamilien als feste Auswahl, nicht als freie Eingabe: Der
   * Anwender wählt einen Schlüssel, das Programm setzt den Stapel.
   * Eine freie Eingabe wäre ein CSS-Wert aus fremder Hand — und in
   * einer importierten Projektdatei nicht mehr vertrauenswürdig.
   *
   * Alles sind Systemschriften mit Rückfallkette. Eine Schriftdatei
   * mitzuliefern verbietet die Einzeldatei-Auslieferung ebenso wie
   * die Lizenzlage; ein Verweis ins Netz die Offline-Anforderung.
   */
  const FONTS = {
    sans:   { label: 'Serifenlos (Standard)', css: '"Segoe UI", Inter, system-ui, sans-serif' },
    serif:  { label: 'Serifen',               css: 'Georgia, "Times New Roman", Times, serif' },
    mono:   { label: 'Feste Breite',          css: 'Consolas, "SF Mono", "Courier New", monospace' },
    narrow: { label: 'Schmal',                css: '"Arial Narrow", "Liberation Sans Narrow", "Segoe UI", sans-serif' }
  };

  /* Vorgaben je Bauform — dieselben Werte wie in styles.css. Steht ein
     Wert am Element, schlägt er die Vorgabe; „zurücksetzen" heißt
     löschen, wie bei Leitungen und Bildern auch. */
  const TEXT_DEFAULTS = {
    text:  { font: 'sans', size: 15, weight: 600, align: 'middle' },
    note:  { font: 'sans', size: 11, weight: 400, align: 'start' },
    shape: { font: 'sans', size: 13, weight: 600, align: 'middle' }
  };

  function fontOptions() {
    return Object.keys(FONTS).map(id => ({ value: id, label: FONTS[id].label }));
  }

  const ALIGNS = [
    { value: 'start',  label: 'linksbündig' },
    { value: 'middle', label: 'zentriert' },
    { value: 'end',    label: 'rechtsbündig' }
  ];

  /** Wirksame Textdarstellung eines Text-, Notiz- oder Grafikelements. */
  function textStyle(d) {
    const base = TEXT_DEFAULTS[NWT.Catalog.shapeOf(d.type)] || TEXT_DEFAULTS.shape;
    const size = Number(d.fontSize);
    return {
      font: FONTS[d.font] ? d.font : base.font,
      family: (FONTS[d.font] || FONTS[base.font]).css,
      size: size > 0 ? NWT.Util.clamp(size, 6, 200) : base.size,
      weight: d.bold === undefined ? base.weight : (d.bold ? 700 : 400),
      italic: !!d.italic,
      align: ALIGNS.some(a => a.value === d.align) ? d.align : base.align,
      /* Ohne eigene Farbe bleibt die des Designs — sonst stünde nach
         einem Wechsel ins dunkle Design schwarze Schrift auf schwarz. */
      color: /^#[0-9a-f]{3,8}$/i.test(String(d.color)) ? String(d.color) : ''
    };
  }

  /* Vorschlagsfarben: bewusst mitteltonig gewählt, damit eine
     Dekoration nach dem Designwechsel nicht verschwindet. */
  const PALETTE = [
    { value: '#64748b', label: 'Grau' },
    { value: '#2563eb', label: 'Blau' },
    { value: '#0d9488', label: 'Türkis' },
    { value: '#16a34a', label: 'Grün' },
    { value: '#ca8a04', label: 'Gelb' },
    { value: '#ea580c', label: 'Orange' },
    { value: '#dc2626', label: 'Rot' },
    { value: '#9333ea', label: 'Violett' }
  ];

  function figure(id) { return FIGURES[id] || FIGURES.rect; }
  function figureId(d) { return FIGURES[d && d.figure] ? d.figure : (NWT.Catalog.type(d && d.type).figure || 'rect'); }
  function isClosed(d) { return figure(figureId(d)).closed; }

  function figureOptions() {
    return Object.keys(FIGURES).map(id => ({ value: id, label: FIGURES[id].label }));
  }

  /**
   * Wirksame Darstellung eines Dekorationselements.
   * Wie bei Leitungen gilt: der Wert am Element schlägt die
   * Katalogvorgabe, und „zurücksetzen" heißt löschen.
   */
  function styleOf(d) {
    const t = NWT.Catalog.type(d.type);
    const sw = Number(d.strokeWidth);
    const id = figureId(d);
    return {
      figure: id,
      stroke: d.stroke || t.color || DEFAULT_STROKE,
      strokeWidth: sw > 0 ? Math.min(24, sw) : 2,
      dash: d.dash || '',
      /* Offene Figuren bleiben ungefüllt: Linie, Pfeil und Klammer
         sind keine Umrisse, eine Füllung ergäbe dort einen Klecks. */
      fill: figure(id).closed ? (d.fill || 'none') : 'none',
      opacity: d.opacity == null || d.opacity === '' ? 1 : NWT.Util.clamp(Number(d.opacity), 0.05, 1),
      rot: Number(d.rot) || 0
    };
  }

  function pathFor(d, w, h) {
    const st = styleOf(d);
    return figure(st.figure).path(w, h, st.strokeWidth);
  }

  function tipFor(d, w, h) {
    const st = styleOf(d);
    const f = figure(st.figure);
    return f.tip ? f.tip(w, h, st.strokeWidth) : '';
  }

  return { FIGURES, PALETTE, DEFAULT_STROKE, FONTS, ALIGNS, TEXT_DEFAULTS,
           figure, figureId, figureOptions, isClosed, styleOf, pathFor, tipFor,
           fontOptions, textStyle };
})();


/* ======================= 28-privacy.js ======================= */
/* ============================================================
   28 — Maskierung vertraulicher Angaben

   NWT.Privacy.mask(kind, text, ctx) ist die einzige Stelle, an der
   entschieden wird, ob eine Angabe unkenntlich gemacht wird. Das
   Rendering ruft sie beim Setzen jedes sichtbaren Textes auf —
   dadurch sind Zeichenfläche, Druck und Bildexport zwangsläufig
   gleich, und es kann kein Feld vergessen werden.

   Wichtig: maskiert wird der Text selbst, nicht ein Balken darüber.
   Ein Balken über echtem Text wäre in der SVG-Datei nur Deko —
   die Angabe stünde weiterhin im Quelltext.
   ============================================================ */

NWT.Privacy = (function () {
  const U = NWT.Util;

  const DEFAULTS = {
    on: false,
    style: 'dots',
    ip: true, mac: true, host: true,
    names: false, ports: false, labels: false, notes: false
  };

  const STYLES = [
    { value: 'dots',    label: 'Punkte — 192.168.1.10 wird zu •••.•••.•.••' },
    { value: 'partial', label: 'Teilweise — 192.168.x.x, Herstellerkennung der MAC bleibt' },
    { value: 'blocks',  label: 'Balken — ██████' },
    { value: 'hide',    label: 'Weglassen — die Angabe verschwindet' }
  ];

  const GROUPS = [
    { key: 'ip',     label: 'IP-Adressen und Subnetze (IPv4, IPv6)' },
    { key: 'mac',    label: 'MAC-Adressen' },
    { key: 'host',   label: 'Hostnamen und DNS-Namen' },
    { key: 'names',  label: 'Geräte- und Bereichsnamen (durch Typ + Nummer ersetzen)' },
    { key: 'ports',  label: 'Portbezeichnungen an den Leitungen' },
    { key: 'labels', label: 'Leitungsbeschriftungen (Geschwindigkeit, VLAN, Text)' },
    { key: 'notes',  label: 'Notizen und Textfelder' }
  ];

  /* Ein einziger Ausdruck über alle vier Muster. Nacheinander
     angewandte Ausdrücke würden über bereits Maskiertes laufen:
     „192.168.x.x" sähe für die Hostnamen-Suche wie ein Rechnername
     aus und würde ein zweites Mal zerlegt.
     Reihenfolge zählt — MAC vor IPv6, beide bestehen aus Hex-Gruppen
     mit Trennern. Beim Hostnamen: erste Marke mindestens zwei
     Zeichen, Endung mindestens zwei Buchstaben, sonst gälte „1.OG"
     als Rechnername. Das bleibt eine Heuristik. */
  const RE_ALL = new RegExp([
    '\\b[0-9a-f]{2}([:-])(?:[0-9a-f]{2}\\1){4}[0-9a-f]{2}\\b',
    '\\b\\d{1,3}(?:\\.\\d{1,3}){3}(?:\\/\\d{1,2})?\\b',
    '\\b(?:[0-9a-f]{1,4}:){2,7}(?::|[0-9a-f]{1,4})(?:\\/\\d{1,3})?\\b',
    '\\b[a-z0-9][a-z0-9-]+(?:\\.[a-z0-9-]+)*\\.[a-z]{2,}\\b'
  ].join('|'), 'gi');

  const RE_IS_MAC = /^[0-9a-f]{2}([:-])(?:[0-9a-f]{2}\1){4}[0-9a-f]{2}$/i;
  const RE_IS_IP4 = /^\d{1,3}(?:\.\d{1,3}){3}(?:\/\d{1,2})?$/;

  function settings() {
    const p = NWT.Store.project.settings.privacy;
    return p && typeof p === 'object' ? p : DEFAULTS;
  }

  function active() { return !!settings().on; }

  /* -------------------------------------------------- Maskierstile */

  function dotted(s) { return s.replace(/[0-9a-z]/gi, '•'); }
  function blocked(s) { return new Array(U.clamp(s.length, 3, 14) + 1).join('█'); }

  function partial(kind, s) {
    if (kind === 'ip4') {
      const m = s.match(/^(\d{1,3})\.(\d{1,3})\./);
      return m ? m[1] + '.' + m[2] + '.x.x' : dotted(s);
    }
    if (kind === 'ip6') {
      const g = s.split(':');
      return g.length > 2 ? g[0] + ':' + g[1] + ':x' : dotted(s);
    }
    if (kind === 'mac') {
      const sep = s.indexOf('-') > -1 ? '-' : ':';
      const g = s.split(sep);
      /* Die ersten drei Bytes sind die Herstellerkennung — oft genau
         die Information, die im Plan bleiben soll. */
      return g.slice(0, 3).join(sep) + sep + 'xx' + sep + 'xx' + sep + 'xx';
    }
    return s.slice(0, 2) + '…';
  }

  function token(kind, s) {
    const st = settings().style;
    if (st === 'hide') return '';
    if (st === 'blocks') return blocked(s);
    if (st === 'partial') return partial(kind, s);
    return dotted(s);
  }

  /* ------------------------------------------------ Mustersuche */

  function kindOf(m) {
    if (RE_IS_MAC.test(m)) return 'mac';
    if (RE_IS_IP4.test(m)) return 'ip4';
    return m.indexOf(':') > -1 ? 'ip6' : 'host';
  }

  /** Ein Durchlauf über alle Muster; jede Fundstelle wird genau einmal ersetzt. */
  function scan(str) {
    const o = settings();
    if (!o.ip && !o.mac && !o.host) return String(str);
    return String(str).replace(RE_ALL, m => {
      const kind = kindOf(m);
      const wanted = kind === 'mac' ? o.mac : kind === 'host' ? o.host : o.ip;
      return wanted ? token(kind, m) : m;
    });
  }

  /** Fortlaufender Ersatzname aus Typ und laufender Nummer der ID. */
  function pseudonym(d) {
    const n = String(d.id || '').replace(/^[a-z]+_0*/, '') || '1';
    return NWT.Catalog.typeLabel(d.type) + ' ' + n;
  }

  /* ------------------------------------------------------ Zugang */

  /**
   * @param kind  name | ip | port | edgelabel | note | areatitle | areasub
   * @param text  der anzuzeigende Text
   * @param ctx   Gerät bzw. Bereich, für Ersatznamen
   */
  function mask(kind, text, ctx) {
    if (!active()) return text;
    const o = settings();
    const s = text == null ? '' : String(text);
    if (!s) return s;

    if (kind === 'name') return o.names && ctx ? pseudonym(ctx) : scan(s);
    if (kind === 'areatitle') {
      if (!o.names) return scan(s);
      const n = String(ctx && ctx.id || '').replace(/^[a-z]+_0*/, '') || '1';
      return 'Bereich ' + n;
    }
    if (kind === 'note') return o.notes ? s.replace(/\S/g, '•') : scan(s);
    if (kind === 'port') return o.ports ? token('host', s) : scan(s);
    if (kind === 'edgelabel') return o.labels ? '' : scan(s);
    return scan(s);
  }

  /** Enthält der Plan überhaupt etwas, das eine Maskierung lohnt? */
  function hasSensitive() {
    return NWT.Store.project.devices.some(d => d.ip || d.ipv6 || d.mac || d.hostname);
  }

  /**

/* Sicherungsverlauf in IndexedDB: transaktional, mit gemeinsam abgelegten Bildern.
   Der bisherige Browser-Speicher bleibt lesbar; alte Sicherungen werden kopiert. */
NWT.Recovery = (function () {
  const U = NWT.Util;
  let database = null, queue = Promise.resolve(), lastAuto = 0, archiveError = '';
  function ready() {
    if (database) return database;
    database = new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open('nwt-recovery', 1); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        db.createObjectStore('snapshots', { keyPath: 'id' });
        db.createObjectStore('assets', { keyPath: 'id' });
        db.createObjectStore('meta');
      };
      req.onsuccess = () => { req.result.onversionchange = () => req.result.close(); resolve(req.result); };
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('Sicherungsdatenbank wird durch ein anderes Fenster blockiert.'));
    });
    database.catch(() => { database = null; });
    return database;
  }
  function done(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = resolve;
      tx.onerror = tx.onabort = () => reject(tx.error || new Error('Sicherung abgebrochen.'));
    });
  }
  function request(req) { return new Promise((resolve, reject) => { req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); }
  async function pack(project) {
    const data = [], ids = new Map();
    const json = JSON.stringify(project, (key, value) => {
      if (typeof value !== 'string' || !/^data:image\//i.test(value)) return value;
      if (!ids.has(value)) { ids.set(value, data.length); data.push(value); }
      return { __recoveryImage: ids.get(value) };
    });
    const assets = await Promise.all(data.map(async value => {
      const bytes = new TextEncoder().encode(value);
      const hash = await crypto.subtle.digest('SHA-256', bytes);
      const id = Array.from(new Uint8Array(hash)).map(n => n.toString(16).padStart(2, '0')).join('');
      return { id: id, data: value };
    }));
    return { json: json, assets: assets };
  }
  function capture(reason, automatic, project) {
    if (automatic && Date.now() - lastAuto < 30000) return Promise.resolve(false);
    const data = NWT.Model.serialize(project || NWT.Store.project);
    const work = async () => {
      const packed = await pack(data), db = await ready();
      const tx = db.transaction(['snapshots', 'assets'], 'readwrite');
      const finished = done(tx), snapshots = tx.objectStore('snapshots');
      const entry = { id: Date.now().toString(36) + '_' + Math.random().toString(36).slice(2),
        name: data.name, at: U.nowIso(), reason: reason, json: packed.json, assets: packed.assets.map(a => a.id) };
      packed.assets.forEach(a => tx.objectStore('assets').put(a));
      snapshots.put(entry);
      const allReq = snapshots.getAll();
      allReq.onsuccess = () => {
        const all = allReq.result.sort((a, b) => b.at.localeCompare(a.at));
        all.slice(30).forEach(e => snapshots.delete(e.id));
        const used = new Set();
        all.slice(0, 30).forEach(e => e.assets.forEach(id => used.add(id)));
        const cursor = tx.objectStore('assets').openKeyCursor();
        cursor.onsuccess = () => { const c = cursor.result; if (c) { if (!used.has(c.key)) tx.objectStore('assets').delete(c.key); c.continue(); } };
      };
      await finished;
      lastAuto = Date.now(); archiveError = '';
      NWT.emit('recovery:status');
      return true;
    };
    const result = queue.catch(() => {}).then(work);
    queue = result;
    result.catch(e => { archiveError = e.message; NWT.emit('recovery:status'); });
    return result;
  }
  async function list() {
    await queue.catch(() => {});
    const db = await ready();
    return (await request(db.transaction('snapshots').objectStore('snapshots').getAll())).sort((a, b) => b.at.localeCompare(a.at));
  }
  async function load(id) {
    const db = await ready(), tx = db.transaction(['snapshots', 'assets']);
    const entry = await request(tx.objectStore('snapshots').get(id));
    if (!entry) throw new Error('Die Sicherung wurde nicht gefunden.');
    // Neue Transaktion, da ein Browser die vorherige nach dem await abschließen darf.
    const assetTx = db.transaction('assets');
    const assets = await Promise.all(entry.assets.map(key => request(assetTx.objectStore('assets').get(key))));
    const raw = JSON.parse(entry.json, (key, value) => {
      if (value && typeof value === 'object' && Object.keys(value).length === 1 && Number.isInteger(value.__recoveryImage)) {
        const asset = assets[value.__recoveryImage];
        if (!asset) throw new Error('Ein Bild der Sicherung fehlt.');
        return asset.data;
      }
      return value;
    });
    return NWT.Model.validate(raw);
  }
  async function remove(id) {
    const db = await ready(), tx = db.transaction('snapshots', 'readwrite'), finished = done(tx);
    tx.objectStore('snapshots').delete(id); await finished;
  }
  async function open() {
    try {
      const entries = await list();
      let bytes = 0;
      try { Object.keys(localStorage).forEach(k => { if (k.startsWith('nwt.')) bytes += (k.length + localStorage.getItem(k).length) * 2; }); } catch (e) {}
      let capacity = '';
      if (navigator.storage && navigator.storage.estimate) {
        const estimate = await navigator.storage.estimate();
        capacity = ' · Browserbudget: ' + NWT.Images.formatBytes(estimate.usage || 0) + ' / ' + NWT.Images.formatBytes(estimate.quota || 0);
      }
      const html = '<p>Bis zu 30 Wiederherstellungspunkte. Browser-Projekte: ca. ' + NWT.Images.formatBytes(bytes) + U.escapeHtml(capacity) +
        '. Eine JSON-Datei dient als unabhängige Sicherung.</p>' + (archiveError ? '<p>' + U.escapeHtml(archiveError) + '</p>' : '') +
        '<div class="review-scroll"><table class="review-table"><thead><tr><th>Projekt</th><th>Zeitpunkt</th><th>Anlass</th><th>Aktionen</th></tr></thead><tbody>' +
        entries.map(e => '<tr><td>' + U.escapeHtml(e.name) + '</td><td>' + U.escapeHtml(U.formatDate(e.at)) + '</td><td>' + U.escapeHtml(e.reason) +
          '</td><td><button type="button" data-restore="' + e.id + '">Wiederherstellen</button> <button type="button" data-remove="' + e.id + '">Löschen</button></td></tr>').join('') +
        '</tbody></table></div>';
      const action = await NWT.Modal.open({ title: 'Sicherungsverlauf', width: '1000px', bodyHtml: html,
        buttons: [{ label: 'Jetzt sichern', value: 'capture' }, { label: 'JSON exportieren', value: 'export' }, { label: 'Schließen', value: null }],
        onMount: (root, api) => {
          root.querySelectorAll('[data-restore]').forEach(b => b.onclick = () => api.close({ restore: b.dataset.restore }));
          root.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => api.close({ remove: b.dataset.remove }));
        } });
      if (!action) return;
      if (action === 'capture') { await capture('Manueller Wiederherstellungspunkt'); return open(); }
      if (action === 'export') return NWT.Exchange.exportJson();
      if (action.remove) {
        if (await NWT.Modal.confirm({ title: 'Sicherung löschen?', message: 'Diesen Wiederherstellungspunkt entfernen?', danger: true })) await remove(action.remove);
        return open();
      }
      if (action.restore) {
        const result = await load(action.restore);
        await NWT.ProjectFlow.replace(() => { NWT.Store.setProject(result.project); NWT.Persistence.markDirty(); }, 'Sicherung wiederherstellen');
      }
    } catch (e) { NWT.Modal.error('Der Sicherungsverlauf ist nicht verfügbar. Bitte JSON exportieren.', e.message); }
  }
  async function init() {
    try {
      const db = await ready();
      const migrated = await request(db.transaction('meta').objectStore('meta').get('legacyImported'));
      if (!migrated) {
        const keys = Object.keys(localStorage).filter(k => k === 'nwt.autosave' || k.startsWith('nwt.project.'));
        for (const key of keys) {
          let project;
          try { project = NWT.Model.validate(JSON.parse(localStorage.getItem(key))).project; }
          catch (e) { continue; /* Unlesbare Altdateien bleiben für manuelle Rettung erhalten. */ }
          // Schreibfehler brechen die Migration ab: beim nächsten Start erneut versuchen.
          await capture('Aus bisherigem Browser-Speicher übernommen', false, project);
        }
        const tx = db.transaction('meta', 'readwrite'), finished = done(tx);
        tx.objectStore('meta').put(true, 'legacyImported'); await finished;
      }
    } catch (e) { archiveError = e.message; NWT.emit('recovery:status'); }
  }
  return { init, capture, list, load, remove, open, ready, error: () => archiveError };
})();

NWT.ProjectFlow = (function () {
  let busy = false;
  async function replace(action, title) {
    if (busy) return false;
    busy = true;
    try {
      const P = NWT.Persistence, S = NWT.Store;
      if (P.status().dirty) {
        const choice = await NWT.Modal.open({ title: title || 'Projekt wechseln',
          bodyHtml: '<p>Das aktuelle Projekt enthält Änderungen. Vor dem Wechsel im Browser sichern?</p>',
          buttons: [{ label: 'Abbrechen', value: null }, { label: 'Verwerfen', value: 'discard' }, { label: 'Sichern', value: 'save', primary: true }] });
        if (!choice) return false;
        if (choice === 'save' && !await NWT.Commands.saveProject()) return false;
      }
      if (S.project.devices.length || S.project.areas.length || S.project.customTypes.length) {
        try { await NWT.Recovery.capture('Vor Projektwechsel'); }
        catch (e) {
          if (!await NWT.Modal.confirm({ title: 'Wiederherstellungskopie fehlgeschlagen', message: 'Bitte bei Bedarf zuvor JSON exportieren. Trotzdem wechseln?', confirmLabel: 'Wechseln' })) return false;
        }
      }
      P.autosave.cancel();
      await action();
      return true;
    } finally { busy = false; }
  }
  return { replace };
})();

NWT.Workbench = (function () {

    const findings = [], addresses = new Map(), occupied = new Map();
    const add = (kind, message, ids) => findings.push({ kind: kind, message: message, ids: ids || [] });
    devices().forEach(d => {
      Net.interfaces(d).forEach(i => {
        [i.ip, i.ipv6].filter(Boolean).forEach(value => {
          const normalized = Net.normalizeIp(value);
          if (!normalized || (String(value).includes('/') && !validPrefix(value))) add('Warnung', d.name + ': ungültige IP-Adresse „' + value + '“.', [d.id]);
          else {
            if (!addresses.has(normalized)) addresses.set(normalized, []);
            addresses.get(normalized).push({ device: d, iface: i });
          }
        });
        if (i.mac && !/^(?:[0-9a-f]{2}[:-]){5}[0-9a-f]{2}$/i.test(i.mac)) add('Warnung', d.name + ': MAC-Adresse prüfen („' + i.mac + '“).', [d.id]);
        if (i.vlan && !String(i.vlan).split(/[,;\s]+/).every(v => {
          const range = v.split('-').map(Number); return range.length <= 2 && range.every(n => Number.isInteger(n) && n >= 1 && n <= 4094) && (range.length === 1 || range[0] <= range[1]);
        })) add('Hinweis', d.name + ': VLAN-Angabe „' + i.vlan + '“ ist keine Liste aus IDs 1–4094.', [d.id]);
        if (i.port && !d.ports.some(p => p.name === i.port)) add('Warnung', d.name + ': Schnittstelle verweist auf unbekannten Port „' + i.port + '“.', [d.id]);
      });
      const names = new Set();
      d.ports.forEach(p => { if (names.has(p.name)) add('Warnung', d.name + ': Portname „' + p.name + '“ ist doppelt.', [d.id]); names.add(p.name); });
      if (!S.connectionsOf(d.id).length) add('Hinweis', d.name + ': keine Verbindung dokumentiert.', [d.id]);
    });
    addresses.forEach((entries, ip) => {
      const ids = Array.from(new Set(entries.map(e => e.device.id)));
      if (entries.length > 1) add('Warnung', 'IP-Adresse ' + ip + ' mehrfach vergeben: ' + entries.map(e => e.device.name + ' / ' + e.iface.name).join(', '), ids);
    });
    S.project.connections.forEach(c => {
      const a = S.dev(c.source), b = S.dev(c.target);
      if (!a || !b) { add('Fehler', 'Verbindung ' + c.id + ': Endpunkt fehlt.', [c.id]); return; }
      [[a, c.sourcePort], [b, c.targetPort]].forEach(pair => {
        const d = pair[0], port = pair[1]; if (!port) return;
        if (!d.ports.some(p => p.name === port)) add('Warnung', d.name + ': Verbindung nutzt unbekannten Port „' + port + '“.', [d.id, c.id]);
        const key = JSON.stringify([d.id, port]);
        if (!occupied.has(key)) occupied.set(key, []);
        occupied.get(key).push(c.id);
      });
      if (c.type !== 'logical') {

        const bi = Net.interfaces(b).find(i => i.port === c.targetPort && i.ip) || Net.interfaces(b)[0];
        const na = Net.cidr(ai.ip), nb = Net.cidr(bi.ip);

    const tables = masked ? '<p>Inventar und Projektdaten sind in dieser maskierten Ausgabe ausgelassen.</p>' :
      '<p>' + esc(S.project.info.description) + '</p>' + ['devices', 'interfaces', 'ports', 'connections', 'checks'].map(tab => '<h2>' + TABS[tab] + '</h2>' + table(rows(tab), false)).join('');
    const safeSvg = masked ? svg.replace(/<title>[\s\S]*?<\/title>/, '<title>Netzwerkbericht</title>') : svg;
    return '<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(title) + '</title>' +
      '<style>body{font:14px system-ui;color:#172033;background:white;margin:28px}h1{font-size:24px}h2{margin-top:32px}.diagram svg{max-width:100%;height:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #64748b;padding:6px;text-align:left;overflow-wrap:anywhere}tr{break-inside:avoid}thead{display:table-header-group}@media print{body{margin:0}.diagram{break-after:page}h2{break-after:avoid}}</style>' +
      '<h1>' + esc(title) + '</h1><p>Erstellt: ' + esc(U.formatDate(U.nowIso())) + ' · Beobachtungen sind Momentaufnahmen, keine Live-Überwachung.</p><div class="diagram">' + safeSvg + '</div>' + tables + '</html>';
  }
  async function exportReport() {
    const result = await NWT.Modal.form({ title: 'Bericht exportieren', fields: [{ key: 'masked', label: 'Maskierte Zeichnung ohne Inventartabellen', type: 'checkbox', wide: true }],
      subtitle: 'Der HTML-Bericht lässt sich offline öffnen und über den Browser drucken oder als PDF speichern. Gerätefotos können weiterhin Angaben enthalten.',
      values: { masked: NWT.Privacy.active() }, submitLabel: 'Exportieren' });
    if (!result) return;
    U.downloadBlob(new Blob([reportHtml(result.masked)], { type: 'text/html;charset=utf-8' }), (result.masked ? 'netzwerk_maskiert' : U.slugify(S.project.name)) + '_bericht.html');
  }
  return { open, check, rows, editInterfaces, reportHtml, exportReport };
})();


/* ======================= 31-layout.js ======================= */
/* Hierarchische Anordnung und rechtwinklige Umwege um Gerätekacheln. */
NWT.Layout = (function () {
  const S = NWT.Store, U = NWT.Util, C = NWT.Catalog;
  function arrange(options) {
    const opts = options || {};
    const chosen = S.project.devices.filter(d => (C.shapeOf(d.type) === 'device' || C.shapeOf(d.type) === 'junction') && S.isVisible(d) && (!opts.selection || S.selection.has(d.id)));
    if (!chosen.length) return 0;
    const ids = new Set(chosen.map(d => d.id)), adjacent = new Map(chosen.map(d => [d.id, new Set()]));
    S.project.connections.forEach(c => { if (ids.has(c.source) && ids.has(c.target)) { adjacent.get(c.source).add(c.target); adjacent.get(c.target).add(c.source); } });
    const membership = S.project.areas.map(a => ({ area: a, members: S.project.devices.filter(d => {
      const r = S.deviceRect(d); return U.pointInRect(r.x + r.w / 2, r.y + r.h / 2, a);
    }) }));
    const waiting = new Set(ids), placements = new Map();
    let componentX = 80;
    while (waiting.size) {
      const order = Array.from(waiting).sort((a, b) => {
        const score = id => (['router', 'firewall', 'internet', 'switch_l3'].includes(S.dev(id).type) ? 10000 : 0) + adjacent.get(id).size;
        return score(b) - score(a) || a.localeCompare(b);
      });
      const queue = [{ id: order[0], depth: 0 }], levels = [];
      waiting.delete(order[0]);
      for (let i = 0; i < queue.length; i++) {
        const item = queue[i];
        if (!levels[item.depth]) levels[item.depth] = [];
        levels[item.depth].push(S.dev(item.id));
        adjacent.get(item.id).forEach(id => { if (waiting.delete(id)) queue.push({ id: id, depth: item.depth + 1 }); });
      }
      const widths = levels.map(level => level.reduce((n, d) => n + S.deviceRect(d).w + 70, -70));
      const componentWidth = Math.max.apply(null, widths);
      let y = 80;
      levels.forEach((level, depth) => {
        let x = componentX + (componentWidth - widths[depth]) / 2, height = 0;
        level.forEach(d => { const r = S.deviceRect(d); placements.set(d.id, { x: Math.round(x / 20) * 20, y: y }); x += r.w + 70; height = Math.max(height, r.h); });
        y += Math.ceil((height + 100) / 20) * 20;
      });
      componentX += componentWidth + 160;
    }
    NWT.History.record('Netzplan automatisch anordnen');
    chosen.forEach(d => Object.assign(d, placements.get(d.id)));
    membership.forEach(group => {
      if (!group.members.length || group.members.some(d => !ids.has(d.id))) return;
      const rects = group.members.map(d => S.deviceRect(d));
      const x = Math.min.apply(null, rects.map(r => r.x)) - 30, y = Math.min.apply(null, rects.map(r => r.y)) - 50;
      Object.assign(group.area, { x: x, y: y, w: Math.max.apply(null, rects.map(r => r.x + r.w)) - x + 30, h: Math.max.apply(null, rects.map(r => r.y + r.h)) - y + 30 });
    });
    if (opts.clearPoints !== false) S.project.connections.forEach(c => { if (ids.has(c.source) && ids.has(c.target)) c.points = []; });
    S.project.settings.avoidObstacles = true;
    S.touch(); NWT.emit('change', { structural: true }); NWT.Viewport.zoomToFit();
    return chosen.length;
  }
  function crosses(a, b, r) {
    if (Math.abs(a.x - b.x) < 0.01) return a.x > r.x && a.x < r.x + r.w && Math.max(a.y, b.y) > r.y && Math.min(a.y, b.y) < r.y + r.h;
    if (Math.abs(a.y - b.y) < 0.01) return a.y > r.y && a.y < r.y + r.h && Math.max(a.x, b.x) > r.x && Math.min(a.x, b.x) < r.x + r.w;
    return true;
  }
  function avoid(conn, original) {
    if (!S.project.settings.avoidObstacles || original.length < 2) return original;
    const obstacles = S.project.devices.filter(d => d.id !== conn.source && d.id !== conn.target && S.isVisible(d) && C.shapeOf(d.type) === 'device')
      .map(d => { const r = S.deviceRect(d); return { x: r.x - 14, y: r.y - 14, w: r.w + 28, h: r.h + 28 }; });
    const clear = points => points.every((p, i) => !i || !obstacles.some(r => crosses(points[i - 1], p, r)));
    if (clear(original)) return original;
    const a = original[0], b = original[original.length - 1];
    const blocking = obstacles.filter(r => original.some((p, i) => i && crosses(original[i - 1], p, r)));
    const candidates = [];
    blocking.slice(0, 40).forEach(r => {
      [r.y - 4, r.y + r.h + 4].forEach(y => candidates.push([a, { x: a.x, y: y }, { x: b.x, y: y }, b]));
      [r.x - 4, r.x + r.w + 4].forEach(x => candidates.push([a, { x: x, y: a.y }, { x: x, y: b.y }, b]));
    });
    const length = p => p.reduce((sum, v, i) => sum + (i ? Math.abs(v.x - p[i - 1].x) + Math.abs(v.y - p[i - 1].y) : 0), 0);
    const result = candidates.filter(clear).sort((x, y) => length(x) - length(y))[0];
    return result || original;
  }
  async function open() {
    const result = await NWT.Modal.form({ title: 'Netzplan automatisch anordnen', subtitle: 'Verbundene Geräte werden in Ebenen angeordnet. Die Änderung lässt sich mit einem Undo-Schritt zurücknehmen.',
      fields: [{ key: 'selection', label: 'Nur ausgewählte Geräte anordnen', type: 'checkbox', wide: true },
        { key: 'clearPoints', label: 'Manuelle Leitungsknoten zwischen angeordneten Geräten zurücksetzen', type: 'checkbox', wide: true }],
      values: { selection: false, clearPoints: true }, submitLabel: 'Anordnen' });
    if (result) U.toast(arrange(result) + ' Geräte angeordnet');
  }
  return { arrange, avoid, open };
})();


/* ======================= 99-app.js ======================= */
/* ============================================================
   16 — Start: Initialisierung und Fehlerbehandlung
   ============================================================ */

(function () {
  const U = NWT.Util;
  const S = NWT.Store;

  let fatalShown = false;
  function fatal(message, detail) {
    console.error('[NWT]', message, detail);
    if (fatalShown) return;
    fatalShown = true;
    try {
      NWT.Modal.error('Es ist ein unerwarteter Fehler aufgetreten. ' +
        'Die zuletzt automatisch gesicherte Fassung bleibt erhalten.', detail);
    } catch (e) {
      window.alert('Unerwarteter Fehler: ' + message);
    }
    setTimeout(() => { fatalShown = false; }, 4000);
  }

  window.addEventListener('error', e => fatal(e.message, e.filename + ':' + e.lineno));
  window.addEventListener('unhandledrejection', e => {
    const r = e.reason;
    fatal('Nicht behandelte Zusage', r && r.message ? r.message : String(r));
  });

  function boot() {
    try {
      NWT.Theme.init();
      NWT.Modal.init();
      NWT.Viewport.init();
      NWT.Render.init();
      NWT.Interaction.init();
      NWT.Exchange.init();
      NWT.Sidebar.init();
      NWT.Minimap.init();
      NWT.Images.init();
      NWT.Analysis.init();
      NWT.Settings.init();
      NWT.Tooltip.init();
      NWT.UI.init();
      NWT.Persistence.init();
      NWT.Recovery.init();
    } catch (e) {
      fatal('Initialisierung fehlgeschlagen', e.message);
      return;
    }

    /* Zentrale Render-Kopplung: strukturelle Änderungen zeichnen alles neu. */
    NWT.on('change', payload => {
      if (!payload || payload.structural) NWT.Render.all();
    });
    NWT.on('selection', () => NWT.Render.selection());
    NWT.on('project:replaced', () => {
      NWT.Render.clearOverlay();
      NWT.Render.all();
    });

    NWT.Catalog.setCustom(S.project.customTypes || []);
    NWT.Symbols.syncDefs();
    S.reindex();

    /* Automatisch gesicherten Stand wiederherstellen. */
    let restored = false;
    try {
      if (NWT.Persistence.hasAutosave()) {
        const result = NWT.Persistence.restoreAutosave();
        if (result) {
          S.setProject(result.project);
          restored = true;
        }
      }
    } catch (e) {
      console.warn('[NWT] Wiederherstellung übersprungen.', e);
    }

    NWT.Viewport.apply();
    NWT.Render.all();
    NWT.UI.updateTitle();
    NWT.UI.updateStatus();
    NWT.emit('ui:minimap');
    if (!restored) NWT.Persistence.markSaved(false);

    if (restored) {
      U.toast('Automatisch gesicherter Stand wiederhergestellt: ' + S.project.name, 'ok', 4000);
    } else if (!S.project.devices.length) {
      /* Erststart: kurzer Hinweis statt leerer Fläche. */
      setTimeout(() => {
        U.toast('Komponenten aus der linken Leiste auf die Fläche ziehen — oder F1 für Hilfe.', '', 6000);
      }, 700);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
