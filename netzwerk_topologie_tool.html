/* ============================================================
   06 — Rendering (SVG)
   all()      … strukturelle Synchronisation (Diff über IDs)
   moveNode() … schnelle Einzelaktualisierung beim Ziehen
   ============================================================ */

NWT.Render = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const C = NWT.Catalog;
  const G = NWT.Geometry;
  const svgEl = U.svgEl;

  let lAreas, lEdges, lNodes, lOverlay, lDeco, lDecoFront;
  const nodeEls = new Map();
  const edgeEls = new Map();
  const areaEls = new Map();

  function init() {
    lAreas = U.el('#l-areas');
    lDeco = U.el('#l-deco');
    lEdges = U.el('#l-edges');
    lNodes = U.el('#l-nodes');
    lDecoFront = U.el('#l-deco-front');
    lOverlay = U.el('#l-overlay');
  }

  /** Maskierung vertraulicher Angaben — siehe 28-privacy.js. */
  function mask(kind, text, ctx) { return NWT.Privacy.mask(kind, text, ctx); }

  /* -------------------------------------------------- generischer Diff */
  function sync(layer, items, cache, create, update) {
    const alive = new Set();
    items.forEach(item => {
      let el = cache.get(item.id);
      if (!el || !el.isConnected) {
        el = create(item);
        el.setAttribute('data-id', item.id);
        cache.set(item.id, el);
        layer.appendChild(el);
      }
      update(el, item);
      alive.add(item.id);
    });
    cache.forEach((el, id) => {
      if (!alive.has(id)) { el.remove(); cache.delete(id); }
    });
    /* Z-Reihenfolge an die Datenreihenfolge angleichen. */
    items.forEach((item, i) => {
      const el = cache.get(item.id);
      if (layer.children[i] !== el) layer.insertBefore(el, layer.children[i] || null);
    });
  }

  /**
   * Wie sync(), verteilt die Elemente aber auf mehrere Ebenen aus einem
   * gemeinsamen Zwischenspeicher. Geräte liegen zwischen den beiden
   * Dekorationsebenen — Dekoration soll das Netz nicht verdecken.
   *
   * signature erzwingt einen Neuaufbau, wenn sich die Bauform geändert
   * hat: aus einem Gerät kann per Typwechsel eine Notiz werden, und
   * deren Aufbau ist ein völlig anderer.
   */
  function syncGroups(groups, cache, create, update, signature) {
    const alive = new Set();
    groups.forEach(g => g.items.forEach(item => {
      let el = cache.get(item.id);
      if (el && signature && el.getAttribute('data-shape') !== signature(item)) {
        el.remove(); cache.delete(item.id); el = null;
      }
      if (!el || !el.isConnected) {
        el = create(item);
        el.setAttribute('data-id', item.id);
        if (signature) el.setAttribute('data-shape', signature(item));
        cache.set(item.id, el);
      }
      if (el.parentNode !== g.layer) g.layer.appendChild(el);
      update(el, item);
      alive.add(item.id);
    }));
    cache.forEach((el, id) => {
      if (!alive.has(id)) { el.remove(); cache.delete(id); }
    });
    groups.forEach(g => g.items.forEach((item, i) => {
      const el = cache.get(item.id);
      if (g.layer.children[i] !== el) g.layer.insertBefore(el, g.layer.children[i] || null);
    }));
  }

  /* ----------------------------------------------------------- Geräte */

  function createNode(d) {
    const shape = C.shapeOf(d.type);
    const g = svgEl('g', { class: 'node' });
    g.setAttribute('tabindex', '0');
    g.setAttribute('role', 'button');
    g.addEventListener('keydown', e => {
      const id = g.getAttribute('data-id');
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault(); e.stopPropagation(); S.select(id);
        if (e.key === 'Enter') NWT.Dialogs.editDevice(id);
      } else if (e.key.indexOf('Arrow') === 0 && !S.selection.has(id)) S.select(id);
    });
    if (shape === 'text') {
      g.classList.add('node-text');
      g.appendChild(svgEl('rect', { class: 'node-hit', fill: 'transparent', x: 0, y: 0 }));
      g.appendChild(svgEl('rect', { class: 'node-halo', rx: 8 }));
      g.appendChild(svgEl('text', { class: 'nt-body' }));
      /* Kein Ziehgriff: die Kachel folgt dem Text, nicht umgekehrt. */
    } else if (shape === 'note') {
      g.classList.add('node-note');
      g.appendChild(svgEl('rect', { class: 'node-halo', rx: 10 }));
      g.appendChild(svgEl('path', { class: 'note-box' }));
      g.appendChild(svgEl('text', { class: 'nt-body' }));
      g.appendChild(svgEl('rect', { class: 'node-handle', width: 12, height: 12, rx: 3 }));
    } else if (shape === 'junction') {
      g.classList.add('node-junction');
      /* Großzügige Trefferfläche: der sichtbare Punkt ist zu klein
         zum Greifen. */
      g.appendChild(svgEl('circle', { class: 'node-hit', fill: 'transparent', r: 13,
                                      cx: C.JUNCTION / 2, cy: C.JUNCTION / 2 }));
      g.appendChild(svgEl('circle', { class: 'node-halo', r: 12,
                                      cx: C.JUNCTION / 2, cy: C.JUNCTION / 2 }));
      g.appendChild(svgEl('circle', { class: 'junction-dot', r: C.JUNCTION / 2 - 2.5,
                                      cx: C.JUNCTION / 2, cy: C.JUNCTION / 2 }));
    } else if (shape === 'shape') {
      g.classList.add('node-decor');
      /* Trefferfläche getrennt vom sichtbaren Pfad: ein Rahmen ohne
         Füllung wäre sonst nur auf der Linie selbst anklickbar. */
      g.appendChild(svgEl('rect', { class: 'node-hit', fill: 'transparent', x: 0, y: 0 }));
      g.appendChild(svgEl('rect', { class: 'node-halo', rx: 8 }));
      g.appendChild(svgEl('path', { class: 'decor-shape' }));
      g.appendChild(svgEl('path', { class: 'decor-tip' }));
      g.appendChild(svgEl('text', { class: 'decor-label' }));
      g.appendChild(svgEl('rect', { class: 'node-handle', width: 12, height: 12, rx: 3 }));
    } else {
      g.appendChild(svgEl('rect', { class: 'node-halo', x: -5, y: -5, width: C.NODE_W + 10, height: C.NODE_H + 10, rx: 14 }));
      g.appendChild(svgEl('rect', { class: 'node-box', x: 0, y: 0, width: C.NODE_W, height: C.NODE_H, rx: 10 }));
      g.appendChild(svgEl('rect', { class: 'node-accent', x: 12, y: 0, width: C.NODE_W - 24, height: 3.5, rx: 1.75 }));
      /* Bildstreifen: Foto/Typbild als <image>, Hardware-Ansicht als <use>. */
      g.appendChild(svgEl('image', {
        class: 'node-photo', x: 6, y: 6, width: C.NODE_W - 12, height: C.PHOTO_H - 10,
        preserveAspectRatio: 'xMidYMid slice', 'clip-path': 'url(#clip-node-photo)'
      }));
      g.appendChild(svgEl('use', {
        class: 'node-hw', x: 6, y: 6, width: C.NODE_W - 12, height: C.PHOTO_H - 10,
        'clip-path': 'url(#clip-node-photo)'
      }));
      const body = svgEl('g', { class: 'node-body' });
      body.appendChild(svgEl('use', { class: 'node-icon', x: C.NODE_W / 2 - 13, y: 13, width: 26, height: 26 }));
      body.appendChild(svgEl('image', {
        class: 'node-icon-img', x: C.NODE_W / 2 - 14, y: 12, width: 28, height: 28,
        preserveAspectRatio: 'xMidYMid meet'
      }));
      body.appendChild(svgEl('text', { class: 'node-name', x: C.NODE_W / 2, y: 55 }));
      body.appendChild(svgEl('text', { class: 'node-type', x: C.NODE_W / 2, y: 68 }));
      body.appendChild(svgEl('text', { class: 'node-ip', x: C.NODE_W / 2, y: 81 }));
      g.appendChild(body);
      g.appendChild(svgEl('circle', { class: 'node-status', cx: C.NODE_W - 13, cy: 13, r: 4.5 }));
    }
    return g;
  }

  /** Lage und Drehung einer Kachel. Auch moveNode() geht hierüber. */
  function nodeTransform(d) {
    const base = 'translate(' + d.x + ' ' + d.y + ')';
    const rot = Number(d.rot) || 0;
    if (!rot || C.shapeOf(d.type) !== 'shape') return base;
    const r = S.deviceRect(d);
    return base + ' rotate(' + rot + ' ' + (r.w / 2) + ' ' + (r.h / 2) + ')';
  }

  function placeHandle(g, r) {
    const h = g.querySelector('.node-handle');
    if (h) { h.setAttribute('x', r.w - 6); h.setAttribute('y', r.h - 6); }
  }

  /**
   * Schrift auf ein <text> legen. Als Inline-Stil, nicht als Attribut:
   * eine Regel in styles.css würde ein Präsentationsattribut
   * überstimmen, ein Inline-Stil schlägt sie.
   *
   * Die Farbe wird nur gesetzt, wenn der Anwender eine gewählt hat —
   * sonst bleibt die des Designs, und ein Wechsel ins Dunkle ergibt
   * keine schwarze Schrift auf schwarzem Grund.
   */
  function applyTextStyle(el, d, fallbackColor) {
    const ts = NWT.Decor.textStyle(d);
    el.style.fontFamily = ts.family;
    el.style.fontSize = ts.size + 'px';
    el.style.fontWeight = ts.weight;
    el.style.fontStyle = ts.italic ? 'italic' : 'normal';
    el.style.textAnchor = ts.align;
    const color = ts.color || fallbackColor || '';
    if (color) el.style.fill = color;
    else el.style.removeProperty('fill');
    return ts;
  }

  /**
   * Kachelmaße eines Textfelds aus dem tatsächlich gesetzten Text.
   * Schreibt ins Modell zurück, damit Ankerpunkte, Auswahlrechteck und
   * Export dieselbe Größe sehen wie das Auge.
   */
  function fitTextBox(d, tx, ts) {
    let w;
    try { w = tx.getBBox().width; } catch (e) { return; }   /* unsichtbar */
    const nw = Math.max(40, Math.round(w + 14));
    const nh = Math.max(22, Math.round(ts.size * 1.9));
    if (Math.abs((d.w || 0) - nw) > 1) d.w = nw;
    if (Math.abs((d.h || 0) - nh) > 1) d.h = nh;
  }

  /** x-Lage einer Zeile aus der Ausrichtung, mit Innenabstand. */
  function anchorX(align, w, pad) {
    return align === 'start' ? pad : align === 'end' ? w - pad : w / 2;
  }

  function updateNode(g, d) {
    g.setAttribute('aria-label', mask('name', d.name || C.typeLabel(d.type), d) + ' – Enter: Eigenschaften, Leertaste: auswählen');
    const t = C.type(d.type);
    const shape = C.shapeOf(d.type);
    const r = S.deviceRect(d);
    g.setAttribute('transform', nodeTransform(d));
    g.style.color = t.color;
    g.style.display = S.isVisible(d) ? '' : 'none';
    g.classList.toggle('sel', S.selection.has(d.id));

    if (shape === 'text') {
      const tx = g.querySelector('.nt-body');
      const ts = applyTextStyle(tx, d);
      tx.textContent = mask('note', d.name || 'Beschriftung', d);
      /* Ein Textfeld ist einzeilig — seine Kachel folgt dem Text statt
         umgekehrt. Deshalb hat es keinen Ziehgriff: die Größe ergibt
         sich aus Inhalt und Schrift. */
      fitTextBox(d, tx, ts);
      const box = S.deviceRect(d);
      tx.setAttribute('x', anchorX(ts.align, box.w, 6));
      tx.setAttribute('y', box.h / 2 + ts.size * 0.35);
      const hit = g.querySelector('.node-hit');
      hit.setAttribute('width', box.w); hit.setAttribute('height', box.h);
      const halo = g.querySelector('.node-halo');
      halo.setAttribute('x', -4); halo.setAttribute('y', -4);
      halo.setAttribute('width', box.w + 8); halo.setAttribute('height', box.h + 8);
      return;
    }

    if (shape === 'note') {
      const fold = 20;
      const halo = g.querySelector('.node-halo');
      halo.setAttribute('x', -4); halo.setAttribute('y', -4);
      halo.setAttribute('width', r.w + 8); halo.setAttribute('height', r.h + 8);
      g.querySelector('.note-box').setAttribute('d',
        'M4 0 H' + (r.w - fold) + ' L' + r.w + ' ' + fold + ' V' + (r.h - 4) +
        ' a4 4 0 0 1 -4 4 H4 a4 4 0 0 1 -4 -4 V4 a4 4 0 0 1 4 -4 Z');
      const tx = g.querySelector('.nt-body');
      const ts = applyTextStyle(tx, d);
      tx.textContent = '';
      /* Umbruch und Zeilenhöhe wachsen mit der Schrift mit — sonst
         liefe größerer Text über den Zettelrand hinaus. */
      const lh = Math.round(ts.size * 1.32);
      const perLine = Math.max(6, Math.round((r.w - 18) / (ts.size * 0.54)));
      const maxLines = Math.max(1, Math.floor((r.h - 14) / lh));
      wrapText(tx, mask('note', d.name || '', d), perLine, maxLines,
               anchorX(ts.align, r.w, 10), 10 + ts.size, lh);
      placeHandle(g, r);
      return;
    }

    if (shape === 'shape') {
      updateDecor(g, d, r);
      return;
    }

    if (shape === 'junction') {
      /* Der Punkt trägt die Farbe der Leitungen, die an ihm hängen —
         so sieht man auf einen Blick, wozu der Abzweig gehört. */
      const cons = S.connectionsOf(d.id);
      const first = cons.length ? S.con(cons[0]) : null;
      g.style.color = first ? S.edgeStyle(first).color : t.color;
      return;
    }

    /* Bildstreifen ein-/ausblenden und Rumpf entsprechend verschieben. */
    const strip = S.stripFor(d);
    const photo = g.querySelector('.node-photo');
    const hw = g.querySelector('.node-hw');
    const body = g.querySelector('.node-body');
    const box = g.querySelector('.node-box');
    const halo = g.querySelector('.node-halo');
    const shift = strip ? C.STRIP_SHIFT : 0;

    if (strip && strip.kind === 'image') {
      photo.setAttribute('href', strip.href);
      photo.style.display = '';
      hw.style.display = 'none';
      hw.removeAttribute('href');
    } else if (strip) {
      hw.setAttribute('href', strip.href);
      hw.style.display = '';
      photo.style.display = 'none';
      photo.removeAttribute('href');
    } else {
      photo.style.display = 'none';
      photo.removeAttribute('href');
      hw.style.display = 'none';
      hw.removeAttribute('href');
    }
    box.setAttribute('height', r.h);
    halo.setAttribute('height', r.h + 10);
    body.setAttribute('transform', shift ? 'translate(0 ' + shift + ')' : '');

    /* Symbol oder Bildsymbol (eigene Symbole können beides sein).
       Zeigt die Kachel einen Bildstreifen, entfällt das Symbol. */
    const ic = NWT.Symbols.iconFor(d.type);
    const useEl = g.querySelector('.node-icon');
    const imgEl = g.querySelector('.node-icon-img');
    if (strip) {
      useEl.style.display = 'none';
      imgEl.style.display = 'none';
      useEl.removeAttribute('href');
      imgEl.removeAttribute('href');
    } else if (ic.kind === 'image') {
      imgEl.setAttribute('href', ic.href);
      imgEl.style.display = '';
      useEl.style.display = 'none';
      useEl.removeAttribute('href');
    } else {
      useEl.setAttribute('href', ic.href);
      useEl.style.display = '';
      imgEl.style.display = 'none';
      imgEl.removeAttribute('href');
    }

    g.querySelector('.node-name').textContent = U.truncate(mask('name', d.name || t.label, d), 18);
    g.querySelector('.node-type').textContent = U.truncate(t.label, 20);
    const ipEl = g.querySelector('.node-ip');
    ipEl.textContent = U.truncate(mask('ip', d.ip || d.hostname || '', d), 20);
    const st = C.STATUS[d.status] || C.STATUS.unknown;
    const dot = g.querySelector('.node-status');
    dot.setAttribute('fill', st.color);
    dot.setAttribute('cy', strip ? C.PHOTO_H + 10 : 13);
    dot.style.display = (d.status && d.status !== 'unknown') ? '' : 'none';
  }

  /* ------------------------------------------------------- Dekoration */

  /**
   * Aussehen kommt aus Attributen, nicht aus CSS: eine Regel wie
   * `.decor-shape{fill:none}` würde jede eingestellte Füllung
   * überstimmen — und im SVG-Export ginge sie verloren.
   */
  function updateDecor(g, d, r) {
    const D = NWT.Decor;
    const st = D.styleOf(d);

    const hit = g.querySelector('.node-hit');
    hit.setAttribute('width', r.w); hit.setAttribute('height', r.h);
    const halo = g.querySelector('.node-halo');
    halo.setAttribute('x', -4); halo.setAttribute('y', -4);
    halo.setAttribute('width', r.w + 8); halo.setAttribute('height', r.h + 8);

    const path = g.querySelector('.decor-shape');
    path.setAttribute('d', D.pathFor(d, r.w, r.h));
    path.setAttribute('fill', st.fill);
    path.setAttribute('stroke', st.stroke);
    path.setAttribute('stroke-width', st.strokeWidth);
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('stroke-linecap', 'round');
    if (st.dash) path.setAttribute('stroke-dasharray', st.dash);
    else path.removeAttribute('stroke-dasharray');

    /* Pfeilspitzen werden gefüllt gezeichnet — als Strich bliebe bei
       dünner Linie ein hohles Dreieck übrig. */
    const tip = g.querySelector('.decor-tip');
    const tipPath = D.tipFor(d, r.w, r.h);
    if (tipPath) {
      tip.setAttribute('d', tipPath);
      tip.setAttribute('fill', st.stroke);
      tip.setAttribute('stroke', 'none');
      tip.style.display = '';
    } else {
      tip.removeAttribute('d');
      tip.style.display = 'none';
    }

    g.setAttribute('opacity', st.opacity);
    g.style.color = st.stroke;

    const label = g.querySelector('.decor-label');
    label.textContent = '';
    const text = mask('note', d.name || '', d);
    if (text) {
      const fig = D.figure(st.figure);
      const ts = applyTextStyle(label, d, st.stroke);
      const lh = Math.round(ts.size * 1.2);
      const perLine = Math.max(6, Math.round(r.w / (ts.size * 0.55)));
      /* Drei Lagen: Rahmen beschriften oben, Marker mittig, offene
         Figuren über der Linie — auf ihr läge der Text sonst. */
      const y = fig.labelTop ? ts.size + 6 : fig.closed ? r.h / 2 + ts.size * 0.35 : -8;
      wrapText(label, text, perLine, fig.closed ? 6 : 2,
               anchorX(ts.align, r.w, 10), y, lh, fig.closed && !fig.labelTop);
    }

    placeHandle(g, r);
  }

  function wrapText(textEl, str, perLine, maxLines, x, y, lh, centerV) {
    const words = String(str).split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = '';
    words.forEach(w => {
      if (!cur.length) { cur = w; return; }
      if ((cur + ' ' + w).length <= perLine) cur += ' ' + w;
      else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    const shown = lines.slice(0, maxLines);
    /* Abgeschnitten? Dann sagen, dass da noch mehr steht — sonst liest
       man den Zettel zu Ende, ohne es zu merken. */
    if (lines.length > maxLines) {
      const last = U.truncate(shown[maxLines - 1], Math.max(3, perLine - 1));
      shown[maxLines - 1] = /…$/.test(last) ? last : last + ' …';
    }
    /* Mehrzeilig mittig: der Block wächst sonst nur nach unten. */
    const top = centerV ? y - (shown.length - 1) * lh / 2 : y;
    shown.forEach((line, i) => {
      const ts = svgEl('tspan', { x: x, y: top + i * lh });
      ts.textContent = line;
      textEl.appendChild(ts);
    });
  }

  /* ------------------------------------------------------- Verbindungen */

  function createEdge() {
    const g = svgEl('g', { class: 'edge' });
    g.appendChild(svgEl('path', { class: 'edge-hit' }));
    g.appendChild(svgEl('path', { class: 'edge-line' }));
    g.appendChild(svgEl('circle', { class: 'edge-cap ca', r: 3 }));
    g.appendChild(svgEl('circle', { class: 'edge-cap cb', r: 3 }));
    g.appendChild(svgEl('text', { class: 'edge-port ps' }));
    g.appendChild(svgEl('text', { class: 'edge-port pt' }));
    const lab = svgEl('g', { class: 'edge-label' });
    lab.appendChild(svgEl('rect', { class: 'edge-label-bg', rx: 4 }));
    lab.appendChild(svgEl('text', { class: 'edge-label-tx' }));
    g.appendChild(lab);
    /* Stützpunkte kommen zuletzt, damit sie über der Beschriftung
       greifbar bleiben. Sichtbar sind sie nur bei Auswahl (CSS). */
    g.appendChild(svgEl('g', { class: 'edge-points' }));
    return g;
  }

  /**
   * Griffe für die Stützpunkte. Sie werden bei jedem Aufbau neu
   * gesetzt — ihre Anzahl ändert sich mit jedem eingefügten Knoten,
   * ein Diff lohnte hier nicht.
   */
  function updatePoints(g, c) {
    const host = g.querySelector('.edge-points');
    while (host.firstChild) host.removeChild(host.firstChild);
    (c.points || []).forEach((p, i) => {
      const el = svgEl('rect', { class: 'edge-point', width: 10, height: 10, rx: 2.5,
                                 x: p.x - 5, y: p.y - 5, 'data-idx': i });
      host.appendChild(el);
    });
  }

  function updateEdge(g, c) {
    const r = G.route(c);
    const A = S.dev(c.source), B = S.dev(c.target);
    const visible = r && A && B && S.isVisible(c) && S.isVisible(A) && S.isVisible(B);
    g.style.display = visible ? '' : 'none';
    if (!visible) return;

    const st = S.edgeStyle(c);
    const line = g.querySelector('.edge-line');
    const hit = g.querySelector('.edge-hit');
    line.setAttribute('d', r.d);
    hit.setAttribute('d', r.d);
    line.style.stroke = st.color;
    line.style.strokeWidth = st.width;
    line.style.strokeDasharray = st.dash || 'none';
    g.classList.toggle('sel', S.selection.has(c.id));

    const capA = g.querySelector('.ca'), capB = g.querySelector('.cb');
    capA.setAttribute('cx', r.a.x); capA.setAttribute('cy', r.a.y);
    capB.setAttribute('cx', r.b.x); capB.setAttribute('cy', r.b.y);
    capA.style.fill = st.color; capB.style.fill = st.color;
    const capR = Math.max(2.4, Math.min(4.2, st.width * 1.35));
    capA.setAttribute('r', capR); capB.setAttribute('r', capR);

    /* Beschriftung in Pfadmitte */
    const lab = g.querySelector('.edge-label');
    const txt = g.querySelector('.edge-label-tx');
    const bg = g.querySelector('.edge-label-bg');
    const primary = mask('edgelabel', c.label || c.speed || '', c);
    const secondary = c.vlan ? mask('edgelabel', 'VLAN ' + c.vlan, c) : '';
    txt.textContent = '';
    if (primary || secondary) {
      let mid = { x: (r.a.x + r.b.x) / 2, y: (r.a.y + r.b.y) / 2 };
      try {
        const len = line.getTotalLength();
        if (len > 0) mid = line.getPointAtLength(len / 2);
      } catch (e) { /* Fallback bleibt Mittelwert */ }
      const lines = [primary, secondary].filter(Boolean);
      lines.forEach((s, i) => {
        const ts = svgEl('tspan', { x: mid.x, y: mid.y + (i - (lines.length - 1) / 2) * 11 + 3.5 });
        ts.textContent = s;
        txt.appendChild(ts);
      });
      lab.style.display = '';
      try {
        const bb = txt.getBBox();
        bg.setAttribute('x', bb.x - 5); bg.setAttribute('y', bb.y - 2.5);
        bg.setAttribute('width', bb.width + 10); bg.setAttribute('height', bb.height + 5);
      } catch (e) { bg.setAttribute('width', 0); bg.setAttribute('height', 0); }
    } else {
      lab.style.display = 'none';
    }

    updatePoints(g, c);

    /* Portbeschriftungen nahe den Endpunkten */
    placePort(g.querySelector('.ps'), line, c.sourcePort, 0);
    placePort(g.querySelector('.pt'), line, c.targetPort, 1);
  }

  function placePort(el, line, text, atEnd) {
    if (!text) { el.textContent = ''; return; }
    el.textContent = U.truncate(mask('port', text, null), 12);
    let p = null, dir = null;
    try {
      const len = line.getTotalLength();
      const d0 = atEnd ? Math.max(0, len - 26) : Math.min(len, 26);
      p = line.getPointAtLength(d0);
      const q = line.getPointAtLength(atEnd ? Math.max(0, len - 34) : Math.min(len, 34));
      dir = { x: q.x - p.x, y: q.y - p.y };
    } catch (e) { el.textContent = ''; return; }
    const horiz = Math.abs(dir.x) >= Math.abs(dir.y);
    el.setAttribute('x', p.x);
    el.setAttribute('y', p.y + (horiz ? -6 : 3));
  }

  /* ------------------------------------------------------------ Bereiche */

  function createArea() {
    const g = svgEl('g', { class: 'area' });
    g.appendChild(svgEl('rect', { class: 'area-rect', 'pointer-events': 'stroke' }));
    g.appendChild(svgEl('rect', { class: 'area-head-hit' }));
    g.appendChild(svgEl('text', { class: 'area-title' }));
    g.appendChild(svgEl('text', { class: 'area-sub' }));
    g.appendChild(svgEl('rect', { class: 'area-handle', width: 12, height: 12, rx: 3 }));
    return g;
  }

  function updateArea(g, a) {
    g.style.color = a.color;
    g.style.display = S.isVisible(a) ? '' : 'none';
    g.classList.toggle('sel', S.selection.has(a.id));
    const rect = g.querySelector('.area-rect');
    rect.setAttribute('x', a.x); rect.setAttribute('y', a.y);
    rect.setAttribute('width', a.w); rect.setAttribute('height', a.h);
    const head = g.querySelector('.area-head-hit');
    head.setAttribute('x', a.x); head.setAttribute('y', a.y);
    head.setAttribute('width', a.w); head.setAttribute('height', a.sublabel ? 38 : 26);
    const title = g.querySelector('.area-title');
    title.setAttribute('x', a.x + 12); title.setAttribute('y', a.y + 18);
    title.textContent = U.truncate(mask('areatitle', a.label, a), 40);
    const sub = g.querySelector('.area-sub');
    sub.setAttribute('x', a.x + 12); sub.setAttribute('y', a.y + 32);
    sub.textContent = U.truncate(mask('areasub', a.sublabel || '', a), 40);
    const h = g.querySelector('.area-handle');
    h.setAttribute('x', a.x + a.w - 6); h.setAttribute('y', a.y + a.h - 6);
  }

  /* ---------------------------------------------------------------- API */

  function all() {
    const P = S.project;
    sync(lAreas, P.areas, areaEls, createArea, updateArea);
    /* Dekoration liegt hinter Leitungen und Geräten — sie soll den
       Netzplan schmücken, nicht verdecken. „Im Vordergrund" hebt ein
       einzelnes Element darüber. */
    const back = [], nodes = [], front = [];
    P.devices.forEach(d => {
      if (C.shapeOf(d.type) === 'shape') (d.front ? front : back).push(d);
      else nodes.push(d);
    });
    syncGroups([
      { layer: lDeco, items: back },
      { layer: lNodes, items: nodes },
      { layer: lDecoFront, items: front }
    ], nodeEls, createNode, updateNode, d => C.shapeOf(d.type));
    sync(lEdges, P.connections, edgeEls, createEdge, updateEdge);
  }

  function selection() {
    nodeEls.forEach((el, id) => el.classList.toggle('sel', S.selection.has(id)));
    edgeEls.forEach((el, id) => el.classList.toggle('sel', S.selection.has(id)));
    areaEls.forEach((el, id) => el.classList.toggle('sel', S.selection.has(id)));
  }

  /** Schnelles Positions-Update beim Ziehen (nur transform). */
  function moveNode(id) {
    const d = S.dev(id);
    const el = nodeEls.get(id);
    if (d && el) el.setAttribute('transform', nodeTransform(d));
  }

  function moveArea(id) {
    const a = S.area(id);
    const el = areaEls.get(id);
    if (a && el) updateArea(el, a);
  }

  /** Aktualisiert alle Leitungen an den angegebenen Geräten. */
  function updateEdgesFor(deviceIds) {
    const done = new Set();
    deviceIds.forEach(devId => {
      S.connectionsOf(devId).forEach(cid => {
        if (done.has(cid)) return;
        done.add(cid);
        const el = edgeEls.get(cid), c = S.con(cid);
        if (el && c) updateEdge(el, c);
      });
    });
  }

  function updateOne(id) {
    const kind = S.kindOf(id);
    if (kind === 'device' && nodeEls.has(id)) updateNode(nodeEls.get(id), S.dev(id));
    else if (kind === 'connection' && edgeEls.has(id)) updateEdge(edgeEls.get(id), S.con(id));
    else if (kind === 'area' && areaEls.has(id)) updateArea(areaEls.get(id), S.area(id));
  }

  function flash(id) {
    const el = nodeEls.get(id);
    if (!el) return;
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1400);
  }

  /* -------------------------------------------------------------- Overlay */

  function clearOverlay() { while (lOverlay.firstChild) lOverlay.removeChild(lOverlay.firstChild); }

  function overlayRect(cls) {
    const r = svgEl('rect', { class: cls, rx: 3 });
    lOverlay.appendChild(r);
    return r;
  }

  function overlayPath(cls) {
    const p = svgEl('path', { class: cls });
    lOverlay.appendChild(p);
    return p;
  }

  function nodeEl(id) { return nodeEls.get(id) || null; }

  return {
    init, all, selection, moveNode, moveArea, updateEdgesFor, updateOne, flash,
    clearOverlay, overlayRect, overlayPath, nodeEl,
    layers: () => ({ areas: lAreas, edges: lEdges, nodes: lNodes, overlay: lOverlay })
  };
})();


/* ======================= 07-interaction.js ======================= */
/* ============================================================
   07 — Interaktion: Zeigergesten, Auswahl, Ziehen, Verbinden
   Ein expliziter Zustandsautomat statt verstreuter Flags.
   ============================================================ */

NWT.Interaction = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const V = NWT.Viewport;
  const R = NWT.Render;
  const C = NWT.Catalog;

  let svg;
  let act = null;              // laufende Geste
  let spaceDown = false;
  let connectSource = null;    // ID des ersten Geräts im Verbindungsmodus
  let previewLine = null;
  let dropGhost = null;
  let lastWorld = { x: 0, y: 0 };

  const CLICK_TOLERANCE = 3;

  function init() {
    svg = U.el('#canvas');

    svg.addEventListener('pointerdown', onPointerDown);
    svg.addEventListener('pointermove', onPointerMove);
    svg.addEventListener('pointerup', onPointerUp);
    svg.addEventListener('pointercancel', onPointerUp);
    svg.addEventListener('dblclick', onDblClick);
    svg.addEventListener('contextmenu', onContextMenu);
    svg.addEventListener('wheel', onWheel, { passive: false });

    svg.addEventListener('dragover', onDragOver);
    svg.addEventListener('dragleave', onDragLeave);
    svg.addEventListener('drop', onDrop);

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' && !isTyping(e.target)) {
        spaceDown = true;
        if (!act) svg.classList.add('mode-pan');
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'Space') {
        spaceDown = false;
        if (S.mode !== 'pan') svg.classList.remove('mode-pan');
      }
    });
    window.addEventListener('blur', () => { spaceDown = false; });

    NWT.on('mode', m => {
      svg.classList.toggle('mode-connect', m === 'connect');
      svg.classList.toggle('mode-pan', m === 'pan');
      cancelConnect();
    });
  }

  function isTyping(t) {
    return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  }

  /* ------------------------------------------------------------ Treffer */

  function hitTest(target) {
    if (!target || !target.closest) return { kind: 'background' };
    if (target.closest('.area-handle')) {
      return { kind: 'area-handle', id: target.closest('.area').getAttribute('data-id') };
    }
    if (target.closest('.node-handle')) {
      return { kind: 'node-handle', id: target.closest('.node').getAttribute('data-id') };
    }
    const point = target.closest('.edge-point');
    if (point) {
      return { kind: 'edge-point', id: point.closest('.edge').getAttribute('data-id'),
               idx: Number(point.getAttribute('data-idx')) };
    }
    const node = target.closest('.node');
    if (node) return { kind: 'device', id: node.getAttribute('data-id') };
    const edge = target.closest('.edge');
    if (edge) return { kind: 'connection', id: edge.getAttribute('data-id') };
    const area = target.closest('.area');
    if (area) return { kind: 'area', id: area.getAttribute('data-id') };
    return { kind: 'background' };
  }

  /**
   * Treffer über Bildschirmkoordinaten bestimmen.
   * Nötig für click/dblclick: nach setPointerCapture liefert der Browser
   * diese Ereignisse am Capture-Element (dem SVG-Root) statt am Gerät.
   */
  function hitTestAt(clientX, clientY, fallback) {
    const el = document.elementFromPoint(clientX, clientY);
    return hitTest(el || fallback);
  }

  /* ------------------------------------------------------- Pointer Down */

  function onPointerDown(e) {
    if (e.button === 2) return;                 // Rechtsklick → contextmenu-Event
    NWT.emit('ui:closemenus');
    svg.focus({ preventScroll: true });

    const world = V.screenToWorld(e.clientX, e.clientY);
    const hit = hitTest(e.target);
    const wantPan = e.button === 1 || spaceDown || S.mode === 'pan';

    if (wantPan) {
      startPan(e);
      return;
    }

    if (S.mode === 'connect') {
      if (hit.kind === 'device') handleConnectClick(hit.id);
      else cancelConnect();
      return;
    }

    svg.setPointerCapture(e.pointerId);

    if (hit.kind === 'device') {
      const additive = e.shiftKey || e.ctrlKey || e.metaKey;
      if (additive) {
        S.toggleSelect(hit.id);
        R.selection();
        return;
      }
      if (!S.selection.has(hit.id)) { S.select(hit.id); R.selection(); }
      startDragObjects(e, world);
      return;
    }

    if (hit.kind === 'connection') {
      const additive = e.shiftKey || e.ctrlKey || e.metaKey;
      if (additive) S.toggleSelect(hit.id); else S.select(hit.id);
      R.selection();
      return;
    }

    if (hit.kind === 'edge-point') {
      const c = S.con(hit.id);
      if (!c || !c.points || !c.points[hit.idx]) return;
      S.select(hit.id); R.selection();
      NWT.History.begin('Knoten verschieben');
      act = { kind: 'dragPoint', id: hit.id, idx: hit.idx, moved: false };
      return;
    }

    if (hit.kind === 'node-handle') {
      const d = S.dev(hit.id);
      if (!d) return;
      const r = S.deviceRect(d);
      S.select(hit.id); R.selection();
      NWT.History.begin('Größe ändern');
      act = { kind: 'resizeNode', id: hit.id, start: world, w0: r.w, h0: r.h, moved: false };
      return;
    }

    if (hit.kind === 'area-handle') {
      const a = S.area(hit.id);
      if (!a) return;
      S.select(hit.id); R.selection();
      NWT.History.begin('Bereich anpassen');
      act = { kind: 'resizeArea', id: hit.id, start: world, w0: a.w, h0: a.h, moved: false };
      return;
    }

    if (hit.kind === 'area') {
      const additive = e.shiftKey || e.ctrlKey || e.metaKey;
      if (additive) { S.toggleSelect(hit.id); R.selection(); return; }
      if (!S.selection.has(hit.id)) { S.select(hit.id); R.selection(); }
      startDragObjects(e, world);
      return;
    }

    /* Hintergrund */
    if (!(e.shiftKey || e.ctrlKey || e.metaKey)) { S.clearSelection(); R.selection(); }
    act = {
      kind: 'marquee', start: world, additive: e.shiftKey || e.ctrlKey || e.metaKey,
      base: S.selectedIds(), el: R.overlayRect('marquee'), moved: false
    };
  }

  function startPan(e) {
    svg.setPointerCapture(e.pointerId);
    svg.classList.add('panning');
    act = { kind: 'pan', sx: e.clientX, sy: e.clientY };
  }

  function startDragObjects(e, world) {
    const ids = S.selectedIds();
    const devIds = ids.filter(id => id.startsWith('dev_'));
    const areaIds = ids.filter(id => id.startsWith('area_'));

    /* Geräte innerhalb bewegter Bereiche mitnehmen. */
    const carried = new Set(devIds);
    areaIds.forEach(aid => {
      const a = S.area(aid);
      if (!a) return;
      S.project.devices.forEach(d => {
        if (!S.isVisible(d)) return;
        const c = S.deviceCenter(d);
        if (c.x >= a.x && c.x <= a.x + a.w && c.y >= a.y && c.y <= a.y + a.h) carried.add(d.id);
      });
    });

    const start = {};
    carried.forEach(id => { const d = S.dev(id); if (d) start[id] = { x: d.x, y: d.y }; });
    areaIds.forEach(id => { const a = S.area(id); if (a) start[id] = { x: a.x, y: a.y }; });

    const anchorId = devIds.length ? devIds[0] : areaIds[0];
    if (!anchorId) return;

    NWT.History.begin(carried.size + areaIds.length > 1 ? 'Objekte verschieben' : 'Objekt verschieben');
    act = {
      kind: 'dragObjects',
      start: world,
      anchor: anchorId,
      positions: start,
      devIds: Array.from(carried),
      areaIds: areaIds,
      moved: false
    };
  }

  /* ------------------------------------------------------- Pointer Move */

  function onPointerMove(e) {
    const world = V.screenToWorld(e.clientX, e.clientY);
    lastWorld = world;
    NWT.emit('ui:coords', world);

    if (connectSource && !act) updatePreview(world);

    if (!act) return;

    if (act.kind === 'pan') {
      V.panBy(e.clientX - act.sx, e.clientY - act.sy);
      act.sx = e.clientX; act.sy = e.clientY;
      return;
    }

    if (act.kind === 'dragObjects') {
      let dx = world.x - act.start.x;
      let dy = world.y - act.start.y;
      const z = S.project.settings.zoom;
      if (!act.moved && Math.hypot(dx * z, dy * z) < CLICK_TOLERANCE) return;
      act.moved = true;

      const base = act.positions[act.anchor];
      if (S.project.settings.snap) {
        const gs = S.project.settings.gridSize;
        dx = Math.round((base.x + dx) / gs) * gs - base.x;
        dy = Math.round((base.y + dy) / gs) * gs - base.y;
      } else {
        dx = Math.round(dx); dy = Math.round(dy);
      }

      act.devIds.forEach(id => {
        const d = S.dev(id), p = act.positions[id];
        if (!d || !p) return;
        d.x = p.x + dx; d.y = p.y + dy;
        R.moveNode(id);
      });
      act.areaIds.forEach(id => {
        const a = S.area(id), p = act.positions[id];
        if (!a || !p) return;
        a.x = p.x + dx; a.y = p.y + dy;
        R.moveArea(id);
      });
      R.updateEdgesFor(act.devIds);
      NWT.emit('ui:minimap');
      return;
    }

    if (act.kind === 'dragPoint') {
      const c = S.con(act.id);
      if (!c || !c.points || !c.points[act.idx]) return;
      c.points[act.idx] = { x: Math.round(V.snap(world.x)), y: Math.round(V.snap(world.y)) };
      act.moved = true;
      R.updateOne(act.id);
      NWT.emit('ui:minimap');
      return;
    }

    if (act.kind === 'resizeNode') {
      const d = S.dev(act.id);
      if (!d) return;
      let dx = world.x - act.start.x;
      let dy = world.y - act.start.y;
      /* Bei gedrehten Elementen zeigt der Griff in eine andere Richtung
         als die Maus sich bewegt — Verschiebung zurückdrehen. */
      const rot = Number(d.rot) || 0;
      if (rot) {
        const a = -rot * Math.PI / 180;
        const rx = dx * Math.cos(a) - dy * Math.sin(a);
        const ry = dx * Math.sin(a) + dy * Math.cos(a);
        dx = rx; dy = ry;
      }
      let w = act.w0 + dx, h = act.h0 + dy;
      if (S.project.settings.snap) {
        const gs = S.project.settings.gridSize;
        w = Math.round(w / gs) * gs;
        h = Math.round(h / gs) * gs;
      }
      d.w = Math.max(24, Math.round(w));
      d.h = Math.max(C.shapeOf(d.type) === 'text' ? 20 : 24, Math.round(h));
      act.moved = true;
      R.updateOne(act.id);
      R.updateEdgesFor([act.id]);
      NWT.emit('ui:minimap');
      return;
    }

    if (act.kind === 'resizeArea') {
      const a = S.area(act.id);
      if (!a) return;
      let w = act.w0 + (world.x - act.start.x);
      let h = act.h0 + (world.y - act.start.y);
      if (S.project.settings.snap) {
        const gs = S.project.settings.gridSize;
        w = Math.round((a.x + w) / gs) * gs - a.x;
        h = Math.round((a.y + h) / gs) * gs - a.y;
      }
      a.w = Math.max(80, Math.round(w));
      a.h = Math.max(60, Math.round(h));
      act.moved = true;
      R.moveArea(act.id);
      NWT.emit('ui:minimap');
      return;
    }

    if (act.kind === 'marquee') {
      const x = Math.min(act.start.x, world.x), y = Math.min(act.start.y, world.y);
      const w = Math.abs(world.x - act.start.x), h = Math.abs(world.y - act.start.y);
      act.moved = w > 3 || h > 3;
      act.el.setAttribute('x', x); act.el.setAttribute('y', y);
      act.el.setAttribute('width', w); act.el.setAttribute('height', h);

      const box = { x: x, y: y, w: w, h: h };
      const picked = [];
      S.project.devices.forEach(d => {
        if (S.isVisible(d) && U.rectsIntersect(S.deviceRect(d), box)) picked.push(d.id);
      });
      S.project.areas.forEach(a => {
        if (S.isVisible(a) && U.rectsIntersect({ x: a.x, y: a.y, w: a.w, h: a.h }, box)) picked.push(a.id);
      });
      S.selection = new Set(act.additive ? act.base.concat(picked) : picked);
      R.selection();
      NWT.emit('selection');
      return;
    }
  }

  /* --------------------------------------------------------- Pointer Up */

  function onPointerUp(e) {
    if (svg.hasPointerCapture && svg.hasPointerCapture(e.pointerId)) {
      svg.releasePointerCapture(e.pointerId);
    }
    svg.classList.remove('panning');
    if (!act) return;
    const a = act;
    act = null;

    if (a.kind === 'marquee') {
      a.el.remove();
      NWT.emit('selection');
      return;
    }
    if (a.kind === 'pan') { NWT.emit('change', { structural: false, viewOnly: true }); return; }

    if (a.kind === 'dragObjects' || a.kind === 'resizeArea' || a.kind === 'resizeNode' || a.kind === 'dragPoint') {
      NWT.History.end(!!a.moved);
      if (a.moved) {
        S.touch();
        NWT.emit('change', { structural: false });
      }
    }
  }

  /* ------------------------------------------------------ Verbindungsmodus */

  function handleConnectClick(deviceId) {
    /* Dekoration ist kein Netzobjekt — ein Rahmen hat keine Leitung. */
    const target = S.dev(deviceId);
    if (target && C.shapeOf(target.type) === 'shape') {
      U.toast('Dekorationselemente lassen sich nicht verbinden', 'warn');
      return;
    }
    if (!connectSource) {
      connectSource = deviceId;
      const el = R.nodeEl(deviceId);
      if (el) el.classList.add('connect-src');
      NWT.emit('ui:connecthint', 'Ziel wählen … (ESC bricht ab)');
      return;
    }
    if (connectSource === deviceId) { cancelConnect(); return; }

    NWT.History.record('Verbindung erstellen');
    const conn = S.addConnection(connectSource, deviceId);
    const src = connectSource;
    cancelConnect();
    if (conn) {
      NWT.emit('change', { structural: true });
      U.toast('Verbindung: ' + label(src) + ' → ' + label(deviceId), 'ok');
      /* Kette weiterziehen: Ziel wird neue Quelle. */
      connectSource = deviceId;
      const el = R.nodeEl(deviceId);
      if (el) el.classList.add('connect-src');
      NWT.emit('ui:connecthint', 'Weiter verbinden oder ESC');
    }
  }

  function label(id) { const d = S.dev(id); return d ? d.name : id; }

  function updatePreview(world) {
    const d = S.dev(connectSource);
    if (!d) { cancelConnect(); return; }
    const c = S.deviceCenter(d);
    if (!previewLine) previewLine = R.overlayPath('preview-line');
    previewLine.setAttribute('d', 'M' + c.x + ' ' + c.y + ' L' + world.x + ' ' + world.y);
  }

  function cancelConnect() {
    if (connectSource) {
      const el = R.nodeEl(connectSource);
      if (el) el.classList.remove('connect-src');
    }
    connectSource = null;
    if (previewLine) { previewLine.remove(); previewLine = null; }
    NWT.emit('ui:connecthint', S.mode === 'connect' ? 'Erstes Gerät wählen …' : null);
  }

  function startConnectFrom(id) {
    S.setMode('connect');
    connectSource = null;
    handleConnectClick(id);
  }

  /* --------------------------------------------------------- Drag & Drop */

  function onDragOver(e) {
    if (!e.dataTransfer) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    /* Beim Ziehen einer Datei keine Gerätevorschau zeigen. */
    const types = e.dataTransfer.types;
    if (types && Array.prototype.indexOf.call(types, 'Files') >= 0) { removeGhost(); return; }
    const w = V.screenToWorld(e.clientX, e.clientY);
    if (!dropGhost) dropGhost = R.overlayRect('drop-ghost');
    dropGhost.setAttribute('x', w.x - C.NODE_W / 2);
    dropGhost.setAttribute('y', w.y - C.NODE_H / 2);
    dropGhost.setAttribute('width', C.NODE_W);
    dropGhost.setAttribute('height', C.NODE_H);
  }

  function onDragLeave(e) {
    if (e.relatedTarget && svg.contains(e.relatedTarget)) return;
    removeGhost();
  }

  function removeGhost() {
    if (dropGhost) { dropGhost.remove(); dropGhost = null; }
  }

  function onDrop(e) {
    e.preventDefault();
    removeGhost();

    /* Bilddatei auf ein Gerät gezogen → Gerätefoto */
    const files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) {
      const hit = hitTestAt(e.clientX, e.clientY, e.target);
      if (hit.kind === 'device') {
        if (NWT.Images.handleDroppedFiles(hit.id, files)) return;
      } else if (Array.prototype.some.call(files, f => f.type && f.type.indexOf('image/') === 0)) {
        U.toast('Bild bitte direkt auf ein Gerät ziehen, um es als Foto zu hinterlegen.', 'warn', 4000);
        return;
      }
    }

    let typeId = '';
    try { typeId = e.dataTransfer.getData('application/x-nwt-type') || e.dataTransfer.getData('text/plain'); }
    catch (err) { typeId = ''; }
    if (!typeId || !C.DEVICE_TYPES[typeId]) return;
    const w = V.screenToWorld(e.clientX, e.clientY);
    addDeviceAt(typeId, w.x, w.y);
  }

  /** Erzeugt ein Gerät zentriert auf (wx,wy) in Weltkoordinaten. */
  function addDeviceAt(typeId, wx, wy) {
    NWT.History.record('Gerät hinzufügen');
    const shape = C.shapeOf(typeId);
    const t = C.type(typeId);
    const w = shape === 'text' ? 180 : shape === 'note' ? 170 : shape === 'shape' ? (t.w || 200) : C.NODE_W;
    const h = shape === 'text' ? 34 : shape === 'note' ? 108 : shape === 'shape' ? (t.h || 140) : C.NODE_H;
    const d = S.addDevice(typeId, V.snap(wx - w / 2), V.snap(wy - h / 2));
    S.select(d.id);
    NWT.emit('change', { structural: true });
    NWT.emit('selection');
    U.toast((d.name || C.typeLabel(typeId)) + ' hinzugefügt');
    return d;
  }

  /** Gerät in der Mitte der sichtbaren Fläche einfügen (Klick in der Seitenleiste). */
  function addDeviceCentered(typeId) {
    const r = V.rect();
    const w = V.screenToWorld(r.left + r.width / 2, r.top + r.height / 2);
    /* Leicht versetzen, damit mehrere Klicks nicht stapeln. */
    const n = S.project.devices.length % 6;
    return addDeviceAt(typeId, w.x + n * 26, w.y + n * 22);
  }

  /* --------------------------------------------------------- Sonstiges */

  function onDblClick(e) {
    const hit = hitTestAt(e.clientX, e.clientY, e.target);
    if (hit.kind === 'device') NWT.Dialogs.editDevice(hit.id);
    else if (hit.kind === 'connection') NWT.Dialogs.editConnection(hit.id);
    /* Doppelklick auf einen Knoten entfernt ihn — der schnellste Weg
       zurück zur automatischen Führung. */
    else if (hit.kind === 'edge-point') NWT.Commands.removeWaypoint(hit.id, hit.idx);
    else if (hit.kind === 'node-handle') NWT.Dialogs.editDevice(hit.id);
    else if (hit.kind === 'area' || hit.kind === 'area-handle') NWT.Dialogs.editArea(hit.id);
  }

  function onContextMenu(e) {
    e.preventDefault();
    const hit = hitTestAt(e.clientX, e.clientY, e.target);
    if (hit.id && !S.selection.has(hit.id)) { S.select(hit.id); R.selection(); }
    if (hit.kind === 'background') { S.clearSelection(); R.selection(); }
    NWT.emit('ui:contextmenu', { x: e.clientX, y: e.clientY, hit: hit, world: V.screenToWorld(e.clientX, e.clientY) });
  }

  function onWheel(e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const factor = Math.pow(0.999, e.deltaY * (e.deltaMode === 1 ? 16 : 1));
      V.zoomAt(factor, e.clientX, e.clientY);
    } else {
      const m = e.deltaMode === 1 ? 16 : 1;
      V.panBy(-e.deltaX * m, -e.deltaY * m);
    }
  }

  function cancel() {
    if (act) {
      if (act.kind === 'marquee') act.el.remove();
      if (act.kind === 'dragObjects' || act.kind === 'resizeArea' || act.kind === 'resizeNode' || act.kind === 'dragPoint') {
        NWT.History.abort();
        NWT.emit('change', { structural: true });
      }
      act = null;
    }
    if (connectSource) { cancelConnect(); return true; }
    return false;
  }

  return {
    init, addDeviceAt, addDeviceCentered, startConnectFrom, cancel, cancelConnect,
    lastWorld: () => lastWorld,
    isBusy: () => !!act
  };
})();


/* ======================= 08-modal.js ======================= */
/* ============================================================
   08 — Modal-Baukasten
   Alle Dialoge (Geräte, Verbindungen, Projekt, Hilfe, Meldungen)
   entstehen datengetrieben aus einer Feldliste.
   ============================================================ */

NWT.Modal = (function () {
  const U = NWT.Util;
  let dlg, current = null;

  function init() {
    dlg = U.el('#modal');
    dlg.addEventListener('cancel', e => {
      e.preventDefault();
      close(null);
    });
    dlg.addEventListener('click', e => {
      if (e.target === dlg) close(null);   // Klick auf Backdrop
    });
    dlg.addEventListener('close', () => { if (!dlg.open && current) close(null); });
  }

  function isOpen() { return dlg && dlg.open; }

  function close(value) {
    if (!current) { if (dlg && dlg.open) dlg.close(); return; }
    const resolve = current.resolve;
    current = null;
    if (dlg.open) dlg.close();
    dlg.innerHTML = '';
    resolve(value);
  }

  /**
   * Basisdialog.
   * opts: {title, subtitle, bodyHtml, buttons:[{label,value,kind,primary,left}],
   *        onMount(root, api), width}
   */
  function open(opts) {
    if (current) close(null);
    return new Promise(resolve => {
      const session = current = { resolve: resolve, busy: false };

      const buttons = opts.buttons || [{ label: 'Schließen', value: null, primary: true }];
      const html =
        '<form method="dialog" class="dlg-form">' +
          '<div class="dlg-head">' +
            '<div><h2>' + U.escapeHtml(opts.title || '') + '</h2>' +
            (opts.subtitle ? '<div class="dlg-sub">' + U.escapeHtml(opts.subtitle) + '</div>' : '') +
            '</div>' +
            '<button type="button" class="dlg-x" data-close aria-label="Schließen">✕</button>' +
          '</div>' +
          '<div class="dlg-body">' + (opts.bodyHtml || '') + '</div>' +
          '<div class="dlg-foot">' +
            buttons.map((b, i) =>
              '<button type="' + (b.submit ? 'submit' : 'button') + '" class="btn' + (b.primary ? ' primary' : '') + (b.kind ? ' ' + b.kind : '') +
              (b.left ? ' left' : '') + '" data-btn="' + i + '">' + U.escapeHtml(b.label) + '</button>').join('') +
          '</div>' +
        '</form>';

      dlg.innerHTML = html;
      if (opts.width) dlg.style.width = opts.width;
      else dlg.style.width = '';

      const api = {
        close: value => { if (current === session) close(value); },
        root: dlg,
        value(key) { const f = dlg.querySelector('[name="' + key + '"]'); return f ? f.value : ''; }
      };

      dlg.querySelector('[data-close]').addEventListener('click', () => close(null));
      const invoke = b => {
        if (!b || current !== session || session.busy) return;
        if (b.submit && !dlg.querySelector('form').reportValidity()) return;
        try {
          const res = b.onClick ? b.onClick(api) : b.value;
          if (res && typeof res.then === 'function') {
            session.busy = true;
            res.then(v => { session.busy = false; if (v !== false) api.close(v); }, err => {
              session.busy = false;
              if (current === session) error('Die Aktion ist fehlgeschlagen.', err.message);
            });
          } else if (res !== false || !b.onClick) api.close(res === undefined ? b.value : res);
        } catch (err) { error('Die Aktion ist fehlgeschlagen.', err.message); }
      };
      buttons.forEach((b, i) => {
        if (!b.submit) dlg.querySelector('[data-btn="' + i + '"]').addEventListener('click', () => invoke(b));
      });
      dlg.querySelector('form').addEventListener('submit', e => {
        e.preventDefault();
        invoke(buttons.find(b => b.submit));
      });

      dlg.showModal();
      if (opts.onMount) opts.onMount(dlg, api);

      const first = dlg.querySelector('.dlg-body input, .dlg-body select, .dlg-body textarea');
      if (first) { try { first.focus(); first.select && first.select(); } catch (e) {} }
    });
  }

  /* ------------------------------------------------------------ Formular */

  function fieldHtml(f, values) {
    if (f.section) return '<div class="form-section">' + U.escapeHtml(f.section) + '</div>';
    const v = values && values[f.key] != null ? values[f.key] : (f.value != null ? f.value : '');
    const cls = 'field' + (f.wide ? ' wide' : '');
    const label = '<label for="fld_' + f.key + '">' + U.escapeHtml(f.label) + '</label>';
    let input = '';

    switch (f.type) {
      case 'textarea':
        input = '<textarea id="fld_' + f.key + '" name="' + f.key + '" rows="' + (f.rows || 3) + '"' +
          (f.placeholder ? ' placeholder="' + U.escapeHtml(f.placeholder) + '"' : '') + '>' + U.escapeHtml(v) + '</textarea>';
        break;
      case 'select': {
        const opts = f.options || [];
        const opt = o => '<option value="' + U.escapeHtml(o.value) + '"' +
          (String(o.value) === String(v) ? ' selected' : '') + '>' + U.escapeHtml(o.label) + '</option>';
        let body = '';
        if (opts.some(o => o.group)) {
          /* Gruppierte Auswahl: lange Listen bleiben nur mit optgroup lesbar. */
          let current = null;
          opts.forEach(o => {
            const g = o.group || '';
            if (g !== current) {
              if (current !== null) body += '</optgroup>';
              body += '<optgroup label="' + U.escapeHtml(g) + '">';
              current = g;
            }
            body += opt(o);
          });
          if (current !== null) body += '</optgroup>';
        } else {
          body = opts.map(opt).join('');
        }
        input = '<select id="fld_' + f.key + '" name="' + f.key + '">' + body + '</select>';
        break;
      }
      case 'number':
        input = '<input type="number" id="fld_' + f.key + '" name="' + f.key + '" value="' + U.escapeHtml(v) + '"' +
          (f.min != null ? ' min="' + f.min + '"' : '') +
          (f.max != null ? ' max="' + f.max + '"' : '') +
          (f.step != null ? ' step="' + f.step + '"' : '') + '>';
        break;
      case 'color':
        input = '<input type="color" id="fld_' + f.key + '" name="' + f.key + '" value="' + U.escapeHtml(v || '#2563eb') + '">';
        break;
      case 'checkbox':
        return '<div class="field field-check' + (f.wide ? ' wide' : '') + '">' +
          '<input type="checkbox" id="fld_' + f.key + '" name="' + f.key + '"' + (v ? ' checked' : '') + '>' +
          '<label for="fld_' + f.key + '">' + U.escapeHtml(f.label) + '</label></div>';
      case 'static':
        return '<div class="' + cls + '">' + label + '<div class="hintline">' + U.escapeHtml(v || '—') + '</div></div>';
      case 'custom':
        /* Vom Aufrufer gelieferter Inhalt; Werte werden nicht ausgelesen. */
        return '<div class="' + cls + '">' + label + (f.render ? f.render() : '') + '</div>';
      default:
        input = '<input type="text" id="fld_' + f.key + '" name="' + f.key + '" value="' + U.escapeHtml(v) + '"' +
          (f.placeholder ? ' placeholder="' + U.escapeHtml(f.placeholder) + '"' : '') +
          (f.mono ? ' spellcheck="false" autocomplete="off"' : '') + '>';
    }
    return '<div class="' + cls + '">' + label + input +
      (f.hint ? '<div class="hintline">' + U.escapeHtml(f.hint) + '</div>' : '') + '</div>';
  }

  function readFields(fields) {
    const out = {};
    fields.forEach(f => {
      if (f.section || f.type === 'static' || f.type === 'custom') return;
      const el = dlg.querySelector('[name="' + f.key + '"]');
      if (!el) return;
      out[f.key] = f.type === 'checkbox' ? el.checked : el.value;
    });
    return out;
  }

  /**
   * form({title, subtitle, fields, values, submitLabel, extraButtons})
   * → Promise<values | {__action} | null>
   */
  function form(opts) {
    const fields = opts.fields || [];
    const bodyHtml = '<div class="form-grid">' + fields.map(f => fieldHtml(f, opts.values)).join('') + '</div>';
    const buttons = [];
    (opts.extraButtons || []).forEach(b => buttons.push(b));
    buttons.push({ label: 'Abbrechen', value: null });
    buttons.push({
      label: opts.submitLabel || 'Übernehmen', primary: true, submit: true,
      onClick: () => readFields(fields)
    });
    return open({
      title: opts.title, subtitle: opts.subtitle, bodyHtml: bodyHtml,
      width: opts.width, buttons: buttons, onMount: opts.onMount
    });
  }

  /* ------------------------------------------------------------ Meldungen */

  function confirm(opts) {
    return open({
      title: opts.title || 'Bestätigen',
      bodyHtml: '<div class="msg-body">' + (opts.html || U.escapeHtml(opts.message || '')) + '</div>',
      buttons: [
        { label: opts.cancelLabel || 'Abbrechen', value: false },
        { label: opts.confirmLabel || 'OK', value: true, primary: !opts.danger, kind: opts.danger ? 'danger' : '' }
      ]
    }).then(v => v === true);
  }

  function alert(opts) {
    return open({
      title: opts.title || 'Hinweis',
      bodyHtml: '<div class="msg-body">' + (opts.html || U.escapeHtml(opts.message || '')) + '</div>',
      buttons: [{ label: 'OK', value: true, primary: true }]
    });
  }

  function error(message, detail) {
    return alert({
      title: 'Fehler',
      html: '<div class="msg-body"><p>' + U.escapeHtml(message) + '</p>' +
            (detail ? '<p><code>' + U.escapeHtml(detail) + '</code></p>' : '') + '</div>'
    });
  }

  function prompt(opts) {
    return form({
      title: opts.title || 'Eingabe',
      subtitle: opts.subtitle,
      fields: [{ key: 'value', label: opts.label || 'Wert', wide: true, placeholder: opts.placeholder }],
      values: { value: opts.value || '' },
      submitLabel: opts.submitLabel || 'OK'
    }).then(v => (v && typeof v.value === 'string') ? v.value.trim() : null);
  }

  return { init, open, form, confirm, alert, error, prompt, close, isOpen };
})();


/* ======================= 09-dialogs.js ======================= */
/* ============================================================
   09 — Fachdialoge: Gerät, Verbindung, Bereich, Projektinfo, Hilfe
   ============================================================ */

NWT.Dialogs = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const C = NWT.Catalog;
  const M = NWT.Modal;

  function layerOptions() {
    return S.project.layers.map(l => ({ value: l.id, label: l.name }));
  }

  /* ---------------------------------------------------------- Gerätefoto */

  function photoFieldHtml(d) {
    const has = !!d.image;
    const kb = has ? Math.round((d.image.length - (d.image.indexOf(',') + 1)) * 0.75 / 1024) : 0;
    return '<div class="photo-field" data-photo-for="' + d.id + '">' +
      '<div class="photo-preview">' +
        (has ? '<img alt="Gerätefoto" src="' + U.escapeHtml(d.image) + '">'
             : '<span class="photo-empty">Kein Foto hinterlegt</span>') +
      '</div>' +
      '<div class="photo-actions">' +
        '<button type="button" class="btn" data-photo-pick>' + (has ? 'Foto ersetzen …' : 'Foto wählen …') + '</button>' +
        (has ? '<button type="button" class="btn ghost-danger" data-photo-del>Entfernen</button>' : '') +
        '<div class="hintline">' +
          (has ? 'Verkleinert gespeichert, ca. ' + kb + ' KB. ' : '') +
          'Auch möglich: Bild auf das Gerät ziehen oder mit Strg+V einfügen.' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function wirePhotoField(root, deviceId) {
    const refresh = () => {
      const host = root.querySelector('[data-photo-for]');
      const dev = S.dev(deviceId);
      if (!host || !dev) return;
      host.outerHTML = photoFieldHtml(dev);
      wirePhotoField(root, deviceId);
    };
    const pick = root.querySelector('[data-photo-pick]');
    if (pick) pick.addEventListener('click', () => NWT.Images.pickFor(deviceId));
    const del = root.querySelector('[data-photo-del]');
    if (del) del.addEventListener('click', () => { NWT.Images.remove(deviceId); refresh(); });
    return refresh;
  }

  /** Vorschaulinie im Verbindungsdialog — zeigt Farbe, Stärke und Muster live. */
  function stylePreviewHtml() {
    return '<svg id="style-preview" viewBox="0 0 260 34" width="100%" height="34">' +
      '<line id="style-preview-line" x1="14" y1="17" x2="246" y2="17" stroke-linecap="round"></line>' +
      '<circle class="pv-cap" cx="14" cy="17" r="3.4"></circle>' +
      '<circle class="pv-cap" cx="246" cy="17" r="3.4"></circle>' +
      '</svg>';
  }

  function portsToText(ports) {
    return (ports || []).map(p => p.name).join('\n');
  }
  function textToPorts(text) {
    return String(text || '').split(/[\n,;]+/).map(s => s.trim()).filter(Boolean).map(n => ({ name: n }));
  }

  /* ------------------------------------------------------------- Gerät */

  function editDevice(id) {
    const d = S.dev(id);
    if (!d) return Promise.resolve(null);
    /* Dekoration und Text haben weder Netzwerkangaben noch Ports —
       sie bekommen ihre eigenen, viel kürzeren Dialoge. */
    const sh = C.shapeOf(d.type);
    if (sh === 'shape') return editDecor(id);
    if (sh === 'text' || sh === 'note') return editText(id);
    if (sh === 'junction') return editJunction(id);

    const fields = [
      { section: 'Identifikation' },
      { key: 'name', label: 'Name' },
      { key: 'type', label: 'Gerätetyp', type: 'select', options: C.typeOptions() },
      { key: 'hostname', label: 'Hostname', mono: true },
      { key: 'status', label: 'Status', type: 'select', options: C.statusOptions() },
      { key: 'manufacturer', label: 'Hersteller' },
      { key: 'model', label: 'Modell' },

      { section: 'Netzwerk' },
      { key: 'ip', label: 'IP-Adresse', mono: true, placeholder: '192.168.1.10' },
      { key: 'ipv6', label: 'IPv6-Adresse', mono: true, placeholder: 'fd00::10' },
      { key: 'mac', label: 'MAC-Adresse', mono: true, placeholder: '00:1A:2B:3C:4D:5E' },
      { key: 'vlan', label: 'VLAN', placeholder: '10' },

      { section: 'Standort' },
      { key: 'location', label: 'Standort' },
      { key: 'room', label: 'Raum' },
      { key: 'rack', label: 'Rack' },
      { key: 'layer', label: 'Ebene', type: 'select', options: layerOptions() },

      { section: 'Weitere Angaben' },
      { key: 'os', label: 'Betriebssystem' },
      { key: 'protocol', label: 'Protokoll / Bus', placeholder: 'DCC, mfx · PROFINET · Modbus TCP' },
      { key: 'description', label: 'Beschreibung', type: 'textarea', wide: true, rows: 2 },
      { key: 'notes', label: 'Bemerkungen', type: 'textarea', wide: true, rows: 2 },
      { key: 'portsText', label: 'Ports (eine Zeile je Port)', type: 'textarea', wide: true, rows: 4,
        hint: 'Diese Liste steht im Verbindungsdialog zur Auswahl.' },

      { section: 'Gerätefoto' },
      { key: '_photo', label: 'Foto', type: 'custom', wide: true, render: () => photoFieldHtml(d) }
    ];

    const values = Object.assign({}, d, { portsText: portsToText(d.ports) });
    const defaultPortsText = portsToText(C.buildPorts(d.type));
    let offChange = null;

    return M.form({
      title: 'Geräteeigenschaften',
      subtitle: d.name + ' · ' + C.typeLabel(d.type) + ' · ID ' + d.id,
      fields: fields,
      values: values,
      width: '760px',
      submitLabel: 'Übernehmen',
      extraButtons: [
        { label: 'Schnittstellen', value: { __interfaces: true } },
        { label: 'Löschen', kind: 'ghost-danger', left: true, value: { __delete: true } },
        { label: 'Duplizieren', left: true, value: { __duplicate: true } }
      ],
      onMount: (root) => {
        const refresh = wirePhotoField(root, id);
        /* Ein per Dateidialog gewähltes Foto trifft asynchron ein. */
        offChange = NWT.on('change', () => refresh());
      }
    }).then(res => {
      if (offChange) { offChange(); offChange = null; }
      if (!res) return null;
      if (res.__interfaces) return NWT.Workbench.editInterfaces(id);
      if (res.__delete) { NWT.Commands.deleteIds([id]); return null; }
      if (res.__duplicate) { NWT.Commands.duplicateSelection([id]); return null; }

      NWT.History.record('Geräteeigenschaften');
      const oldType = d.type;
      const portsTextChanged = res.portsText !== defaultPortsText;

      ['name', 'type', 'hostname', 'status', 'manufacturer', 'model', 'ip', 'ipv6', 'mac',
       'vlan', 'location', 'room', 'rack', 'layer', 'os', 'protocol', 'description', 'notes'].forEach(k => {
        if (res[k] !== undefined) d[k] = res[k];
      });

      if (!C.known(d.type)) d.type = oldType;
      /* Typ gewechselt und Portliste unverändert → Ports des neuen Typs übernehmen. */
      if (d.type !== oldType && !portsTextChanged) d.ports = C.buildPorts(d.type);
      else d.ports = textToPorts(res.portsText);

      S.touch();
      NWT.emit('change', { structural: true });
      return d;
    });
  }

  /* ---------------------------------------------------- Abzweig */

  /* ------------------------------------------------ Text und Notiz */

  /** Schriftfelder — dieselben für Textfeld, Notiz und Formbeschriftung. */
  function fontFields(prefixSection) {
    const D = NWT.Decor;
    return [
      { section: prefixSection },
      { key: 'font', label: 'Schriftart', type: 'select', options: D.fontOptions(),
        hint: 'Systemschriften mit Rückfallkette — mitgelieferte Schriftdateien verbietet die Einzeldatei-Auslieferung.' },
      { key: 'fontSize', label: 'Schriftgröße (px)', type: 'number', min: 6, max: 200, step: 1 },
      { key: 'color', label: 'Schriftfarbe', type: 'color' },
      { key: 'useColor', label: 'eigene Schriftfarbe verwenden', type: 'checkbox', wide: true,
        hint: 'Ohne Haken folgt die Schrift dem Design — im dunklen Design also hell.' },
      { key: 'bold', label: 'Fett', type: 'checkbox' },
      { key: 'italic', label: 'Kursiv', type: 'checkbox' },
      { key: 'align', label: 'Ausrichtung', type: 'select', options: D.ALIGNS }
    ];
  }

  function fontValues(d) {
    const ts = NWT.Decor.textStyle(d);
    return {
      font: ts.font, fontSize: ts.size,
      color: ts.color || (NWT.Theme.effective() === 'dark' ? '#e8eef8' : '#0f172a'),
      useColor: !!ts.color,
      bold: ts.weight >= 600, italic: ts.italic, align: ts.align
    };
  }

  function applyFont(d, res) {
    const D = NWT.Decor;
    d.font = D.FONTS[res.font] ? res.font : undefined;
    d.fontSize = U.clamp(Number(res.fontSize) || 0, 6, 200) || undefined;
    /* Ohne Haken kein Farbwert am Element — dann gilt das Design. */
    d.color = res.useColor ? res.color : undefined;
    d.bold = !!res.bold;
    d.italic = !!res.italic;
    d.align = D.ALIGNS.some(a => a.value === res.align) ? res.align : undefined;
  }

  function editText(id) {
    const d = S.dev(id);
    if (!d) return Promise.resolve(null);
    const istNotiz = C.shapeOf(d.type) === 'note';
    const r = S.deviceRect(d);

    const fields = [
      { section: 'Inhalt' },
      { key: 'name', label: istNotiz ? 'Notiztext' : 'Text', wide: true,
        type: istNotiz ? 'textarea' : 'text', rows: 4,
        placeholder: istNotiz ? 'Was hier noch zu tun ist …' : 'Beschriftung' }
    ];
    if (istNotiz) {
      fields.push({ key: 'w', label: 'Breite', type: 'number', min: 60, max: 2000, step: 10 });
      fields.push({ key: 'h', label: 'Höhe', type: 'number', min: 40, max: 2000, step: 10 });
    } else {
      fields.push({ key: '_gr', type: 'static', wide: true, label: 'Größe',
        value: 'Ein Textfeld ist einzeilig; seine Kachel folgt dem Text. Wird die Schrift '
             + 'größer, wächst das Feld mit.' });
    }
    fontFields('Schrift').forEach(f => fields.push(f));
    fields.push({ section: 'Lage' });
    fields.push({ key: 'layer', label: 'Ebene', type: 'select', options: layerOptions() });

    return M.form({
      title: istNotiz ? 'Freie Notiz' : 'Textfeld',
      subtitle: 'ID ' + d.id,
      width: '600px',
      fields: fields,
      values: Object.assign({ name: d.name || '', w: Math.round(r.w), h: Math.round(r.h),
                              layer: d.layer }, fontValues(d)),
      submitLabel: 'Übernehmen',
      extraButtons: [
        { label: 'Löschen', kind: 'ghost-danger', left: true, value: { __delete: true } },
        { label: 'Duplizieren', left: true, value: { __duplicate: true } }
      ]
    }).then(res => {
      if (!res) return null;
      if (res.__delete) { NWT.Commands.deleteIds([id]); return null; }
      if (res.__duplicate) { NWT.Commands.duplicateSelection([id]); return null; }

      NWT.History.record(istNotiz ? 'Notiz bearbeiten' : 'Textfeld bearbeiten');
      d.name = res.name;
      if (istNotiz) {
        d.w = Math.max(60, Number(res.w) || r.w);
        d.h = Math.max(40, Number(res.h) || r.h);
      }
      applyFont(d, res);
      d.layer = res.layer;
      S.touch();
      NWT.emit('change', { structural: true });
      return d;
    });
  }

    return M.form({

      fields: [
        { section: 'Form' },
        { key: 'figure', label: 'Figur', type: 'select', options: D.figureOptions() },
        { key: 'name', label: 'Beschriftung', wide: true, placeholder: 'bleibt leer, wenn nichts hineingehört' },
        { key: 'w', label: 'Breite', type: 'number', min: 10, max: 4000, step: 5 },
        { key: 'h', label: 'Höhe', type: 'number', min: 10, max: 4000, step: 5 },
        { key: 'rot', label: 'Drehung (Grad)', type: 'number', min: -360, max: 360, step: 15,
          hint: 'Dreht um die Mitte. Für senkrechte Linien und Pfeile: 90.' },

        { section: 'Darstellung' },
        { key: 'stroke', label: 'Linienfarbe', type: 'color' },

        { key: 'fillOn', label: 'Fläche füllen', type: 'checkbox' },
        { key: 'fill', label: 'Füllfarbe', type: 'color' },
        { key: 'opacity', label: 'Deckkraft', type: 'number', min: 0.05, max: 1, step: 0.05,
          hint: '1 = deckend. Kleinere Werte legen die Fläche wie eine Folie über den Plan.' },

        { section: 'Beschriftung' },
        { key: 'font', label: 'Schriftart', type: 'select', options: D.fontOptions() },
        { key: 'fontSize', label: 'Schriftgröße (px)', type: 'number', min: 6, max: 200, step: 1 },
        { key: 'bold', label: 'Fett', type: 'checkbox' },
        { key: 'italic', label: 'Kursiv', type: 'checkbox' },
        { key: 'color', label: 'Schriftfarbe', type: 'color' },
        { key: 'useColor', label: 'eigene Schriftfarbe (sonst wie die Linie)', type: 'checkbox', wide: true },

        { section: 'Lage' },
        { key: 'front', label: 'Im Vordergrund (über Geräten und Leitungen)', type: 'checkbox', wide: true },

        stroke: st.stroke, strokeWidth: st.strokeWidth, dash: st.dash,
        fillOn: st.fill !== 'none', fill: st.fill === 'none' ? st.stroke : st.fill,

        italic: tsv.italic, color: tsv.useColor ? tsv.color : st.stroke,

      },
      submitLabel: 'Übernehmen',
      extraButtons: [

      ]
    }).then(res => {
      if (!res) return null;
      if (res.__delete) { NWT.Commands.deleteIds([id]); return null; }
      if (res.__duplicate) { NWT.Commands.duplicateSelection([id]); return null; }

      NWT.History.record('Grafikelement');
      d.figure = D.FIGURES[res.figure] ? res.figure : d.figure;
      d.name = res.name;
      d.w = Math.max(10, Number(res.w) || r.w);
      d.h = Math.max(10, Number(res.h) || r.h);
      d.rot = Math.round(U.clamp(Number(res.rot) || 0, -360, 360));
      d.stroke = res.stroke;
      d.strokeWidth = U.clamp(Number(res.strokeWidth) || 2, 0.5, 24);
      d.dash = res.dash;

         gesetzt, damit die Farbe beim nächsten Einschalten dasteht. */
      d.fill = res.fillOn ? res.fill : 'none';
      d.opacity = U.clamp(Number(res.opacity) || 1, 0.05, 1);
      d.front = !!res.front;
      applyFont(d, res);

  /* -------------------------------------------------------- Verbindung */

  function portOptions(deviceId) {
    const d = S.dev(deviceId);
    const opts = [{ value: '', label: '— kein Port —' }];
    if (d) (d.ports || []).forEach(p => opts.push({ value: p.name, label: p.name }));
    return opts;
  }

  function editConnection(id) {
    const c = S.con(id);
    if (!c) return Promise.resolve(null);
    const A = S.dev(c.source), B = S.dev(c.target);

    const fields = [
      { section: 'Verbindung' },
      { key: 'label', label: 'Beschriftung', placeholder: 'z. B. Uplink Serverraum' },
      { key: 'type', label: 'Verbindungstyp', type: 'select', options: C.connTypeOptions() },
      { key: 'speed', label: 'Geschwindigkeit / Kennwert', placeholder: '1 Gbit/s · 30 W · 12 Mbit/s' },
      { key: 'vlan', label: 'VLAN', placeholder: '20' },

      { section: 'Endpunkte' },
      { key: '_src', label: 'Quelle', type: 'static', value: A ? A.name : '—' },
      { key: '_dst', label: 'Ziel', type: 'static', value: B ? B.name : '—' },
      { key: 'sourcePort', label: 'Port Quelle', type: 'select', options: portOptions(c.source) },
      { key: 'targetPort', label: 'Port Ziel', type: 'select', options: portOptions(c.target) },
      { key: 'layer', label: 'Ebene', type: 'select', options: layerOptions() },

      { section: 'Darstellung dieser Verbindung' },
      { key: 'styleColor', label: 'Farbe', type: 'color' },
      { key: 'styleWidth', label: 'Linienstärke', type: 'number', min: 0.5, max: 12, step: 0.1 },
      { key: 'styleDash', label: 'Strichmuster', type: 'select',
        options: C.DASH_PRESETS.map(p => ({ value: p.value, label: p.label })) },
      { key: '_preview', label: 'Vorschau', type: 'custom', render: () => stylePreviewHtml() },

      { section: 'Führung' },
      { key: '_pts', label: 'Knoten', type: 'static', wide: true,
        value: (c.points && c.points.length)
          ? c.points.length + ' Stützpunkt(e) gesetzt — Griffe erscheinen, sobald die Leitung '
            + 'ausgewählt ist. Doppelklick auf einen Griff entfernt ihn.'
          : 'Keine — die Leitung wird automatisch geführt. Rechtsklick auf die Leitung: '
            + '„Knoten hier einfügen" oder „Abzweig hier einfügen".' },
      { key: 'clearPoints', label: 'Knoten entfernen, automatisch führen', type: 'checkbox', wide: true },

      { section: 'Dokumentation' },
      { key: 'description', label: 'Beschreibung', type: 'textarea', wide: true, rows: 3 }
    ];

    const eff = S.edgeStyle(c);

    return M.form({
      title: 'Verbindungseigenschaften',
      subtitle: (A ? A.name : '?') + ' → ' + (B ? B.name : '?') + ' · ID ' + c.id,
      fields: fields,
      values: Object.assign({}, c, {
        styleColor: eff.color, styleWidth: eff.width, styleDash: eff.dash
      }),
      width: '720px',
      extraButtons: [
        { label: 'Löschen', kind: 'ghost-danger', left: true, value: { __delete: true } },
        { label: 'Richtung tauschen', left: true, value: { __swap: true } },
        { label: 'Darstellung zurücksetzen', left: true, value: { __resetStyle: true } }
      ],
      onMount: (root) => {
        const typeSel = root.querySelector('[name="type"]');
        const speedIn = root.querySelector('[name="speed"]');
        const colorIn = root.querySelector('[name="styleColor"]');
        const widthIn = root.querySelector('[name="styleWidth"]');
        const dashIn = root.querySelector('[name="styleDash"]');

        const paint = () => {
          const line = root.querySelector('#style-preview-line');
          if (!line) return;
          line.style.stroke = colorIn.value;
          line.style.strokeWidth = widthIn.value;
          line.style.strokeDasharray = dashIn.value || 'none';
          const caps = root.querySelectorAll('#style-preview .pv-cap');
          caps.forEach(el => { el.style.fill = colorIn.value; });
        };

        /* Typwechsel füllt Geschwindigkeit und Darstellung nach, solange der
           Anwender sie nicht selbst überschrieben hat. */
        typeSel.addEventListener('change', () => {
          const prev = C.connType(c.type).speed;
          if (!speedIn.value || speedIn.value === prev) speedIn.value = C.connType(typeSel.value).speed;
          if (!c.style) {
            const next = S.edgeStyle({ type: typeSel.value });
            colorIn.value = next.color;
            widthIn.value = next.width;
            dashIn.value = next.dash;
          }
          paint();
        });
        [colorIn, widthIn, dashIn].forEach(el => {
          el.addEventListener('input', paint);
          el.addEventListener('change', paint);
        });
        paint();
      }
    }).then(res => {
      if (!res) return null;
      if (res.__delete) { NWT.Commands.deleteIds([id]); return null; }
      if (res.__resetStyle) {
        NWT.History.record('Darstellung zurücksetzen');
        delete c.style;
        S.touch();
        NWT.emit('change', { structural: true });
        U.toast('Darstellung folgt wieder dem Verbindungstyp');
        return c;
      }
      if (res.__swap) {
        NWT.History.record('Richtung tauschen');
        const s = c.source, sp = c.sourcePort;
        c.source = c.target; c.sourcePort = c.targetPort;
        c.target = s; c.targetPort = sp;
        S.reindex(); S.touch();
        NWT.emit('change', { structural: true });
        return c;
      }
      NWT.History.record('Verbindungseigenschaften');
      if (res.clearPoints) c.points = [];
      ['label', 'type', 'speed', 'vlan', 'sourcePort', 'targetPort', 'layer', 'description'].forEach(k => {
        if (res[k] !== undefined) c[k] = res[k];
      });
      if (!C.CONNECTION_TYPES[c.type]) c.type = 'custom';

      /* Weicht die eingestellte Darstellung von der Vorgabe ab, wird sie an
         der Leitung festgehalten — sonst folgt sie weiter dem Typ. */
      const typeDefault = S.edgeStyle({ type: c.type });
      const chosen = {
        color: res.styleColor || typeDefault.color,
        width: Number(res.styleWidth) || typeDefault.width,
        dash: res.styleDash === undefined ? typeDefault.dash : res.styleDash
      };
      if (chosen.color.toLowerCase() !== typeDefault.color.toLowerCase() ||
          Math.abs(chosen.width - typeDefault.width) > 0.001 ||
          chosen.dash !== typeDefault.dash) {
        c.style = chosen;
      } else {
        delete c.style;
      }

      S.touch();
      NWT.emit('change', { structural: true });
      return c;
    });
  }
