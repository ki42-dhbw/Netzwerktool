  let fileInput = null;

  function init() {
    fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.json,.xml,.txt,.csv,.log,application/json,text/xml,text/plain,text/csv';
    fileInput.hidden = true;
    document.body.appendChild(fileInput);
    fileInput.addEventListener('change', () => {
      const f = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (f) importFile(f);
    });
  }

  /* ------------------------------------------------------- Einlesen */

  const EXAMPLES = [
    ['Windows', 'arp -a', 'ipconfig /all'],
    ['Linux/macOS', 'ip neigh', 'arp -n'],
    ['nmap (Hosts)', 'nmap -sn 192.168.1.0/24'],
    ['nmap (Dienste, empfohlen)', 'nmap -sV -oX scan.xml 192.168.1.0/24'],
    ['nmap (UDP, Modellbahn)', 'nmap -sU -p 15730,15731,21105 192.168.1.0/24'],
    ['Switch (Nachbarn)', 'show lldp neighbors detail', 'show cdp neighbors detail'],
    ['Switch (Portbelegung)', 'show mac address-table']
  ];

  function pasteDialog() {
    const cmds = '<table class="cmd-table"><tbody>' + EXAMPLES.map(e =>
      '<tr><th>' + U.escapeHtml(e[0]) + '</th><td>' +
      e.slice(1).map(c => '<code>' + U.escapeHtml(c) + '</code>').join(' &nbsp;·&nbsp; ') +
      '</td></tr>').join('') + '</tbody></table>';

    return NWT.Modal.open({
      title: 'Netzwerkdaten einlesen',
      subtitle: 'Ausgabe eines Werkzeugs einfügen — das Format wird automatisch erkannt.',
      width: '820px',
      bodyHtml:
        '<div class="analysis-dlg">' +
          '<p class="msg-body">Führen Sie einen der folgenden Befehle aus und fügen Sie die ' +
          'komplette Ausgabe unten ein. Mehrere Ausgaben dürfen zusammen eingefügt werden.</p>' +
          cmds +
          '<textarea id="an-input" rows="12" spellcheck="false" placeholder="Ausgabe hier einfügen (Strg+V) …"></textarea>' +
          '<div class="hintline">Erkannt werden: ARP-/Nachbartabellen, nmap (normal, -oG, -oX), ' +
          'LLDP/CDP-Nachbarschaften, MAC-Adresstabellen, CSV-Listen und die JSON-Datei des Analyse-Skripts.</div>' +
        '</div>',
      buttons: [
        { label: 'Analyse-Skript …', value: 'script', left: true },
        { label: 'Datei wählen …', value: 'file', left: true },
        { label: 'Abbrechen', value: null },
        {
          label: 'Analysieren', primary: true,
          onClick: (api) => {
            const text = api.root.querySelector('#an-input').value;
            if (!text.trim()) {
              U.toast('Bitte zuerst eine Ausgabe einfügen.', 'warn');
              return false;
            }
            return { text: text };
          }
        }
      ],
      onMount: (root) => {
        const ta = root.querySelector('#an-input');
        setTimeout(() => ta.focus(), 40);
      }
    }).then(res => {
      if (!res) return;
      if (res === 'script') { showScript(); return; }
      if (res === 'file') { fileInput.click(); return; }
      runAnalysis(res.text);
    });
  }

  function importFile(file) {
    if (file.size > 20 * 1024 * 1024) {
      NWT.Modal.error('Die Datei ist größer als 20 MB und wird nicht gelesen.');
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => NWT.Modal.error('Die Datei konnte nicht gelesen werden.');
    reader.onload = () => runAnalysis(String(reader.result), file.name);
    reader.readAsText(file);
  }

  function pickFile() { fileInput.click(); }

  function runAnalysis(text, filename) {
    let result;
    try {
      result = NWT.Discovery.analyze(text);
    } catch (e) {
      NWT.Modal.error('Die Daten konnten nicht ausgewertet werden.', e.message);
      return null;
    }
    U.toast(result.hosts.length + ' Host(s) erkannt' + (filename ? ' aus ' + filename : '') +
      ' · Quelle: ' + (result.sources.join(', ') || 'unbekannt'), 'ok', 4000);
    return result;
  }

  /* --------------------------------------------------------- Skripte */

  function scriptText(kind) {
    return kind === 'sh' ? (window.__NWT_SCRIPT_SH__ || '') : (window.__NWT_SCRIPT_PS1__ || '');
  }

  function showScript(kind) {
    let current = kind || 'ps1';
    const body = () =>
      '<div class="script-dlg">' +
        '<div class="script-tabs">' +
          '<button type="button" class="btn' + (current === 'ps1' ? ' primary' : '') + '" data-k="ps1">Windows · PowerShell</button>' +
          '<button type="button" class="btn' + (current === 'sh' ? ' primary' : '') + '" data-k="sh">Linux / macOS · Bash</button>' +
        '</div>' +
        '<div class="script-how">' +
          (current === 'ps1'
            ? '<ol><li>Skript herunterladen oder kopieren und als <code>netzwerk_analyse.ps1</code> speichern.</li>' +
              '<li>PowerShell im selben Ordner öffnen und ausführen:<br>' +
              '<code>powershell -ExecutionPolicy Bypass -File .\\netzwerk_analyse.ps1</code></li>' +
              '<li>Die erzeugte <code>netzwerk_scan.json</code> hier importieren.</li></ol>' +
              '<p class="script-note">Die Windows-Fassung findet Geräte auch dann, wenn sie ' +
              'nicht auf Ping antworten, und leitet aus den Fundstellen Verbindungen ab. ' +
              'Diese werden im Dashboard einzeln zur Prüfung angeboten.</p>'
            : '<ol><li>Skript herunterladen oder kopieren und als <code>netzwerk_analyse.sh</code> speichern.</li>' +
              '<li>Ausführbar machen und starten:<br><code>chmod +x netzwerk_analyse.sh &amp;&amp; ./netzwerk_analyse.sh</code></li>' +
              '<li>Die erzeugte <code>netzwerk_scan.json</code> hier importieren.</li></ol>' +
              '<p>Voraussetzung: Python 3.9+ sowie ping und die Netzwerkwerkzeuge des Betriebssystems. Es werden keine Python-Pakete benötigt.</p>') +
          '<p>Vorab den Bereich prüfen: <code>-PlanOnly</code> (Windows) bzw. <code>--plan-only</code> (Linux/macOS). ' +
          'Schnittstelle, Startadresse, maximale Hostzahl, Parallelität und Timeout sind einstellbar. Abbruch mit Q (Windows) bzw. Strg+C (Linux/macOS) schreibt ein Teilergebnis.</p>' +
        '</div>' +
        '<div class="note-inline">Das Skript sendet Prüfanfragen an den gewählten Adressbereich und fragt die konfigurierte Namensauflösung ab. ' +
        'Es verändert keine Gerätekonfiguration. Setzen Sie es ausschließlich in Netzwerken ein, für die Sie zuständig sind.</div>' +
        '<pre class="script-code">' + U.escapeHtml(scriptText(current)) + '</pre>' +
      '</div>';

    const wire = (root, api) => {
      root.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
        current = b.getAttribute('data-k');
        root.querySelector('.dlg-body').innerHTML = body();
        wire(root, api);
      }));
    };

    return NWT.Modal.open({
      title: 'Analyse-Skript',
      subtitle: 'Ermittelt erreichbare Hosts, MAC-Adressen, Namen und offene Ports',
      width: '880px',
      bodyHtml: body(),
      buttons: [
        {
          label: 'Kopieren', left: true,
          onClick: () => {
            copyText(scriptText(current));
            return false;
          }
        },
        {
          label: 'Herunterladen', left: true,
          onClick: () => {
            const name = current === 'ps1' ? 'netzwerk_analyse.ps1' : 'netzwerk_analyse.sh';
            U.downloadBlob(new Blob([scriptText(current)], { type: 'text/plain;charset=utf-8' }), name);
            U.toast(name + ' gespeichert', 'ok');
            return false;
          }
        },
        { label: 'Scan-Datei importieren …', value: 'import' },
        { label: 'Schließen', value: null, primary: true }
      ],
      onMount: wire
    }).then(v => { if (v === 'import') pickFile(); });
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => U.toast('Skript in die Zwischenablage kopiert', 'ok'))
        .catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    U.toast(ok ? 'Skript in die Zwischenablage kopiert' : 'Kopieren nicht möglich — bitte manuell markieren.',
      ok ? 'ok' : 'warn');
  }

  return { init, pasteDialog, importFile, pickFile, showScript, runAnalysis };
})();


/* ======================= 23-symbols.js ======================= */
/* ============================================================
   23 — Symbol-Editor
   Eigene Komponenten für die linke Leiste: zeichnen, aus SVG
   übernehmen oder aus einer Bilddatei erzeugen.

   Eigene Symbole liegen im Projekt (project.customTypes) und
   reisen daher in Speicherung, Autosave, JSON- und Grafikexport
   automatisch mit.

   SICHERHEIT: eingefügtes bzw. importiertes SVG wird strikt
   gefiltert — nur Geometrie-Elemente und eine feste Liste von
   Attributen bleiben übrig. Skripte, Verweise auf externe
   Ressourcen und Ereignis-Attribute werden entfernt.
   ============================================================ */

NWT.Symbols = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const C = NWT.Catalog;
  const M = NWT.Modal;

  const ALLOWED_TAGS = ['g', 'path', 'rect', 'circle', 'ellipse', 'line', 'polyline', 'polygon'];
  const ALLOWED_ATTRS = [
    'd', 'x', 'y', 'width', 'height', 'rx', 'ry', 'cx', 'cy', 'r',
    'x1', 'y1', 'x2', 'y2', 'points', 'transform',
    'fill', 'stroke', 'stroke-width', 'stroke-linecap', 'stroke-linejoin',
    'stroke-dasharray', 'fill-rule', 'fill-opacity', 'stroke-opacity', 'opacity'
  ];
  const MAX_MARKUP = 24000;

  /* ------------------------------------------------------- Bereinigung */

  /**
   * Filtert beliebiges SVG auf reine Geometrie.
   * Liefert { inner, viewBox } oder null, wenn nichts Zeichenbares übrig bleibt.
   */
  function sanitizeSvg(markup) {
    const src = String(markup || '').trim();
    if (!src) return null;
    if (src.length > MAX_MARKUP) throw new Error('Das SVG ist größer als 24 KB.');

    /* In ein <svg> hüllen, falls nur Elemente übergeben wurden. */
    const wrapped = /<svg[\s>]/i.test(src) ? src : '<svg xmlns="http://www.w3.org/2000/svg">' + src + '</svg>';
    let doc;
    try { doc = new DOMParser().parseFromString(wrapped, 'image/svg+xml'); }
    catch (e) { throw new Error('Das SVG konnte nicht gelesen werden.'); }
    if (!doc || doc.getElementsByTagName('parsererror').length) {
      throw new Error('Das SVG ist nicht wohlgeformt.');
    }
    const root = doc.documentElement;
    if (!root) throw new Error('Kein SVG-Inhalt gefunden.');

    /* viewBox übernehmen oder aus width/height ableiten. */
    let viewBox = root.getAttribute('viewBox') || '';
    if (!/^\s*-?[\d.]+\s+-?[\d.]+\s+[\d.]+\s+[\d.]+\s*$/.test(viewBox)) {
      const w = parseFloat(root.getAttribute('width')) || 24;
      const h = parseFloat(root.getAttribute('height')) || 24;
      viewBox = '0 0 ' + w + ' ' + h;
    }

    const out = [];
    const walk = (node, depth) => {
      if (depth > 8) return;
      Array.prototype.forEach.call(node.childNodes, child => {
        if (child.nodeType !== 1) return;
        const tag = String(child.nodeName).toLowerCase().replace(/^svg:/, '');
        if (tag === 'defs' || tag === 'symbol' || tag === 'use') { walk(child, depth + 1); return; }
        if (ALLOWED_TAGS.indexOf(tag) < 0) return;
        const attrs = [];
        Array.prototype.forEach.call(child.attributes, a => {
          const name = a.name.toLowerCase();
          if (ALLOWED_ATTRS.indexOf(name) < 0) return;
          const value = String(a.value);
          /* Keine Verweise auf externe oder interne Ressourcen. */
          if (/url\s*\(|javascript:|data:/i.test(value)) return;
          attrs.push(name + '="' + U.escapeHtml(value) + '"');
        });
        if (tag === 'g') {
          const before = out.length;
          walk(child, depth + 1);
          const collected = out.splice(before).join('');
          if (collected) out.push('<g ' + attrs.join(' ') + '>' + collected + '</g>');
          return;
        }
        out.push('<' + tag + (attrs.length ? ' ' + attrs.join(' ') : '') + '/>');
      });
    };
    walk(root, 0);

    const inner = out.join('');
    if (!inner) return null;
    return { inner: inner, viewBox: viewBox };
  }

  /** Prüft und bereinigt eine Liste eigener Typen (z. B. aus einer Fremddatei). */
  function sanitizeTypeList(list, warnings) {
    const out = [];
    const seen = {};
    (list || []).forEach((t, i) => {
      if (!t || typeof t !== 'object') return;
      let id = String(t.id || '');
      if (!/^custom_[a-z0-9_]{1,40}$/.test(id)) id = 'custom_' + (i + 1);
      while (seen[id]) id = id + '_x';
      seen[id] = true;

      const def = {
        id: id,
        label: String(t.label || 'Eigenes Symbol').slice(0, 60),
        cat: C.CATEGORIES.some(c => c.id === t.cat) ? t.cat : 'custom',
        color: /^#[0-9a-f]{3,8}$/i.test(String(t.color)) ? String(t.color) : '#0f172a',
        ports: Array.isArray(t.ports) ? t.ports.map(p => String(p && p.name ? p.name : p)).filter(Boolean).slice(0, 64) : [],
        iconViewBox: '0 0 24 24',
        iconInner: '',
        iconImage: ''
      };

      if (t.iconImage && /^data:image\//i.test(String(t.iconImage))) {
        def.iconImage = String(t.iconImage);
      }
      if (t.iconInner) {
        try {
          const clean = sanitizeSvg('<svg viewBox="' + (t.iconViewBox || '0 0 24 24') + '">' + t.iconInner + '</svg>');
          if (clean) { def.iconInner = clean.inner; def.iconViewBox = clean.viewBox; }
        } catch (e) {
          if (warnings) warnings.push('Symbol „' + def.label + '“: SVG verworfen (' + e.message + ')');
        }
      }
      if (!def.iconInner && !def.iconImage) {
        if (warnings) warnings.push('Symbol „' + def.label + '“ enthält keine verwertbare Grafik und wurde übersprungen.');
        return;
      }
      out.push(def);
    });
    return out;
  }

  /* ------------------------------------------------- Symbole einhängen */

  /** Schreibt alle eigenen Symbole als <symbol> in die <defs> des Canvas. */
  function syncDefs() {
    const host = document.getElementById('custom-defs');
    if (!host) return;
    const list = (S.project && S.project.customTypes) || [];
    host.innerHTML = list.filter(t => t.iconInner).map(t =>
      '<symbol id="' + U.escapeHtml(symbolId(t.id)) + '" viewBox="' + U.escapeHtml(t.iconViewBox) + '">' +
      t.iconInner + '</symbol>').join('');
  }

  function symbolId(typeId) { return 'ic-' + typeId.replace(/[^a-z0-9_]/gi, ''); }

  /** Liefert die Darstellungsart eines Typs für Katalog und Zeichenfläche. */
  function iconFor(typeId) {
    const t = C.type(typeId);
    if (t.iconImage) return { kind: 'image', href: t.iconImage };
    if (t.custom) return { kind: 'symbol', href: '#' + symbolId(typeId) };
    return { kind: 'symbol', href: '#' + t.icon };
  }

  /* ------------------------------------------------------- Verwaltung */

  function list() { return (S.project.customTypes || []).slice(); }

  function nextId() {
    let n = 1;
    const used = {};
    (S.project.customTypes || []).forEach(t => { used[t.id] = true; });
    while (used['custom_' + n]) n++;
    return 'custom_' + n;
  }

  function save(def) {
    const clean = sanitizeTypeList([def], null)[0];
    if (!clean) throw new Error('Das Symbol enthält keine verwertbare Grafik.');
    NWT.History.record('Eigenes Symbol speichern');
    const arr = S.project.customTypes;
    const i = arr.findIndex(t => t.id === clean.id);
    if (i >= 0) arr[i] = clean; else arr.push(clean);
    C.setCustom(arr);
    syncDefs();
    S.touch();
    NWT.emit('customtypes');
    NWT.emit('change', { structural: true });
    return clean;
  }

  function remove(typeId) {
    const used = S.project.devices.filter(d => d.type === typeId);
    const go = () => {
      NWT.History.record('Eigenes Symbol löschen');
      S.project.customTypes = S.project.customTypes.filter(t => t.id !== typeId);
      used.forEach(d => { d.type = 'pc'; });
      C.setCustom(S.project.customTypes);
      syncDefs();
      S.touch();
      NWT.emit('customtypes');
      NWT.emit('change', { structural: true });
      U.toast('Symbol gelöscht' + (used.length ? ' · ' + used.length + ' Gerät(e) auf „Desktop-PC“ gesetzt' : ''));
    };
    if (!used.length) { go(); return Promise.resolve(true); }
    return M.confirm({
      title: 'Symbol löschen',
      message: 'Das Symbol wird von ' + used.length + ' Gerät(en) verwendet. Diese Geräte erhalten den Typ „Desktop-PC“. Fortfahren?',
      confirmLabel: 'Löschen', danger: true
    }).then(ok => { if (ok) go(); return ok; });
  }

  /* ========================================================== Editor */

  /* Zustand des Zeichenwerkzeugs */
  let ed = null;

  const GRID = 24;         // logische Einheiten
  const PX = 15;           // Bildschirmpixel je Einheit
  const SIZE = GRID * PX;  // 360

  function open(typeId) {
    const existing = typeId ? (S.project.customTypes || []).find(t => t.id === typeId) : null;

    ed = {
      id: existing ? existing.id : nextId(),
      mode: 'draw',
      tool: 'poly',
      shapes: [],
      current: null,
      half: true,
      svgText: '',
      image: existing && existing.iconImage ? existing.iconImage : '',
      viewBox: existing ? existing.iconViewBox : '0 0 24 24',
      inner: existing ? existing.iconInner : '',
      isNew: !existing
    };
    /* Vorhandenes Symbol kommt als SVG-Text in den Reiter „SVG“. */
    if (existing && existing.iconInner) { ed.mode = 'svg'; ed.svgText = existing.iconInner; }
    if (existing && existing.iconImage) ed.mode = 'image';

    const values = {
      label: existing ? existing.label : '',
      cat: existing ? existing.cat : 'custom',
      color: existing ? existing.color : '#0f172a',
      ports: existing ? (existing.ports || []).join('\n') : 'LAN'
    };

    return M.open({
      title: existing ? 'Eigenes Symbol bearbeiten' : 'Eigenes Symbol erstellen',
      subtitle: 'Erscheint anschließend in der linken Leiste und wird mit dem Projekt gespeichert.',
      width: '960px',
      bodyHtml: editorHtml(values),
      buttons: [
        existing ? { label: 'Löschen', kind: 'ghost-danger', left: true, value: { __delete: true } } : null,
        { label: 'Abbrechen', value: null },
        {
          label: existing ? 'Änderungen speichern' : 'Symbol anlegen', primary: true,
          onClick: (api) => collect(api.root)
        }
      ].filter(Boolean),
      onMount: (root) => wireEditor(root)
    }).then(res => {
      if (!res) { ed = null; return null; }
      if (res.__delete) { ed = null; return remove(typeId); }
      try {
        const saved = save(res);
        U.toast('Symbol „' + saved.label + '“ gespeichert', 'ok');
        ed = null;
        return saved;
      } catch (e) {
        M.error('Das Symbol konnte nicht gespeichert werden.', e.message);
        ed = null;
        return null;
      }
    });
  }

  function editorHtml(v) {
    const cats = C.CATEGORIES.map(c =>
      '<option value="' + c.id + '"' + (c.id === v.cat ? ' selected' : '') + '>' +
      U.escapeHtml(c.label) + '</option>').join('');

    return '<div class="sym-editor">' +
      '<div class="sym-left">' +
        '<div class="sym-tabs">' +
          '<button type="button" class="btn" data-mode="draw">Zeichnen</button>' +
          '<button type="button" class="btn" data-mode="svg">SVG einfügen</button>' +
          '<button type="button" class="btn" data-mode="image">Bilddatei</button>' +
        '</div>' +

        '<div class="sym-pane" data-pane="draw">' +
          '<div class="sym-tools">' +
            '<button type="button" class="btn sym-tool" data-tool="poly">Linienzug</button>' +
            '<button type="button" class="btn sym-tool" data-tool="rect">Rechteck</button>' +
            '<button type="button" class="btn sym-tool" data-tool="circle">Kreis</button>' +
            '<span class="sym-spacer"></span>' +
            '<label class="dash-inline"><input type="checkbox" id="sym-half" checked> halbes Raster</label>' +
            '<button type="button" class="btn" data-act="close-shape">Form abschließen</button>' +
            '<button type="button" class="btn" data-act="undo-shape">Zurück</button>' +
            '<button type="button" class="btn ghost-danger" data-act="clear-shapes">Leeren</button>' +
          '</div>' +
          '<svg class="sym-grid" id="sym-grid" viewBox="0 0 ' + SIZE + ' ' + SIZE + '" width="' + SIZE + '" height="' + SIZE + '">' +
            '<g id="sym-grid-lines"></g>' +
            '<g id="sym-shapes"></g>' +
            '<g id="sym-guide"></g>' +
          '</svg>' +
          '<div class="hintline">Klicken setzt Punkte. <b>Doppelklick</b> oder <b>Form abschließen</b> beendet ' +
          'den Linienzug; für Rechteck und Kreis zwei Punkte setzen. Die Linien werden im Stil der ' +
          'eingebauten Symbole gezeichnet.</div>' +
        '</div>' +

        '<div class="sym-pane" data-pane="svg" hidden>' +
          '<textarea id="sym-svg" rows="14" spellcheck="false" placeholder="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt; … &lt;/svg&gt;  oder nur die Elemente"></textarea>' +
          '<div class="sym-tools"><button type="button" class="btn" data-act="svg-file">SVG-Datei wählen …</button>' +
          '<button type="button" class="btn" data-act="svg-apply">Übernehmen &amp; Vorschau</button></div>' +
          '<div class="note-inline">Eingefügtes SVG wird auf reine Geometrie gefiltert: Skripte, ' +
          'externe Verweise und Ereignis-Attribute werden entfernt. Am besten funktionieren einfache, ' +
          'einfarbige Strichsymbole ohne Farbfüllung.</div>' +
        '</div>' +

        '<div class="sym-pane" data-pane="image" hidden>' +
          '<div class="sym-drop" id="sym-drop">Bilddatei hierher ziehen oder klicken …</div>' +
          '<div class="hintline">PNG, JPG, GIF oder WebP. Das Bild wird auf 128 Pixel verkleinert und ' +
          'als Symbol verwendet. Für die Zeichenfläche eignen sich freigestellte Bilder mit ' +
          'transparentem Hintergrund am besten; ein echtes Gerätefoto gehört eher an das Gerät selbst ' +
          '(Abschnitt <i>Gerätefoto</i> im Eigenschaftenfenster).</div>' +
        '</div>' +
      '</div>' +

      '<div class="sym-right">' +
        '<div class="form-grid sym-form">' +
          '<div class="field wide"><label for="sym-label">Bezeichnung</label>' +
            '<input type="text" id="sym-label" value="' + U.escapeHtml(v.label) + '" placeholder="z. B. Hutschienen-Netzteil"></div>' +
          '<div class="field"><label for="sym-cat">Kategorie</label><select id="sym-cat">' + cats + '</select></div>' +
          '<div class="field"><label for="sym-color">Farbe</label>' +
            '<input type="color" id="sym-color" value="' + U.escapeHtml(v.color) + '"></div>' +
          '<div class="field wide"><label for="sym-ports">Ports (eine Zeile je Port)</label>' +
            '<textarea id="sym-ports" rows="4">' + U.escapeHtml(v.ports) + '</textarea></div>' +
        '</div>' +
        '<div class="sym-preview-block">' +
          '<div class="sym-preview-label">Vorschau</div>' +
          '<div class="sym-previews">' +
            '<div class="sym-prev-tile"><div id="sym-prev-icon" class="sym-prev-icon"></div><span id="sym-prev-name">Symbol</span></div>' +
            '<svg id="sym-prev-node" viewBox="0 0 132 88" width="132" height="88"></svg>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ---------------------------------------------------- Editor-Logik */

  function wireEditor(root) {
    const gridLines = root.querySelector('#sym-grid-lines');
    const shapesG = root.querySelector('#sym-shapes');
    const guideG = root.querySelector('#sym-guide');
    const svgEl = root.querySelector('#sym-grid');

    /* Raster zeichnen */
    let g = '';
    for (let i = 0; i <= GRID; i++) {
      const p = i * PX;
      const major = i % 6 === 0;
      g += '<line x1="' + p + '" y1="0" x2="' + p + '" y2="' + SIZE + '" class="' + (major ? 'gl-major' : 'gl') + '"/>';
      g += '<line x1="0" y1="' + p + '" x2="' + SIZE + '" y2="' + p + '" class="' + (major ? 'gl-major' : 'gl') + '"/>';
    }
    gridLines.innerHTML = g;

    const setMode = mode => {
      ed.mode = mode;
      root.querySelectorAll('[data-mode]').forEach(b =>
        b.classList.toggle('primary', b.getAttribute('data-mode') === mode));
      root.querySelectorAll('[data-pane]').forEach(p =>
        p.hidden = p.getAttribute('data-pane') !== mode);
      preview(root);
    };
    root.querySelectorAll('[data-mode]').forEach(b =>
      b.addEventListener('click', () => setMode(b.getAttribute('data-mode'))));

    const setTool = t => {
      ed.tool = t;
      ed.current = null;
      root.querySelectorAll('.sym-tool').forEach(b =>
        b.classList.toggle('primary', b.getAttribute('data-tool') === t));
      drawShapes();
    };
    root.querySelectorAll('.sym-tool').forEach(b =>
      b.addEventListener('click', () => setTool(b.getAttribute('data-tool'))));

    root.querySelector('#sym-half').addEventListener('change', e => { ed.half = e.target.checked; });

    /* Zeichnen */
    const toUnits = e => {
      const r = svgEl.getBoundingClientRect();
      const step = ed.half ? 0.5 : 1;
      const x = U.clamp(Math.round(((e.clientX - r.left) / r.width * GRID) / step) * step, 0, GRID);
      const y = U.clamp(Math.round(((e.clientY - r.top) / r.height * GRID) / step) * step, 0, GRID);
      return { x: x, y: y };
    };

    svgEl.addEventListener('click', e => {
      const p = toUnits(e);
      if (ed.tool === 'poly') {
        if (!ed.current) { ed.current = { t: 'poly', pts: [[p.x, p.y]] }; }
        else ed.current.pts.push([p.x, p.y]);
      } else {
        if (!ed.current) ed.current = { t: ed.tool, a: [p.x, p.y] };
        else {
          ed.current.b = [p.x, p.y];
          ed.shapes.push(ed.current);
          ed.current = null;
        }
      }
      drawShapes();
      preview(root);
    });

    svgEl.addEventListener('dblclick', e => {
      e.preventDefault();
      closeShape();
    });

    svgEl.addEventListener('mousemove', e => {
      if (!ed.current) { guideG.innerHTML = ''; return; }
      const p = toUnits(e);
      if (ed.current.t === 'poly') {
        const last = ed.current.pts[ed.current.pts.length - 1];
        guideG.innerHTML = '<line class="sym-guide-line" x1="' + last[0] * PX + '" y1="' + last[1] * PX +
          '" x2="' + p.x * PX + '" y2="' + p.y * PX + '"/>';
      } else if (ed.current.a) {
        const a = ed.current.a;
        guideG.innerHTML = ed.current.t === 'rect'
          ? '<rect class="sym-guide-line" x="' + Math.min(a[0], p.x) * PX + '" y="' + Math.min(a[1], p.y) * PX +
            '" width="' + Math.abs(p.x - a[0]) * PX + '" height="' + Math.abs(p.y - a[1]) * PX + '"/>'
          : '<circle class="sym-guide-line" cx="' + a[0] * PX + '" cy="' + a[1] * PX + '" r="' +
            Math.hypot(p.x - a[0], p.y - a[1]) * PX + '"/>';
      }
    });
    svgEl.addEventListener('mouseleave', () => { guideG.innerHTML = ''; });

    function closeShape() {
      if (ed.current && ed.current.t === 'poly' && ed.current.pts.length >= 2) ed.shapes.push(ed.current);
      ed.current = null;
      guideG.innerHTML = '';
      drawShapes();
      preview(root);
    }

    root.querySelector('[data-act="close-shape"]').addEventListener('click', closeShape);
    root.querySelector('[data-act="undo-shape"]').addEventListener('click', () => {
      if (ed.current && ed.current.t === 'poly' && ed.current.pts.length > 1) ed.current.pts.pop();
      else if (ed.current) ed.current = null;
      else ed.shapes.pop();
      drawShapes();
      preview(root);
    });
    root.querySelector('[data-act="clear-shapes"]').addEventListener('click', () => {
      ed.shapes = []; ed.current = null;
      drawShapes();
      preview(root);
    });

    function drawShapes() {
      const all = ed.shapes.concat(ed.current ? [ed.current] : []);
      shapesG.innerHTML = all.map(s => shapeToSvg(s, PX, true)).join('') +
        all.filter(s => s.t === 'poly').map(s => s.pts.map(p =>
          '<circle class="sym-node" cx="' + p[0] * PX + '" cy="' + p[1] * PX + '" r="3"/>').join('')).join('');
    }

    /* SVG-Reiter */
    const svgArea = root.querySelector('#sym-svg');
    svgArea.value = ed.svgText || '';
    root.querySelector('[data-act="svg-apply"]').addEventListener('click', () => {
      ed.svgText = svgArea.value;
      preview(root, true);
    });
    svgArea.addEventListener('blur', () => { ed.svgText = svgArea.value; preview(root); });
    root.querySelector('[data-act="svg-file"]').addEventListener('click', () => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.svg,image/svg+xml';
      inp.addEventListener('change', () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => { svgArea.value = String(rd.result); ed.svgText = svgArea.value; preview(root, true); };
        rd.readAsText(f);
      });
      inp.click();
    });

    /* Bild-Reiter */
    const drop = root.querySelector('#sym-drop');
    const takeImage = file => {
      NWT.Images.processFile(file).then(res => {
        /* Für ein Symbol reicht eine kleine Kantenlänge. */
        shrink(res.dataUrl, 128).then(small => {
          ed.image = small;
          preview(root);
        });
      }).catch(err => M.error('Das Bild konnte nicht gelesen werden.', err.message));
    };
    drop.addEventListener('click', () => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'image/*';
      inp.addEventListener('change', () => {
        const f = inp.files && inp.files[0];
        if (f) takeImage(f);
      });
      inp.click();
    });
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.classList.remove('over');
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) takeImage(f);
    });

    ['#sym-label', '#sym-color', '#sym-cat'].forEach(sel => {
      const el = root.querySelector(sel);
      el.addEventListener('input', () => preview(root));
      el.addEventListener('change', () => preview(root));
    });

    setMode(ed.mode);
    setTool('poly');
    drawShapes();
    preview(root);
  }

  function shrink(dataUrl, maxEdge) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * k));
        const h = Math.max(1, Math.round(img.naturalHeight * k));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/png'));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  /* Zeichenform → SVG-Markup. scale = Einheiten→Pixel, editor = Editordarstellung */
  function shapeToSvg(s, scale, editor) {
    const cls = editor ? ' class="sym-draw"' : '';
    const style = editor ? '' : ' fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
    if (s.t === 'poly') {
      if (!s.pts || s.pts.length < 2) return '';
      const d = 'M' + s.pts.map(p => (p[0] * scale) + ' ' + (p[1] * scale)).join(' L');
      return '<path' + cls + style + ' d="' + d + '"/>';
    }
    if (s.t === 'rect') {
      if (!s.b) return '';
      const x = Math.min(s.a[0], s.b[0]) * scale, y = Math.min(s.a[1], s.b[1]) * scale;
      const w = Math.abs(s.b[0] - s.a[0]) * scale, h = Math.abs(s.b[1] - s.a[1]) * scale;
      if (w < 0.1 || h < 0.1) return '';
      return '<rect' + cls + style + ' x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
        '" rx="' + (1.5 * scale) + '"/>';
    }
    if (s.t === 'circle') {
      if (!s.b) return '';
      const r = Math.hypot(s.b[0] - s.a[0], s.b[1] - s.a[1]) * scale;
      if (r < 0.5) return '';
      return '<circle' + cls + style + ' cx="' + (s.a[0] * scale) + '" cy="' + (s.a[1] * scale) + '" r="' + r + '"/>';
    }
    return '';
  }

  /** Aktuelles Symbol als bereinigtes Innen-Markup (24×24). */
  function currentGraphic(showError) {
    if (ed.mode === 'image') {
      return ed.image ? { iconImage: ed.image } : null;
    }
    if (ed.mode === 'svg') {
      if (!String(ed.svgText || '').trim()) return null;
      try {
        const clean = sanitizeSvg(ed.svgText);
        if (!clean) throw new Error('Es blieb kein zeichenbares Element übrig.');
        return { iconInner: clean.inner, iconViewBox: clean.viewBox };
      } catch (e) {
        if (showError) M.error('Das SVG konnte nicht übernommen werden.', e.message);
        return null;
      }
    }
    const shapes = ed.shapes.concat(ed.current && ed.current.t === 'poly' && ed.current.pts.length >= 2 ? [ed.current] : []);
    const inner = shapes.map(s => shapeToSvg(s, 1, false)).join('');
    return inner ? { iconInner: inner, iconViewBox: '0 0 ' + GRID + ' ' + GRID } : null;
  }

  function preview(root, showError) {
    const gfx = currentGraphic(showError);
    const color = root.querySelector('#sym-color').value || '#0f172a';
    const label = root.querySelector('#sym-label').value || 'Symbol';

    const iconHost = root.querySelector('#sym-prev-icon');
    iconHost.style.color = color;
    iconHost.innerHTML = !gfx ? '<span class="sym-none">—</span>'
      : gfx.iconImage ? '<img src="' + U.escapeHtml(gfx.iconImage) + '" alt="">'
      : '<svg viewBox="' + U.escapeHtml(gfx.iconViewBox) + '">' + gfx.iconInner + '</svg>';
    root.querySelector('#sym-prev-name').textContent = U.truncate(label, 18);

    /* Kachelvorschau in Originalgröße der Zeichenfläche */
    const node = root.querySelector('#sym-prev-node');
    const inner = !gfx ? ''
      : gfx.iconImage
        ? '<image x="53" y="13" width="26" height="26" href="' + U.escapeHtml(gfx.iconImage) + '"/>'
        : '<svg x="53" y="13" width="26" height="26" viewBox="' + U.escapeHtml(gfx.iconViewBox) + '">' + gfx.iconInner + '</svg>';
    /* Bewusst dieselben Klassen wie auf der Zeichenfläche: so folgt die
       Vorschau dem Design und zeigt wirklich, was später zu sehen ist. */
    node.innerHTML =
      '<rect class="node-box" x="0.7" y="0.7" width="130.6" height="86.6" rx="10"/>' +
      '<rect class="node-accent" x="12" y="0" width="108" height="3.5" rx="1.75" fill="' +
        U.escapeHtml(color) + '"/>' +
      '<g style="color:' + U.escapeHtml(color) + '">' + inner + '</g>' +
      '<text class="node-name" x="66" y="55">' + U.escapeHtml(U.truncate(label, 18)) + '</text>' +
      '<text class="node-type" x="66" y="68">eigenes Symbol</text>';
  }

  function collect(root) {
    const label = root.querySelector('#sym-label').value.trim();
    if (!label) { U.toast('Bitte eine Bezeichnung eingeben.', 'warn'); return false; }
    const gfx = currentGraphic(true);
    if (!gfx) { U.toast('Bitte zuerst ein Symbol zeichnen, einfügen oder wählen.', 'warn'); return false; }
    return Object.assign({
      id: ed.id,
      label: label,
      cat: root.querySelector('#sym-cat').value,
      color: root.querySelector('#sym-color').value,
      ports: root.querySelector('#sym-ports').value.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean)
    }, gfx);
  }

  return {
    open, save, remove, list, syncDefs, sanitizeSvg, sanitizeTypeList,
    symbolId, iconFor
  };
})();


/* ======================= 24-settings.js ======================= */
/* ============================================================
   24 — Einstellungsseite
   Sammelt alle Optionen an einem Ort: Ansicht, Bedienung,
   Projektdaten, Gerätebilder, eigene Symbole und Speicher.

   Unterscheidung, die hier wichtig ist:
     • Projekteinstellungen (Raster, Fotos, Hardware-Ansicht …)
       liegen im Projekt und reisen mit einer JSON-Datei mit.
     • Arbeitsplatzvorlieben (Hinweisfenster) liegen in NWT.Prefs
       und gelten nur für diesen Browser.
   ============================================================ */

NWT.Settings = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const C = NWT.Catalog;

  let overlay = null;
  let showAllTypes = false;
  let pendingType = null;
  let fileInput = null;
  let folderInput = null;

  function init() {
    fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.hidden = true;
    document.body.appendChild(fileInput);
    fileInput.addEventListener('change', () => {
      const f = fileInput.files && fileInput.files[0];
      const t = pendingType;
      fileInput.value = '';
      pendingType = null;
      if (f && t) setTypeImage(t, f);
    });

    /* Ordnerauswahl für die Bildbibliothek. webkitdirectory ist der einzige
       Weg, im Browser einen ganzen Ordner zu übergeben. */
    folderInput = document.createElement('input');
    folderInput.type = 'file';
    folderInput.multiple = true;
    folderInput.accept = 'image/*';
    folderInput.setAttribute('webkitdirectory', '');
    folderInput.hidden = true;
    document.body.appendChild(folderInput);
    folderInput.addEventListener('change', () => {
      const files = folderInput.files;
      folderInput.value = '';
      if (!files || !files.length) return;
      NWT.Library.importFiles(files).then(n => {
        if (!n) return;
        U.toast(n + ' Bild(er) eingelesen', 'ok');
        render();
        NWT.Library.reviewDialog(false).then(() => render());
      });
    });
  }

  /* -------------------------------------------------------- Typbilder */

  function setTypeImage(typeId, file) {
    NWT.Images.processFile(file).then(res => {
      NWT.History.record('Typbild zuweisen');
      if (!S.project.typeImages) S.project.typeImages = {};
      S.project.typeImages[typeId] = res.dataUrl;
      S.touch();
      NWT.emit('change', { structural: true });
      U.toast('Typbild für „' + C.typeLabel(typeId) + '“ gesetzt', 'ok');
      render();
    }).catch(err => NWT.Modal.error('Das Bild konnte nicht übernommen werden.', err.message));
  }

  function clearTypeImage(typeId) {
    if (!S.project.typeImages || !S.project.typeImages[typeId]) return;
    NWT.History.record('Typbild entfernen');
    delete S.project.typeImages[typeId];
    S.touch();
    NWT.emit('change', { structural: true });
    render();
  }

  function typeImageBytes() {
    const map = S.project.typeImages || {};
    return Object.keys(map).reduce((sum, k) =>
      sum + Math.round((map[k].length - map[k].indexOf(',') - 1) * 0.75), 0);
  }

  /* ------------------------------------------------------------ Gerüst */

  function ensure() {
    if (overlay) return overlay;
    overlay = document.createElement('div');
    overlay.id = 'set-overlay';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-label', 'Einstellungen');
    overlay.innerHTML =
      '<div class="dash">' +
        '<header class="dash-top">' +
          '<div class="dash-brand"><b>Einstellungen</b><span id="set-sub"></span></div>' +
          '<button type="button" class="help-btn primary" data-set-close>Schließen (Esc)</button>' +
        '</header>' +
        '<div class="dash-body"></div>' +
      '</div>';
    overlay.querySelector('[data-set-close]').addEventListener('click', close);
    overlay.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
    });
    document.body.appendChild(overlay);
    return overlay;
  }

  function open() {
    ensure();
    overlay.classList.add('on');
    document.body.classList.add('help-open');
    NWT.Tooltip && NWT.Tooltip.hide();
    render();
    NWT.Focus.enter(overlay);
  }

  function close() {
    if (!overlay) return;
    overlay.classList.remove('on');
    document.body.classList.remove('help-open');
    NWT.Focus.leave(overlay);
  }

  function isOpen() { return !!overlay && overlay.classList.contains('on'); }

  /* ------------------------------------------------------- Bausteine */

  function toggle(id, label, checked, hint) {
    return '<label class="set-row"><input type="checkbox" data-set="' + id + '"' +
      (checked ? ' checked' : '') + '>' +
      '<span class="set-text"><b>' + U.escapeHtml(label) + '</b>' +
      (hint ? '<small>' + hint + '</small>' : '') + '</span></label>';
  }

  function selectRow(id, label, options, value, hint) {
    const opt = o => '<option value="' + U.escapeHtml(o.value) + '"' +
      (String(o.value) === String(value) ? ' selected' : '') + '>' + U.escapeHtml(o.label) + '</option>';
    let body = '';
    if (options.some(o => o.group)) {
      let current = null;
      options.forEach(o => {
        if (o.group !== current) {
          if (current !== null) body += '</optgroup>';
          body += '<optgroup label="' + U.escapeHtml(o.group || '') + '">';
          current = o.group;
        }
        body += opt(o);
      });
      if (current !== null) body += '</optgroup>';
    } else {
      body = options.map(opt).join('');
    }
    return '<div class="set-row set-row-field">' +
      '<span class="set-text"><b>' + U.escapeHtml(label) + '</b>' +
      (hint ? '<small>' + hint + '</small>' : '') + '</span>' +
      '<select data-set="' + id + '">' + body + '</select></div>';
  }

  function textRow(id, label, value, placeholder, hint) {
    return '<div class="set-row set-row-field">' +
      '<span class="set-text"><b>' + U.escapeHtml(label) + '</b>' +
      (hint ? '<small>' + hint + '</small>' : '') + '</span>' +
      '<input type="text" data-set="' + id + '" value="' + U.escapeHtml(value || '') + '"' +
      (placeholder ? ' placeholder="' + U.escapeHtml(placeholder) + '"' : '') + '></div>';
  }

  function numberRow(id, label, value, min, max, hint) {
    return '<div class="set-row set-row-field">' +
      '<span class="set-text"><b>' + U.escapeHtml(label) + '</b>' +
      (hint ? '<small>' + hint + '</small>' : '') + '</span>' +
      '<input type="number" data-set="' + id + '" value="' + Number(value) +
      '" min="' + min + '" max="' + max + '"></div>';
  }

  /* Zeigt die drei häufigsten Angaben so, wie sie im Bild stünden. */
  function privacySample() {
    return ['192.168.10.42', '00:1A:2B:3C:4D:5E', 'srv01.firma.local']
      .map(t => NWT.Privacy.preview(t)).join('  ·  ');
  }

  function updatePrivacySample() {
    const el = overlay && overlay.querySelector('.set-sample');
    if (el) el.textContent = privacySample();
  }

  function card(title, inner, note) {
    return '<section class="dash-card set-card"><h3>' + U.escapeHtml(title) + '</h3>' + inner +
      (note ? '<div class="dash-note">' + note + '</div>' : '') + '</section>';
  }

  /* --------------------------------------------------------- Aufbau */

  function render() {
    if (!overlay) return;
    const P = S.project;
    const st = P.settings;
    overlay.querySelector('#set-sub').textContent = P.name;

    /* --- Vertrauliche Angaben --- */
    const pv = NWT.Privacy.settings();
    const beispiel = privacySample();
    const maskCard =
      toggle('pv-on', 'Maskierung einschalten', pv.on,
        'Gilt für Zeichenfläche, Ausdruck und Bildexport zugleich. So sehen Sie vorher, was hinterher im Bild steht.') +
      selectRow('pv-style', 'Art der Maskierung', NWT.Privacy.STYLES, pv.style) +
      '<div class="set-row set-row-field"><span class="set-text"><b>Beispiel</b>' +
        '<small>mit den aktuellen Einstellungen</small></span>' +
        '<code class="set-sample">' + U.escapeHtml(beispiel) + '</code></div>' +
      NWT.Privacy.GROUPS.map(g => toggle('pv-' + g.key, g.label, pv[g.key])).join('');

    /* --- Ansicht --- */
    const ansicht =
      toggle('grid', 'Raster anzeigen', st.grid, 'Hilfslinien auf der Zeichenfläche. Taste <kbd>G</kbd>.') +
      toggle('avoidObstacles', 'Leitungen um Geräte führen', st.avoidObstacles, 'Rechtwinklige Umwege bei freier Strecke. Manuelle Leitungsknoten bleiben maßgeblich.') +
      toggle('snap', 'Am Raster ausrichten', st.snap, 'Neue und verschobene Objekte rasten ein.') +
      numberRow('gridSize', 'Rastergröße', st.gridSize, 5, 200, 'in Pixeln, Standard 20') +
      selectRow('routing', 'Linienführung', [
        { value: 'orthogonal', label: 'Orthogonal (rechtwinklig)' },
        { value: 'straight', label: 'Gerade' },
        { value: 'curved', label: 'Gebogen' }
      ], st.routing, 'Gilt für alle Verbindungen des Projekts.') +
      toggle('minimap', 'Übersichtskarte anzeigen', st.minimap !== false, 'Minimap unten rechts.');

    /* --- Gerätedarstellung --- */
    const hwCount = Object.keys(C.HARDWARE).length;
    const darstellung =
      toggle('photos', 'Bilder auf der Zeichenfläche', st.photos !== false,
        'Zeigt Gerätefotos und Typbilder. Ausgeschaltet bleiben sie im Projekt erhalten.') +
      toggle('hardware', 'Hardware-Ansicht statt Symbol', !!st.hardware,
        'Gezeichnete Frontblenden für ' + hwCount + ' Gerätetypen — Portreihen, LEDs, Displays. ' +
        'Ein eigenes Foto oder Typbild hat immer Vorrang.');

    /* --- Bedienung --- */
    const bedienung =
      selectRow('theme', 'Design',
        NWT.Theme.MODES.map(m => ({ value: m, label: NWT.Theme.LABELS[m] })), NWT.Theme.get(),
        'Hell, dunkel oder dem System folgend. Export und Ausdruck bleiben immer hell.') +
      toggle('tooltips', 'Hinweisfenster (Tipps)', NWT.Tooltip.isEnabled(),
        'Gilt nur für diesen Browser und wird <b>nicht</b> im Projekt gespeichert.') +
      selectRow('defaultConnType', 'Standard-Verbindungstyp', C.connTypeOptions(),
        st.defaultConnType, 'Typ für neu gezogene Verbindungen.') +
      selectRow('activeLayer', 'Ebene für neue Objekte',
        P.layers.map(l => ({ value: l.id, label: l.name })), st.activeLayer);

    /* --- Projekt --- */
    const info = P.info || {};
    const projekt =
      textRow('projectName', 'Projektname', P.name) +
      textRow('author', 'Autor', info.author) +
      textRow('company', 'Firma', info.company) +
      textRow('location', 'Standort', info.location) +
      '<div class="set-meta">Erstellt: ' + U.formatDate(info.created) +
      ' · Geändert: ' + U.formatDate(info.modified) + '</div>';

    /* --- Gerätebilder --- */
    const used = {};
    P.devices.forEach(d => { used[d.type] = (used[d.type] || 0) + 1; });
    const imgs = P.typeImages || {};
    let typeList = Object.keys(C.DEVICE_TYPES).concat(Object.keys(C.customTypes()));
    if (!showAllTypes) {
      typeList = typeList.filter(t => used[t] || imgs[t]);
    }
    typeList.sort((a, b) => C.typeLabel(a).localeCompare(C.typeLabel(b), 'de'));

    const tiles = typeList.length ? typeList.map(t => {
      const has = !!imgs[t];
      const hw = C.hardwareFor(t);
      return '<div class="ti-tile' + (has ? ' has' : '') + '" data-type="' + U.escapeHtml(t) + '">' +
        '<div class="ti-img">' +
          (has ? '<img src="' + U.escapeHtml(imgs[t]) + '" alt="">'
               : hw ? '<svg viewBox="0 0 120 48"><use href="#' + hw + '"></use></svg>'
                    : '<span class="ti-none">kein Bild</span>') +
        '</div>' +
        '<div class="ti-label">' + U.escapeHtml(U.truncate(C.typeLabel(t), 22)) +
          (used[t] ? ' <em>· ' + used[t] + '×</em>' : '') + '</div>' +
        '<div class="ti-actions">' +
          '<button type="button" class="btn" data-ti-pick="' + U.escapeHtml(t) + '">' +
            (has ? 'Ersetzen' : 'Bild wählen') + '</button>' +
          (has ? '<button type="button" class="btn ghost-danger" data-ti-del="' + U.escapeHtml(t) + '">✕</button>' : '') +
        '</div>' +
      '</div>';
    }).join('') : '<div class="dash-empty">Noch keine Gerätetypen im Projekt.</div>';

    const tiBytes = typeImageBytes();
    const gerätebilder =
      toggle('showAllTypes', 'Nur verwendete Typen zeigen', !showAllTypes,
        'Ein Typbild gilt für <i>alle</i> Geräte dieses Typs — einmal hinterlegen genügt. ' +
        'Ohne Bild zeigt die Kachel die gezeichnete Hardware-Ansicht.') +
      '<div class="ti-grid">' + tiles + '</div>' +
      '<div class="dash-note">Bilder werden auf ' + NWT.Images.MAX_EDGE +
      ' Pixel verkleinert und im Projekt gespeichert (aktuell ' +
      NWT.Images.formatBytes(tiBytes) + ' für ' + Object.keys(imgs).length + ' Typbilder). ' +
      'Verwenden Sie nur Bilder, an denen Sie die Rechte haben.</div>';

    /* --- Eigene Symbole --- */
    const custom = C.customTypes();
    const symKeys = Object.keys(custom);
    const symbole =
      (symKeys.length
        ? '<div class="sym-list">' + symKeys.map(id => {
            const t = custom[id];
            const ic = NWT.Symbols.iconFor(id);
            return '<div class="sym-list-item" style="color:' + U.escapeHtml(t.color) + '">' +
              '<span class="sym-list-icon">' +
                (ic.kind === 'image' ? '<img src="' + U.escapeHtml(ic.href) + '" alt="">'
                                     : '<svg viewBox="0 0 24 24"><use href="' + U.escapeHtml(ic.href) + '"></use></svg>') +
              '</span>' +
              '<span class="sym-list-name">' + U.escapeHtml(t.label) + '</span>' +
              '<button type="button" class="btn" data-sym-edit="' + U.escapeHtml(id) + '">Bearbeiten</button>' +
              '<button type="button" class="btn ghost-danger" data-sym-del="' + U.escapeHtml(id) + '">Löschen</button>' +
            '</div>';
          }).join('') + '</div>'
        : '<div class="dash-empty">Noch keine eigenen Symbole angelegt.</div>') +
      '<div class="dash-actions"><button type="button" class="btn primary" data-sym-new>Neues Symbol …</button></div>';

    /* --- Speicher --- */
    const imgStats = NWT.Images.stats();
    const projects = NWT.Persistence.available() ? NWT.Persistence.listProjects().length : 0;
    const speicher =
      '<table class="dash-table"><tbody>' +
        '<tr><td>Browser-Speicher</td><td>' +
          (NWT.Persistence.available() ? 'verfügbar' : '<b>nicht verfügbar</b> — bitte per Export sichern') + '</td></tr>' +
        '<tr><td>Gespeicherte Projekte</td><td>' + projects + '</td></tr>' +
        '<tr><td>Gerätefotos</td><td>' + imgStats.count + ' · ' + NWT.Images.formatBytes(imgStats.bytes) + '</td></tr>' +
        '<tr><td>Typbilder</td><td>' + Object.keys(imgs).length + ' · ' + NWT.Images.formatBytes(tiBytes) + '</td></tr>' +
        '<tr><td>Eigene Symbole</td><td>' + symKeys.length + '</td></tr>' +
      '</tbody></table>' +
      '<div class="dash-actions">' +
        '<button type="button" class="btn" data-act-projects>Projekte verwalten …</button>' +
        '<button type="button" class="btn" data-act-export>Als JSON sichern</button>' +
        '<button type="button" class="btn ghost-danger" data-act-clearauto>Automatische Sicherung löschen</button>' +
      '</div>';

    /* --- Hilfe --- */
    const hilfe =
      '<div class="dash-actions">' +
        '<button type="button" class="btn" data-act-help>Kurzhilfe &amp; Kürzel</button>' +
        '<button type="button" class="btn" data-act-handbook>Ausführliches Handbuch</button>' +
        '<button type="button" class="btn" data-act-example>Beispielnetzwerk laden</button>' +
      '</div>';

    /* --- Setups --- */
    const setupNames = NWT.Setups.names();
    const activeSetup = NWT.Setups.active();
    const setups = setupNames.length
      ? '<div class="setup-list">' + setupNames.map(n =>
          '<div class="setup-row' + (n === activeSetup ? ' active' : '') + '">' +
            '<span class="setup-name">' + (n === activeSetup ? '● ' : '') + U.escapeHtml(n) + '</span>' +
            '<span class="setup-desc">' + U.escapeHtml(NWT.Setups.describe(n)) + '</span>' +
            '<button type="button" class="btn primary" data-setup-apply="' + U.escapeHtml(n) + '">Anwenden</button>' +
            '<button type="button" class="btn" data-setup-over="' + U.escapeHtml(n) + '" ' +
              'title="Mit den aktuellen Einstellungen überschreiben">Aktualisieren</button>' +
            '<button type="button" class="btn" data-setup-rename="' + U.escapeHtml(n) + '">Umbenennen</button>' +
            '<button type="button" class="btn ghost-danger" data-setup-del="' + U.escapeHtml(n) + '">✕</button>' +
          '</div>').join('') + '</div>'
      : '<div class="dash-empty">Noch keine Setups gesichert.</div>';

    const setupCard = setups +
      '<div class="dash-actions">' +
        '<button type="button" class="btn primary" data-setup-new>Aktuelle Einstellungen sichern …</button>' +
        (setupNames.length ? '' :
          '<button type="button" class="btn" data-setup-examples>Vier Beispiel-Setups anlegen</button>') +
      '</div>' +
      '<div class="dash-note">Ein Setup hält <b>Einstellungen</b> fest, nicht den Netzplan: Ansicht, ' +
      'Gerätedarstellung, Standard-Verbindungstyp, eigene Verbindungsarten, Bildauswahl, Design und ' +
      'Hinweisfenster. So schalten Sie zwischen Szenarien um — Arbeiten, Präsentation, Druck — ohne ' +
      'die Zeichnung anzufassen. Setups gehören zum Arbeitsplatz und gelten über alle Projekte hinweg; ' +
      'sie reisen <b>nicht</b> in einer exportierten JSON-Datei mit. Das Anwenden ist ein einziger ' +
      'Schritt und mit <b>Strg+Z</b> zurücknehmbar. Schneller geht es über das Zahnrad-Menü in der ' +
      'Werkzeugleiste.</div>';

    /* --- Bildbibliothek --- */
    const lib = NWT.Library.analyze();
    const picks = P.libraryPicks || {};
    const sicher = lib.filter(x => x.confidence === 'hoch').length;
    const offen = lib.filter(x => !x.type).length;
    const abgedeckt = {};
    lib.forEach(x => { if (x.type && x.confidence === 'hoch') abgedeckt[x.type] = true; });
    Object.keys(picks).forEach(t => { abgedeckt[t] = true; });

    const libList = lib.length
      ? '<div class="lib-grid">' + lib.map(x => {
          const gewaehlt = picks[x.type] === x.name;
          return '<div class="lib-card' + (gewaehlt ? ' picked' : '') + '">' +
            '<img class="lib-thumb" src="' + U.escapeHtml(x.data) + '" alt="">' +
            '<div class="lib-file">' + U.escapeHtml(x.name) + '</div>' +
            '<div class="lib-type">' + (x.type
              ? U.escapeHtml(C.typeLabel(x.type)) +
                (x.variant ? ' <em>· ' + U.escapeHtml(x.variant) + '</em>' : '')
              : '<span class="lib-open">nicht zugeordnet</span>') + '</div>' +
            (x.type
              ? '<button type="button" class="btn lib-pick" data-lib-pick="' + U.escapeHtml(x.type) +
                '" data-lib-name="' + U.escapeHtml(x.name) + '">' +
                (gewaehlt ? 'gewählt' : 'als Typbild') + '</button>'
              : '') +
          '</div>';
        }).join('') + '</div>'
      : '<div class="dash-empty">Es sind keine Bilder eingebettet oder eingelesen.</div>';

    const bibliothek =
      '<div class="kpi-row small">' +
        '<div class="kpi"><b>' + lib.length + '</b><span>Bilder</span></div>' +
        '<div class="kpi"><b>' + sicher + '</b><span>sicher zugeordnet</span></div>' +
        '<div class="kpi"><b>' + offen + '</b><span>offen</span></div>' +
        '<div class="kpi"><b>' + Object.keys(abgedeckt).length + '</b><span>Gerätetypen abgedeckt</span></div>' +
        '<div class="kpi"><b>' + NWT.Library.runtimeCount() + '</b><span>eingelesen</span></div>' +
      '</div>' +
      '<div class="dash-actions">' +
        '<button type="button" class="btn primary" data-lib-review>Zuordnung prüfen …</button>' +
        '<button type="button" class="btn" data-lib-open>Bildordner einlesen …</button>' +
        (NWT.Library.runtimeCount()
          ? '<button type="button" class="btn ghost-danger" data-lib-clear>Eingelesene verwerfen</button>' : '') +
      '</div>' +
      libList +
      '<div class="dash-note">Bilder im Ordner <code>bilder/</code> werden beim Bauen eingebettet und ' +
      'stehen in <b>jedem</b> Projekt zur Verfügung, ohne die Projektdatei zu vergrößern — gespeichert ' +
      'wird nur der Dateiname der Auswahl. Eingelesene Ordner werden im Browser verkleinert und gelten ' +
      'nur für diese Sitzung, bis Sie sie einem Typ zuweisen. ' +
      'Ein Bild direkt am Gerät (Rechtsklick → Foto) hat immer Vorrang.</div>';

    /* --- Verbindungsarten --- */
    const styles = P.connStyles || {};
    const connRows = C.CONN_CATEGORIES.map(cat => {
      const ids = C.connTypesIn(cat.id);
      if (!ids.length) return '';
      return '<div class="cs-group"><h4>' + U.escapeHtml(cat.label) + '</h4>' +
        ids.map(id => {
          const eff = S.edgeStyle({ type: id });
          const own = !!styles[id];
          return '<div class="cs-row' + (own ? ' changed' : '') + '" data-conn="' + id + '">' +
            '<span class="cs-name" title="' + U.escapeHtml(C.connType(id).label) + '">' + U.escapeHtml(C.connType(id).label) + '</span>' +
            '<svg class="cs-preview" viewBox="0 0 90 14" preserveAspectRatio="none">' +
              '<line x1="2" y1="7" x2="88" y2="7" stroke-linecap="round" stroke="' + eff.color +
              '" stroke-width="' + eff.width + '"' +
              (eff.dash ? ' stroke-dasharray="' + U.escapeHtml(eff.dash) + '"' : '') + '></line>' +
            '</svg>' +
            '<input type="color" data-cs="color" value="' + U.escapeHtml(eff.color) + '" title="Farbe">' +
            '<input type="number" data-cs="width" value="' + eff.width + '" min="0.5" max="12" step="0.1" title="Linienstärke">' +
            '<select data-cs="dash" title="Strichmuster">' + C.DASH_PRESETS.map(p =>
              '<option value="' + U.escapeHtml(p.value) + '"' + (p.value === eff.dash ? ' selected' : '') + '>' +
              U.escapeHtml(p.label) + '</option>').join('') + '</select>' +
            '<button type="button" class="btn cs-reset"' + (own ? '' : ' disabled') +
              ' title="Auf Auslieferungszustand zurücksetzen">↺</button>' +
          '</div>';
        }).join('') + '</div>';
    }).join('');

    const changedCount = Object.keys(styles).length;
    const verbindungen =
      '<div class="cs-list">' + connRows + '</div>' +
      '<div class="dash-actions">' +
        '<button type="button" class="btn ghost-danger" data-cs-reset-all' +
        (changedCount ? '' : ' disabled') + '>Alle zurücksetzen' +
        (changedCount ? ' (' + changedCount + ')' : '') + '</button>' +
      '</div>' +
      '<div class="dash-note">Diese Vorgaben gelten für <b>alle</b> Leitungen des jeweiligen Typs im ' +
      'Projekt und werden mitgespeichert. Eine einzelne Leitung lässt sich davon abweichend im ' +
      'Verbindungsdialog gestalten — geänderte Typen sind hier markiert.</div>';

    overlay.querySelector('.dash-body').innerHTML =
      '<div class="dash-inner set-inner">' +
        '<div class="dash-grid">' +
          card('Ansicht', ansicht) +
          card('Gerätedarstellung', darstellung,
            'Reihenfolge: eigenes Foto → Typbild → Hardware-Ansicht → Strichsymbol.') +
          card('Bedienung', bedienung) +
          card('Projekt', projekt) +
          card('Eigene Symbole', symbole) +
          card('Speicher', speicher) +
          card('Hilfe', hilfe) +
        '</div>' +
        '<section class="dash-card set-card set-wide"><h3>Vertrauliche Angaben maskieren</h3>' + maskCard +
          '<div class="dash-note">Maskiert wird der Text selbst, nicht ein Balken darüber — in der ' +
          'exportierten Datei steht danach nichts anderes mehr. Was auf einem Gerätefoto zu lesen ist, ' +
          'kann das Programm nicht erkennen. Die Einstellung gehört zum Projekt und reist in der ' +
          'JSON-Datei mit; deren Inhalt bleibt unmaskiert, denn sie ist Ihre Arbeitsdatei.</div></section>' +
        '<section class="dash-card set-card set-wide"><h3>Setups — Einstellungen für Szenarien</h3>' + setupCard + '</section>' +
        '<section class="dash-card set-card set-wide"><h3>Bildbibliothek</h3>' + bibliothek + '</section>' +
        '<section class="dash-card set-card set-wide"><h3>Verbindungsarten</h3>' + verbindungen + '</section>' +
        '<section class="dash-card set-card set-wide"><h3>Gerätebilder je Typ</h3>' + gerätebilder + '</section>' +
      '</div>';

    wire();
  }

  /* ------------------------------------------------------- Verdrahten */

  function wire() {
    const body = overlay.querySelector('.dash-body');

    body.querySelectorAll('[data-set]').forEach(el => {
      el.addEventListener('change', () => apply(el.getAttribute('data-set'), el));
      if (el.tagName === 'INPUT' && el.type === 'text') {
        el.addEventListener('blur', () => apply(el.getAttribute('data-set'), el));
      }
    });

    body.querySelectorAll('[data-ti-pick]').forEach(b => b.addEventListener('click', () => {
      pendingType = b.getAttribute('data-ti-pick');
      fileInput.click();
    }));
    body.querySelectorAll('[data-ti-del]').forEach(b => b.addEventListener('click', () =>
      clearTypeImage(b.getAttribute('data-ti-del'))));

    /* Bild direkt auf eine Kachel ziehen */
    body.querySelectorAll('.ti-tile').forEach(tile => {
      tile.addEventListener('dragover', e => { e.preventDefault(); tile.classList.add('over'); });
      tile.addEventListener('dragleave', () => tile.classList.remove('over'));
      tile.addEventListener('drop', e => {
        e.preventDefault();
        tile.classList.remove('over');
        const f = e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) setTypeImage(tile.getAttribute('data-type'), f);
      });
    });

    /* Setups */
    body.querySelectorAll('[data-setup-apply]').forEach(b => b.addEventListener('click', () => {
      NWT.Setups.apply(b.getAttribute('data-setup-apply'));
      render();
    }));
    body.querySelectorAll('[data-setup-over]').forEach(b => b.addEventListener('click', () => {
      const name = b.getAttribute('data-setup-over');
      NWT.Modal.confirm({
        title: 'Setup aktualisieren',
        message: 'Das Setup „' + name + '“ wird mit den aktuellen Einstellungen überschrieben.',
        confirmLabel: 'Überschreiben'
      }).then(ok => {
        if (!ok) return;
        NWT.Setups.save(name);
        U.toast('Setup „' + name + '“ aktualisiert', 'ok');
        render();
      });
    }));
    body.querySelectorAll('[data-setup-rename]').forEach(b => b.addEventListener('click', () => {
      const name = b.getAttribute('data-setup-rename');
      NWT.Modal.prompt({ title: 'Setup umbenennen', label: 'Neuer Name', value: name })
        .then(next => {
          if (!next || next === name) return;
          try { NWT.Setups.rename(name, next); render(); }
          catch (e) { NWT.Modal.error('Umbenennen nicht möglich.', e.message); }
        });
    }));
    body.querySelectorAll('[data-setup-del]').forEach(b => b.addEventListener('click', () => {
      const name = b.getAttribute('data-setup-del');
      NWT.Modal.confirm({
        title: 'Setup löschen',
        message: 'Das Setup „' + name + '“ endgültig löschen? Die aktuellen Einstellungen bleiben unverändert.',
        confirmLabel: 'Löschen', danger: true
      }).then(ok => { if (ok) { NWT.Setups.remove(name); render(); } });
    }));
    const setupNew = body.querySelector('[data-setup-new]');
    if (setupNew) setupNew.addEventListener('click', () => {
      NWT.Modal.prompt({
        title: 'Einstellungen als Setup sichern',
        subtitle: 'Ansicht, Darstellung, Verbindungsarten, Design und Hinweisfenster — ohne den Netzplan.',
        label: 'Name des Setups',
        value: NWT.Setups.active(),
        placeholder: 'z. B. Präsentation'
      }).then(name => {
        if (!name) return;
        try { NWT.Setups.save(name); U.toast('Setup „' + name.trim() + '“ gesichert', 'ok'); render(); }
        catch (e) { NWT.Modal.error('Das Setup konnte nicht gesichert werden.', e.message); }
      });
    });
    const setupEx = body.querySelector('[data-setup-examples]');
    if (setupEx) setupEx.addEventListener('click', () => {
      const made = NWT.Setups.createExamples();
      U.toast(made.length + ' Beispiel-Setups angelegt: ' + made.join(', '), 'ok', 4000);
      render();
    });

    /* Bildbibliothek */
    const act0 = (sel, fn) => {
      const el = body.querySelector(sel);
      if (el) el.addEventListener('click', fn);
    };
    act0('[data-lib-review]', () => NWT.Library.reviewDialog(false).then(() => render()));
    act0('[data-lib-open]', () => folderInput.click());
    act0('[data-lib-clear]', () => {
      NWT.Library.clearRuntime();
      U.toast('Eingelesene Bilder verworfen');
      render();
    });
    body.querySelectorAll('[data-lib-pick]').forEach(b => b.addEventListener('click', () => {
      const type = b.getAttribute('data-lib-pick');
      const name = b.getAttribute('data-lib-name');
      const current = (S.project.libraryPicks || {})[type];
      NWT.History.record('Bildauswahl');
      NWT.Library.pick(type, current === name ? '' : name);
      render();
    }));

    /* Verbindungsarten: jede Änderung schreibt alle drei Werte als Typvorgabe.
       Aktualisiert wird nur die betroffene Zeile — ein Neuaufbau der ganzen
       Seite würde beim Tippen den Fokus aus dem Feld reißen. */
    const refreshResetAll = () => {
      const btn = body.querySelector('[data-cs-reset-all]');
      if (!btn) return;
      const n = Object.keys(S.project.connStyles || {}).length;
      btn.disabled = n === 0;
      btn.textContent = 'Alle zurücksetzen' + (n ? ' (' + n + ')' : '');
    };

    body.querySelectorAll('.cs-row').forEach(row => {
      const id = row.getAttribute('data-conn');

      const refreshRow = () => {
        const eff = S.edgeStyle({ type: id });
        const line = row.querySelector('.cs-preview line');
        if (line) {
          line.setAttribute('stroke', eff.color);
          line.setAttribute('stroke-width', eff.width);
          if (eff.dash) line.setAttribute('stroke-dasharray', eff.dash);
          else line.removeAttribute('stroke-dasharray');
        }
        const own = !!(S.project.connStyles || {})[id];
        row.classList.toggle('changed', own);
        const rb = row.querySelector('.cs-reset');
        if (rb) rb.disabled = !own;
        refreshResetAll();
      };

      const store = () => {
        const base = C.connType(id);
        const chosen = {
          color: row.querySelector('[data-cs="color"]').value,
          width: Number(row.querySelector('[data-cs="width"]').value) || base.width,
          dash: row.querySelector('[data-cs="dash"]').value
        };
        if (!S.project.connStyles) S.project.connStyles = {};
        if (chosen.color.toLowerCase() === base.color.toLowerCase() &&
            Math.abs(chosen.width - base.width) < 0.001 && chosen.dash === (base.dash || '')) {
          delete S.project.connStyles[id];
        } else {
          S.project.connStyles[id] = chosen;
        }
        S.touch();
        NWT.emit('change', { structural: true });
        refreshRow();
      };

      row.querySelectorAll('[data-cs]').forEach(el => {
        el.addEventListener('change', store);
        /* Der Farbwähler meldet beim Ziehen nur input — sonst bliebe die
           Vorschau stehen, bis der Dialog geschlossen wird. */
        if (el.type === 'color') el.addEventListener('input', store);
      });

      const reset = row.querySelector('.cs-reset');
      if (reset) reset.addEventListener('click', () => {
        if (!S.project.connStyles || !S.project.connStyles[id]) return;
        NWT.History.record('Verbindungsart zurücksetzen');
        delete S.project.connStyles[id];
        const base = C.connType(id);
        row.querySelector('[data-cs="color"]').value = base.color;
        row.querySelector('[data-cs="width"]').value = base.width;
        row.querySelector('[data-cs="dash"]').value = base.dash || '';
        S.touch();
        NWT.emit('change', { structural: true });
        refreshRow();
      });
    });

    const resetAll = body.querySelector('[data-cs-reset-all]');
    if (resetAll) resetAll.addEventListener('click', () => {
      NWT.Modal.confirm({
        title: 'Verbindungsarten zurücksetzen',
        message: 'Alle eigenen Vorgaben für Farbe, Linienstärke und Strichmuster werden entfernt. ' +
                 'Abweichungen an einzelnen Leitungen bleiben erhalten.',
        confirmLabel: 'Zurücksetzen', danger: true
      }).then(ok => {
        if (!ok) return;
        NWT.History.record('Verbindungsarten zurücksetzen');
        S.project.connStyles = {};
        S.touch();
        NWT.emit('change', { structural: true });
        render();
      });
    });

    body.querySelectorAll('[data-sym-edit]').forEach(b => b.addEventListener('click', () => {
      NWT.Symbols.open(b.getAttribute('data-sym-edit')).then(() => render());
    }));
    body.querySelectorAll('[data-sym-del]').forEach(b => b.addEventListener('click', () => {
      NWT.Symbols.remove(b.getAttribute('data-sym-del')).then(() => render());
    }));
    const symNew = body.querySelector('[data-sym-new]');
    if (symNew) symNew.addEventListener('click', () => NWT.Symbols.open().then(() => render()));

    const act = (sel, fn) => {
      const el = body.querySelector(sel);
      if (el) el.addEventListener('click', fn);
    };
    act('[data-act-projects]', () => { close(); NWT.Commands.openProject(); });
    act('[data-act-export]', () => NWT.Exchange.exportJson());
    act('[data-act-clearauto]', () => {
      NWT.Modal.confirm({
        title: 'Automatische Sicherung löschen',
        message: 'Der zuletzt automatisch gesicherte Stand wird entfernt. Das aktuelle Projekt bleibt geöffnet.',
        confirmLabel: 'Löschen', danger: true
      }).then(ok => {
        if (!ok) return;
        NWT.Persistence.clearAutosave();
        U.toast('Automatische Sicherung gelöscht');
        render();
      });
    });
    act('[data-act-help]', () => { close(); NWT.Dialogs.help(); });
    act('[data-act-handbook]', () => { close(); NWT.HelpDoc.open(); });
    act('[data-act-example]', () => { close(); NWT.Commands.loadExample(); });
  }

  function apply(key, el) {
    const st = S.project.settings;
    const value = el.type === 'checkbox' ? el.checked : el.value;

    switch (key) {
      /* Nur der Stil ändert das Aussehen der ganzen Karte; die
         Gruppenhaken aktualisieren allein die Vorschauzeile — ein
         Vollaufbau würde hier den Fokus stehlen. */
      case 'pv-on': case 'pv-style':
        NWT.Privacy.set(key.slice(3), value);
        if (isOpen()) render();
        return;
      case 'pv-ip': case 'pv-mac': case 'pv-host': case 'pv-names':
      case 'pv-ports': case 'pv-labels': case 'pv-notes':
        NWT.Privacy.set(key.slice(3), value);
        updatePrivacySample();
        return;

      case 'grid': case 'snap': case 'photos': case 'hardware': case 'minimap': case 'avoidObstacles':
        st[key] = value;
        NWT.Viewport.apply();
        NWT.emit('change', { structural: true });
        NWT.emit('settings');
        break;
      case 'gridSize': {
        const n = U.clamp(parseInt(value, 10) || 20, 5, 200);
        st.gridSize = n;
        el.value = n;
        NWT.Viewport.apply();
        NWT.emit('change', { structural: false });
        break;
      }
      case 'routing':
        NWT.History.record('Linienführung');
        st.routing = value;
        NWT.emit('change', { structural: true });
        NWT.emit('settings');
        break;
      case 'defaultConnType':
      case 'activeLayer':
        st[key] = value;
        NWT.emit('change', { structural: false });
        NWT.emit('settings');
        break;
      case 'theme':
        NWT.Theme.set(value);
        break;
      case 'tooltips':
        NWT.Tooltip.setEnabled(value);
        NWT.emit('settings');
        break;
      case 'projectName':
        S.project.name = String(value).trim() || 'Unbenannt';
        S.touch();
        NWT.emit('project:meta');
        NWT.emit('change', { structural: false });
        overlay.querySelector('#set-sub').textContent = S.project.name;
        break;
      case 'author': case 'company': case 'location':
        S.project.info[key] = value;
        S.touch();
        NWT.emit('project:meta');
        NWT.emit('change', { structural: false });
        break;
      case 'showAllTypes':
        showAllTypes = !el.checked;
        render();
        break;
    }
  }

  /* Nach Projektwechsel neu aufbauen, damit die Werte stimmen. */
  NWT.on('project:replaced', () => { if (isOpen()) render(); });
  NWT.on('customtypes', () => { if (isOpen()) render(); });
  NWT.on('setups', () => { if (isOpen()) render(); });

  return { init, open, close, isOpen, render };
})();


/* ======================= 25-library.js ======================= */
/* ============================================================
   25 — Bildbibliothek
   Ordnet Bilddateien automatisch Gerätetypen zu — für die beim
   Bauen eingebettete Sammlung aus bilder/ ebenso wie für einen
   Ordner, den der Anwender zur Laufzeit einliest.

   Beide Wege nutzen denselben Abgleich; deshalb macht der Build
   nur das Einbetten, die Zuordnung entsteht immer hier.

   Der Abgleich rät nicht: jeder Vorschlag trägt eine Begründung
   und eine Zuverlässigkeit, und nichts wird ohne Prüfliste
   übernommen. Ein falsch zugeordnetes Gerätebild ist in einer
   Dokumentation schlimmer als gar keins.
   ============================================================ */

NWT.Library = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const C = NWT.Catalog;
  const imageCache = new Map();
  let cachedBuilt = null, cachedCustom = null;
  function invalidate() { imageCache.clear(); }
  NWT.on('library', invalidate);
  NWT.on('customtypes', invalidate);
  NWT.on('project:replaced', invalidate);

  /* Synonyme und Produktnamen → Typkennung. Hier entsteht der
     eigentliche Nutzen: „Central_Station_3“ heißt nirgends „mb_cs3“. */
  const ALIASES = {
    mb_ecos:       ['ecos', 'esuecos', 'esu', 'ecos2', 'ecosniffer'],
    mb_cs3:        ['cs3', 'centralstation3', 'cs3plus', 'centralstationplus'],
    mb_cs2:        ['cs2', 'centralstation2', 'centralstation'],
    mb_ms2:        ['ms2', 'ms1', 'mobilestation', 'mobilestation2', 'ms2009'],
    mb_z21:        ['z21', 'roco z21', 'z21start', 'z21single'],
    mb_intellibox: ['intellibox', 'ib1', 'ib2', 'ib3', 'ibcom', 'ibbasic', 'uhlenbrock'],
    mb_dr5000:     ['dr5000', 'digikeijs', 'dr5000ib'],
    mb_mx10:       ['mx10', 'zimo', 'mx10ec'],
    mb_tams:       ['mastercontrol', 'tams', 'mc2'],
    mb_dccex:      ['dccex', 'dccpp', 'commandstation'],
    mb_booster:    ['booster', 'verstaerker', 'b4', 'poweri'],
    mb_feedback:   ['rueckmelder', 'rueckmeldemodul', 's88', 'belegtmelder', 'lissy'],
    mb_gateway:    ['loconet', 'xpressnet', 'lbserver', 'busgateway'],
    mb_throttle:   ['wlanmaus', 'multimaus', 'handregler', 'throttle', 'fred'],
    mb_pc:         ['rocrail', 'jmri', 'itrain', 'traincontroller', 'windigipet', 'steuerrechner'],

    router:        ['router', 'rt'],
    wlan_router:   ['fritzbox', 'fritz', 'speedport', 'easybox', 'wlanrouter'],
    switch:        ['switch', 'sw'],
    switch_managed:['managedswitch', 'poeswitch', 'switch24', 'switch16', 'switch8'],
    switch_l3:     ['layer3', 'l3switch', 'coreswitch'],
    firewall:      ['firewall', 'pfsense', 'opnsense', 'fw'],
    accesspoint:   ['accesspoint', 'ap', 'unifi', 'wlanap'],
    modem:         ['modem', 'dslmodem', 'kabelmodem'],
    gateway:       ['gateway', 'gw'],
    server:        ['server', 'srv'],
    nas:           ['nas', 'synology', 'qnap', 'diskstation'],
    vmserver:      ['proxmox', 'esxi', 'hyperv', 'vmhost'],
    raspberrypi:   ['raspberrypi', 'raspi', 'rpi', 'pi4', 'pi5', 'pizero'],
    jetson:        ['jetson', 'nano', 'xavier', 'orin'],
    mcu:           ['esp32', 'esp8266', 'arduino', 'mikrocontroller', 'nodemcu'],
    sensor:        ['sensor', 'shelly', 'tasmota', 'sonoff'],
    camera:        ['kamera', 'camera', 'ipcam', 'reolink'],
    netprinter:    ['drucker', 'printer', 'netzwerkdrucker'],
    plc:           ['sps', 'plc', 'simatic', 's7'],
    pc:            ['pc', 'desktop', 'workstation'],
    notebook:      ['notebook', 'laptop'],
    tablet:        ['tablet', 'ipad'],
    smartphone:    ['smartphone', 'handy', 'iphone']
  };

  /* Dateiendungen, die als Bild in Frage kommen. */
  const IMAGE_RE = /\.(jpe?g|png|gif|webp|bmp|avif)$/i;

  let runtime = [];   // zur Laufzeit eingelesene Bilder, gleiche Struktur wie die eingebauten

  /* ------------------------------------------------------- Textnormalisierung */

  function normalize(text) {
    return String(text || '')
      .toLowerCase()
      .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
      .replace(/[^a-z0-9]+/g, '');
  }

  function baseName(filename) {
    return String(filename || '').replace(/^.*[\\/]/, '').replace(/\.[^.]+$/, '');
  }

  /* Zerlegt den Dateinamen in Wortteile. Ziffern bleiben erhalten —
     bei „Central_Station_2“ ist die 2 Teil des Produktnamens, nicht Beiwerk. */
  function tokens(name) {
    return baseName(name)
      .replace(/([a-zA-Z])(\d)/g, '$1 $2')
      .replace(/(\d)([a-zA-Z])/g, '$1 $2')
      .split(/[^a-zA-Z0-9äöüÄÖÜß]+/)
      .map(t => normalize(t))
      .filter(Boolean);
  }

  /* Endungen, die eine Bildvariante kennzeichnen und keine Gerätevariante. */
  const VARIANT_TOKENS = ['small', 'klein', 'gross', 'big', 'a', 'b', 'c', 'v2', 'neu', 'alt',
                          'front', 'vorne', 'rueckseite', 'hinten', 'detail', 'kopie', 'copy'];

  /* --------------------------------------------------------------- Abgleich */

  /**
   * Ordnet einen Dateinamen einem Gerätetyp zu.
   * Liefert { type, confidence: 'hoch'|'mittel'|'niedrig'|'', why, variant }.
   */
  function match(filename) {
    const norm = normalize(baseName(filename));
    const tk = tokens(filename);
    const meaningful = tk.filter(t => VARIANT_TOKENS.indexOf(t) < 0);
    const variant = tk.filter(t => VARIANT_TOKENS.indexOf(t) >= 0).join(' ');
    const none = { type: '', confidence: '', why: 'kein passender Typ gefunden', variant: variant };
    if (!norm) return none;

    /* 1. Typkennung oder Bezeichnung direkt getroffen */
    const allTypes = Object.keys(C.DEVICE_TYPES).concat(Object.keys(C.customTypes()));
    for (const id of allTypes) {
      if (norm === normalize(id)) {
        return { type: id, confidence: 'hoch', why: 'Dateiname entspricht der Typkennung', variant: variant };
      }
    }
    for (const id of allTypes) {
      const label = normalize(C.typeLabel(id));
      if (label && (norm === label || norm.indexOf(label) === 0)) {
        return { type: id, confidence: 'hoch', why: 'Dateiname entspricht der Bezeichnung', variant: variant };
      }
    }

    /* 2. Alias-Tabelle — längster Treffer gewinnt, damit „cs3“ nicht von „cs“ verdeckt wird */
    let best = null;
    Object.keys(ALIASES).forEach(id => {
      if (!C.known(id)) return;
      ALIASES[id].forEach(alias => {
        const a = normalize(alias);
        if (!a || norm.indexOf(a) < 0) return;
        if (!best || a.length > best.alias.length) best = { type: id, alias: a };
      });
    });
    if (best) {
      /* Ziffernprobe: „Central_Station_2“ darf nicht stillschweigend als CS3 durchgehen. */
