ldordner einlesen …<\/span> wählen Sie einen Ordner aus. Die Bilder werden\nim Browser auf 640 Pixel verkleinert und sofort abgeglichen. Kein Neubauen nötig, keine\nNode-Installation.<\/p>\n\n<h4>Wie zugeordnet wird<\/h4>\n<p>Der Abgleich läuft in drei Stufen und weist jedem Vorschlag eine Zuverlässigkeit zu:<\/p>\n<table>\n<thead><tr><th>Stufe<\/th><th>Beispiel<\/th><th>Zuverlässigkeit<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Dateiname entspricht Typkennung oder Bezeichnung<\/td>\n    <td><code>switch_managed.png<\/code>, <code>ESU_ECoS.jpg<\/code><\/td><td>hoch<\/td><\/tr>\n<tr><td>Bekannte Produktbezeichnung aus der Alias-Tabelle<\/td>\n    <td><code>Central_Station_3.jpg<\/code>, <code>fritzbox-7590.jpg<\/code>, <code>raspi4.png<\/code><\/td><td>hoch<\/td><\/tr>\n<tr><td>Bezeichnung passt, aber die Ziffer weicht ab<\/td>\n    <td><code>Intellibox_7.jpg<\/code> bei bekanntem Typ „Intellibox“<\/td><td>mittel<\/td><\/tr>\n<tr><td>Nur teilweise Übereinstimmung<\/td><td>Restfälle<\/td><td>niedrig<\/td><\/tr>\n<tr><td>Kein Treffer<\/td><td><code>DSC_04711.jpg<\/code><\/td><td>offen<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Ziffern werden dabei ernst genommen: <code>Central_Station_2<\/code> wird nicht\nstillschweigend als CS3 durchgewinkt. Endungen wie <code>_small<\/code>, <code>_a<\/code> oder\n<code>_front<\/code> erkennt der Abgleich dagegen als <em>Bildvariante<\/em> und nicht als\nanderes Gerät — bei drei Intellibox-Bildern bleibt es also bei einem Gerätetyp mit drei\nKandidaten.<\/p>\n\n<h4>Prüfen und von Hand zuordnen<\/h4>\n<p><span class=\"ui\">Zuordnung prüfen …<\/span> öffnet eine Liste mit Vorschaubild, Dateiname,\nvorgeschlagenem Typ, Begründung und Zuverlässigkeit. Jede Zeile hat eine Auswahlliste zum\nUmstellen und ein Häkchen zum Abwählen; <span class=\"ui\">Nur unsichere zeigen<\/span> blendet\ndie eindeutigen Fälle aus. Übernommen wird ausschließlich, was angehakt ist.<\/p>\n<p>Liegen mehrere Bilder für einen Typ vor, wählen Sie in der Bibliotheksübersicht mit\n<span class=\"ui\">als Typbild<\/span> aus, welches gilt. Die übrigen bleiben verfügbar und lassen\nsich weiterhin einzelnen Geräten zuweisen.<\/p>\n\n<div class=\"note\">\n<strong>Automatisch verwendet werden nur Treffer mit Zuverlässigkeit „hoch“.<\/strong> Alles\nUnsichere wartet auf Ihre Bestätigung. Ein falsch zugeordnetes Gerätebild ist in einer\nDokumentation schlimmer als gar keins.\n<\/div>\n\n<h4>Neue Bilder später<\/h4>\n<p>Der Abgleich ist wiederholbar und zerstört nichts: bereits getroffene Auswahlen bleiben,\nneue Dateien erscheinen als zusätzliche Zeilen. Nach dem Ablegen neuer Bilder in\n<code>bilder/<\/code> genügt <code>node build.js<\/code>; in der Anwendung zeigt\n<span class=\"ui\">Zuordnung prüfen<\/span> anschließend, was dazugekommen ist.<\/p>\n\n<h4>Reihenfolge im Überblick<\/h4>\n<p>Damit ergibt sich die vollständige Rangfolge für das Bild auf einer Gerätekachel:<\/p>\n<pre>1. Foto am einzelnen Gerät\n2. Typbild im Projekt (eigene Datei zugewiesen)\n3. Bildbibliothek — gewähltes oder sicher zugeordnetes Bild\n4. Hardware-Ansicht (gezeichnete Frontblende)\n5. Strichsymbol<\/pre>\n\n<h3 id=\"k21-7\">21.7 Warum keine Herstellerfotos mitgeliefert werden<\/h3>\n<p>Es liegt nahe zu fragen, warum das Programm nicht einfach fertige Produktfotos mitbringt.\nDer Grund ist nicht technisch, sondern rechtlich:<\/p>\n<ul>\n  <li>Gerätefotos in freien Bilddatenbanken stehen fast durchweg unter Lizenzen, die\n      <strong>Namensnennung<\/strong> und <strong>Weitergabe unter gleichen Bedingungen<\/strong>\n      verlangen. Für eine Datei, die Sie an Kunden oder Kollegen weiterreichen, ist das\n      untragbar.<\/li>\n  <li>Was manche Portale als „gemeinfrei“ bewerben, ist es lizenzrechtlich längst nicht mehr.<\/li>\n  <li>Für Spezialgeräte — etwa Modellbahn-Digitalzentralen — existieren praktisch nur\n      geschützte Herstellerfotos.<\/li>\n<\/ul>\n<p>Deshalb der zweigleisige Weg: eigene gezeichnete Ansichten für die Grunddarstellung, und die\nMöglichkeit, <strong>Ihre eigenen<\/strong> Bilder als Typbild oder Gerätefoto zu hinterlegen.\nVerwenden Sie dort nur Bilder, an denen Sie die Rechte haben — bei selbst fotografierten\nGeräten ist das unproblematisch.<\/p>\n\n<h3 id=\"k21-8\">21.8 Helles und dunkles Design<\/h3>\n<p>Unter <span class=\"ui\">Bedienung<\/span> → <span class=\"ui\">Design<\/span> wählen Sie zwischen\ndrei Zuständen:<\/p>\n<table>\n<tbody>\n<tr><td>Hell<\/td><td>die Standarddarstellung<\/td><\/tr>\n<tr><td>Dunkel<\/td><td>dunkle Oberfläche und dunkle Zeichenfläche — angenehmer bei wenig Umgebungslicht<\/td><\/tr>\n<tr><td>Automatisch<\/td><td>folgt der Einstellung des Betriebssystems und wechselt mit ihr mit<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Schneller geht es über das Zahnrad in der Werkzeugleiste:\n<span class=\"ui\">⚙<\/span> → <span class=\"ui\">Design wechseln<\/span> schaltet reihum weiter.<\/p>\n\n<div class=\"note\">\n<strong>Export und Ausdruck bleiben immer hell.<\/strong> Ein Netzplan auf schwarzem Grund ist\nauf Papier unbrauchbar und kostet unnötig Toner. Das dunkle Design gilt deshalb ausschließlich\nfür die Oberfläche: SVG-Export, PNG-Export und Druck liefern unverändert die helle Darstellung\n— unabhängig davon, womit Sie gerade arbeiten.\n<\/div>\n\n<p>Im dunklen Design werden auch die Farben der Netzwerkbereiche aufgehellt, damit ihre\nBeschriftung lesbar bleibt. Der Farbton bleibt dabei erhalten, sodass Sie Ihre Zonen weiterhin\nan der Farbe erkennen.<\/p>\n<p>Das Design gehört zum Arbeitsplatz und liegt neben den Hinweisfenstern in den\nBrowsereinstellungen. Es wird <strong>nicht<\/strong> im Projekt gespeichert: Wer eine\nJSON-Datei weitergibt, zwingt dem Empfänger nicht die eigene Vorliebe auf.<\/p>\n\n<h3 id=\"k21-9\">21.9 Setups — zwischen Szenarien umschalten<\/h3>\n<p class=\"lead\">Ein Setup ist eine benannte Momentaufnahme <em>der Einstellungen<\/em> — nicht\ndes Netzplans. Damit wechseln Sie mit einem Klick zwischen Arbeitsweisen, ohne jedes Mal ein\nhalbes Dutzend Schalter umzulegen.<\/p>\n\n<h4>Was ein Setup enthält<\/h4>\n<table>\n<thead><tr><th>Enthalten<\/th><th>Nicht enthalten<\/th><\/tr><\/thead>\n<tbody>\n<tr>\n  <td>Raster, Rastergröße, Ausrichten, Linienführung, Übersichtskarte, Bilder,\n      Hardware-Ansicht, Standard-Verbindungstyp, eigene Verbindungsarten, Bildauswahl,\n      Design, Hinweisfenster<\/td>\n  <td>Geräte, Verbindungen, Bereiche, Ebenen, eigene Symbole, Typbilder, Projektdaten,\n      Zoom und Bildausschnitt<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Der Bildausschnitt bleibt bewusst außen vor: ein Setup soll die Darstellung umstellen, Ihnen\naber nicht die Ansicht verreißen, an der Sie gerade arbeiten.<\/p>\n\n<h4>Anlegen und anwenden<\/h4>\n<ol class=\"steps\">\n<li>Alles so einstellen, wie Sie es haben möchten.<\/li>\n<li>Auf der Einstellungsseite unter <span class=\"ui\">Setups<\/span> →\n    <span class=\"ui\">Aktuelle Einstellungen sichern …<\/span>, Namen vergeben. Alternativ\n    <span class=\"ui\">⚙<\/span> → <span class=\"ui\">Aktuelle Einstellungen sichern …<\/span>.<\/li>\n<li>Umschalten über <span class=\"ui\">Anwenden<\/span> in der Liste oder — schneller — über das\n    Zahnrad-Menü, in dem alle Setups direkt aufgeführt sind. Das aktive trägt einen Punkt.<\/li>\n<\/ol>\n<p>Zu jedem Setup gibt es <span class=\"ui\">Aktualisieren<\/span> (mit dem aktuellen Zustand\nüberschreiben), <span class=\"ui\">Umbenennen<\/span> und Löschen. Das Anwenden ist ein einziger\nSchritt und mit <kbd>Strg<\/kbd>+<kbd>Z<\/kbd> zurücknehmbar.<\/p>\n\n<h4>Beispiel-Setups<\/h4>\n<p>Solange noch kein Setup existiert, legt <span class=\"ui\">Vier Beispiel-Setups anlegen<\/span>\ngebrauchsfertige Ausgangspunkte an. Es sind ganz normale Setups — ändern und löschen Sie sie\nnach Belieben:<\/p>\n<table>\n<thead><tr><th>Setup<\/th><th>Gedacht für<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Arbeiten<\/b><\/td><td>Raster und Ausrichten an, Bilder an, Übersichtskarte an,\n    Hinweisfenster an, helles Design — der Zustand zum Zeichnen und Dokumentieren.<\/td><\/tr>\n<tr><td><b>Präsentation<\/b><\/td><td>Raster aus, Hardware-Ansicht an, Übersichtskarte aus,\n    Hinweisfenster aus, dunkles Design — aufgeräumt für den Beamer.<\/td><\/tr>\n<tr><td><b>Druck<\/b><\/td><td>Raster aus, Bilder aus, Übersichtskarte aus, helles Design —\n    kompakte Kacheln, damit viel auf eine Seite passt.<\/td><\/tr>\n<tr><td><b>Weitergabe<\/b><\/td><td>wie Druck, zusätzlich mit eingeschalteter Maskierung:\n    IP-Adressen, MAC-Adressen und Hostnamen sind unkenntlich. Für Unterlagen, die das Haus\n    verlassen — siehe <a href=\"#k10-4\">10.4<\/a>.<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<h4>Wo Setups liegen<\/h4>\n<p>Setups gehören zum Arbeitsplatz und liegen im Browser, nicht im Projekt. Das ist Absicht:\nSo gilt „Präsentation“ für <em>jeden<\/em> Netzplan, den Sie öffnen. Eine exportierte JSON-Datei\nenthält keine Setups; der Empfänger behält seine eigenen.<\/p>\n<div class=\"note\">\nWeil Setups im Browser liegen, verschwinden sie mit den Website-Daten — genau wie gespeicherte\nProjekte. Wer sie sichern will, notiert sich die Einstellungen oder legt sie am neuen\nArbeitsplatz noch einmal an; es sind wenige Klicks.\n<\/div>\n\n<h3 id=\"k21-10\">21.10 Bedienung, Projekt, Speicher und Hilfe<\/h3>\n<table>\n<thead><tr><th>Karte<\/th><th>Inhalt<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Bedienung<\/td><td>Hinweisfenster ein- und ausschalten, Standard-Verbindungstyp für neu\n    gezogene Leitungen, Ebene für neu eingefügte Objekte.<\/td><\/tr>\n<tr><td>Projekt<\/td><td>Projektname, Autor, Firma, Standort sowie Erstellungs- und\n    Änderungsdatum. Dieselben Angaben wie unter <span class=\"ui\">?<\/span> &rarr;\n    <span class=\"ui\">Projektinformationen<\/span>.<\/td><\/tr>\n<tr><td>Eigene Symbole<\/td><td>Liste aller selbst angelegten Symbole mit\n    <span class=\"ui\">Bearbeiten<\/span> und <span class=\"ui\">Löschen<\/span>, dazu\n    <span class=\"ui\">Neues Symbol …<\/span>. Siehe <a href=\"#k20\">Kapitel 20<\/a>.<\/td><\/tr>\n<tr><td>Speicher<\/td><td>Verfügbarkeit des Browser-Speichers, Anzahl gespeicherter Projekte,\n    belegter Platz durch Gerätefotos und Typbilder. Dazu Projektverwaltung, JSON-Sicherung und\n    das Löschen der automatischen Sicherung.<\/td><\/tr>\n<tr><td>Hilfe<\/td><td>Kurzhilfe, dieses Handbuch und das Beispielnetzwerk.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Die Karte <em>Speicher<\/em> ist der richtige erste Blick, wenn das Speichern klemmt: Sie\nzeigt sofort, ob der Browser-Speicher überhaupt verfügbar ist und wie viel Platz die Bilddaten\nbelegen.<\/p>\n<\/section>\n\n<section id=\"probleme\">\n<h2 id=\"k22\">22. Problembehebung<\/h2>\n\n<dl class=\"faq\">\n<dt>Nach dem Doppelklick öffnet sich ein Texteditor statt des Browsers.<\/dt>\n<dd>Die Dateizuordnung für <code>.html<\/code> zeigt auf ein anderes Programm. Rechtsklick →\n    <em>Öffnen mit<\/em> → Browser wählen.<\/dd>\n\n<dt>Ein gezogenes Gerät landet nicht dort, wo ich losgelassen habe.<\/dt>\n<dd>Prüfen Sie, ob <span class=\"ui\">Snap<\/span> aktiv ist — dann rastet die Position auf dem\n    Raster ein. Die Rastergröße stellen Sie in den Projektinformationen ein.<\/dd>\n\n<dt>Ich treffe eine Leitung nicht mit der Maus.<\/dt>\n<dd>Der Klickbereich ist deutlich breiter als die sichtbare Linie; treffen Sie sie in der\n    Mitte zwischen den Geräten. Liegt eine Gerätekachel darüber, verschieben Sie diese oder\n    nutzen die Suche und das Kontextmenü.<\/dd>\n\n<dt>Meine Änderungen sind nach einem Neustart verschwunden.<\/dt>\n<dd>Wird der Browser so eingestellt, dass er beim Beenden Website-Daten löscht, oder läuft\n    er im privaten Modus, wird auch die automatische Sicherung entfernt. Zeigt die\n    Statusleiste einen Hinweis auf fehlenden Browser-Speicher, arbeiten Sie mit\n    JSON-Export und -Import.<\/dd>\n\n<dt>Der Import meldet entfernte Verbindungen.<\/dt>\n<dd>In der Datei verweisen Verbindungen auf Geräte, die es nicht (mehr) gibt. Das Programm\n    entfernt nur diese Verbindungen und behält den Rest. Prüfen Sie die Quelldatei, wenn\n    Sie sie außerhalb des Programms erzeugt haben.<\/dd>\n\n<dt>Im exportierten SVG fehlen die Symbole.<\/dt>\n<dd>Das kann nur passieren, wenn die Datei nachträglich bearbeitet und der\n    <code>&lt;defs&gt;<\/code>-Abschnitt entfernt wurde — dort stehen alle Symbole. Exportieren\n    Sie in dem Fall erneut.<\/dd>\n\n<dt>Der PNG-Export bricht ab.<\/dt>\n<dd>Sehr große Diagramme überschreiten die Grenzen der Pixelgrafik. Nutzen Sie SVG; es ist\n    verlustfrei und beliebig skalierbar.<\/dd>\n\n<dt>Der Ausdruck zeigt nur einen Ausschnitt.<\/dt>\n<dd>Stellen Sie im Druckdialog des Browsers auf Querformat um oder verkleinern Sie den\n    Skalierungsfaktor. Für sehr breite Pläne ist der SVG- oder PDF-Weg besser geeignet.<\/dd>\n\n<dt>Rückgängig macht mehr oder weniger als erwartet.<\/dt>\n<dd>Eine zusammenhängende Bewegung — auch über viele Zwischenschritte — gilt als ein\n    Schritt. Ebenso zählt jedes Bestätigen eines Eigenschaftenfensters als genau ein Schritt.\n    Die Historie umfasst die letzten 60 Schritte.<\/dd>\n<\/dl>\n<\/section>\n\n\n<section id=\"entwickler\">\n<h2 id=\"k23\">23. Für Entwickler<\/h2>\n\n<p>Die ausgelieferte HTML-Datei wird aus Modulen unter <code>src/<\/code> erzeugt\n(<code>node build.js<\/code>). Jedes Modul ist eine gekapselte Funktion, die sich unter dem\neinzigen globalen Objekt <code>NWT<\/code> registriert; die Verständigung läuft über einen\nEreignisbus (<code>NWT.on<\/code> / <code>NWT.emit<\/code>).<\/p>\n\n<table>\n<thead><tr><th>Erweiterung<\/th><th>Vorgehen<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Neuer Gerätetyp<\/td><td>Ein Eintrag in <code>DEVICE_TYPES<\/code> (<code>src/js/01-catalog.js<\/code>) und ein <code>&lt;symbol&gt;<\/code> in <code>src/icons.svg<\/code>. Katalog, Suche, Benennung, Ports und Darstellung folgen automatisch.<\/td><\/tr>\n<tr><td>Neue Erkennungsregel<\/td><td>Ein Eintrag in <code>PORT_HINTS<\/code> oder <code>NAME_HINTS<\/code> (<code>src/js/20-discovery.js<\/code>) — Portnummer bzw. Namensmuster, Zieltyp und Begründung.<\/td><\/tr>\n<tr><td>Neue Analysequelle<\/td><td>Eine Parserfunktion in <code>20-discovery.js<\/code>, die <code>{ip, mac, hostname, vendor, ports}<\/code> liefert, und ein Aufruf in <code>analyze()<\/code>. Die Zusammenführung über MAC/IP erledigt <code>mergeHosts()<\/code>.<\/td><\/tr>\n<tr><td>Neue Dashboard-Karte<\/td><td>Eine Funktion in <code>21-dashboard.js<\/code>, die mit <code>card(titel, inhalt)<\/code> ein Panel liefert.<\/td><\/tr>\n<tr><td>Symbol per Code<\/td><td><code>NWT.Symbols.save({id, label, cat, color, iconInner, iconViewBox, ports})<\/code>. Der Inhalt läuft immer durch <code>sanitizeSvg()<\/code>.<\/td><\/tr>\n<tr><td>Neuer Verbindungstyp<\/td><td>Ein Eintrag in <code>CONNECTION_TYPES<\/code> mit Farbe, Strichstärke, Strichelung und Standardgeschwindigkeit.<\/td><\/tr>\n<tr><td>Neues Werkzeug<\/td><td>Eigenes Modul anlegen, an <code>NWT.on('change', …)<\/code> andocken und einen Eintrag in der Aktionstabelle in <code>src/js/15-ui.js<\/code> ergänzen.<\/td><\/tr>\n<tr><td>Zugriff auf die Daten<\/td><td>Das vollständige, serialisierbare Projekt liegt unter <code>NWT.Store.project<\/code>; Indizes für schnellen Zugriff unter <code>NWT.Store.index<\/code>.<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<p>Vorgesehene Ausbaustufen sind unter anderem Ping- und Portscan-Anbindung, SNMP-, LLDP-\nund CDP-Abfragen, ein Subnetzrechner, VLAN- und DHCP-Planung sowie automatische\nTopologieerkennung. Das Datenmodell ist darauf ausgelegt: Geräte tragen bereits IP-, MAC-\nund Portfelder, Verbindungen kennen beide Endpunkte samt Ports.<\/p>\n\n<p>Zur Qualitätssicherung gehört eine automatisierte Prüfung, die die fertige HTML-Datei in\neinem echten Browser lädt und mit Maus- und Tastaturereignissen bedient\n(<code>npm test<\/code>).<\/p>\n<\/section>\n";

window.__NWT_SCRIPT_PS1__ = "<#\nBestandsaufnahme V6, Windows PowerShell 5.1 / PowerShell 7.\n.\\netzwerk_analyse.ps1 -Subnet 192.168.10.0/24 -InterfaceIndex 12\n.\\netzwerk_analyse.ps1 -PlanOnly\n.\\netzwerk_analyse.ps1 -Subnet 10.0.0.0/16 -StartAddress 10.0.20.1 -MaxHosts 254\nQ beendet mit Teilergebnis. Nur eigene/freigegebene Netze scannen.\nKeine Anmeldung oder Konfigurationsaenderung an den erkannten Geraeten.\n#>\n[CmdletBinding()]\nparam(\n    [string]$Subnet = '', [int]$InterfaceIndex = 0, [string]$StartAddress = '',\n    [ValidateRange(50,10000)][int]$Timeout = 400,\n    [ValidateRange(1,65536)][int]$MaxHosts = 1024,\n    [ValidateRange(1,64)][int]$Concurrency = 16,\n    [ValidateRange(0,86400)][int]$CancelAfterSeconds = 0,\n    [switch]$NoPorts, [switch]$PlanOnly, [switch]$ListInterfaces,\n    [string]$OutFile = 'netzwerk_scan.json'\n)\n$ErrorActionPreference = 'Stop'\nfunction Convert-IPv4ToNumber([string]$Address) {\n    if ($Address -notmatch '^\\d{1,3}(\\.\\d{1,3}){3}$') { throw 'Ungueltige IPv4-Adresse.' }\n    $n = [long]0\n    foreach ($part in $Address.Split('.')) {\n        if ([int]$part -gt 255) { throw 'Ungueltiges IPv4-Oktett.' }\n        $n = $n * 256 + [int]$part\n    }\n    return $n\n}\nfunction Convert-NumberToIPv4([long]$Value) {\n    return (@(24,16,8,0) | ForEach-Object { [math]::Floor($Value / [math]::Pow(2,$_)) % 256 }) -join '.'\n}\nfunction Get-ScanPlan([string]$Cidr, [string]$LocalAddress, [string]$Start, [int]$Limit) {\n    if ($Cidr -notmatch '^([^/]+)/(\\d{1,2})$') { throw 'Subnetz als IPv4/Prefix angeben.' }\n    $addressText=$Matches[1]; $prefix=[int]$Matches[2]\n    $ip = Convert-IPv4ToNumber $addressText\n    if ($prefix -gt 32) { throw 'Prefix muss zwischen 0 und 32 liegen.' }\n    $size = [long][math]::Pow(2,32-$prefix)\n    $network = [long]([math]::Floor($ip / $size) * $size)\n    $first = $network; $last = $network + $size - 1\n    if ($prefix -lt 31) { $first++; $last-- }\n    $total = $last - $first + 1\n    if ($Limit -lt 1) { throw 'MaxHosts muss positiv sein.' }\n    if ($Start) {\n        $begin = Convert-IPv4ToNumber $Start\n        if ($begin -lt $first -or $begin -gt $last) { throw 'Startadresse liegt ausserhalb des nutzbaren Bereichs.' }\n    } else {\n        $begin = $first\n        if ($LocalAddress -and $total -gt $Limit) {\n            $localNumber = Convert-IPv4ToNumber $LocalAddress\n            if ($localNumber -ge $first -and $localNumber -le $last) {\n                $begin = [long][math]::Max($first, [math]::Min($last-$Limit+1, $localNumber-[math]::Floor($Limit/2)))\n            }\n        }\n    }\n    $end = [long][math]::Min($last, $begin+$Limit-1)\n    $addresses = New-Object 'System.Collections.Generic.List[string]'\n    for ($n=$begin; $n -le $end; $n++) { $addresses.Add((Convert-NumberToIPv4 $n)) }\n    return [pscustomobject]@{ network=((Convert-NumberToIPv4 $network)+\"/$prefix\"); first=(Convert-NumberToIPv4 $begin)\n        last=(Convert-NumberToIPv4 $end); total=$total; selected=$addresses.Count; omitted=($total-$addresses.Count); addresses=$addresses.ToArray() }\n}\nfunction Get-LocalNet([int]$Index) {\n    $routes = @(Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue)\n    if (-not $Index) {\n        $route = $routes | Sort-Object @{Expression={ $_.RouteMetric + (Get-NetIPInterface -InterfaceIndex $_.InterfaceIndex -AddressFamily IPv4).InterfaceMetric }} | Select-Object -First 1\n        if ($route) { $Index = $route.InterfaceIndex }\n    }\n    $all = @(Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -ne '127.0.0.1' -and $_.IPAddress -notlike '169.254.*' })\n    $local = $all | Where-Object { -not $Index -or $_.InterfaceIndex -eq $Index } | Select-Object -First 1\n    if (-not $local) { throw 'Keine passende IPv4-Schnittstelle gefunden. -InterfaceIndex angeben.' }\n    $gateway = $routes | Where-Object { $_.InterfaceIndex -eq $local.InterfaceIndex } | Sort-Object RouteMetric | Select-Object -First 1\n    return @{ Address=$local.IPAddress; Prefix=$local.PrefixLength; Index=$local.InterfaceIndex; Name=$local.InterfaceAlias; Gateway=$gateway.NextHop }\n}\nfunction Get-Neighbors([int]$Index) {\n    $map = @{}\n    Get-NetNeighbor -AddressFamily IPv4 -InterfaceIndex $Index -ErrorAction SilentlyContinue | ForEach-Object {\n        if ($_.State -in @('Reachable','Stale','Delay','Probe','Permanent') -and $_.LinkLayerAddress -match '^([0-9A-Fa-f]{2}[-:]){5}[0-9A-Fa-f]{2}$' -and $_.LinkLayerAddress -notmatch '^(00[:-]){5}00$|^(FF[:-]){5}FF$') {\n            $map[$_.IPAddress] = $_.LinkLayerAddress.ToUpper().Replace('-',':')\n        }\n    }\n    return $map\n}\nfunction Get-WifiInfo([string]$InterfaceName) {\n    $process = New-Object System.Diagnostics.Process\n    try {\n        $process.StartInfo = New-Object System.Diagnostics.ProcessStartInfo\n        $process.StartInfo.FileName = 'netsh.exe'\n        $process.StartInfo.Arguments = 'wlan show interfaces'\n        $process.StartInfo.UseShellExecute = $false\n        $process.StartInfo.CreateNoWindow = $true\n        $process.StartInfo.RedirectStandardOutput = $true\n        [void]$process.Start()\n        $reading = $process.StandardOutput.ReadToEndAsync()\n        if (-not $process.WaitForExit(2000)) { $process.Kill(); return $null }\n        $selected = $false; $ssid = ''; $bssid = ''\n        foreach ($line in ($reading.Result -split '\\r?\\n')) {\n            if ($line -match '^\\s*Name\\s*:\\s*(.+)$') { $selected = $Matches[1].Trim() -eq $InterfaceName }\n            if ($selected -and $line -match '^\\s*SSID\\s*:\\s*(.+)$') { $ssid = $Matches[1].Trim() }\n            if ($selected -and $line -match '^\\s*BSSID\\s*:\\s*(.+)$') { $bssid = $Matches[1].Trim().ToUpper().Replace('-', ':') }\n        }\n        if ($ssid -or $bssid) { return [pscustomobject]@{ssid=$ssid;bssid=$bssid} }\n    } catch { return $null }\n    finally { $process.Dispose() }\n    return $null\n}\nif ($ListInterfaces) { Get-NetIPAddress -AddressFamily IPv4 | Select-Object InterfaceIndex,InterfaceAlias,IPAddress,PrefixLength; return }\n$local = Get-LocalNet $InterfaceIndex\nif (-not $Subnet) { $Subnet = \"$($local.Address)/$($local.Prefix)\" }\nif ($Subnet -notmatch '/') { $Subnet += '/24' }\n$plan = Get-ScanPlan $Subnet $local.Address $StartAddress $MaxHosts\nif ($PlanOnly) { $plan | Select-Object network,first,last,total,selected,omitted | ConvertTo-Json; return }\nWrite-Host \"Schnittstelle: $($local.Name) ($($local.Address)); Bereich: $($plan.first) - $($plan.last)\"\nWrite-Host \"Ausgelassen: $($plan.omitted); Parallelitaet: $Concurrency. Q beendet mit Teilergebnis.\"\n$ports = @(22,53,80,443,445,515,554,631,1883,3306,3389,5000,5001,8000,8080,8443,8883,9100,1234,2560,12080,12090,15471)\n$worker = {\n    param($Ip,$Source,$Wait,$PortList,$SkipPorts,$Mac)\n    function Tcp([int]$Port) {\n        $client = New-Object System.Net.Sockets.TcpClient\n        try {\n            $client.Client.Bind((New-Object System.Net.IPEndPoint([System.Net.IPAddress]::Parse($Source),0)))\n            $task = $client.ConnectAsync($Ip,$Port)\n            return ($task.Wait($Wait) -and $client.Connected)\n        } catch { return $false } finally { $client.Dispose() }\n    }\n    $reply = (& ping.exe -n 1 -w $Wait -S $Source $Ip 2>$null) -join ' '\n    $ping = $reply -match 'TTL='\n    $open = New-Object 'System.Collections.Generic.List[object]'\n    if (-not $SkipPorts) {\n        $probe = if ($ping -or $Mac -or $Ip -eq $Source) { $PortList } else { @(80,443,22,445,1883,3389,8080,9100) }\n        foreach ($port in $probe) { if (Tcp $port) { $open.Add([pscustomobject]@{port=$port;proto='tcp';service=''}) } }\n        if ($open.Count -and -not $ping -and -not $Mac -and $Ip -ne $Source) {\n            foreach ($port in $PortList) { if ($port -notin $probe -and (Tcp $port)) { $open.Add([pscustomobject]@{port=$port;proto='tcp';service=''}) } }\n        }\n    }\n    if (-not $ping -and -not $Mac -and -not $open.Count -and $Ip -ne $Source) { return }\n    $name = ''\n    try { $dns = [System.Net.Dns]::GetHostEntryAsync($Ip); if ($dns.Wait($Wait)) { $name=$dns.Result.HostName } } catch {}\n    $methods = @(); if ($ping) {$methods+='icmp'}; if ($Mac) {$methods+='arp'}; if ($open.Count) {$methods+='tcp'}; if ($Ip -eq $Source) {$methods+='local'}\n    [pscustomobject]@{ip=$Ip;mac=$Mac;hostname=$name;vendor='';os='';ping=$ping;rtt=$null;ports=@($open.ToArray());discovery=$methods}\n}\n$pool = [runspacefactory]::CreateRunspacePool(1,$Concurrency); $pool.Open()\n$pending = New-Object 'System.Collections.Generic.List[object]'\n$hosts = New-Object 'System.Collections.Generic.List[object]'\n$completed = New-Object 'System.Collections.Generic.List[string]'\n$neighbors = Get-Neighbors $local.Index\n$clock = [diagnostics.stopwatch]::StartNew()\n$next=0; $cancelled=$false; $scanError=''\ntry {\n    while ($next -lt $plan.addresses.Count -or $pending.Count) {\n        if ($CancelAfterSeconds -and $clock.Elapsed.TotalSeconds -ge $CancelAfterSeconds) { $cancelled=$true; break }\n        try { if ([Console]::KeyAvailable -and [Console]::ReadKey($true).Key -eq 'Q') { $cancelled=$true; break } } catch {}\n        while ($next -lt $plan.addresses.Count -and $pending.Count -lt $Concurrency) {\n            $ip=$plan.addresses[$next]; $next++\n            $ps=[powershell]::Create(); $ps.RunspacePool=$pool\n            [void]$ps.AddScript($worker).AddArgument($ip).AddArgument($local.Address).AddArgument($Timeout).AddArgument($ports).AddArgument([bool]$NoPorts).AddArgument([string]$neighbors[$ip])\n            $pending.Add(@{PowerShell=$ps;Handle=$ps.BeginInvoke();Ip=$ip})\n        }\n        foreach ($job in @($pending.ToArray())) {\n            if (-not $job.Handle.IsCompleted) { continue }\n            try {\n                foreach ($h in $job.PowerShell.EndInvoke($job.Handle)) { $hosts.Add($h) }\n                if ($job.PowerShell.HadErrors) { throw ('Pruefung von ' + $job.Ip + ': ' + $job.PowerShell.Streams.Error[0]) }\n                $completed.Add($job.Ip)\n            }\n            finally { $job.PowerShell.Dispose(); [void]$pending.Remove($job) }\n        }\n        Write-Progress -Activity 'Bestandsaufnahme' -Status \"$($completed.Count) / $($plan.selected)\" -PercentComplete (100*$completed.Count/$plan.selected)\n        Start-Sleep -Milliseconds 30\n    }\n} catch { $scanError=$_.Exception.Message; $cancelled=$true }\nfinally {\n    if ($completed.Count -lt $plan.selected) { $cancelled=$true }\n    foreach ($job in @($pending.ToArray())) { try { $job.PowerShell.Stop(); $job.PowerShell.Dispose() } catch {} }\n    $pool.Close(); $pool.Dispose()\n    $neighbors = Get-Neighbors $local.Index\n    foreach ($h in $hosts) { if ($neighbors.ContainsKey($h.ip)) { $h.mac=$neighbors[$h.ip]; if ('arp' -notin $h.discovery) {$h.discovery+= 'arp'} } }\n    foreach ($ip in $completed) {\n        if ($neighbors.ContainsKey($ip) -and -not @($hosts | Where-Object {$_.ip -eq $ip}).Count) {\n            $hosts.Add([pscustomobject]@{ip=$ip;mac=$neighbors[$ip];hostname='';vendor='';os='';ping=$false;rtt=$null;ports=@();discovery=@('arp')})\n        }\n    }\n    $links=New-Object 'System.Collections.Generic.List[object]'\n    $localPlan=Get-ScanPlan \"$($local.Address)/$($local.Prefix)\" '' '' 1\n    $gateway = if ($plan.network -eq $localPlan.network) { [string]$local.Gateway } else { '' }\n    if ($gateway -and @($hosts | Where-Object {$_.ip -eq $gateway}).Count) {\n        foreach ($h in $hosts) {\n            if ($h.ip -ne $gateway) {\n                $method=if ($h.mac) {'arp'} else {'same-subnet'}\n                $links.Add([pscustomobject]@{source=$gateway;target=$h.ip;type='logical';method=$method;confidence=0.4;description='Gleiches lokales IP-Netz; physische Verkabelung nicht verifiziert.'})\n            }\n        }\n    }\n    $result=[ordered]@{tool='nwt-scan';version=6;generated=(Get-Date).ToString('o');scannedFrom=$env:COMPUTERNAME\n        interface=$local.Name;interfaceIndex=$local.Index;localAddress=$local.Address;subnets=@($plan.network);gateway=$gateway;wifi=(Get-WifiInfo $local.Name)\n        scan=[ordered]@{first=$plan.first;last=$plan.last;total=$plan.total;selected=$plan.selected;omitted=$plan.omitted;completed=$completed.Count;completedAddresses=$completed.ToArray();cancelled=$cancelled;error=$scanError;timeoutMs=$Timeout;concurrency=$Concurrency}\n        hosts=$hosts.ToArray();links=$links.ToArray()}\n    $outputPath=$ExecutionContext.SessionState.Path.GetUnresolvedProviderPathFromPSPath($OutFile)\n    $json=$result | ConvertTo-Json -Depth 10\n    [System.IO.File]::WriteAllText($outputPath,$json,(New-Object System.Text.UTF8Encoding($false)))\n    Write-Progress -Activity 'Bestandsaufnahme' -Completed\n    Write-Host \"Ergebnis: $outputPath ($($hosts.Count) Hosts; $($completed.Count) Adressen abgeschlossen; Teilscan: $cancelled)\"\n}\n";
window.__NWT_SCRIPT_SH__ = "#!/usr/bin/env bash\n# Bestandsaufnahme V6 fuer Linux/macOS. Python 3.9+ (nur Standardbibliothek)\n# sowie ping und ip (Linux) bzw. ifconfig/route/arp (macOS) erforderlich.\n# ./netzwerk_analyse.sh 192.168.10.0/24 --interface eth0 --max-hosts 254\n# ./netzwerk_analyse.sh --plan-only\n# Ctrl+C schreibt den abgeschlossenen Teil als JSON. Nur freigegebene Netze scannen.\nset -eu\ncommand -v python3 >/dev/null 2>&1 || { echo 'Python 3.9+ wird fuer dieses Analyseskript benoetigt.' >&2; exit 1; }\nexec python3 - \"$@\" <<'PY_NWT'\nimport argparse\nimport concurrent.futures as futures\nimport datetime\nimport ipaddress\nimport json\nimport math\nimport os\nimport re\nimport shutil\nimport signal\nimport socket\nimport subprocess\nimport sys\nimport tempfile\nimport threading\nimport time\n\nPORTS = [22,53,80,443,445,515,554,631,1883,3306,3389,5000,5001,8000,8080,8443,8883,9100,1234,2560,12080,12090,15471]\nPROBE_PORTS = [80,443,22,445,1883,3389,8080,9100]\n\ndef command(argv, timeout=2):\n    try:\n        result = subprocess.run(argv, capture_output=True, text=True, timeout=timeout)\n        return result.stdout if result.returncode == 0 else ''\n    except (OSError, subprocess.TimeoutExpired):\n        return ''\n\ndef scan_plan(cidr, local='', start='', limit=1024):\n    network = ipaddress.IPv4Network(cidr, strict=False)\n    if limit < 1:\n        raise ValueError('max-hosts muss positiv sein')\n    first, last = int(network.network_address), int(network.broadcast_address)\n    if network.prefixlen < 31:\n        first += 1\n        last -= 1\n    total = last - first + 1\n    begin = int(ipaddress.IPv4Address(start)) if start else first\n    if start and not first <= begin <= last:\n        raise ValueError('Startadresse liegt ausserhalb des nutzbaren Bereichs')\n    if not start and local and total > limit and ipaddress.IPv4Address(local) in network:\n        begin = max(first, min(last-limit+1, int(ipaddress.IPv4Address(local))-limit//2))\n    end = min(last, begin+limit-1)\n    return dict(network=str(network), first=str(ipaddress.IPv4Address(begin)), last=str(ipaddress.IPv4Address(end)),\n                total=total, selected=end-begin+1, omitted=total-(end-begin+1),\n                addresses=[str(ipaddress.IPv4Address(n)) for n in range(begin, end+1)])\n\ndef local_net(interface=''):\n    if sys.platform == 'darwin':\n        route = command(['route','-n','get','default'])\n        default = re.search(r'interface:\\s*(\\S+)', route)\n        gateway = re.search(r'gateway:\\s*([0-9.]+)', route)\n        interface = interface or (default.group(1) if default else '')\n        data = command(['ifconfig',interface])\n        match = re.search(r'inet\\s+([0-9.]+)\\s+netmask\\s+(0x[0-9a-f]+|[0-9.]+)', data)\n        if not match:\n            raise ValueError('Keine IPv4-Adresse fuer die Schnittstelle gefunden')\n        mask = str(ipaddress.IPv4Address(int(match.group(2),16))) if match.group(2).startswith('0x') else match.group(2)\n        prefix = ipaddress.IPv4Network('0.0.0.0/'+mask).prefixlen\n        return dict(address=match.group(1), prefix=prefix, interface=interface,\n                    gateway=gateway.group(1) if gateway and default and default.group(1) == interface else '')\n    routes = json.loads(command(['ip','-j','-4','route','show','default']) or '[]')\n    route = next((r for r in routes if not interface or r.get('dev') == interface), {})\n    interface = interface or route.get('dev','')\n    interfaces = json.loads(command(['ip','-j','-4','addr','show'] + (['dev',interface] if interface else [])) or '[]')\n    for item in interfaces:\n        for address in item.get('addr_info',[]):\n            if address.get('family') == 'inet' and not ipaddress.IPv4Address(address['local']).is_loopback:\n                return dict(address=address['local'], prefix=address['prefixlen'], interface=item['ifname'], gateway=route.get('gateway',''))\n    raise ValueError('Keine passende IPv4-Schnittstelle gefunden; --interface angeben')\n\ndef neighbors(interface):\n    if sys.platform != 'darwin':\n        values = json.loads(command(['ip','-j','-4','neigh','show','dev',interface]) or '[]')\n        pairs = [(v.get('dst',''),v.get('lladdr','')) for v in values if not set(v.get('state',[])) & {'FAILED','INCOMPLETE'}]\n    else:\n        text = command(['arp','-an','-i',interface])\n        pairs = re.findall(r'\\(([0-9.]+)\\) at ([0-9a-f:]+)', text, re.I)\n    result = {}\n    for ip, mac in pairs:\n        try:\n            address = ipaddress.IPv4Address(ip)\n            parts = mac.split(':')\n            if len(parts) != 6 or address.is_multicast:\n                continue\n            normalized = ':'.join('%02X' % int(p,16) for p in parts)\n            if normalized not in ('00:00:00:00:00:00','FF:FF:FF:FF:FF:FF'):\n                result[ip] = normalized\n        except ValueError:\n            pass\n    return result\n\ndef main():\n    parser = argparse.ArgumentParser(description='Offline-Scan-Datei fuer das Netzwerktool erstellen')\n    parser.add_argument('subnet', nargs='?', default='')\n    parser.add_argument('--subnet', dest='subnet_option', default='', help='Zielnetz als IPv4/CIDR')\n    parser.add_argument('--interface', default='')\n    parser.add_argument('--start-address', default='')\n    parser.add_argument('--max-hosts', type=int, default=1024)\n    parser.add_argument('--timeout', type=int, default=400, help='Timeout in Millisekunden')\n    parser.add_argument('--concurrency', type=int, default=16)\n    parser.add_argument('--cancel-after-seconds', type=float, default=0)\n    parser.add_argument('--no-ports', action='store_true')\n    parser.add_argument('--plan-only', action='store_true')\n    parser.add_argument('--out-file', default='netzwerk_scan.json')\n    args = parser.parse_args()\n    if args.subnet and args.subnet_option and args.subnet != args.subnet_option:\n        parser.error('Zielnetz nur einmal angeben.')\n    if not 1 <= args.max_hosts <= 65536 or not 1 <= args.concurrency <= 64 or not 50 <= args.timeout <= 10000 or args.cancel_after_seconds < 0:\n        parser.error('Ungueltige Grenzen: Hosts 1..65536, Parallelitaet 1..64, Timeout 50..10000 ms')\n    local = local_net(args.interface)\n    subnet = args.subnet_option or args.subnet or (local['address']+'/'+str(local['prefix']))\n    if subnet.count('.') == 2:\n        subnet += '.0/24'\n    elif '/' not in subnet:\n        subnet += '/24'\n    plan = scan_plan(subnet, local['address'], args.start_address, args.max_hosts)\n    if args.plan_only:\n        print(json.dumps({k:v for k,v in plan.items() if k != 'addresses'}, indent=2))\n        return\n    stop = threading.Event()\n    signal.signal(signal.SIGINT, lambda *_: stop.set())\n    signal.signal(signal.SIGTERM, lambda *_: stop.set())\n    timeout = args.timeout/1000\n    initial = neighbors(local['interface'])\n    def tcp(ip, port):\n        if stop.is_set():\n            return False\n        try:\n            with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as client:\n                client.settimeout(timeout)\n                client.bind((local['address'],0))\n                return client.connect_ex((ip,port)) == 0\n        except OSError:\n            return False\n    def probe(ip):\n        mac = initial.get(ip,'')\n        ping_args = ['ping','-c','1','-W',str(args.timeout if sys.platform == 'darwin' else max(1,math.ceil(timeout))),\n                     '-S' if sys.platform == 'darwin' else '-I',local['address'],ip]\n        ping = bool(command(ping_args, max(1,timeout)+0.5))\n        checked = PORTS if ping or mac or ip == local['address'] else PROBE_PORTS\n        ports = [] if args.no_ports else [p for p in checked if tcp(ip,p)]\n        if ports and checked is PROBE_PORTS:\n            ports += [p for p in PORTS if p not in checked and tcp(ip,p)]\n        name = ''\n        if (ping or ports or mac) and not stop.is_set():\n            dns = command(['nslookup',ip], timeout=max(0.5,timeout))\n            match = re.search(r'name\\s*=\\s*([^\\s]+)',dns,re.I)\n            name = match.group(1).rstrip('.') if match else ''\n        host = None\n        if ping or mac or ports or ip == local['address']:\n            methods = (['icmp'] if ping else []) + (['arp'] if mac else []) + (['tcp'] if ports else []) + (['local'] if ip == local['address'] else [])\n            host = dict(ip=ip,mac=mac,hostname=name,vendor='',os='',ping=ping,rtt=None,\n                        ports=[dict(port=p,proto='tcp',service='') for p in ports],discovery=methods)\n        return host, not stop.is_set()\n    hosts, completed = {}, []\n    started = time.monotonic()\n    pool = futures.ThreadPoolExecutor(max_workers=args.concurrency)\n    pending, remaining = {}, iter(plan['addresses'])\n    error = ''\n    print('Bereich %s - %s; %s Adressen ausgelassen. Ctrl+C schreibt Teilergebnis.' % (plan['first'],plan['last'],plan['omitted']), file=sys.stderr)\n    try:\n        exhausted = False\n        while not stop.is_set() and (pending or not exhausted):\n            if args.cancel_after_seconds and time.monotonic()-started >= args.cancel_after_seconds:\n                stop.set()\n                break\n            while len(pending) < args.concurrency and not exhausted:\n                ip = next(remaining, None)\n                if ip is None:\n                    exhausted = True\n                else:\n                    pending[pool.submit(probe,ip)] = ip\n            done, _ = futures.wait(pending, timeout=0.1, return_when=futures.FIRST_COMPLETED)\n            for task in done:\n                ip = pending.pop(task)\n                host, finished = task.result()\n                if host:\n                    hosts[ip] = host\n                if finished:\n                    completed.append(ip)\n    except Exception as exc:\n        error = str(exc)\n        stop.set()\n    finally:\n        if pending:\n            stop.set()\n        pool.shutdown(wait=True, cancel_futures=True)\n        for task, ip in pending.items():\n            if not task.cancelled() and task.done():\n                try:\n                    host, finished = task.result()\n                    if host:\n                        hosts[ip] = host\n                    if finished:\n                        completed.append(ip)\n                except Exception:\n                    pass\n        final = neighbors(local['interface'])\n        for ip in completed:\n            if ip in final:\n                host = hosts.setdefault(ip, dict(ip=ip,mac='',hostname='',vendor='',os='',ping=False,rtt=None,ports=[],discovery=[]))\n                host['mac'] = final[ip]\n                if 'arp' not in host['discovery']:\n                    host['discovery'].append('arp')\n        local_network = str(ipaddress.IPv4Network(local['address']+'/'+str(local['prefix']), strict=False))\n        gateway = local['gateway'] if plan['network'] == local_network else ''\n        links = [dict(source=gateway,target=ip,type='logical',method='arp' if h['mac'] else 'same-subnet',confidence=0.4,\n                      description='Gleiches lokales IP-Netz; physische Verkabelung nicht verifiziert.')\n                 for ip,h in hosts.items() if ip != gateway] if gateway in hosts else []\n        scan = {k:v for k,v in plan.items() if k not in ('addresses','network')}\n        scan.update(completed=len(completed),completedAddresses=completed,cancelled=len(completed)<plan['selected'],error=error,timeoutMs=args.timeout,concurrency=args.concurrency)\n        result = dict(tool='nwt-scan',version=6,generated=datetime.datetime.now(datetime.timezone.utc).isoformat(),scannedFrom=socket.gethostname(),\n                      interface=local['interface'],localAddress=local['address'],subnets=[plan['network']],gateway=gateway,wifi=None,scan=scan,\n                      hosts=sorted(hosts.values(),key=lambda h:int(ipaddress.IPv4Address(h['ip']))),links=links)\n /* ======================= help-ui.js ======================= */
/* ============================================================
   Verhalten des Hilfe-Dokuments: Inhaltsverzeichnis, Scrollspy,
   Suche im Text. Wird von hilfe.html und vom Hilfe-Overlay der
   Anwendung mit demselben Code verwendet.
   ============================================================ */
'use strict';

function NWT_HELP_UI(root) {
  if (!root || root.__helpReady) return;
  root.__helpReady = true;

  const main = root.querySelector('.help-main');
  const toc = root.querySelector('.help-toc');
  const search = root.querySelector('.help-search');
  const links = Array.prototype.slice.call(toc ? toc.querySelectorAll('a[href^="#"]') : []);
  const targets = links
    .map(a => ({ a: a, el: root.querySelector('#' + CSS.escape(a.getAttribute('href').slice(1))) }))
    .filter(t => t.el);

  /* --- Sprung über das Inhaltsverzeichnis --------------------------- */
  links.forEach(a => {
    a.addEventListener('click', e => {
      const id = a.getAttribute('href').slice(1);
      const el = root.querySelector('#' + CSS.escape(id));
      if (!el) return;
      e.preventDefault();
      scrollTo(el);
      setActive(a);
      history.replaceState && history.replaceState(null, '', '#' + id);
    });
  });

  function scrollTo(el) {
    if (!main) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const top = el.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop - 12;
    main.scrollTo({ top: top, behavior: 'smooth' });
  }

  function setActive(a) {
    links.forEach(l => l.classList.remove('on'));
    if (a) {
      a.classList.add('on');
      if (toc && a.offsetTop < toc.scrollTop || (toc && a.offsetTop > toc.scrollTop + toc.clientHeight - 40)) {
        toc.scrollTop = Math.max(0, a.offsetTop - toc.clientHeight / 2);
      }
    }
  }

  /* --- Mitlaufende Markierung beim Scrollen -------------------------- */
  let ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const base = main ? main.getBoundingClientRect().top : 0;
      let current = targets.length ? targets[0].a : null;
      for (const t of targets) {
        if (t.el.getBoundingClientRect().top - base <= 90) current = t.a; else break;
      }
      setActive(current);
    });
  }
  (main || window).addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* --- Suche im Hilfetext ------------------------------------------- */
  if (search) {
    const sections = Array.prototype.slice.call(root.querySelectorAll('.help-main section'));
    search.addEventListener('input', () => applyFilter(search.value));
    search.addEventListener('keydown', e => {
      if (e.key === 'Escape') { search.value = ''; applyFilter(''); search.blur(); }
      if (e.key === 'Enter') {
        const first = links.filter(l => !l.classList.contains('hidden'))[0];
        if (first) first.click();
      }
    });

    function applyFilter(q) {
      q = String(q || '').trim().toLowerCase();
      clearMarks();
      if (!q) {
        links.forEach(l => l.classList.remove('hidden'));
        sections.forEach(s => { s.style.display = ''; });
        removeEmptyNote();
        return;
      }
      let hits = 0;
      const visibleIds = new Set();
      sections.forEach(s => {
        const match = s.textContent.toLowerCase().indexOf(q) >= 0;
        s.style.display = match ? '' : 'none';
        if (match) {
          hits++;
          s.querySelectorAll('h2[id],h3[id]').forEach(h => visibleIds.add(h.id));
          markIn(s, q);
        }
      });
      links.forEach(l => {
        const id = l.getAttribute('href').slice(1);
        l.classList.toggle('hidden', !visibleIds.has(id));
      });
      if (!hits) showEmptyNote(q); else removeEmptyNote();
    }

    function showEmptyNote(q) {
      removeEmptyNote();
      const d = document.createElement('div');
      d.className = 'toc-empty';
      d.textContent = 'Kein Treffer für „' + q + '“.';
      toc && toc.appendChild(d);
    }
    function removeEmptyNote() {
      const d = toc && toc.querySelector('.toc-empty');
      if (d) d.remove();
    }
  }

  /* --- Treffer im Text hervorheben ---------------------------------- */
  function markIn(section, q) {
    const walker = document.createTreeWalker(section, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const p = node.parentNode;
        if (!p || p.nodeName === 'PRE' || p.nodeName === 'MARK' || p.nodeName === 'SCRIPT') {
          return NodeFilter.FILTER_REJECT;
        }
        return node.nodeValue.toLowerCase().indexOf(q) >= 0
          ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const found = [];
    let n;
    while ((n = walker.nextNode())) { found.push(n); if (found.length > 300) break; }
    found.forEach(node => {
      const text = node.nodeValue;
      const frag = document.createDocumentFragment();
      let i = 0, at;
      const low = text.toLowerCase();
      while ((at = low.indexOf(q, i)) >= 0) {
        if (at > i) frag.appendChild(document.createTextNode(text.slice(i, at)));
        const m = document.createElement('mark');
        m.className = 'hit';
        m.textContent = text.substr(at, q.length);
        frag.appendChild(m);
        i = at + q.length;
      }
      if (i < text.length) frag.appendChild(document.createTextNode(text.slice(i)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function clearMarks() {
    root.querySelectorAll('mark.hit').forEach(m => {
      const t = document.createTextNode(m.textContent);
      m.parentNode.replaceChild(t, m);
    });
    root.querySelectorAll('.help-main section').forEach(s => s.normalize());
  }

  /* --- Druckschaltfläche -------------------------------------------- */
  const printBtn = root.querySelector('[data-help-print]');
  if (printBtn) printBtn.addEventListener('click', () => window.print());

  /* --- Anker aus der Adresszeile ------------------------------------ */
  if (location.hash && location.hash.length > 1) {
    const el = root.querySelector('#' + CSS.escape(location.hash.slice(1)));
    if (el) setTimeout(() => scrollTo(el), 60);
  }
}

/* ============================================================
   00 — Kern: Namespace, Event-Bus, Hilfsfunktionen
   ============================================================ */
'use strict';

var NWT = (function () {
  const api = {};

  /* --- Event-Bus ------------------------------------------------------- */
  const listeners = new Map();
  api.on = function (evt, fn) {
    if (!listeners.has(evt)) listeners.set(evt, new Set());
    listeners.get(evt).add(fn);
    return () => listeners.get(evt).delete(fn);
  };
  api.emit = function (evt, payload) {
    const set = listeners.get(evt);
    if (!set) return;
    for (const fn of Array.from(set)) {
      try { fn(payload); }
      catch (err) { console.error('[NWT] Listener-Fehler bei "' + evt + '"', err); }
    }
  };

  return api;
})();

NWT.Util = (function () {
  const SVG_NS = 'http://www.w3.org/2000/svg';

  function svgEl(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function el(sel) { return document.querySelector(sel); }
  function els(sel) { return Array.from(document.querySelectorAll(sel)); }

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  function clone(obj) {
    if (typeof structuredClone === 'function') {
      try { return structuredClone(obj); } catch (e) { /* fällt unten durch */ }
    }
    return JSON.parse(JSON.stringify(obj));
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function debounce(fn, ms) {
    let t = null;
    const wrapped = function () {
      const args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(() => { t = null; fn.apply(self, args); }, ms);
    };
    wrapped.cancel = () => { clearTimeout(t); t = null; };
    wrapped.flush = function () { if (t) { clearTimeout(t); t = null; fn.apply(this, arguments); } };
    return wrapped;
  }

  /** requestAnimationFrame-Drosselung: mehrere Aufrufe pro Frame => ein Aufruf. */
  function rafThrottle(fn) {
    let queued = false, lastArgs = null;
    return function () {
      lastArgs = arguments;
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; fn.apply(null, lastArgs); });
    };
  }

  function truncate(text, max) {
    text = String(text == null ? '' : text);
    return text.length > max ? text.slice(0, max - 1) + '…' : text;
  }

  function pad(n, width) { return String(n).padStart(width, '0'); }

  function nowIso() { return new Date().toISOString(); }

  function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function slugify(s) {
    return String(s || '').toLowerCase()
      .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
      .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'projekt';
  }

  function rectsIntersect(a, b) {
    return !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
  }

  function pointInRect(px, py, r) {
    return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  }

  /** Kleines Toast-Feedback unten links. */
  function toast(message, kind, ms) {
    const host = el('#toasts');
    if (!host) return;
    const t = document.createElement('div');
    t.className = 'toast' + (kind ? ' ' + kind : '');
    t.textContent = message;
    host.appendChild(t);
    setTimeout(() => {
      t.style.transition = 'opacity .25s, transform .25s';
      t.style.opacity = '0';
      t.style.transform = 'translateY(6px)';
      setTimeout(() => t.remove(), 260);
    }, ms || 2600);
  }

  return {
    SVG_NS, svgEl, el, els, clamp, clone, escapeHtml, debounce, rafThrottle,
    truncate, pad, nowIso, formatDate, downloadBlob, slugify,
    rectsIntersect, pointInRect, toast
  };
})();

/* Gemeinsame Parser für Inventar, Analyse und Netzplanprüfung. */
NWT.Net = (function () {
  function ipv4(value) {
    const parts = String(value || '').split('.');
    if (parts.length !== 4 || parts.some(p => !/^\d{1,3}$/.test(p) || Number(p) > 255)) return null;
    return parts.reduce((n, p) => n * 256 + Number(p), 0);
  }
  function address(n) { return [24, 16, 8, 0].map(shift => Math.floor(n / Math.pow(2, shift)) % 256).join('.'); }
  function cidr(value) {
    const parts = String(value || '').split('/'), ip = ipv4(parts[0]);
    const prefix = Number(parts[1]);
    if (parts.length !== 2 || ip === null || !/^\d{1,2}$/.test(parts[1]) || prefix > 32) return null;
    const size = Math.pow(2, 32 - prefix), start = Math.floor(ip / size) * size;
    return { start: start, end: start + size - 1, prefix: prefix, text: address(start) + '/' + prefix };
  }
  function subnet(ip, subnets) {
    const n = ipv4(String(ip || '').split('/')[0]);
    if (n === null) return '';
    const matches = (subnets || []).map(cidr).filter(c => c && n >= c.start && n <= c.end).sort((a, b) => b.prefix - a.prefix);
    return matches.length ? matches[0].text : '';
  }
  function normalizeIp(value) {
    const ip = String(value || '').trim().split('/')[0];
    const n = ipv4(ip);
    if (n !== null) return address(n);
    if (!ip.includes(':') || /[%\s]/.test(ip)) return '';
    try { return new URL('http://[' + ip + ']/').hostname.replace(/^\[|\]$/g, '').toLowerCase(); } catch (e) { return ''; }
  }
  function csv(text, separator) {
    text = String(text || '').replace(/^\uFEFF/, '');
    function parse(sep) {
      const rows = [], row = []; let cell = '', quoted = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
          else if (quoted || !cell.trim()) quoted = !quoted;
          else cell += c;
        } else if (!quoted && c === sep) { row.push(cell.trim()); cell = ''; }
        else if (!quoted && (c === '\n' || c === '\r')) {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(cell.trim()); if (row.some(Boolean)) rows.push(row.splice(0)); else row.length = 0;
          cell = '';
        } else cell += c;
      }
      if (quoted) throw new Error('CSV: Ein zitiertes Feld wurde nicht geschlossen.');
      row.push(cell.trim()); if (row.some(Boolean)) rows.push(row);
      return rows;
    }
    if (separator) return parse(separator);
    const candidates = [';', ',', '\t'].map(sep => { try { return parse(sep); } catch (e) { return null; } }).filter(Boolean);
    if (!candidates.length) throw new Error('CSV: Ungültige Anführungszeichen.');
    return candidates.sort((a, b) => ((b[0] || []).length - (a[0] || []).length))[0];
  }
  function csvString(rows) { return '\uFEFF' + rows.map(row => row.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n'); }
  function interfaces(device) {
    const primary = { name: 'Hauptadresse', ip: device.ip || '', ipv6: device.ipv6 || '', mac: device.mac || '', vlan: device.vlan || '', port: '' };
    return [primary].concat(device.interfaces || []);
  }
  return { ipv4, address, cidr, subnet, normalizeIp, csv, csvString, interfaces };
})();

NWT.Focus = (function () {
  const stack = [], baseline = new Map();
  function top() { return stack.length ? stack[stack.length - 1].el : null; }
  function sync() {
    const active = top();
    Array.from(document.body.children).forEach(el => {
      if (!baseline.has(el)) baseline.set(el, el.inert);
      el.inert = active ? (el !== active && el.id !== 'modal' && el.id !== 'toasts') : baseline.get(el);
    });
    if (!active) baseline.clear();
    document.body.classList.toggle('help-open', !!active);
  }
  function enter(el) {
    if (stack.some(x => x.el === el)) return;
    stack.push({ el: el, previous: document.activeElement });
    el.setAttribute('aria-modal', 'true'); el.tabIndex = -1;
    sync();
    const target = el.querySelector('button, input, select, textarea, [tabindex="0"]');
    (target || el).focus();
  }
  function leave(el) {
    const index = stack.findIndex(x => x.el === el);
    if (index < 0) return;
    const entry = stack.splice(index, 1)[0];
    sync();
    if (entry.previous && entry.previous.isConnected && !entry.previous.closest('[inert]')) entry.previous.focus();
  }
  document.addEventListener('keydown', e => {
    const active = top();
    if (!active || e.key !== 'Tab' || (NWT.Modal && NWT.Modal.isOpen())) return;
    const targets = Array.from(active.querySelectorAll('button, input, select, textarea, a[href], [tabindex="0"]')).filter(el => !el.disabled && el.getClientRects().length);
    if (!targets.length) { e.preventDefault(); active.focus(); return; }
    const first = targets[0], last = targets[targets.length - 1];
    if (e.shiftKey && (document.activeElement === first || !active.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !active.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
  }, true);
  return { enter, leave };
})();
