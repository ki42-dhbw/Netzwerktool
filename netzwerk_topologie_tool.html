    document.addEventListener('pointerout', onOut, true);
    document.addEventListener('pointerdown', hide, true);
    document.addEventListener('wheel', hide, { capture: true, passive: true });
    window.addEventListener('blur', hide);
    document.addEventListener('focusin', e => { if (enabled) onOver(e); });
    document.addEventListener('focusout', hide);
    NWT.on('ui:closemenus', hide);
  }

  function setEnabled(on) {
    enabled = !!on;
    NWT.Prefs.set('tooltips', enabled);
    if (!enabled) hide();
    NWT.emit('tooltips', enabled);
  }

  function isEnabled() { return enabled; }

  /* ----------------------------------------------------- Trefferauswahl */

  function suppressed() {
    if (!enabled) return true;
    if (NWT.Modal && NWT.Modal.isOpen()) return true;
    if (NWT.Interaction && NWT.Interaction.isBusy()) return true;
    const ctx = document.getElementById('contextmenu');
    if (ctx && !ctx.hidden) return true;
    return false;
  }

  /**
   * Sucht das nächstgelegene Element mit Hinweistext.
   * Native title-Attribute werden dabei einmalig übernommen, damit der
   * Browser nicht zusätzlich seinen eigenen Tooltip einblendet.
   */
  function findTarget(node) {
    let el = node;
    while (el && el.nodeType === 1 && el !== document.body) {
      if (el.hasAttribute && el.hasAttribute('title')) adoptTitle(el);
      if (el.dataset && el.dataset.tip !== undefined) return el;
      if (el.classList && (el.classList.contains('node') || el.classList.contains('edge') ||
                           el.classList.contains('area'))) return el;
      if (el.id && ELEMENT_TIPS[el.id]) return el;
      el = el.parentElement || (el.parentNode && el.parentNode.host) || null;
    }
    return null;
  }

  function adoptTitle(el) {
    const t = el.getAttribute('title');
    if (t == null) return;
    el.removeAttribute('title');
    if (!el.dataset.tip) el.dataset.tip = t;
    if (!el.getAttribute('aria-label') && !el.textContent.trim()) el.setAttribute('aria-label', t);
  }

  function onOver(e) {
    /* title-Attribute auch dann einsammeln, wenn Tipps aus sind —
       sonst zeigt der Browser stattdessen seine eigenen an. */
    const el = findTarget(e.target);
    if (suppressed()) { hide(); return; }
    if (!el || el === currentTarget) return;
    currentTarget = el;
    clearTimeout(showTimer);
    const delay = box.hidden ? SHOW_DELAY : MOVE_DELAY;
    showTimer = setTimeout(() => show(el), delay);
  }

  function onOut(e) {
    if (!currentTarget) return;
    const to = e.relatedTarget;
    if (to && currentTarget.contains && currentTarget.contains(to)) return;
    hide();
  }

  function hide() {
    clearTimeout(showTimer);
    showTimer = null;
    currentTarget = null;
    if (box) { box.hidden = true; box.innerHTML = ''; }
  }

  /* ------------------------------------------------------------- Inhalt */

  function contentFor(el) {
    if (el.classList && el.classList.contains('node')) return deviceTip(el.getAttribute('data-id'));
    if (el.classList && el.classList.contains('edge')) return connectionTip(el.getAttribute('data-id'));
    if (el.classList && el.classList.contains('area')) return areaTip(el.getAttribute('data-id'));

    const act = el.getAttribute && el.getAttribute('data-act');
    if (act && ACTION_TIPS[act]) return simple(ACTION_TIPS[act]);
    if (el.id && ELEMENT_TIPS[el.id]) return simple(ELEMENT_TIPS[el.id]);

    const type = el.getAttribute && el.getAttribute('data-type');
    if (type && C.DEVICE_TYPES[type]) return catalogTip(type);

    const tip = el.dataset ? el.dataset.tip : '';
    if (!tip) return '';
    return '<div class="tt-title">' + U.escapeHtml(tip) + '</div>';
  }

  function simple(entry) {
    return '<div class="tt-title">' + U.escapeHtml(entry[0]) + '</div>' +
      (entry[1] ? '<div class="tt-desc">' + U.escapeHtml(entry[1]) + '</div>' : '') +
      (entry[2] ? '<div class="tt-meta"><kbd>' + U.escapeHtml(entry[2]) + '</kbd></div>' : '');
  }

  function rows(pairs) {
    const body = pairs.filter(p => p[1]).map(p =>
      '<tr><th>' + U.escapeHtml(p[0]) + '</th><td>' + U.escapeHtml(p[1]) + '</td></tr>').join('');
    return body ? '<table class="tt-rows">' + body + '</table>' : '';
  }

  function catalogTip(typeId) {
    const t = C.type(typeId);
    const cat = (C.CATEGORIES.find(c => c.id === t.cat) || {}).label || '';
    const ports = C.buildPorts(typeId);
    return '<div class="tt-title">' + U.escapeHtml(t.label) + (t.custom ? ' · eigenes Symbol' : '') + '</div>' +
      '<div class="tt-desc">Auf die Zeichenfläche ziehen — oder anklicken, um mittig einzufügen.</div>' +
      rows([
        ['Kategorie', cat],
        ['Ports', ports.length ? ports.length + ' (' + ports.slice(0, 3).map(p => p.name).join(', ') + (ports.length > 3 ? ' …' : '') + ')' : '—']
      ]) +
      (t.custom ? '<div class="tt-meta">✎ oder Doppelklick bearbeitet das Symbol</div>' : '');
  }

  function deviceTip(id) {
    const d = S.dev(id);
    if (!d) return '';
    const shape = C.shapeOf(d.type);
    if (shape === 'text' || shape === 'note') {
      const ts = NWT.Decor.textStyle(d);
      return '<div class="tt-title">' + U.escapeHtml(C.typeLabel(d.type)) + '</div>' +
        '<div class="tt-desc">' + U.escapeHtml(U.truncate(d.name, 160)) + '</div>' +
        rows([['Schrift', NWT.Decor.FONTS[ts.font].label + ' · ' + ts.size + ' px' +
                          (ts.weight >= 600 ? ' · fett' : '') + (ts.italic ? ' · kursiv' : '')]]);
    }
    if (shape === 'shape') {
      const st = NWT.Decor.styleOf(d);
      return '<div class="tt-title">' + U.escapeHtml(d.name || C.typeLabel(d.type)) + '</div>' +
        '<div class="tt-desc">' + U.escapeHtml(NWT.Decor.figure(st.figure).label) + ' · Grafikelement</div>' +
        rows([
          ['Größe', Math.round(S.deviceRect(d).w) + ' × ' + Math.round(S.deviceRect(d).h) + ' px'],
          ['Drehung', st.rot ? st.rot + '°' : ''],
          ['Lage', d.front ? 'im Vordergrund' : 'hinter dem Netz']
        ]);
    }
    if (shape === 'junction') {
      return '<div class="tt-title">' + U.escapeHtml(d.name || 'Abzweig') + '</div>' +
        '<div class="tt-desc">Knotenpunkt — kein Gerät, sondern eine Stelle im Kabel.</div>' +
        rows([
          ['Leitungen', String(S.connectionsOf(id).length)],
          ['Bemerkung', d.description]
        ]);
    }
    const st = C.STATUS[d.status] || C.STATUS.unknown;
    const layer = S.layer(d.layer);
    const place = [d.location, d.room, d.rack].filter(Boolean).join(' · ');
    const conns = S.connectionsOf(id).length;
    return (d.image ? '<img class="tt-photo" alt="" src="' + U.escapeHtml(d.image) + '">' : '') +
      '<div class="tt-title">' + U.escapeHtml(d.name) + '</div>' +
      '<div class="tt-desc">' + U.escapeHtml(C.typeLabel(d.type)) +
        (d.manufacturer || d.model ? ' · ' + U.escapeHtml([d.manufacturer, d.model].filter(Boolean).join(' ')) : '') +
      '</div>' +
      rows([
        ['Status', st.label],
        ['IP', d.ip],
        ['IPv6', d.ipv6],
        ['Hostname', d.hostname],
        ['MAC', d.mac],
        ['VLAN', d.vlan],
        ['Protokoll', d.protocol],
        ['Standort', place],
        ['System', d.os],
        ['Ebene', layer ? layer.name : ''],
        ['Ports', (d.ports || []).length ? (d.ports.length + ' Ports · ' + conns + ' verbunden') : ''],
        ['Weitere Schnittstellen', (d.interfaces || []).map(i => [i.name, i.ip || i.ipv6].filter(Boolean).join(': ')).join(' · ')],
        ['Letzte Beobachtung', (d.observations || []).length ? U.formatDate(d.observations[d.observations.length - 1].at) + ' (Momentaufnahme)' : ''],
        ['Notiz', U.truncate(d.description || d.notes || '', 90)]
      ]) +
      '<div class="tt-meta">Doppelklick öffnet die Eigenschaften' +
      (d.image ? '' : ' · Bild hierher ziehen für ein Foto') + '</div>';
  }

  function connectionTip(id) {
    const c = S.con(id);
    if (!c) return '';
    const A = S.dev(c.source), B = S.dev(c.target);
    const t = C.connType(c.type);
    const from = (A ? A.name : '?') + (c.sourcePort ? ' (' + c.sourcePort + ')' : '');
    const to = (B ? B.name : '?') + (c.targetPort ? ' (' + c.targetPort + ')' : '');
    return '<div class="tt-title">' + U.escapeHtml(c.label || t.label) + '</div>' +
      '<div class="tt-desc">' + U.escapeHtml(from) + ' &rarr; ' + U.escapeHtml(to) + '</div>' +
      rows([
        ['Typ', t.label],
        ['Kategorie', (C.CONN_CATEGORIES.find(x => x.id === (t.cat || 'misc')) || {}).label || ''],
        ['Geschwindigkeit', c.speed],
        ['VLAN', c.vlan],
        ['Darstellung', c.style ? 'eigene Farbe/Stärke' : ''],
        ['Führung', (c.points && c.points.length) ? c.points.length + ' Knoten' : 'automatisch'],
        ['Beschreibung', U.truncate(c.description || '', 90)]
      ]) +
      '<div class="tt-meta">Doppelklick öffnet die Eigenschaften · Rechtsklick setzt Knoten und Abzweige</div>';
  }

  function areaTip(id) {
    const a = S.area(id);
    if (!a) return '';
    const inside = S.project.devices.filter(d => {
      const c = S.deviceCenter(d);
      return c.x >= a.x && c.x <= a.x + a.w && c.y >= a.y && c.y <= a.y + a.h;
    }).length;
    return '<div class="tt-title">' + U.escapeHtml(a.label) + '</div>' +
      (a.sublabel ? '<div class="tt-desc">' + U.escapeHtml(a.sublabel) + '</div>' : '') +
      rows([['Enthält', inside + ' Gerät' + (inside === 1 ? '' : 'e')],
            ['Ebene', (S.layer(a.layer) || {}).name || '']]) +
      '<div class="tt-meta">Am Titel ziehen verschiebt den Bereich samt Inhalt</div>';
  }

  /* ---------------------------------------------------------- Anzeigen */

  function show(el) {
    if (suppressed() || !el.isConnected) { hide(); return; }
    const html = contentFor(el);
    if (!html) { hide(); return; }

    box.innerHTML = html;
    box.hidden = false;

    const r = el.getBoundingClientRect();
    const w = box.offsetWidth, h = box.offsetHeight;
    const gap = 9;
    let left = r.left + r.width / 2 - w / 2;
    let top = r.bottom + gap;

    if (top + h > window.innerHeight - 6) {
      const above = r.top - h - gap;
      top = above >= 6 ? above : Math.max(6, window.innerHeight - h - 6);
    }
    left = U.clamp(left, 8, Math.max(8, window.innerWidth - w - 8));

    box.style.left = Math.round(left) + 'px';
    box.style.top = Math.round(top) + 'px';
  }

  return { init, setEnabled, isEnabled, hide };
})();


/* ======================= 18-helpdoc.js ======================= */
/* ============================================================
   18 — Ausführliches Handbuch im Programm
   Zeigt denselben Text wie hilfe.html als Vollbild-Overlay,
   damit die Einzeldatei auch ohne Begleitdatei vollständig ist.
   ============================================================ */

NWT.HelpDoc = (function () {
  const U = NWT.Util;
  let overlay = null;

  function available() {
    return typeof window.__NWT_HELP_BODY__ === 'string' && window.__NWT_HELP_BODY__.length > 0;
  }

  function build() {
    const host = document.createElement('div');
    host.id = 'help-overlay';
    host.setAttribute('role', 'dialog');
    host.setAttribute('aria-label', 'Handbuch');
    host.innerHTML =
      '<div class="nwt-help">' +
        '<header class="help-top">' +
          '<div class="help-brand">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2.5h6v5H9zM2 16.5h6v5H2zM16 16.5h6v5h-6z"/>' +
            '<path d="M12 7.5v3.5M5 16.5v-3.2h14v3.2M12 11v2.3"/></svg>' +
            '<div><b>Handbuch</b><span>Netzwerk-Topologie-Tool</span></div>' +
          '</div>' +
          '<input type="search" class="help-search" placeholder="Im Handbuch suchen …" autocomplete="off" aria-label="Im Handbuch suchen">' +
          '<button type="button" class="help-btn" data-help-print>Drucken</button>' +
          '<button type="button" class="help-btn primary" data-help-close>Schließen (Esc)</button>' +
        '</header>' +
        '<div class="help-shell">' +
          '<nav class="help-toc" aria-label="Inhaltsverzeichnis"><h4>Inhalt</h4>' +
            (window.__NWT_HELP_TOC__ || '') +
          '</nav>' +
          '<div class="help-main">' +
            '<div class="help-inner">' + window.__NWT_HELP_BODY__ + '</div>' +
            '<div class="help-foot">Dieses Handbuch liegt zusätzlich als eigenständige Datei ' +
            '<code>hilfe.html</code> neben dem Programm — zum Ausdrucken oder Weitergeben.</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    host.querySelector('[data-help-close]').addEventListener('click', close);
    host.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
    });
    document.body.appendChild(host);
    if (typeof window.NWT_HELP_UI === 'function') {
      window.NWT_HELP_UI(host.querySelector('.nwt-help'));
    }
    return host;
  }

  function open(anchor) {
    if (!available()) {
      NWT.Modal.error('Das ausführliche Handbuch ist in dieser Fassung nicht eingebettet.');
      return;
    }
    if (!overlay) overlay = build();
    overlay.classList.add('on');
    document.body.classList.add('help-open');
    NWT.Focus.enter(overlay);
    NWT.Tooltip && NWT.Tooltip.hide();

    const main = overlay.querySelector('.help-main');
    if (anchor) {
      const el = overlay.querySelector('#' + (window.CSS && CSS.escape ? CSS.escape(anchor) : anchor));
      if (el && main) {
        main.scrollTop = el.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop - 12;
      }
    }
    const search = overlay.querySelector('.help-search');
    if (search) setTimeout(() => search.focus(), 60);
  }

  function close() {
    if (!overlay) return;
    overlay.classList.remove('on');
    document.body.classList.remove('help-open');
    NWT.Focus.leave(overlay);
  }

  function isOpen() { return !!overlay && overlay.classList.contains('on'); }

  return { open, close, isOpen, available };
})();


/* ======================= 19-images.js ======================= */
/* ============================================================
   19 — Gerätefotos
   Echte Fotos werden als data:-URL im Gerät gespeichert und
   reisen dadurch automatisch in Projekt, Autosave, JSON-Export
   und Grafikexport mit.

   Entscheidend ist die Verkleinerung: ein Handyfoto mit 4 MB
   würde als Base64 rund 5,4 MB belegen und den Browser-Speicher
   (5–10 MB) sofort sprengen. Jedes Bild wird daher auf maximal
   MAX_EDGE Pixel skaliert und als JPEG neu kodiert — typisch
   30–70 KB pro Gerät.
   ============================================================ */

NWT.Images = (function () {
  const U = NWT.Util;
  const S = NWT.Store;

  const MAX_EDGE = 640;         // längste Kante nach der Verkleinerung
  const QUALITY = 0.82;         // JPEG-Qualität
  const MAX_SOURCE = 30 * 1024 * 1024;
  const WARN_TOTAL = 1.6 * 1024 * 1024;   // ab hier wird es im localStorage eng

  let fileInput = null;
  let pendingDeviceId = null;

  function init() {
    fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.hidden = true;
    document.body.appendChild(fileInput);
    fileInput.addEventListener('change', () => {
      const f = fileInput.files && fileInput.files[0];
      const id = pendingDeviceId;
      fileInput.value = '';
      pendingDeviceId = null;
      if (f && id) setFromFile(id, f);
    });

    /* Einfügen aus der Zwischenablage: Screenshot oder kopiertes Bild. */
    document.addEventListener('paste', e => {
      if (NWT.Modal.isOpen() || NWT.HelpDoc.isOpen()) return;
      const target = e.target;
      if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) return;
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf('image/') === 0) {
          const ids = S.selectedDevices();
          if (!ids.length) {
            U.toast('Erst ein Gerät auswählen, dann das Bild einfügen.', 'warn');
            return;
          }
          e.preventDefault();
          const file = items[i].getAsFile();
          if (file) setFromFile(ids[0], file);
          return;
        }
      }
    });
  }

  /* ---------------------------------------------------- Verkleinern */

  /** Liest eine Bilddatei, skaliert sie und liefert eine data:-URL. */
  function processFile(file) {
    return new Promise((resolve, reject) => {
      if (!file) { reject(new Error('Keine Datei übergeben.')); return; }
      if (file.type && file.type.indexOf('image/') !== 0) {
        reject(new Error('Die Datei ist kein Bild (' + (file.type || 'unbekannter Typ') + ').'));
        return;
      }
      if (file.size > MAX_SOURCE) {
        reject(new Error('Das Bild ist größer als 30 MB und wird nicht geladen.'));
        return;
      }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = function () {
        try {
          const scale = Math.min(1, MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * scale));
          const h = Math.max(1, Math.round(img.naturalHeight * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve({ dataUrl: canvas.toDataURL('image/jpeg', QUALITY), w: w, h: h });
        } catch (err) {
          URL.revokeObjectURL(url);
          reject(err);
        }
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('Das Bildformat konnte nicht gelesen werden.'));
      };
      img.src = url;
    });
  }

  /* ------------------------------------------------------ Zuweisen */

  function setFromFile(deviceId, file) {
    const d = S.dev(deviceId);
    if (!d) return Promise.resolve(false);
    return processFile(file).then(res => {
      NWT.History.record('Gerätefoto zuweisen');
      d.image = res.dataUrl;
      S.touch();
      NWT.emit('change', { structural: true });
      const kb = Math.round(res.dataUrl.length * 0.75 / 1024);
      U.toast('Foto zu „' + d.name + '“ hinzugefügt (' + res.w + '×' + res.h + ', ~' + kb + ' KB)', 'ok');
      checkBudget();
      return true;
    }).catch(err => {
      NWT.Modal.error('Das Foto konnte nicht übernommen werden.', err.message);
      return false;
    });
  }

  /** Öffnet den Dateidialog für ein bestimmtes Gerät. */
  function pickFor(deviceId) {
    pendingDeviceId = deviceId;
    fileInput.click();
  }

  function remove(deviceId) {
    const d = S.dev(deviceId);
    if (!d || !d.image) return;
    NWT.History.record('Gerätefoto entfernen');
    d.image = '';
    S.touch();
    NWT.emit('change', { structural: true });
    U.toast('Foto entfernt');
  }

  /** Wird von der Zeichenfläche aufgerufen, wenn eine Bilddatei auf ein Gerät fällt. */
  function handleDroppedFiles(deviceId, files) {
    if (!files || !files.length) return false;
    const img = Array.prototype.slice.call(files).find(f => f.type && f.type.indexOf('image/') === 0);
    if (!img) return false;
    setFromFile(deviceId, img);
    return true;
  }

  /* -------------------------------------------------------- Bilanz */

  function stats() {
    let count = 0, bytes = 0;
    S.project.devices.forEach(d => {
      if (!d.image) return;
      count++;
      /* Base64 belegt 4 Zeichen je 3 Byte. */
      bytes += Math.round((d.image.length - (d.image.indexOf(',') + 1)) * 0.75);
    });
    return { count: count, bytes: bytes };
  }

  function formatBytes(b) {
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB';
    return (b / 1024 / 1024).toFixed(2) + ' MB';
  }

  let warned = false;
  function checkBudget() {
    const st = stats();
    if (st.bytes > WARN_TOTAL && !warned) {
      warned = true;
      NWT.Modal.alert({
        title: 'Viele Bilddaten im Projekt',
        html: '<div class="msg-body"><p>Die hinterlegten Gerätefotos belegen bereits <b>' +
          formatBytes(st.bytes) + '</b> in ' + st.count + ' Geräten.</p>' +
          '<p>Der Browser-Speicher fasst je nach Browser nur 5–10 MB für <i>alle</i> Projekte zusammen. ' +
          'Sichern Sie das Projekt zusätzlich über <b>Export → Projekt als JSON</b> und entfernen Sie ' +
          'Fotos, die Sie nicht brauchen.</p></div>'
      });
    }
    if (st.bytes <= WARN_TOTAL) warned = false;
  }

  return {
    init, processFile, setFromFile, pickFor, remove, handleDroppedFiles,
    stats, formatBytes, MAX_EDGE
  };
})();


/* ======================= 20-discovery.js ======================= */
/* ============================================================
   20 — Netzwerkanalyse (Discovery)

   Ein Browser darf aus Sicherheitsgründen weder ICMP senden noch
   ARP-Tabellen lesen, keine Rohsockets öffnen und keine Ports
   scannen. Ein Scanner „im HTML“ wäre daher entweder unwirksam
   oder würde geraten — beides ist für eine Dokumentation wertlos.

   Dieses Modul geht deshalb den belastbaren Weg: es liest die
   Ausgabe der Werkzeuge, die auf dem Rechner ohnehin vorhanden
   sind, und leitet daraus Geräte, Typen und Verbindungen ab.

   Unterstützte Quellen:
     • arp -a · arp -n · ip neigh · Get-NetNeighbor
     • ipconfig /all · ip addr
     • nmap  (normal, -oG grepable, -oX XML)
     • show cdp/lldp neighbors [detail] · lldpctl
     • show mac address-table  (verbindet Geräte mit Switchports)
     • CSV/Semikolon-Listen aus Inventar oder DHCP-Leases
     • netzwerk_analyse.ps1 / .sh  (mitgeliefertes Skript → JSON)

   Alle Parser laufen gemeinsam über den Text; kombinierte
   Einfügungen (z. B. ipconfig + arp + nmap) werden zusammengeführt.
   ============================================================ */

NWT.Discovery = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const C = NWT.Catalog;

  /* Kleine, bewusst kurze OUI-Liste: nur Präfixe, die eindeutig sind.
     Herstellernamen liefern nmap und das Analyse-Skript ohnehin mit. */
  const OUI = {
    'B8:27:EB': 'Raspberry Pi Foundation', 'DC:A6:32': 'Raspberry Pi Trading',
    'E4:5F:01': 'Raspberry Pi Trading', '28:CD:C1': 'Raspberry Pi Trading',

  /* ------------------------------------------------------------ Helfer */

  function normMac(mac) {
    if (!mac) return '';
    let m = String(mac).toUpperCase().replace(/[^0-9A-F]/g, '');
    if (m.length !== 12) return '';
    return m.match(/.{2}/g).join(':');
  }

  function isUsableIp(ip) {
    if (!/^(\d{1,3}\.){3}\d{1,3}$/.test(ip)) return false;
    const p = ip.split('.').map(Number);
    if (p.some(n => n > 255)) return false;
    if (p[0] === 0 || p[0] === 127) return false;
    if (p[0] >= 224) return false;                       // Multicast/Broadcast
    if (ip === '255.255.255.255') return false;
    return true;
  }

  function isUsableMac(mac) {
    if (!mac) return true;                               // MAC ist optional
    if (mac === 'FF:FF:FF:FF:FF:FF') return false;
    if (mac.indexOf('01:00:5E') === 0) return false;      // IPv4-Multicast
    if (mac.indexOf('33:33') === 0) return false;         // IPv6-Multicast
    return true;
  }

  function vendorFor(mac) {
    const pre = mac.slice(0, 8);
    if (OUI[pre]) return OUI[pre];
    /* Zweites Halbbyte mit gesetztem Bit 1 = lokal verwaltete Adresse. */
    const second = parseInt(mac.charAt(1), 16);
    if (!isNaN(second) && (second & 2)) return 'lokal verwaltet / zufällig';
    return '';
  }

  function blankHost(ip) {
    return { ip: ip || '', mac: '', hostname: '', vendor: '', os: '', ports: [], sources: [], notes: [] };
  }

  /** Führt Hosts über MAC, sonst IP, sonst Hostname zusammen. */
  function mergeHosts(target, incoming) {
    incoming.forEach(h => {
      if (!h.ip && !h.mac) return;
      let found = null;
      if (h.mac) found = target.find(t => t.mac && t.mac === h.mac);
      if (!found && h.ip) found = target.find(t => t.ip === h.ip);
      if (!found && h.hostname) found = target.find(t => t.hostname && t.hostname.toLowerCase() === h.hostname.toLowerCase());
      if (!found) { target.push(h); return; }
      if (!found.ip) found.ip = h.ip;
      if (!found.mac) found.mac = h.mac;
      if (!found.hostname) found.hostname = h.hostname;
      if (!found.vendor) found.vendor = h.vendor;
      if (!found.os) found.os = h.os;
      h.ports.forEach(p => {
        if (!found.ports.some(q => q.port === p.port && q.proto === p.proto)) found.ports.push(p);
      });
      h.sources.forEach(s => { if (found.sources.indexOf(s) < 0) found.sources.push(s); });
      h.notes.forEach(n => { if (found.notes.indexOf(n) < 0) found.notes.push(n); });
    });
    return target;
  }

  /* ------------------------------------------------------------ Parser */

  /* ARP / Nachbartabellen: IP und MAC in derselben Zeile. */
  function parseArp(text) {
    const out = [];
    const re = /(\d{1,3}(?:\.\d{1,3}){3})[^\n\r]*?([0-9a-fA-F]{2}(?:[-:][0-9a-fA-F]{2}){5})/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      const ip = m[1], mac = normMac(m[2]);
      if (!isUsableIp(ip) || !isUsableMac(mac)) continue;
      const h = blankHost(ip);
      h.mac = mac;
      h.vendor = vendorFor(mac);
      h.sources.push('ARP');
      out.push(h);
    }
    return out;
  }

  /* nmap, grepable (-oG) */
  function parseNmapGrep(text) {
    const out = [];
    text.split(/\r?\n/).forEach(line => {
      if (line.indexOf('Host: ') !== 0) return;
      const head = /^Host:\s+(\S+)\s*(?:\(([^)]*)\))?/.exec(line);
      if (!head || !isUsableIp(head[1])) return;
      const h = blankHost(head[1]);
      if (head[2]) h.hostname = head[2].trim();
      h.sources.push('nmap -oG');
      const pm = /Ports:\s*(.+?)(?:\s+Ignored State|$)/.exec(line);
      if (pm) {
        pm[1].split(',').forEach(part => {
          const f = part.trim().split('/');
          if (f.length >= 5 && f[1] === 'open') {
            h.ports.push({ port: Number(f[0]), proto: f[2] || 'tcp', service: f[4] || '' });
          }
        });
      }
      out.push(h);
    });
    return out;
  }

  /* nmap, XML (-oX) */
  function parseNmapXml(text) {
    const out = [];
    if (text.indexOf('<nmaprun') < 0) return out;
    let doc;
    try { doc = new DOMParser().parseFromString(text, 'application/xml'); }
    catch (e) { return out; }
    if (!doc || doc.getElementsByTagName('parsererror').length) return out;

    Array.prototype.forEach.call(doc.getElementsByTagName('host'), host => {
      const h = blankHost('');
      h.sources.push('nmap -oX');
      Array.prototype.forEach.call(host.getElementsByTagName('address'), a => {
        const kind = a.getAttribute('addrtype');
        if (kind === 'ipv4') h.ip = a.getAttribute('addr') || '';
        if (kind === 'mac') {
          h.mac = normMac(a.getAttribute('addr'));
          h.vendor = a.getAttribute('vendor') || vendorFor(h.mac);
        }
      });
      const hn = host.getElementsByTagName('hostname')[0];
      if (hn) h.hostname = hn.getAttribute('name') || '';
      Array.prototype.forEach.call(host.getElementsByTagName('port'), p => {
        const state = p.getElementsByTagName('state')[0];
        if (!state || state.getAttribute('state') !== 'open') return;
        const svc = p.getElementsByTagName('service')[0];
        h.ports.push({
          port: Number(p.getAttribute('portid')),
          proto: p.getAttribute('protocol') || 'tcp',
          service: svc ? (svc.getAttribute('name') || '') : ''
        });
      });
      const osm = host.getElementsByTagName('osmatch')[0];
      if (osm) h.os = osm.getAttribute('name') || '';
      if (isUsableIp(h.ip) && isUsableMac(h.mac)) out.push(h);
    });
    return out;
  }

  /* nmap, normale Textausgabe */
  function parseNmapNormal(text) {
    const out = [];
    if (text.indexOf('Nmap scan report for') < 0) return out;
    const blocks = text.split(/Nmap scan report for\s+/).slice(1);
    blocks.forEach(block => {
      const first = block.split(/\r?\n/)[0].trim();
      let ip = '', name = '';
      const paren = /^(\S+)\s+\((\d{1,3}(?:\.\d{1,3}){3})\)/.exec(first);
      if (paren) { name = paren[1]; ip = paren[2]; }
      else if (/^\d{1,3}(?:\.\d{1,3}){3}$/.test(first)) ip = first;
      if (!isUsableIp(ip)) return;

      const h = blankHost(ip);
      h.hostname = name;
      h.sources.push('nmap');
      const pre = /MAC Address:\s*([0-9A-Fa-f:.-]{12,17})\s*(?:\(([^)]*)\))?/.exec(block);
      if (pre) {
        h.mac = normMac(pre[1]);
        h.vendor = (pre[2] || '').trim() || vendorFor(h.mac);
      }
      const osm = /(?:Running|OS details|Service Info):\s*([^\r\n]+)/.exec(block);
      if (osm) h.os = osm[1].trim();
      const pr = /^(\d+)\/(tcp|udp)\s+open\s*(\S+)?/gm;
      let pm;
      while ((pm = pr.exec(block)) !== null) {
        h.ports.push({ port: Number(pm[1]), proto: pm[2], service: pm[3] || '' });
      }
      if (isUsableMac(h.mac)) out.push(h);
    });
    return out;
  }

  /* LLDP / CDP — liefert Nachbarschaften, also echte Verbindungen. */
  function parseNeighbors(text) {
    const links = [];
    const hosts = [];

    /* Cisco: show cdp/lldp neighbors detail */
    const blocks = text.split(/(?=Device ID:|System Name:|Local Intf:)/);
    blocks.forEach(b => {
      const name = (/(?:Device ID|System Name):\s*(\S+)/.exec(b) || [])[1];
      if (!name) return;
      const ip = (/(?:IP address|Management Addresses?|IPv4 address)[^\d]*(\d{1,3}(?:\.\d{1,3}){3})/i.exec(b) || [])[1];
      const local = (/(?:Interface|Local Intf):\s*([^\s,]+)/.exec(b) || [])[1];
      const remote = (/(?:Port ID \(outgoing port\)|Port id|Port ID):\s*([^\s,]+)/i.exec(b) || [])[1];
      links.push({ remoteName: name, remoteIp: ip || '', localPort: local || '', remotePort: remote || '', source: 'LLDP/CDP' });
      if (ip && isUsableIp(ip)) {
        const h = blankHost(ip);
        h.hostname = name;
        h.sources.push('LLDP/CDP');
        hosts.push(h);
      }
    });

    /* lldpctl */
    const lldpctl = text.split(/(?=Interface:\s)/);
    lldpctl.forEach(b => {
      const sys = (/SysName:\s*(\S+)/.exec(b) || [])[1];
      if (!sys) return;
      const ip = (/MgmtIP:\s*(\d{1,3}(?:\.\d{1,3}){3})/.exec(b) || [])[1];
      const local = (/Interface:\s*([^\s,]+)/.exec(b) || [])[1];
      const remote = (/PortID:\s*\S*\s*(\S+)/.exec(b) || [])[1];
      links.push({ remoteName: sys, remoteIp: ip || '', localPort: local || '', remotePort: remote || '', source: 'lldpctl' });
      if (ip && isUsableIp(ip)) {
        const h = blankHost(ip);
        h.hostname = sys;
        h.sources.push('lldpctl');
        hosts.push(h);
      }
    });

    return { links: links, hosts: hosts };
  }

  /* show mac address-table — ordnet MAC-Adressen Switchports zu. */
  function parseMacTable(text) {
    const map = [];
    const re = /(\d{1,4})\s+([0-9a-fA-F]{4}\.[0-9a-fA-F]{4}\.[0-9a-fA-F]{4})\s+\S+\s+(\S+)/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      const mac = normMac(m[2]);
      if (!mac || !isUsableMac(mac)) continue;
      map.push({ vlan: m[1], mac: mac, port: m[3] });
    }
    return map;
  }

  /* CSV / Semikolonliste mit Kopfzeile */
  function parseCsv(text) {
    const rows = NWT.Net.csv(text);
    if (rows.length < 2 || rows[0].length < 2) return [];
    const head = rows[0].map(h => h.toLowerCase());
    const col = names => head.findIndex(h => names.some(n => h.indexOf(n) >= 0));
    const iIp = col(['ip-adresse', 'ipaddress', 'ip address', 'ip']);
    const iMac = col(['mac']);
    const iName = col(['hostname', 'name', 'gerät', 'geraet', 'host']);
    const iRoom = col(['raum', 'room']);
    const iRack = col(['rack', 'schrank']);
    const iVendor = col(['hersteller', 'vendor', 'manufacturer']);
    if (iIp < 0 && iMac < 0) return [];

    const out = [];
    rows.slice(1).forEach(f => {
      const ip = iIp >= 0 ? f[iIp] : '';
      const mac = iMac >= 0 ? normMac(f[iMac]) : '';
      if (!isUsableIp(ip) && !mac) return;
      const h = blankHost(isUsableIp(ip) ? ip : '');
      h.mac = mac;
      h.hostname = iName >= 0 ? (f[iName] || '') : '';
      h.vendor = (iVendor >= 0 ? f[iVendor] : '') || vendorFor(mac);
      if (iRoom >= 0 && f[iRoom]) h.room = f[iRoom];
      if (iRack >= 0 && f[iRack]) h.rack = f[iRack];
      h.sources.push('CSV');
      out.push(h);
    });
    return out;
  }

  /* Ausgabe des mitgelieferten Analyse-Skripts */
  function parseScanJson(obj) {
    const out = { hosts: [], subnets: [], meta: null, ipLinks: [], local: {} };
    if (!obj || obj.tool !== 'nwt-scan' || !Array.isArray(obj.hosts)) return out;
    out.meta = {
      generated: obj.generated || '', host: obj.scannedFrom || '',
      version: Number(obj.version) || 1,
      iface: String(obj.interface || ''),
      wifi: obj.wifi && obj.wifi.ssid ? String(obj.wifi.ssid) : ''
    };
    if (obj.scan && typeof obj.scan === 'object') {
      const scan = obj.scan;
      out.meta.scan = { first: String(scan.first || ''), last: String(scan.last || ''),
        selected: Number(scan.selected) || 0, completed: Number(scan.completed) || 0,
        omitted: Number(scan.omitted) || 0, cancelled: !!scan.cancelled, error: String(scan.error || '') };
    }
    out.subnets = Array.isArray(obj.subnets) ? obj.subnets : [];
    if (isUsableIp(String(obj.gateway || ''))) out.local.gateway = String(obj.gateway);
    if (isUsableIp(String(obj.localAddress || ''))) out.local.self = String(obj.localAddress);

    obj.hosts.forEach(x => {
      if (!x || typeof x !== 'object') return;
      const ip = String(x.ip || '');
      if (!isUsableIp(ip)) return;
      const h = blankHost(ip);
      h.mac = normMac(x.mac);
      h.hostname = String(x.hostname || '');
      h.vendor = String(x.vendor || '') || vendorFor(h.mac);
      h.os = String(x.os || '');
      if (Array.isArray(x.ports)) {
        x.ports.filter(p => p != null && Number(p.port || p) > 0 && Number(p.port || p) <= 65535).forEach(p => h.ports.push({
          port: Number(p.port || p), proto: String(p.proto || 'tcp'), service: String(p.service || '')
        }));
      }
      if (x.rtt != null) h.notes.push('Antwortzeit ' + x.rtt + ' ms');
      /* Ab Version 5 sagt das Skript, wie ein Host gefunden wurde.
         Das ist für den Anwender die eigentliche Begründung. */
      if (Array.isArray(x.discovery) && x.discovery.length) {
        h.discovery = x.discovery.map(String);
        h.notes.push('Gefunden über ' + h.discovery.join(', '));
      }
      if (x.ping === false) h.notes.push('antwortet nicht auf Ping');
      if (x.neighborState) h.notes.push('ARP-Zustand ' + String(x.neighborState));
      h.sources.push('Analyse-Skript');
      h.observation = { at: String(obj.generated || ''), source: 'Analyse-Skript',
        method: (Array.isArray(x.discovery) ? x.discovery : []).map(String).join(', '), confidence: x.ping || (x.ports || []).length ? 1 : 0.5,
        status: x.ping || (x.ports || []).length ? 'active' : 'unknown' };
      out.hosts.push(h);
    });

    if (Array.isArray(obj.links)) {
      obj.links.forEach(l => {
        const a = String(l && l.source || ''), b = String(l && l.target || '');
        if (!isUsableIp(a) || !isUsableIp(b) || a === b) return;
        out.ipLinks.push({
          a: a, b: b,
          type: String(l.type || 'logical'),
          method: String(l.method || ''),
          confidence: Number(l.confidence) || 0,
          why: String(l.description || '')
        });
      });
    }
    return out;
  }

  /* ---------------------------------------------------- Verbindungen */

  const LINK_METHODS = {
    'arp':             { label: 'ARP-Nachbar',        conn: 'logical' },
    'local-discovery': { label: 'selbst beobachtet',  conn: 'logical' },
    'same-subnet':     { label: 'gleiches Subnetz',   conn: 'logical' },
    'lldp':            { label: 'LLDP',               conn: 'gigabit' },
    'cdp':             { label: 'CDP',                conn: 'gigabit' }
  };

  function methodLabel(m) { return (LINK_METHODS[m] || {}).label || m || 'unbekannt'; }
  function connTypeFor(m) { return (LINK_METHODS[m] || {}).conn || 'logical'; }

  /**
   * Aus vielen Vermutungen einen brauchbaren Plan machen.
   *
   * Das Skript liefert bewusst jede Ableitung einzeln — für 20 Hosts
   * waren das zuletzt 56 Einträge, meist dreifach dasselbe Paar und
   * dazu ein Stern vom Scan-Rechner zu jedem gesehenen Gerät. Würde
   * man das ungefiltert übernehmen, entstünde ein unlesbarer Filz.
   *
   * Zwei Regeln reichen:
   *   1. Je Gerätepaar bleibt die bestbelegte Ableitung.
   *   2. Jedes Gerät behält genau seine beste Verbindung. Bei
   *      Gleichstand gewinnt das stärker vernetzte Gegenüber —
   *      der Verteiler, an dem tatsächlich alles hängt.
   *
   * Aus dem Stern „ich habe alle gesehen" wird so „ich hänge am
   * selben Verteiler wie alle anderen". Das ist die Aussage, die die
   * Daten hergeben — nicht mehr.
   */
  function reduceLinks(raw) {
    const best = new Map();
    raw.forEach(l => {
      const key = l.a < l.b ? l.a + '|' + l.b : l.b + '|' + l.a;
      const cur = best.get(key);
      if (!cur || l.confidence > cur.confidence) {
        best.set(key, { a: key.split('|')[0], b: key.split('|')[1], key: key,
                        type: l.type, method: l.method, confidence: l.confidence, why: l.why });
      }
    });

    const degree = {};
    best.forEach(l => { degree[l.a] = (degree[l.a] || 0) + 1; degree[l.b] = (degree[l.b] || 0) + 1; });

    const perHost = {};
    best.forEach(l => {
      (perHost[l.a] = perHost[l.a] || []).push(l);
      (perHost[l.b] = perHost[l.b] || []).push(l);
    });

    const keep = new Map();
    Object.keys(perHost).forEach(ip => {
      const sorted = perHost[ip].slice().sort((x, y) => {
        if (y.confidence !== x.confidence) return y.confidence - x.confidence;
        const ox = x.a === ip ? x.b : x.a, oy = y.a === ip ? y.b : y.a;
        if ((degree[oy] || 0) !== (degree[ox] || 0)) return (degree[oy] || 0) - (degree[ox] || 0);
        return x.key < y.key ? -1 : 1;
      });
      keep.set(sorted[0].key, sorted[0]);
    });

    const out = [];
    keep.forEach(l => out.push(l));
    out.sort((x, y) => (ipNum(x.a) - ipNum(y.a)) || (ipNum(x.b) - ipNum(y.b)));
    out.forEach(l => { l.selected = true; });
    return { links: out, dropped: raw.length - out.length };
  }

  /* ipconfig /all bzw. ip addr — liefert eigene Adresse und Gateway. */
  function parseLocal(text) {
    const info = {};
    const gw = /(?:Standardgateway|Default Gateway|default via)[^\d]*(\d{1,3}(?:\.\d{1,3}){3})/i.exec(text);
    if (gw) info.gateway = gw[1];
    const dns = /(?:DNS-Server|DNS Servers)[^\d]*(\d{1,3}(?:\.\d{1,3}){3})/i.exec(text);
    if (dns) info.dns = dns[1];
    const mask = /(?:Subnetzmaske|Subnet Mask)[^\d]*(\d{1,3}(?:\.\d{1,3}){3})/i.exec(text);
    if (mask) info.mask = mask[1];
    return info;
  }

  /* -------------------------------------------------------- Erkennung */

  function classify(host) {
    const ports = host.ports || [];
    for (const hint of PORT_HINTS) {
      if (ports.some(p => p.port === hint.port && (!hint.proto || p.proto === hint.proto))) {
        return { type: hint.type, reason: hint.why, confidence: 'hoch' };
      }
    }
    /* Nur der eigene Name zählt, nicht die Domäne: in einem
       FritzBox-Netz endet jeder Rechner auf .fritz.box — daraus
       würde sonst ein Netz voller WLAN-Router. */
    const shortName = String(host.hostname || '').split('.')[0];
    const name = shortName + ' ' + (host.vendor || '');
    for (const [re, type, why] of NAME_HINTS) {
      if (re.test(name)) return { type: type, reason: why, confidence: 'mittel' };
    }
    if (/raspberry/i.test(host.vendor)) return { type: 'raspberrypi', reason: 'Hersteller Raspberry Pi', confidence: 'hoch' };
    if (/espressif/i.test(host.vendor)) return { type: 'sensor', reason: 'Hersteller Espressif (ESP)', confidence: 'mittel' };
    /* Eine virtuelle Netzwerkkarte gehört einem Gastsystem, nicht dem
       Virtualisierungshost — daher „Server“ und nicht „Virtualisierungsserver“. */
    if (/virtuell|vmware|virtualbox|hyper-v|qemu|xen/i.test(host.vendor)) {
      return { type: 'server', reason: 'virtuelle Netzwerkkarte — vermutlich ein Gastsystem', confidence: 'mittel' };
    }
    if (ports.some(p => p.port === 80 || p.port === 443)) {
      return { type: 'server', reason: 'Webdienst erreichbar', confidence: 'niedrig' };
    }
    if (ports.some(p => p.port === 22)) {
      return { type: 'server', reason: 'SSH erreichbar', confidence: 'niedrig' };
    }
    return { type: 'pc', reason: 'keine eindeutigen Merkmale', confidence: 'niedrig' };
  }

  /** Vergleicht einen erkannten Host mit dem Projekt. */
  function matchExisting(host) {
    const devs = S.project.devices;
    if (host.mac) {
      const byMac = devs.find(d => NWT.Net.interfaces(d).some(i => normMac(i.mac) && normMac(i.mac) === host.mac));
      if (byMac) return { device: byMac, by: 'MAC' };
    }
    if (host.ip) {
      const byIp = devs.find(d => NWT.Net.interfaces(d).some(i => NWT.Net.normalizeIp(i.ip) === NWT.Net.normalizeIp(host.ip)));
      if (byIp) return { device: byIp, by: 'IP' };
    }
    if (host.hostname) {
      const hn = host.hostname.toLowerCase().split('.')[0];
      const byName = devs.find(d =>
        (d.hostname || '').toLowerCase().split('.')[0] === hn ||
        (d.name || '').toLowerCase() === host.hostname.toLowerCase());
      if (byName) return { device: byName, by: 'Name' };
    }
    return null;
  }

  /* ------------------------------------------------------------ Analyse */

  /** Hauptfunktion: beliebiger Text oder JSON → Analyseergebnis. */
  function analyze(input) {
    const text = String(input || '');
    if (!text.trim()) throw new Error('Es wurde kein Text übergeben.');

    const warnings = [];
    let hosts = [];
    let links = [];
    let macTable = [];
    let subnets = [];
    let meta = null;
    let rawIpLinks = [];
    let scanLocal = {};

    /* 1. Versuch: JSON (Analyse-Skript oder Datensatzliste) */
    const trimmed = text.trim();
    if (trimmed.charAt(0) === '{' || trimmed.charAt(0) === '[') {
      try {
        const obj = JSON.parse(trimmed);
        if (obj && obj.tool === 'nwt-scan') {
          const r = parseScanJson(obj);
          hosts = r.hosts; subnets = r.subnets; meta = r.meta;
          rawIpLinks = r.ipLinks; scanLocal = r.local;
        } else if (Array.isArray(obj)) {
          obj.forEach(x => {
            if (!x || typeof x !== 'object') return;
            const ip = String(x.ip || x.IPAddress || x.address || '');
            const mac = normMac(x.mac || x.MACAddress || x.LinkLayerAddress);
            if (!isUsableIp(ip) && !mac) return;
            const h = blankHost(isUsableIp(ip) ? ip : '');
            h.mac = mac;
            h.hostname = String(x.hostname || x.name || x.Name || '');
            h.vendor = String(x.vendor || '') || vendorFor(mac);
            h.sources.push('JSON');
            hosts.push(h);
          });
        } else {
          warnings.push('Die JSON-Struktur ist unbekannt und wurde übersprungen.');
        }
      } catch (e) {
        warnings.push('Der Text beginnt wie JSON, ließ sich aber nicht auswerten: ' + e.message);
      }
    }

    /* 2. Textparser laufen immer mit — kombinierte Einfügungen sind üblich. */
    if (!hosts.length || trimmed.charAt(0) !== '{') {
      mergeHosts(hosts, parseNmapXml(text));
      mergeHosts(hosts, parseNmapNormal(text));
      mergeHosts(hosts, parseNmapGrep(text));
      mergeHosts(hosts, parseArp(text));
      mergeHosts(hosts, parseCsv(text));
      const nb = parseNeighbors(text);
      mergeHosts(hosts, nb.hosts);
      links = nb.links;
      macTable = parseMacTable(text);
    }

    const local = Object.assign({}, scanLocal.gateway ? { gateway: scanLocal.gateway } : {}, parseLocal(text));
    if (scanLocal.gateway) local.gateway = scanLocal.gateway;
    if (scanLocal.self) local.self = scanLocal.self;

    if (!hosts.length) {
      throw new Error('Im Text wurden keine IP- oder MAC-Adressen gefunden. ' +
        'Unterstützt werden u. a. arp -a, ip neigh, nmap, LLDP/CDP, CSV und die Ausgabe des Analyse-Skripts.');
    }

    /* Anreichern: Typvorschlag, Abgleich mit dem Projekt, Switchport */
    hosts.forEach(h => {
      const g = classify(h);
      h.guessType = g.type;
      h.guessReason = g.reason;
      h.confidence = g.confidence;
      const m = matchExisting(h);
      h.existingId = m ? m.device.id : '';
      h.matchedBy = m ? m.by : '';
      h.state = m ? 'bekannt' : 'neu';
      h.selected = true;
      if (h.mac) {
        const mt = macTable.find(x => x.mac === h.mac);
        if (mt) { h.switchPort = mt.port; h.switchVlan = mt.vlan; }
      }
      /* Das Standardgateway ist keine Vermutung, sondern eine Auskunft
         des Betriebssystems — sie schlägt jede Porthäufigkeit. Nur
         wenn der Name bereits eine genauere Bauform nennt (etwa
         WLAN-Router), bleibt diese stehen. */
      if (local.gateway && h.ip === local.gateway) {
        h.isGateway = true;
        const routerish = ['router', 'wlan_router', 'firewall', 'gateway', 'modem', 'switch_l3'];
        if (routerish.indexOf(h.guessType) < 0) {
          h.guessType = 'router';
          h.guessReason = 'Standardgateway dieses Netzes';
          h.confidence = 'hoch';
        } else if (h.confidence !== 'hoch') {
          h.guessReason = h.guessReason + ', zugleich Standardgateway';
          h.confidence = 'hoch';
        }
      }
      h.subnet = NWT.Net.subnet(h.ip, subnets);
      h.subnetAssumed = !h.subnet && !!h.ip;
      if (h.subnetAssumed) h.subnet = h.ip.split('.').slice(0, 3).join('.') + '.0/24';
    });

    hosts.sort((a, b) => ipNum(a.ip) - ipNum(b.ip));
    if (hosts.some(h => h.subnetAssumed)) warnings.push('Für Hosts ohne Präfixangabe wird /24 nur als Annahme zur Gruppierung verwendet.');
    if (meta && meta.scan) {
      const scan = meta.scan;
      warnings.push('Scanbereich ' + scan.first + ' – ' + scan.last + ': ' + scan.completed + ' von ' + scan.selected + ' Adressen geprüft; ' + scan.omitted + ' Adressen außerhalb der Auswahl.');
      if (scan.cancelled) warnings.push('Die Aufnahme wurde vorzeitig beendet. Fehlende Geräte sind damit nicht als offline nachgewiesen.');
      if (scan.error) warnings.push('Scanner meldet: ' + scan.error);
    }

    /* Verbindungen aus dem Scan verdichten und benennen. Der eigene
       Rechner hängt per WLAN am Netz, wenn das Skript es so meldet —
       das ist belegt und darf in die Leitungsart einfließen. */
    const reduced = reduceLinks(rawIpLinks);
    const byIp = {};
    hosts.forEach(h => { if (h.ip) byIp[h.ip] = h; });
    reduced.links.forEach(l => {
      const wifi = meta && meta.wifi && local.self && (l.a === local.self || l.b === local.self);
      l.connType = wifi ? 'wlan' : connTypeFor(l.method);
      l.methodLabel = methodLabel(l.method);
      l.aName = byIp[l.a] ? (byIp[l.a].hostname || byIp[l.a].ip) : l.a;
      l.bName = byIp[l.b] ? (byIp[l.b].hostname || byIp[l.b].ip) : l.b;
      if (wifi) l.why = (l.why ? l.why + ' ' : '') + 'Scan-Rechner über WLAN „' + meta.wifi + '“.';
    });

    lastResult = {
      hosts: hosts,
      links: links,
      ipLinks: reduced.links,
      ipLinksDropped: reduced.dropped,
      macTable: macTable,
      subnets: subnets.length ? subnets : uniqueSubnets(hosts),
      local: local,
      meta: meta,
      warnings: warnings,
      sources: uniqueSources(hosts),
      at: U.nowIso()
    };
    NWT.emit('discovery', lastResult);
    return lastResult;
  }

  function ipNum(ip) {
    if (!ip) return 0;
    return ip.split('.').reduce((a, o) => a * 256 + Number(o), 0);
  }

  function uniqueSubnets(hosts) {
    const set = [];
    hosts.forEach(h => { if (h.subnet && set.indexOf(h.subnet) < 0) set.push(h.subnet); });
    return set;
  }

  function uniqueSources(hosts) {
    const set = [];
    hosts.forEach(h => h.sources.forEach(s => { if (set.indexOf(s) < 0) set.push(s); }));
    return set;
  }

  /* ------------------------------------------------------- Übernehmen */

  /**
   * Übernimmt ausgewählte Hosts ins Projekt.
   * opts: { connectTo: deviceId|'', createArea: bool, overwrite: bool }
   */
  /**
   * Anordnung aus den erkannten Verbindungen.
   *
   * Ein Raster reiht Geräte nach IP-Adresse auf; die Leitungen laufen
   * dann kreuz und quer. Kennt man den Sternmittelpunkt, wird daraus
   * ein lesbarer Plan: Verteiler oben, was daran hängt darunter.
   *
   * Liefert eine Zuordnung IP → {x,y} oder null, wenn die Daten keinen
   * Verteiler hergeben — dann bleibt es beim Raster.
   */
  function planLayout(chosen, links, startX, startY) {
    const sel = (links || []).filter(l => l.selected);
    if (!sel.length) return null;

    const deg = {};
    sel.forEach(l => { deg[l.a] = (deg[l.a] || 0) + 1; deg[l.b] = (deg[l.b] || 0) + 1; });

    /* Nur neu angelegte Geräte werden gesetzt — vorhandene stehen,
       wo der Anwender sie hingestellt hat. */
    const placeable = {};
    chosen.forEach(h => { if (h.ip && !h.existingId) placeable[h.ip] = true; });

    const hubs = Object.keys(deg)
      .filter(ip => deg[ip] >= 3 && placeable[ip])
      .sort((a, b) => deg[b] - deg[a] || ipNum(a) - ipNum(b));
    if (!hubs.length) return null;

    const hubOf = {};
    sel.forEach(l => {
      [[l.a, l.b], [l.b, l.a]].forEach(pair => {
        const ip = pair[0], other = pair[1];
        if (!placeable[ip] || hubs.indexOf(ip) >= 0) return;
        if (!hubOf[ip] || (deg[other] || 0) > (deg[hubOf[ip]] || 0)) hubOf[ip] = other;
      });
    });

    const stepX = C.NODE_W + 44;
    const stepY = C.NODE_H + 74;
    const pos = {};
    let cursorX = startX;

    hubs.forEach(hub => {
      const leaves = Object.keys(hubOf).filter(ip => hubOf[ip] === hub).sort((a, b) => ipNum(a) - ipNum(b));
      const cols = Math.max(2, Math.min(6, Math.ceil(Math.sqrt(leaves.length || 1))));
      const width = cols * stepX;
      pos[hub] = { x: cursorX + Math.round((width - stepX) / 2), y: startY };
      leaves.forEach((ip, i) => {
        pos[ip] = { x: cursorX + (i % cols) * stepX, y: startY + stepY + Math.floor(i / cols) * stepY };
      });
      delete hubOf[hub];
      cursorX += width + stepX;
    });

    /* Was an keinem erkannten Verteiler hängt, kommt in eine eigene
       Reihe darunter — sichtbar, aber ohne falsche Nachbarschaft. */
    const rest = chosen.filter(h => h.ip && placeable[h.ip] && !pos[h.ip]).map(h => h.ip);
    if (rest.length) {
      const bottom = Math.max.apply(null, Object.keys(pos).map(ip => pos[ip].y)) + stepY * 2;
      const cols = Math.max(4, Math.min(8, rest.length));
      rest.forEach((ip, i) => {
        pos[ip] = { x: startX + (i % cols) * stepX, y: bottom + Math.floor(i / cols) * stepY };
      });
    }
    return pos;
  }

  function apply(hosts, opts) {
    opts = opts || {};
    const chosen = hosts.filter(h => h.selected);
    if (!chosen.length) return { created: 0, updated: 0 };

    NWT.History.record('Netzwerkanalyse übernehmen');

    const P = S.project;
    let created = 0, updated = 0;
    const newIds = [];

    /* Platzierung: freies Feld unterhalb des bisherigen Inhalts. */
    const b = S.contentBounds(0);
    const startX = b.empty ? 80 : Math.round(b.x / 20) * 20;
    const startY = b.empty ? 80 : Math.round((b.y + b.h + 90) / 20) * 20;
    const perRow = Math.max(4, Math.min(8, Math.ceil(Math.sqrt(chosen.length))));
    const stepX = C.NODE_W + 44;
    const stepY = C.NODE_H + 74;
    const plan = planLayout(chosen, (lastResult || {}).ipLinks || [], startX, startY);

    S.batch(() => chosen.forEach((h, i) => {
      const match = matchExisting(h);
      const existing = match ? match.device : null;
      h.existingId = existing ? existing.id : '';
      if (existing) {
        let changed = false;
        /* Vorhandene Angaben nur ergänzen, nicht überschreiben. */
        const fill = (key, value) => {
          if (!value) return;
          if (!existing[key] || opts.overwrite) {
            if (existing[key] !== value) { existing[key] = value; changed = true; }
          }
        };
        fill('ip', h.ip);
        fill('mac', h.mac);
        fill('hostname', h.hostname);
        fill('manufacturer', h.vendor);
        fill('os', h.os);
        if (existing.status === 'unknown' && (!h.observation || h.observation.status === 'active')) { existing.status = 'active'; changed = true; }
        if (h.observation) {
          if (!existing.observations) existing.observations = [];
          if (!existing.observations.some(o => o.at === h.observation.at && o.method === h.observation.method)) {
            existing.observations.push(U.clone(h.observation)); existing.observations = existing.observations.slice(-20); changed = true;
          }
        }
        if (changed) updated++;
        h.appliedId = existing.id;
        return;
      }

      const p = plan && h.ip ? plan[h.ip] : null;
      const x = p ? p.x : startX + (i % perRow) * stepX;
      const y = p ? p.y : startY + Math.floor(i / perRow) * stepY;
      const d = S.addDevice(h.guessType, x, y);
      d.name = h.hostname ? h.hostname.split('.')[0] : (h.ip || 'Unbekannt');
      d.ip = h.ip;
      d.mac = h.mac;
      d.hostname = h.hostname;
      d.manufacturer = h.vendor;
      d.os = h.os;
      d.status = h.observation ? h.observation.status : 'unknown';
      if (h.observation) d.observations = [U.clone(h.observation)];
      d.description = 'Automatisch erkannt (' + h.sources.join(', ') + ') — ' + h.guessReason +
        '. Zuverlässigkeit: ' + h.confidence + '.';
      if (h.ports && h.ports.length) {
        d.notes = 'Offene Ports: ' + h.ports.slice(0, 24)
          .map(p => p.port + '/' + p.proto + (p.service ? ' ' + p.service : '')).join(', ');
      }
      if (h.room) d.room = h.room;
      if (h.rack) d.rack = h.rack;
      created++;
      newIds.push(d.id);
      h.appliedId = d.id;
      h.existingId = d.id;
      h.state = 'bekannt';
    }));

    /* Verbindungen: erst die aus dem Scan abgeleiteten, dann echte
       Nachbarschaften aus LLDP/CDP, zuletzt gegen den Sammelpunkt. */
    let linked = 0;
    const result = lastResult || { links: [] };

    /* IP → Gerät: frisch angelegte und im Projekt vorhandene zusammen,
       sonst hängen Verbindungen zu bereits bekannten Geräten in der
       Luft. */
    const ipMap = {};
    P.devices.forEach(d => { if (d.ip) ipMap[String(d.ip).split('/')[0]] = d.id; });
    chosen.forEach(h => { if (h.ip && h.appliedId) ipMap[h.ip] = h.appliedId; });

    S.batch(() => {
    (result.ipLinks || []).forEach(l => {
      if (!l.selected) return;
      const from = ipMap[l.a], to = ipMap[l.b];
      if (!from || !to || from === to) return;
      if (S.connectionBetween && S.connectionBetween(from, to)) return;
      const c = S.addConnection(from, to, l.connType || 'logical');
      if (!c) return;
      c.description = (l.why || '') + ' Methode: ' + (l.methodLabel || l.method) +
        ', Zuverlässigkeit ' + Math.round((l.confidence || 0) * 100) + ' %.';
      c.observations = [{ at: (result.meta || {}).generated || result.at, source: 'Analyse', method: l.method,
        confidence: U.clamp(Number(l.confidence) || 0, 0, 1), status: 'observed' }];
      linked++;
    });

    (result.links || []).forEach(l => {
      const a = findDeviceByNameOrIp(l.remoteName, l.remoteIp);
      if (!a) return;
      const target = opts.connectTo ? S.dev(opts.connectTo) : null;
      if (!target || target.id === a.id) return;
      if (P.connections.some(c => c.source === target.id && c.target === a.id && c.sourcePort === (l.localPort || '') && c.targetPort === (l.remotePort || ''))) return;
      const c = S.addConnection(target.id, a.id, 'gigabit');
      if (c) {
        c.sourcePort = l.localPort || '';
        c.targetPort = l.remotePort || '';
        c.description = 'Aus ' + l.source + ' erkannt';
        linked++;
      }
    });

    if (opts.connectTo && S.dev(opts.connectTo)) {
      newIds.forEach(id => {
        if (S.connectionsOf(id).length) return;
        const c = S.addConnection(opts.connectTo, id, 'gigabit');
        if (c) {
          const h = chosen.find(x => x.appliedId === id);
          if (h && h.switchPort) { c.sourcePort = h.switchPort; if (h.switchVlan) c.vlan = h.switchVlan; }
          linked++;
        }
      });
    }
    });

    if (opts.createArea && newIds.length) {
      const rects = newIds.map(id => S.deviceRect(S.dev(id)));
      const minX = Math.min.apply(null, rects.map(r => r.x));
      const minY = Math.min.apply(null, rects.map(r => r.y));
      const maxX = Math.max.apply(null, rects.map(r => r.x + r.w));
      const maxY = Math.max.apply(null, rects.map(r => r.y + r.h));
      const a = S.addArea(minX - 34, minY - 50, (maxX - minX) + 68, (maxY - minY) + 84);
      a.label = 'Automatisch erkannt';
      a.sublabel = (result.subnets || []).join(' · ') + ' · ' + U.formatDate(result.at);
      a.color = '#0891b2';
    }

    S.reindex();
    S.touch();
    NWT.emit('change', { structural: true });
    if (newIds.length) { S.select(newIds); NWT.emit('selection'); }

    return { created: created, updated: updated, linked: linked, ids: newIds };
  }

  function findDeviceByNameOrIp(name, ip) {
    const devs = S.project.devices;
    if (ip) {
      const d = devs.find(x => (x.ip || '').split('/')[0] === ip);
      if (d) return d;
    }
    if (name) {
      const n = String(name).toLowerCase().split('.')[0];
      return devs.find(x => (x.hostname || '').toLowerCase().split('.')[0] === n ||
                            (x.name || '').toLowerCase() === n) || null;
    }
    return null;
  }

  function last() { return lastResult; }

  return {
    analyze, apply, classify, last, normMac, vendorFor,
    PORT_HINTS, NAME_HINTS, OUI
  };
})();


/* ======================= 21-dashboard.js ======================= */
/* ============================================================
   21 — Dashboard
   Zwei Ansichten in einem Vollbild-Overlay:
     „Übersicht“  — Auswertung des Projekts
     „Erkennung“  — Ergebnis der letzten Netzwerkanalyse mit
                    Auswahl und Übernahme ins Projekt
   ============================================================ */

NWT.Dashboard = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const C = NWT.Catalog;

  let overlay = null;
  let tab = 'overview';

  /* ------------------------------------------------------------ Gerüst */

  function ensure() {
    if (overlay) return overlay;
    overlay = document.createElement('div');
    overlay.id = 'dash-overlay';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-label', 'Dashboard');
    overlay.innerHTML =
      '<div class="dash">' +
        '<header class="dash-top">' +
          '<div class="dash-brand"><b>Dashboard</b><span id="dash-sub"></span></div>' +
          '<div class="dash-tabs">' +
            '<button type="button" class="dash-tab" data-tab="overview">Übersicht</button>' +
            '<button type="button" class="dash-tab" data-tab="discovery">Erkennung</button>' +
          '</div>' +
          '<button type="button" class="help-btn primary" data-dash-close>Schließen (Esc)</button>' +
        '</header>' +
        '<div class="dash-body"></div>' +
      '</div>';
    overlay.querySelector('[data-dash-close]').addEventListener('click', close);
    overlay.querySelectorAll('.dash-tab').forEach(b => {
      b.addEventListener('click', () => { tab = b.getAttribute('data-tab'); render(); });
    });
    overlay.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
    });
    document.body.appendChild(overlay);
    return overlay;
  }

  function open(which) {
    ensure();
    if (which) tab = which;
    overlay.classList.add('on');
    document.body.classList.add('help-open');
    NWT.Tooltip && NWT.Tooltip.hide();
    render();
    NWT.Focus.enter(overlay);
  }

  function close() {
    if (!overlay) return;
    overlay.classList.remove('on');
    document.body.classList.remove('help-open');
    NWT.Focus.leave(overlay);
  }

  function isOpen() { return !!overlay && overlay.classList.contains('on'); }

  function render() {
    if (!overlay) return;
    overlay.querySelectorAll('.dash-tab').forEach(b =>
      b.classList.toggle('on', b.getAttribute('data-tab') === tab));
    const body = overlay.querySelector('.dash-body');
    const sub = overlay.querySelector('#dash-sub');
    sub.textContent = S.project.name;
    body.innerHTML = tab === 'discovery' ? discoveryHtml() : overviewHtml();
    if (tab === 'discovery') wireDiscovery(body);
  }

  /* ------------------------------------------------------- Übersicht */

  function bar(label, value, max, color) {
    const pct = max > 0 ? Math.round(value / max * 100) : 0;
    return '<div class="bar-row">' +
      '<span class="bar-label">' + U.escapeHtml(label) + '</span>' +
      '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%;background:' +
        (color || '#2563eb') + '"></span></span>' +
      '<span class="bar-value">' + value + '</span>' +
    '</div>';
  }

  function card(title, inner, note) {
    return '<section class="dash-card"><h3>' + U.escapeHtml(title) + '</h3>' + inner +
      (note ? '<div class="dash-note">' + note + '</div>' : '') + '</section>';
  }

  function overviewHtml() {
    const P = S.project;
    const devs = P.devices.filter(d => C.shapeOf(d.type) === 'device');
    const total = devs.length;

    /* Kennzahlen */
    const img = NWT.Images.stats();
    const kpis = [
      ['Geräte', total],
      ['Verbindungen', P.connections.length],
      ['Bereiche', P.areas.length],
      ['Ebenen', P.layers.length],
      ['Fotos', img.count],
      ['Bilddaten', NWT.Images.formatBytes(img.bytes)]
    ];
    const kpiHtml = '<div class="kpi-row">' + kpis.map(k =>
      '<div class="kpi"><b>' + U.escapeHtml(String(k[1])) + '</b><span>' + U.escapeHtml(k[0]) + '</span></div>'
    ).join('') + '</div>';

    /* Kategorien */
    const byCat = {};
    devs.forEach(d => { const c = C.type(d.type).cat; byCat[c] = (byCat[c] || 0) + 1; });
    const maxCat = Math.max(1, ...Object.values(byCat));
    const catHtml = C.CATEGORIES.filter(c => byCat[c.id])
      .map(c => bar(c.label, byCat[c.id], maxCat, '#2563eb')).join('') ||
      '<div class="dash-empty">Noch keine Geräte.</div>';

    /* Status */
    const byStatus = {};
    devs.forEach(d => { byStatus[d.status || 'unknown'] = (byStatus[d.status || 'unknown'] || 0) + 1; });
    const maxSt = Math.max(1, ...Object.values(byStatus));
    const stHtml = Object.keys(C.STATUS).filter(k => byStatus[k])
      .map(k => bar(C.STATUS[k].label, byStatus[k], maxSt, C.STATUS[k].color)).join('') ||
      '<div class="dash-empty">Kein Status gesetzt.</div>';

    /* Subnetze */
    const subnets = {};
    devs.forEach(d => {
      const ip = (d.ip || '').split('/')[0];
      if (!/^(\d{1,3}\.){3}\d{1,3}$/.test(ip)) return;
      const key = ip.split('.').slice(0, 3).join('.') + '.0/24';
      (subnets[key] = subnets[key] || []).push(ip);
    });
    const subKeys = Object.keys(subnets).sort();
    const subHtml = subKeys.length
      ? '<table class="dash-table"><thead><tr><th>Netz</th><th>Adressen</th><th>Bereich</th></tr></thead><tbody>' +
        subKeys.map(k => {
          const list = subnets[k].map(ip => Number(ip.split('.')[3])).sort((a, b) => a - b);
          return '<tr><td>' + U.escapeHtml(k) + '</td><td>' + list.length + '</td><td>.' +
            list[0] + ' – .' + list[list.length - 1] + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '<div class="dash-empty">Keine IP-Adressen erfasst.</div>';

    /* VLANs */
    const vlans = {};
    devs.forEach(d => { if (d.vlan) vlans[d.vlan] = (vlans[d.vlan] || 0) + 1; });
    P.connections.forEach(c => { if (c.vlan) vlans[c.vlan] = (vlans[c.vlan] || 0) + 1; });
    const vlanHtml = Object.keys(vlans).length
      ? '<div class="chip-row">' + Object.keys(vlans).sort((a, b) => Number(a) - Number(b))
          .map(v => '<span class="chip">VLAN ' + U.escapeHtml(v) + ' <b>' + vlans[v] + '</b></span>').join('') + '</div>'
      : '<div class="dash-empty">Keine VLANs vergeben.</div>';

    /* Verbindungstypen */
    const byType = {};
    P.connections.forEach(c => { byType[c.type] = (byType[c.type] || 0) + 1; });
    const maxCt = Math.max(1, ...Object.values(byType));
    const ctHtml = Object.keys(byType).length
      ? Object.keys(byType).map(t => bar(C.connType(t).label, byType[t], maxCt, S.edgeStyle({ type: t }).color)).join('')
      : '<div class="dash-empty">Noch keine Verbindungen.</div>';

    /* Dokumentationsgrad */
    const missing = {
      'IP-Adresse': devs.filter(d => !d.ip).length,
      'Hostname': devs.filter(d => !d.hostname).length,
      'MAC-Adresse': devs.filter(d => !d.mac).length,
      'Standort/Raum': devs.filter(d => !d.room && !d.location).length,
      'Hersteller/Modell': devs.filter(d => !d.manufacturer && !d.model).length,
      'Foto': devs.filter(d => !d.image).length
    };
    const docHtml = total
      ? Object.keys(missing).map(k => {
          const done = total - missing[k];
          const pct = Math.round(done / total * 100);
          return '<div class="bar-row"><span class="bar-label">' + k + '</span>' +
            '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%;background:' +
            (pct > 80 ? '#16a34a' : pct > 40 ? '#f59e0b' : '#dc2626') + '"></span></span>' +
            '<span class="bar-value">' + pct + ' %</span></div>';
        }).join('')
      : '<div class="dash-empty">Noch keine Geräte.</div>';

    /* Isolierte Geräte */
    const lonely = devs.filter(d => !S.connectionsOf(d.id).length);
    const lonelyHtml = lonely.length
      ? '<div class="chip-row">' + lonely.slice(0, 24).map(d =>
          '<button type="button" class="chip chip-btn" data-goto="' + d.id + '">' +
          U.escapeHtml(U.truncate(d.name, 22)) + '</button>').join('') +
        (lonely.length > 24 ? '<span class="chip">… ' + (lonely.length - 24) + ' weitere</span>' : '') + '</div>'
      : '<div class="dash-empty">Alle Geräte sind verbunden.</div>';

    /* Modellbahn */
    const mb = devs.filter(d => C.type(d.type).cat === 'mobra');
    let mbHtml = '';
    if (mb.length) {
      const proto = {};
      mb.forEach(d => {
        (d.protocol || '').split(/[,;/]/).map(s => s.trim()).filter(Boolean)
          .forEach(p => { proto[p] = (proto[p] || 0) + 1; });
      });
      mbHtml = card('Modellbahn-Digitalkomponenten',
        '<div class="kpi-row small">' +
          '<div class="kpi"><b>' + mb.length + '</b><span>Komponenten</span></div>' +
          '<div class="kpi"><b>' + mb.filter(d => /^mb_(ecos|cs3|z21|intellibox|dr5000|mx10|tams|dccex)$/.test(d.type)).length +
            '</b><span>Zentralen</span></div>' +
          '<div class="kpi"><b>' + mb.filter(d => d.type === 'mb_booster').length + '</b><span>Booster</span></div>' +
          '<div class="kpi"><b>' + mb.filter(d => d.type === 'mb_feedback').length + '</b><span>Rückmelder</span></div>' +
        '</div>' +
        (Object.keys(proto).length
          ? '<div class="chip-row">' + Object.keys(proto).map(p =>
              '<span class="chip">' + U.escapeHtml(p) + ' <b>' + proto[p] + '</b></span>').join('') + '</div>'
          : '<div class="dash-note">Tipp: Feld <b>Protokoll / Bus</b> füllen (z.&nbsp;B. „DCC, mfx“), dann erscheint hier eine Auswertung.</div>'));
    }

    return '<div class="dash-inner">' +
      kpiHtml +
      '<div class="dash-grid">' +
        card('Geräte nach Kategorie', catHtml) +
        card('Betriebsstatus', stHtml) +
        card('IP-Netze', subHtml) +
        card('VLANs', vlanHtml) +
        card('Verbindungsarten', ctHtml) +
        card('Dokumentationsgrad', docHtml, 'Anteil der Geräte, bei denen das Feld gefüllt ist.') +
        card('Nicht verbundene Geräte', lonelyHtml, 'Klick springt zum Gerät.') +
        mbHtml +
      '</div>' +
    '</div>';
  }

  /* ------------------------------------------------------- Erkennung */

  function discoveryHtml() {
    const r = NWT.Discovery.last();
    if (!r) {
      return '<div class="dash-inner"><div class="dash-placeholder">' +
        '<h3>Noch keine Analyse durchgeführt</h3>' +
        '<p>Ein Browser darf aus Sicherheitsgründen selbst keine Netzwerkscans ausführen — ' +
        'kein ICMP, keine Rohsockets, kein Portscan. Deshalb liest dieses Programm die Ausgabe ' +
        'der Werkzeuge, die auf Ihrem Rechner schon vorhanden sind.</p>' +
        '<p>Zwei Wege:</p>' +
        '<ol>' +
          '<li><b>Analyse-Skript ausführen.</b> Das mitgelieferte Skript ermittelt erreichbare Hosts, ' +
          'MAC-Adressen, Namen und offene Ports und schreibt eine JSON-Datei, die hier eingelesen wird.</li>' +
          '<li><b>Ausgabe einfügen.</b> Führen Sie z.&nbsp;B. <code>arp -a</code>, ' +
          '<code>nmap -sn 192.168.1.0/24</code> oder <code>show lldp neighbors detail</code> aus und ' +
          'fügen Sie die Ausgabe ein.</li>' +
        '</ol>' +
        '<div class="dash-actions">' +
          '<button type="button" class="btn primary" data-dash-paste>Netzwerkdaten einlesen …</button>' +
          '<button type="button" class="btn" data-dash-script>Analyse-Skript anzeigen …</button>' +
        '</div>' +
      '</div></div>';
    }

    const neu = r.hosts.filter(h => h.state === 'neu').length;
    const known = r.hosts.length - neu;
    const withMac = r.hosts.filter(h => h.mac).length;
    const withPorts = r.hosts.filter(h => h.ports.length).length;

    const devOptions = S.project.devices
      .filter(d => C.shapeOf(d.type) === 'device')
      .map(d => '<option value="' + d.id + '">' + U.escapeHtml(U.truncate(d.name, 34)) + '</option>').join('');

    const rows = r.hosts.map((h, i) => {
      const t = C.type(h.guessType);
      return '<tr class="' + (h.state === 'neu' ? 'is-new' : 'is-known') + '">' +
        '<td><input type="checkbox" data-host="' + i + '"' + (h.selected ? ' checked' : '') + '></td>' +
        '<td class="mono">' + U.escapeHtml(h.ip || '—') + '</td>' +
        '<td class="mono">' + U.escapeHtml(h.mac || '—') + '</td>' +
        '<td>' + U.escapeHtml(h.hostname || '—') + '</td>' +
        '<td>' + U.escapeHtml(h.vendor || '—') + '</td>' +
        '<td><span class="type-chip" style="color:' + t.color + '">' + U.escapeHtml(t.label) + '</span>' +
          '<div class="why">' + U.escapeHtml(h.guessReason) + ' · ' + h.confidence + '</div></td>' +
        '<td class="mono small">' + (h.ports.length
            ? U.escapeHtml(h.ports.slice(0, 6).map(p => p.port + '/' + p.proto).join(' ')) +
              (h.ports.length > 6 ? ' +' + (h.ports.length - 6) : '')
            : '—') + '</td>' +
        '<td>' + (h.state === 'neu'
            ? '<span class="tag tag-new">neu</span>'
            : '<span class="tag tag-known">bekannt (' + U.escapeHtml(h.matchedBy) + ')</span>') + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="dash-inner">' +
      '<div class="kpi-row">' +
        '<div class="kpi"><b>' + r.hosts.length + '</b><span>Hosts gefunden</span></div>' +
        '<div class="kpi"><b>' + neu + '</b><span>neu</span></div>' +
        '<div class="kpi"><b>' + known + '</b><span>bereits im Projekt</span></div>' +
        '<div class="kpi"><b>' + withMac + '</b><span>mit MAC</span></div>' +
        '<div class="kpi"><b>' + withPorts + '</b><span>mit Portdaten</span></div>' +
        '<div class="kpi"><b>' + (r.subnets.length || '—') + '</b><span>Netze</span></div>' +
        '<div class="kpi"><b>' + ((r.ipLinks || []).length || '—') + '</b><span>Verbindungen</span></div>' +
      '</div>' +

      '<div class="dash-meta">' +
        'Quellen: <b>' + U.escapeHtml(r.sources.join(', ') || 'unbekannt') + '</b>' +
        (r.local.gateway ? ' · Gateway <b class="mono">' + U.escapeHtml(r.local.gateway) + '</b>' : '') +
        (r.subnets.length ? ' · Netze <b class="mono">' + U.escapeHtml(r.subnets.join(', ')) + '</b>' : '') +
        (r.links.length ? ' · ' + r.links.length + ' Nachbarschaften (LLDP/CDP)' : '') +
        (r.meta && r.meta.wifi ? ' · WLAN <b>' + U.escapeHtml(r.meta.wifi) + '</b>' : '') +
        (r.macTable.length ? ' · ' + r.macTable.length + ' Switchport-Zuordnungen' : '') +
        ' · Aufnahme: ' + U.formatDate(r.meta && r.meta.generated || r.at) + ' (keine Live-Überwachung)' +
      '</div>' +

      (r.warnings.length ? '<div class="dash-warn">' + r.warnings.map(U.escapeHtml).join('<br>') + '</div>' : '') +

      '<div class="dash-toolbar">' +
        '<button type="button" class="btn" data-sel="all">Alle</button>' +
        '<button type="button" class="btn" data-sel="none">Keine</button>' +
        '<button type="button" class="btn" data-sel="new">Nur neue</button>' +
        '<label class="dash-inline"><input type="checkbox" id="dash-area" checked> Bereich „Automatisch erkannt“ anlegen</label>' +
        '<label class="dash-inline"><input type="checkbox" id="dash-overwrite"> vorhandene Felder überschreiben</label>' +
        '<label class="dash-inline">Neue verbinden mit' +
          '<select id="dash-connect"><option value="">— nicht verbinden —</option>' + devOptions + '</select>' +
        '</label>' +
        '<span class="dash-spacer"></span>' +
        '<button type="button" class="btn" data-dash-paste>Weitere Daten einlesen …</button>' +
        '<button type="button" class="btn primary" data-dash-apply>Auswahl übernehmen</button>' +
      '</div>' +

      '<div class="dash-tablewrap"><table class="dash-table wide">' +
        '<thead><tr><th></th><th>IP</th><th>MAC</th><th>Hostname</th><th>Hersteller</th>' +
        '<th>Typ-Vorschlag</th><th>Offene Ports</th><th>Status</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>' +

      linkTableHtml(r) +

      '<div class="dash-note">Die Typ-Vorschläge sind Heuristiken aus Portnummern, Hostnamen und ' +
      'Herstellerkennungen — bitte vor der Übernahme prüfen. Nach dem Übernehmen lässt sich alles ' +
      'mit <b>Strg+Z</b> in einem Schritt zurücknehmen.</div>' +
    '</div>';
  }

  /**
   * Verbindungsvorschläge aus dem Analyse-Skript. Sie stehen bewusst
   * in einer eigenen Liste mit Methode und Zuverlässigkeit: welches
   * Kabel wo steckt, weiß ohne Auskunft der Switches niemand, und
   * eine falsche Leitung im Plan ist schlimmer als gar keine.
   */
  function linkTableHtml(r) {
    const links = r.ipLinks || [];
    if (!links.length) return '';
    const rows = links.map((l, i) => {
      const ct = C.connType(l.connType || 'logical');
      const pct = Math.round((l.confidence || 0) * 100);
      return '<tr>' +
        '<td><input type="checkbox" data-link="' + i + '"' + (l.selected ? ' checked' : '') + '></td>' +
        '<td class="mono">' + U.escapeHtml(l.a) + '<div class="why">' + U.escapeHtml(l.aName || '') + '</div></td>' +
        '<td class="mono">' + U.escapeHtml(l.b) + '<div class="why">' + U.escapeHtml(l.bName || '') + '</div></td>' +
        '<td><span class="type-chip" style="color:' + ct.color + '">' + U.escapeHtml(ct.label) + '</span></td>' +
        '<td>' + U.escapeHtml(l.methodLabel || l.method) + '<div class="why">' + pct + ' %</div></td>' +
        '<td class="small">' + U.escapeHtml(l.why || '') + '</td>' +
      '</tr>';
    }).join('');

    return '<h3 class="dash-subhead">Erkannte Verbindungen</h3>' +
      '<div class="dash-toolbar">' +
        '<button type="button" class="btn" data-lsel="all">Alle</button>' +
        '<button type="button" class="btn" data-lsel="none">Keine</button>' +
        '<span class="dash-spacer"></span>' +
        (r.ipLinksDropped ? '<span class="dash-inline">' + r.ipLinksDropped +
          ' schwächere Ableitung(en) für dieselben Geräte ausgelassen</span>' : '') +
      '</div>' +
      '<div class="dash-tablewrap"><table class="dash-table wide">' +
        '<thead><tr><th></th><th>von</th><th>nach</th><th>Leitungsart</th>' +
        '<th>Methode</th><th>Begründung</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>' +
      '<div class="dash-note">Ohne Auskunft der Switches (SNMP, LLDP) lässt sich nicht feststellen, ' +
      'welches Kabel wo steckt. Diese Verbindungen sind daher als <b>logische Verbindung</b> ' +
      'eingetragen — grau gestrichelt. Wo Sie es besser wissen, ändern Sie die Leitungsart ' +
      'hinterher per Doppelklick.</div>';
  }

  function wireDiscovery(body) {
    const r = NWT.Discovery.last();

    body.querySelectorAll('[data-dash-paste]').forEach(b =>
      b.addEventListener('click', () => NWT.Analysis.pasteDialog()));
    body.querySelectorAll('[data-dash-script]').forEach(b =>
      b.addEventListener('click', () => NWT.Analysis.showScript()));
    body.querySelectorAll('[data-goto]').forEach(b =>
      b.addEventListener('click', () => {
        close();
        NWT.Commands.focusDevice(b.getAttribute('data-goto'));
      }));

    if (!r) return;

    body.querySelectorAll('[data-host]').forEach(cb => {
      cb.addEventListener('change', () => {
        const h = r.hosts[Number(cb.getAttribute('data-host'))];
        if (h) h.selected = cb.checked;
      });
    });

    body.querySelectorAll('[data-link]').forEach(cb => {
      cb.addEventListener('change', () => {
        const l = (r.ipLinks || [])[Number(cb.getAttribute('data-link'))];
        if (l) l.selected = cb.checked;
      });
    });

    body.querySelectorAll('[data-lsel]').forEach(btn => {
      btn.addEventListener('click', () => {
        const on = btn.getAttribute('data-lsel') === 'all';
        (r.ipLinks || []).forEach(l => { l.selected = on; });
        render();
      });
    });

    body.querySelectorAll('[data-sel]').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.getAttribute('data-sel');
        r.hosts.forEach(h => {
          h.selected = mode === 'all' ? true : mode === 'none' ? false : h.state === 'neu';
        });
        render();
      });
    });

    const applyBtn = body.querySelector('[data-dash-apply]');
    if (applyBtn) applyBtn.addEventListener('click', () => {
      const opts = {
        createArea: body.querySelector('#dash-area').checked,
        overwrite: body.querySelector('#dash-overwrite').checked,
        connectTo: body.querySelector('#dash-connect').value
      };
      const res = NWT.Discovery.apply(r.hosts, opts);
      if (!res.created && !res.updated) {
        U.toast('Nichts ausgewählt — es wurde nichts übernommen.', 'warn');
        return;
      }
      close();
      NWT.Viewport.zoomToFit();
      U.toast(res.created + ' Gerät(e) angelegt, ' + res.updated + ' aktualisiert' +
        (res.linked ? ', ' + res.linked + ' Verbindung(en)' : ''), 'ok', 5000);
    });
  }

  /* Nach einer Analyse automatisch die Erkennungsansicht zeigen. */
  NWT.on('discovery', () => open('discovery'));
  NWT.on('change', () => { if (isOpen() && tab === 'overview') render(); });

  return { open, close, isOpen, render };
})();


/* ======================= 22-analysis.js ======================= */
/* ============================================================
   22 — Bedienung der Netzwerkanalyse
   Einlesedialog, Dateiimport und Anzeige der Analyse-Skripte.
   ============================================================ */

NWT.Analysis = (function () {
  const U = NWT.Util;
