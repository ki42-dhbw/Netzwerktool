ich. Mehrere Verbindungen zwischen\ndemselben Gerätepaar sind ausdrücklich erlaubt — etwa für Link Aggregation.\n<\/div>\n\n<h3 id=\"k5-2\">5.2 Verbindungsarten<\/h3>\n<p>Ein Netzplan besteht selten nur aus Ethernet. Die Verbindungsarten sind deshalb in sieben\nGruppen gegliedert; die Auswahlliste im Verbindungsdialog zeigt sie als aufklappbare Blöcke.<\/p>\n\n<table>\n<thead><tr><th>Gruppe<\/th><th>Enthält<\/th><th>Darstellung<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Netzwerk<\/td>\n    <td>Ethernet, Gigabit, 2.5/10/25/40/100 Gbit, Glasfaser, WAN, VPN<\/td>\n    <td>Blau über Violett nach Magenta, mit der Geschwindigkeit zunehmend kräftiger<\/td><\/tr>\n<tr><td>Funk<\/td>\n    <td>WLAN, Bluetooth, Zigbee, LoRaWAN, Mobilfunk, DECT<\/td>\n    <td>Türkistöne, <strong>durchweg gestrichelt<\/strong> — Kabel und Funk bleiben so auf einen Blick unterscheidbar<\/td><\/tr>\n<tr><td>Peripherie<\/td>\n    <td>USB 2.0/3.x/USB4, HDMI, DisplayPort, RS-232, RS-485, SAS, Fibre Channel, KVM<\/td>\n    <td>Bernstein- und Brauntöne<\/td><\/tr>\n<tr><td>Feldbus &amp; Industrie<\/td>\n    <td>CAN, PROFINET, PROFIBUS DP, Modbus RTU/TCP, KNX, DALI, M-Bus, IO-Link<\/td>\n    <td>Grün- und Olivtöne<\/td><\/tr>\n<tr><td>Modellbahn<\/td>\n    <td>Gleisanschluss, Booster (CDE), LocoNet, XpressNet, S88, CAN, ECoSlink<\/td>\n    <td>Rot- und Rosétöne, Gleisanschluss betont kräftig<\/td><\/tr>\n<tr><td>Strom<\/td>\n    <td>230 V AC, 24 V DC, PoE, USV-Versorgung<\/td>\n    <td>Deutlich dicker als Datenleitungen; 230 V und USV zusätzlich als Strich-Punkt<\/td><\/tr>\n<tr><td>Sonstiges<\/td>\n    <td>Logische Verbindung, Benutzerdefiniert<\/td>\n    <td>Grau gestrichelt<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<p>Beim Typwechsel wird die Geschwindigkeit automatisch nachgeführt, solange Sie sie nicht von\nHand überschrieben haben. Das Feld heißt <span class=\"ui\">Geschwindigkeit / Kennwert<\/span> und\nnimmt auch andere Angaben auf — bei einer PoE-Leitung etwa „30 W“, bei PROFIBUS „bis 12 Mbit/s“.<\/p>\n\n<div class=\"note\">\nStandardgeschwindigkeiten sind Vorschläge und dort eingetragen, wo es einen belegten Wert gibt\n— etwa 480 Mbit/s bei USB 2.0 oder 9600 Baud bei KNX. Wo die Bandbreite von Version und Aufbau\nabhängt, bleibt das Feld leer statt geraten. Tragen Sie dort ein, was bei Ihnen tatsächlich läuft.\n<\/div>\n\n<h3 id=\"k5-3\">5.3 Farbe, Linienstärke und Strichmuster<\/h3>\n<p>Jede Verbindungsart bringt eine Darstellung mit, die Sie an zwei Stellen ändern können. Die\nReihenfolge bestimmt, was gilt — die erste zutreffende Ebene gewinnt:<\/p>\n\n<ol class=\"steps\">\n<li><strong>Diese eine Leitung<\/strong> — im Verbindungsdialog unter\n    <span class=\"ui\">Darstellung dieser Verbindung<\/span>. Für die Ausnahme: eine Leitung, die\n    im Plan auffallen soll.<\/li>\n<li><strong>Dieser Typ im ganzen Projekt<\/strong> — auf der Einstellungsseite unter\n    <span class=\"ui\">Verbindungsarten<\/span>. Für die Regel: alle USB-Leitungen violett, einmal\n    eingestellt.<\/li>\n<li><strong>Auslieferungszustand<\/strong> — die Vorgabe aus der Tabelle oben.<\/li>\n<\/ol>\n\n<p>Einstellbar sind:<\/p>\n<table>\n<tbody>\n<tr><td>Farbe<\/td><td>freier Farbwähler<\/td><\/tr>\n<tr><td>Linienstärke<\/td><td>0,5 bis 12 Pixel<\/td><\/tr>\n<tr><td>Strichmuster<\/td><td>durchgezogen, gestrichelt, gepunktet, Strich-Punkt, lang gestrichelt<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<p>Der Verbindungsdialog zeigt eine <strong>Vorschaulinie<\/strong>, die sich beim Ändern sofort\nmitzeichnet. Die Schaltfläche <span class=\"ui\">Darstellung zurücksetzen<\/span> löst die Leitung\nwieder von ihrer Sonderbehandlung; sie folgt dann erneut ihrem Typ. Schneller geht es über\nRechtsklick auf die Leitung → <span class=\"ui\">Darstellung ändern …<\/span>.<\/p>\n\n<p>Auf der Einstellungsseite sind alle Arten nach Gruppen aufgelistet, jede mit Vorschaulinie,\nFarbfeld, Stärke und Muster. Geänderte Arten sind hervorgehoben und lassen sich einzeln über\n<span class=\"ui\">↺<\/span> oder gesammelt zurücksetzen. Beides gehört zum Projekt und reist mit\neiner exportierten JSON-Datei mit.<\/p>\n\n<div class=\"note\">\nFreie Strichmuster per Zahleneingabe gibt es bewusst nicht. Fünf Muster decken jeden lesbaren\nNetzplan ab; mehr Auswahl führt erfahrungsgemäß nur zu Diagrammen, die niemand mehr entziffert.\n<\/div>\n<h3 id=\"k5-4\">5.4 Eigenschaften und Portbelegung<\/h3>\n<p>Ein Doppelklick auf eine Leitung öffnet deren Eigenschaften. Neben Beschriftung, Typ,\nGeschwindigkeit und VLAN wählen Sie hier <strong>Port Quelle<\/strong> und\n<strong>Port Ziel<\/strong> aus den Portlisten der beteiligten Geräte aus. Die gewählten\nPorts erscheinen als kleine graue Beschriftung direkt an den Leitungsenden.<\/p>\n\n<p>Damit dokumentieren Sie eine Patchung vollständig:<\/p>\n<pre>Switch01  Port 5   →   Server01  eth0\n1 Gbit/s · VLAN 20<\/pre>\n\n<p>Die Schaltfläche <span class=\"ui\">Richtung tauschen<\/span> vertauscht Quelle und Ziel\nsamt Ports — nützlich, wenn Sie beim Zeichnen in der falschen Richtung angesetzt haben.<\/p>\n\n<p>Auf der Zeichenfläche zeigt die Leitung standardmäßig ihre Geschwindigkeit an; sobald Sie\neine <strong>Beschriftung<\/strong> eintragen, tritt diese an die Stelle. Ist ein VLAN\ngesetzt, erscheint es als zweite Zeile.<\/p>\n\n<h3 id=\"k5-5\">5.5 Linienführung<\/h3>\n<p>Die Auswahlliste in der Werkzeugleiste stellt die Führung aller Leitungen um:<\/p>\n<ul>\n<li><strong>Orthogonal<\/strong> — rechtwinklige Linien mit abgerundeten Ecken. Die Standardeinstellung und die übliche Darstellung in Netzplänen.<\/li>\n<li><strong>Gerade<\/strong> — direkte Verbindungslinie zwischen den Kachelrändern.<\/li>\n<li><strong>Gebogen<\/strong> — weiche Kurven; übersichtlich bei vielen sich kreuzenden Leitungen.<\/li>\n<\/ul>\n<p>Die Endpunkte liegen in jedem Modus exakt auf dem Rand der Gerätekachel, nicht in deren Mitte.<\/p>\n\n<h3 id=\"k5-6\">5.6 Knoten: die Führung selbst bestimmen<\/h3>\n<p class=\"lead\">Normalerweise sucht sich eine Leitung ihren Weg selbst. Wo das Ergebnis nicht\npasst — weil die Linie quer über eine Gerätekachel läuft oder sich mit drei anderen kreuzt —\nsetzen Sie Knoten, an denen sie entlanggeführt wird.<\/p>\n\n<ol class=\"steps\">\n<li>Rechtsklick auf die Leitung an der Stelle, wo der Knick sitzen soll.<\/li>\n<li><span class=\"ui\">Knoten hier einfügen<\/span>.<\/li>\n<li>Der Knoten sitzt jetzt im richtigen Abschnitt. Solange die Leitung ausgewählt ist, zeigen\n    kleine Quadrate alle Knoten — ziehen Sie sie mit der Maus.<\/li>\n<\/ol>\n<p>Ein <strong>Doppelklick auf ein Quadrat<\/strong> entfernt diesen Knoten.\n<span class=\"ui\">Alle Knoten entfernen<\/span> im Kontextmenü stellt die automatische Führung\nwieder her; dasselbe geht im Eigenschaftendialog unter <span class=\"ui\">Führung<\/span>.<\/p>\n\n<p>Die Knoten gelten für alle drei Linienführungen: bei <em>orthogonal<\/em> entsteht zwischen\nzwei Knoten ein rechtwinkliger Weg, bei <em>gerade<\/em> eine direkte Strecke, bei\n<em>gebogen<\/em> ein weicher Bogen. Bei aktivem Snap rasten die Knoten am Raster ein.<\/p>\n<div class=\"note\">\nEine Leitung mit eigenen Knoten wird <strong>nicht<\/strong> mehr gegen parallele Leitungen\nversetzt. Wer die Führung selbst bestimmt, will sie genau so — und nicht um ein paar Pixel\nverschoben. Mehr als 40 Knoten je Leitung sind nicht vorgesehen.\n<\/div>\n\n<h3 id=\"k5-7\">5.7 Abzweige<\/h3>\n<p class=\"lead\">Ein Abzweig ist ein Punkt, an dem sich eine Leitung teilt: die Abzweigdose im\nKabelkanal, der T-Verteiler am Bus, die Stelle, an der drei Kabel in einem Kanal\nzusammenlaufen. Er ist ein eigenes Objekt und kein Gerät.<\/p>\n\n<ol class=\"steps\">\n<li>Rechtsklick auf die Leitung an der Abzweigstelle.<\/li>\n<li><span class=\"ui\">Abzweig hier einfügen<\/span>. Die Leitung wird dort geteilt; an der\n    Stelle sitzt nun ein Punkt in der Leitungsfarbe.<\/li>\n<li><span class=\"ui\">Verbinden<\/span> anklicken, dann den Abzweig und das Ziel — schon hängt\n    der dritte Strang daran.<\/li>\n<\/ol>\n<p>Die beiden Hälften erben Art, Farbe, Geschwindigkeit, VLAN und Ebene der geteilten Leitung.\nEin Abzweig ändert die Leitung nicht, er unterbricht sie nur. Alternativ ziehen Sie\n<span class=\"ui\">Abzweig / Knotenpunkt<\/span> aus der Seitenleiste und verbinden von Hand.<\/p>\n\n<h4>Was ein Abzweig nicht ist<\/h4>\n<ul>\n<li><strong>Kein Gerät.<\/strong> Die Statusleiste zählt Abzweige getrennt, und das Dashboard\n    lässt sie aus der Geräteauswertung heraus. Ein T-Stück ist keine Komponente Ihres Netzes.<\/li>\n<li><strong>Kein Switch.<\/strong> Wo tatsächlich ein Gerät sitzt, gehört auch eines in den\n    Plan — mit IP, Ports und allem, was dazugehört. Der Abzweig ist für die Stellen gedacht,\n    an denen nichts steht außer einer Klemme oder einer Dose.<\/li>\n<\/ul>\n<p>Ein Abzweig hat einen kurzen Eigenschaftendialog: Bezeichnung und Bemerkung — etwa\n„Abzweigdose Kabelkanal Nord“ — sowie die Ebene. Auf der Zeichenfläche bleibt er ein Punkt;\ndie Bezeichnung finden Sie über die Suche und im Hinweisfenster.<\/p>\n\n<div class=\"note\">\n<strong>Knoten oder Abzweig?<\/strong> Ein <em>Knoten<\/em> ändert nur den Weg der Linie —\ner ist Darstellung. Ein <em>Abzweig<\/em> teilt die Leitung wirklich in zwei und lässt weitere\ndaran andocken — er ist Inhalt. Wenn Sie unsicher sind: Soll dort etwas abgehen? Dann\nAbzweig. Soll die Linie nur woanders langlaufen? Dann Knoten.\n<\/div>\n\n<h3 id=\"k5-8\">5.8 Parallele Verbindungen<\/h3>\n<p>Führen mehrere Leitungen zwischen denselben zwei Geräten, werden sie automatisch\ngegeneinander versetzt gezeichnet, statt sich zu überdecken. So bleiben etwa vier gebündelte\n10-Gbit-Leitungen einzeln erkennbar und anklickbar.<\/p>\n\n<h3 id=\"k5-9\">5.9 Auswählen und Löschen<\/h3>\n<p>Leitungen sind über einen unsichtbaren, deutlich breiteren Klickbereich erreichbar — Sie\nmüssen die dünne Linie nicht exakt treffen. Ein Klick markiert, <kbd>Entf<\/kbd> löscht.\nÜber das Kontextmenü lassen sich Beschriftung und Verbindungstyp auch ohne den vollen\nEigenschaftendialog schnell ändern.<\/p>\n<\/section>\n\n\n<section id=\"bereiche\">\n<h2 id=\"k6\">6. Bereiche, Text und Grafik<\/h2>\n\n<p>Netzwerkbereiche sind beschriftete, farbig hinterlegte Rechtecke — für Gebäude,\nServerräume, Produktionshallen, DMZ, VLAN-Zonen, Außenstellen oder Cloud-Umgebungen.\nGruppierung und Netzbereich sind dasselbe Werkzeug.<\/p>\n\n<h3 id=\"k6-1\">6.1 Bereich anlegen<\/h3>\n<p>Markieren Sie die zusammengehörenden Geräte und drücken Sie <kbd>Strg<\/kbd>+<kbd>G<\/kbd>.\nDer Bereich legt sich passend um die Auswahl, und der Eigenschaftendialog öffnet sich\nsofort. Ohne Auswahl entsteht ein leerer Bereich in der Bildmitte, den Sie anschließend\npositionieren.<\/p>\n\n<h3 id=\"k6-2\">6.2 Beschriftung<\/h3>\n<p>Ein Bereich hat zwei Textzeilen: eine <strong>Bezeichnung<\/strong> („Serverraum“) und\neinen <strong>Zusatz<\/strong> für die technische Angabe („192.168.10.0/24 · VLAN 10“).\nÜber die Farbwahl unterscheiden Sie Zonen optisch — etwa Rot für die DMZ, Violett für den\nServerraum, Grün für die Außenstelle.<\/p>\n\n<h3 id=\"k6-3\">6.3 Verschieben und Größe ändern<\/h3>\n<p>Ein Bereich wird an seinem Titelbereich oder an der Rahmenlinie gezogen — die Fläche\nselbst bleibt durchlässig, damit Sie die Geräte darin normal anklicken können.<\/p>\n<div class=\"note\">\n<strong>Nützlich:<\/strong> Beim Verschieben eines Bereichs wandern alle Geräte mit, deren\nMittelpunkt innerhalb liegt. So verschieben Sie einen kompletten Serverraum als Einheit.\n<\/div>\n<p>Ist der Bereich markiert, erscheint unten rechts ein kleiner Anfasser zum Ändern der\nGröße. Bei aktivem Snap rastet auch dieser am Raster ein.<\/p>\n\n<h3 id=\"k6-4\">6.4 Text, Grafik und Dekoration<\/h3>\n<p class=\"lead\">Unter <span class=\"ui\">Text &amp; Grafik<\/span> in der linken Leiste liegen\nBausteine, die kein Netzobjekt sind: Beschriftungen, Notizen und einfache Formen. Sie ziehen\nsie genauso auf die Fläche wie ein Gerät.<\/p>\n<table>\n<thead><tr><th>Baustein<\/th><th>Wofür<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Textfeld<\/b><\/td><td>eine einzelne Zeile — Standortname, Etagenbezeichnung, Überschrift<\/td><\/tr>\n<tr><td><b>Freie Notiz<\/b><\/td><td>gelber Zettel mit mehrzeiligem Text für Hinweise und offene Punkte<\/td><\/tr>\n<tr><td><b>Rahmen<\/b>, <b>Rahmen abgerundet<\/b><\/td><td>Rechtecke, um Zusammengehörendes optisch zu fassen<\/td><\/tr>\n<tr><td><b>Kreis<\/b>, <b>Ellipse<\/b><\/td><td>etwas hervorheben, ohne es einzurahmen<\/td><\/tr>\n<tr><td><b>Raute<\/b>, <b>Dreieck<\/b>, <b>Sechseck<\/b>, <b>Stern<\/b><\/td><td>Entscheidungspunkte, Warnhinweise, Markierungen<\/td><\/tr>\n<tr><td><b>Linie<\/b>, <b>Pfeil<\/b>, <b>Doppelpfeil<\/b><\/td><td>Trennlinien und Verweise, die keine Leitung sind<\/td><\/tr>\n<tr><td><b>Geschweifte Klammer<\/b><\/td><td>fasst mehrere Zeilen oder Geräte zu einer Erläuterung zusammen<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"note\">\n<strong>Rahmen oder Bereich?<\/strong> Ein <em>Bereich<\/em> ist eine Zone Ihres Netzes: er hat\nBezeichnung und Netzangabe, nimmt Geräte beim Verschieben mit und zählt im Dashboard. Ein\n<em>Rahmen<\/em> ist reine Grafik. Für „Serverraum“ nehmen Sie den Bereich, für „hier fehlt\nnoch die Abnahme“ die Grafik.\n<\/div>\n\n<h3 id=\"k6-5\">6.5 Form und Farbe einstellen<\/h3>\n<p>Ein Doppelklick öffnet den Dialog <span class=\"ui\">Grafikelement<\/span>. Dort stellen Sie\nein:<\/p>\n<table>\n<tbody>\n<tr><td>Figur<\/td><td>Die Form lässt sich jederzeit wechseln — aus einem Rahmen wird ein Kreis, ohne ihn neu zu ziehen.<\/td><\/tr>\n<tr><td>Beschriftung<\/td><td>steht bei geschlossenen Formen mittig darin, bei Linien und Pfeilen darüber. Bleibt leer, wenn nichts hineingehört.<\/td><\/tr>\n<tr><td>Breite, Höhe<\/td><td>auf den Punkt genau. Schneller geht es mit dem Anfasser unten rechts, solange das Element markiert ist.<\/td><\/tr>\n<tr><td>Drehung<\/td><td>in Grad, um die Mitte. Für eine senkrechte Linie oder einen Pfeil nach unten: 90.<\/td><\/tr>\n<tr><td>Linienfarbe, ‑stärke, Strichmuster<\/td><td>dieselben fünf Muster wie bei Leitungen — durchgezogen bis Strich-Punkt.<\/td><\/tr>\n<tr><td>Fläche füllen<\/td><td>nur bei geschlossenen Formen. Linie, Pfeil und Klammer bleiben immer ungefüllt; eine Füllung ergäbe dort einen Klecks.<\/td><\/tr>\n<tr><td>Deckkraft<\/td><td>Werte unter 1 legen die Fläche wie eine Folie über den Plan — gut, um eine Zone einzufärben, ohne etwas zu verdecken.<\/td><\/tr>\n<tr><td>Im Vordergrund<\/td><td>siehe unten.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Die Vorschlagsfarben sind bewusst mitteltonig gewählt: sie tragen im hellen wie im dunklen\nDesign. Eine sehr helle oder sehr dunkle eigene Farbe kann nach dem Designwechsel\nverschwinden — das gilt für Grafik genauso wie für Bereichsfarben.<\/p>\n\n<h3 id=\"k6-6\">6.6 Vorn oder hinten<\/h3>\n<p>Grafikelemente liegen standardmäßig <strong>hinter<\/strong> Geräten und Leitungen. Ein\nRahmen um eine Gerätegruppe verdeckt also nichts, auch wenn Sie ihn füllen. Neue Formen sind\nzusätzlich ungefüllt — beides zusammen sorgt dafür, dass Dekoration nie im Weg steht.<\/p>\n<p>Soll ein Element darüber liegen — etwa ein Pfeil, der auf ein Gerät zeigt, oder eine\nMarkierung für eine Besprechung —, setzen Sie im Dialog den Haken\n<span class=\"ui\">Im Vordergrund<\/span>.<\/p>\n\n<h3 id=\"k6-7\">6.7 Was Dekoration nicht ist<\/h3>\n<p>Grafikelemente sind keine Netzobjekte. Daraus folgt:<\/p>\n<ul>\n<li>Sie lassen sich <strong>nicht verbinden<\/strong> — der Verbindungsmodus weist sie ab.<\/li>\n<li>Sie haben keine Ports, keine IP, keinen Status.<\/li>\n<li>Sie zählen nicht als Gerät. Die Statusleiste führt sie getrennt als\n    <span class=\"ui\">Text/Grafik<\/span>, und das Dashboard lässt sie aus der Auswertung heraus.<\/li>\n<\/ul>\n<p>Alles Übrige verhält sich wie gewohnt: markieren, verschieben, kopieren, duplizieren,\nEbenen zuordnen, ein- und ausblenden. Sie werden mit dem Projekt gespeichert und\nmitexportiert.<\/p>\n\n<h3 id=\"k6-8\">6.8 Schrift einstellen<\/h3>\n<p class=\"lead\">Textfeld, Notiz und die Beschriftung eines Grafikelements tragen dieselben\nSchrifteinstellungen. Ein Doppelklick öffnet den passenden Dialog.<\/p>\n<table>\n<tbody>\n<tr><td>Schriftart<\/td><td>Vier Auswahlmöglichkeiten: serifenlos (Standard), Serifen, feste Breite, schmal.<\/td><\/tr>\n<tr><td>Schriftgröße<\/td><td>6 bis 200 Pixel. Ein Textfeld wächst dabei mit; die Notiz behält ihre Größe und bricht neu um.<\/td><\/tr>\n<tr><td>Schriftfarbe<\/td><td>Nur wirksam, wenn <span class=\"ui\">eigene Schriftfarbe verwenden<\/span> angehakt ist — siehe unten.<\/td><\/tr>\n<tr><td>Fett, Kursiv<\/td><td>frei kombinierbar<\/td><\/tr>\n<tr><td>Ausrichtung<\/td><td>linksbündig, zentriert, rechtsbündig<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"note\">\n<strong>Warum die Schriftfarbe einen Haken hat.<\/strong> Ohne eigene Farbe folgt die Schrift\ndem Design: im hellen Design dunkel, im dunklen Design hell. Setzen Sie eine feste Farbe,\ngilt sie in beiden — schwarze Schrift bleibt dann auch auf schwarzem Grund schwarz. Der Haken\nmacht diese Entscheidung sichtbar, statt sie im Farbwähler zu verstecken.\n<\/div>\n\n<h4>Welche Schriften zur Auswahl stehen<\/h4>\n<p>Es sind <strong>Systemschriften<\/strong> mit Rückfallkette, keine mitgelieferten\nSchriftdateien. Das hat zwei Gründe: Eine Schriftdatei würde die Programmdatei um ein\nVielfaches vergrößern, und die Lizenzen der meisten Schriften erlauben die Weitergabe in\neiner fremden Datei nicht. Ein Verweis auf eine Schrift im Netz scheidet aus, weil das\nProgramm offline läuft.<\/p>\n<p>Praktisch heißt das: Auf einem Rechner ohne Georgia zeigt „Serifen“ eine andere\nSerifenschrift. Das Schriftbild ändert sich, die Aussage nicht. In SVG- und PNG-Export wird\ndie Angabe mitgeschrieben; beim PNG ist das Ergebnis fest, beim SVG entscheidet der Rechner\ndes Empfängers.<\/p>\n\n<h4>Textfeld und Notiz im Vergleich<\/h4>\n<table>\n<thead><tr><th><\/th><th>Textfeld<\/th><th>Freie Notiz<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Zeilen<\/td><td>eine<\/td><td>mehrere, mit automatischem Umbruch<\/td><\/tr>\n<tr><td>Größe<\/td><td>folgt dem Text — kein Anfasser nötig<\/td><td>Sie bestimmen sie, per Anfasser oder im Dialog<\/td><\/tr>\n<tr><td>Wenn der Platz nicht reicht<\/td><td>kommt nicht vor<\/td><td>der Rest wird abgeschnitten und mit „…“ gekennzeichnet<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Reicht der Platz auf einem Zettel nicht, vergrößern Sie ihn oder verkleinern die Schrift —\ndas „…“ am Ende sagt Ihnen, dass da noch etwas steht.<\/p>\n\n<\/section>\n\n\n<section id=\"ebenen\">\n<h2 id=\"k7\">7. Ebenen<\/h2>\n\n<p>Ebenen trennen verschiedene Sichten auf dasselbe Netz. Sechs sind voreingestellt:\nPhysisches Netzwerk, Logisches Netzwerk, VLAN, WLAN, Server und IoT. Eigene Ebenen legen\nSie mit <span class=\"ui\">+<\/span> im Ebenenbereich an.<\/p>\n\n<p>Jedes Gerät, jede Verbindung und jeder Bereich liegt auf genau einer Ebene. Ausgeblendete\nEbenen verschwinden vollständig aus der Darstellung — samt der Leitungen, die zu ihren\nGeräten führen. Sie bleiben aber im Projekt und im Export erhalten.<\/p>\n\n<p>Typische Anwendungen:<\/p>\n<ul>\n<li>Verkabelung auf „Physisches Netzwerk“, VLAN-Struktur auf „VLAN“ — beim Präsentieren\n    blenden Sie jeweils nur eine Sicht ein.<\/li>\n<li>Geplanter Ausbau auf einer Ebene „Planung 2027“, die im Normalbetrieb ausgeblendet bleibt.<\/li>\n<li>Getrennte Ebenen je Gebäude bei großen Liegenschaften.<\/li>\n<\/ul>\n\n<p>Beim Löschen einer Ebene werden ihre Objekte nicht entfernt, sondern auf die erste\nverbleibende Ebene verschoben. Der Dialog nennt vorher die betroffene Anzahl. Die letzte\nverbleibende Ebene lässt sich nicht löschen.<\/p>\n<\/section>\n\n\n<section id=\"navigation\">\n<h2 id=\"k8\">8. Navigieren in großen Plänen<\/h2>\n\n<h3 id=\"k8-1\">8.1 Zoomen<\/h3>\n<table>\n<tbody>\n<tr><td><kbd>Strg<\/kbd> + Mausrad<\/td><td>Stufenlos zoomen. Der Punkt unter dem Mauszeiger bleibt exakt stehen.<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>+<\/kbd> / <kbd>Strg<\/kbd>+<kbd>−<\/kbd><\/td><td>In Stufen zoomen<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>0<\/kbd><\/td><td>Zurück auf 100&nbsp;%<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>1<\/kbd><\/td><td>Alles einpassen<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Der Zoombereich reicht von 15&nbsp;% bis 500&nbsp;%. Leitungsstärken und Rasterlinien\nbleiben dabei optisch konstant.<\/p>\n\n<h3 id=\"k8-2\">8.2 Ausschnitt verschieben<\/h3>\n<ul>\n<li><strong>Mausrad<\/strong> — vertikal, mit <kbd>Umschalt<\/kbd> horizontal<\/li>\n<li><strong>Mittlere Maustaste<\/strong> — ziehen, jederzeit und in jedem Modus<\/li>\n<li><strong>Leertaste + Ziehen<\/strong> — wie das Hand-Werkzeug, ohne den Modus zu wechseln<\/li>\n<li><strong>Hand-Werkzeug<\/strong> (<kbd>H<\/kbd>) — für längeres Navigieren<\/li>\n<li><strong>Minimap<\/strong> — Klick oder Ziehen springt direkt an die Stelle<\/li>\n<\/ul>\n\n<h3 id=\"k8-3\">8.3 Gerät suchen<\/h3>\n<p>Für größere Pläne bietet <span class=\"ui\">Analyse → Automatisch anordnen<\/span> eine\nAnordnung verbundener Geräte in Ebenen. Sie können den gesamten sichtbaren Plan oder nur\ndie Auswahl anordnen und manuelle Leitungsknoten wahlweise behalten. Ein Undo nimmt die\ngesamte Anordnung zurück. Die Hindernisvermeidung für orthogonale Leitungen ist in den\nEinstellungen schaltbar; bei komplexen Hindernissen kann Nacharbeit nötig bleiben.<\/p>\n<p><kbd>Strg<\/kbd>+<kbd>F<\/kbd> setzt den Fokus in das Suchfeld. Gesucht wird gleichzeitig\nin Name, IP, IPv6, Hostname, MAC-Adresse, Raum, Rack, Standort, VLAN und Gerätetyp. Mit den\nPfeiltasten wählen Sie einen Treffer aus, <kbd>Eingabe<\/kbd> springt hin: die Ansicht\nzentriert das Gerät, markiert es und lässt es kurz orange aufblinken.<\/p>\n<\/section>\n\n\n<section id=\"speichern\">\n<h2 id=\"k9\">9. Speichern, Laden und Austausch<\/h2>\n\n<h3 id=\"k9-1\">9.1 Projekte im Browser<\/h3>\n<p><span class=\"ui\">Speichern<\/span> (<kbd>Strg<\/kbd>+<kbd>S<\/kbd>) fragt nach einem\nProjektnamen und legt das Projekt im <code>localStorage<\/code> des Browsers ab. Existiert\nder Name bereits, wird nach Bestätigung überschrieben.<\/p>\n<p><span class=\"ui\">Laden<\/span> (<kbd>Strg<\/kbd>+<kbd>O<\/kbd>) zeigt alle gespeicherten\nProjekte mit Speicherdatum, Geräte- und Verbindungszahl. Das Papierkorbsymbol in einer Zeile\nlöscht das jeweilige Projekt nach Rückfrage.<\/p>\n\n<h3 id=\"k9-2\">9.2 Automatische Sicherung<\/h3>\n<p>Die Statusleiste zeigt offene Änderungen, den letzten erfolgreichen Sicherungszeitpunkt\nund Speicherfehler. Vor einem Projektwechsel können Sie <span class=\"ui\">Sichern<\/span>,\n<span class=\"ui\">Verwerfen<\/span> oder <span class=\"ui\">Abbrechen<\/span> wählen.\nEin zusätzlicher Wiederherstellungspunkt schützt den bisherigen Inhalt.<\/p>\n<p>Unabhängig davon sichert das Programm den aktuellen Stand automatisch — jeweils kurz\nnachdem Sie eine Änderung abgeschlossen haben. Beim nächsten Start wird dieser Stand\nwiederhergestellt und eine entsprechende Meldung eingeblendet.<\/p>\n<p>Die automatische Sicherung ist ein Schutz gegen versehentliches Schließen, <em>kein\nErsatz für benannte Projekte<\/em>: Sie hält immer nur den zuletzt bearbeiteten Stand.\nLegen Sie Meilensteine bewusst als benanntes Projekt oder als JSON-Datei ab.<\/p>\n\n<h3 id=\"k9-3\">9.3 JSON-Export und -Import<\/h3>\n<p><span class=\"ui\">Export → Projekt als JSON<\/span> (<kbd>Strg<\/kbd>+<kbd>E<\/kbd>) schreibt\neine lesbare Textdatei mit allen Geräten, Positionen, Eigenschaften, Ports, Verbindungen,\nBereichen, Ebenen und Ansichtseinstellungen. Der Dateiname leitet sich vom Projektnamen ab.<\/p>\n<p><span class=\"ui\">Import<\/span> liest eine solche Datei wieder ein. Enthält das aktuelle\nProjekt bereits Objekte, wird vorher gefragt.<\/p>\n\n<div class=\"note\">\n<strong>Import ist robust:<\/strong> Die Datei wird vor der Übernahme geprüft. Unbekannte\nGerätetypen werden durch „Desktop-PC“ ersetzt, doppelte IDs bereinigt, fehlende Felder\nergänzt und Verbindungen ohne gültige Endpunkte entfernt. Jede Korrektur wird anschließend\nin einem Hinweisfenster aufgelistet — nichts geschieht unbemerkt. Ist die Datei kein\ngültiges JSON oder kein Projektobjekt, erscheint eine verständliche Fehlermeldung und das\naktuelle Projekt bleibt unangetastet.\n<\/div>\n\n<h3 id=\"k9-4\">9.4 Grenzen des Browser-Speichers<\/h3>\n<p><span class=\"ui\">⚙ → Sicherungsverlauf<\/span> zeigt bis zu 30 Wiederherstellungspunkte\nüber alle Projekte sowie die Speicherbelegung. Dort können Sie einen Stand wiederherstellen,\nentfernen oder manuell sichern. Das Archiv nutzt IndexedDB und speichert identische Bilder\ngemeinsam. Alte Browserprojekte werden kopiert und bleiben weiterhin in der Ladeliste.\nEin Schreibfehler sperrt den Lesezugriff auf vorhandene Projekte nicht.<\/p>\n<p>Browserdaten sind an das Profil und gegebenenfalls den Dateipfad gebunden. Vor dem Wechsel\nvon Browser oder Ablageordner eine JSON-Datei exportieren. Das Löschen von Browserdaten\nkann auch den Sicherungsverlauf entfernen.<\/p>\n<p>Der <code>localStorage<\/code> fasst je nach Browser etwa 5–10&nbsp;MB. Das reicht für\nsehr viele Projekte; ein Netzplan mit 200 Geräten liegt im Bereich weniger hundert Kilobyte.\nIst der Speicher dennoch voll, erscheint eine Meldung mit dem Hinweis, ältere Projekte in\nder Ladeliste zu löschen oder als JSON auszulagern.<\/p>\n<p>Im privaten Modus mancher Browser ist <code>localStorage<\/code> gesperrt. Das Programm\nerkennt das beim Start und weist in der Statusleiste darauf hin — Speichern und automatische\nSicherung entfallen dann, Export und Import funktionieren weiterhin.<\/p>\n<\/section>\n\n\n<section id=\"export\">\n<h2 id=\"k10\">10. Grafikexport und Druck<\/h2>\n\n<h3 id=\"k10-1\">10.1 SVG<\/h3>\n<p><span class=\"ui\">Export → Diagramm als SVG<\/span> erzeugt eine verlustfreie Vektorgrafik.\nSie enthält alle Symbole, Texte, Farben und Linien und lässt sich beliebig skalieren, in\nWord, LibreOffice oder Inkscape einbinden und weiter bearbeiten.<\/p>\n<p>Der Ausschnitt wird automatisch auf den tatsächlichen Inhalt zugeschnitten. Raster,\nAuswahlrahmen und Bedienhilfen werden nicht mit exportiert; ausgeblendete Ebenen bleiben\nausgeblendet.<\/p>\n\n<h3 id=\"k10-2\">10.2 PNG<\/h3>\n<p><span class=\"ui\">Export → Diagramm als PNG<\/span> erzeugt eine Pixelgrafik in doppelter\nAuflösung, sodass sie auch in Präsentationen scharf bleibt. Für sehr große Diagramme ist SVG\ndie bessere Wahl; überschreitet das Bild eine sinnvolle Größe, weist das Programm darauf hin.<\/p>\n\n<h3 id=\"k10-3\">10.3 Drucken<\/h3>\n<p><span class=\"ui\">Export → Bericht exportieren<\/span> erstellt eine eigenständige\nHTML-Datei mit Zeichnung, Inventar, Verbindungen, Prüfhinweisen und Scanzeitpunkt.\nÖffnen Sie diese Datei im Browser und wählen Sie Drucken bzw. Als PDF speichern.\nDie maskierte Variante enthält die maskierte Zeichnung ohne Inventartabellen;\nGerätebilder können weiterhin eingebrannte vertrauliche Angaben enthalten.<\/p>\n<p><span class=\"ui\">Drucken<\/span> (oder <kbd>Strg<\/kbd>+<kbd>P<\/kbd>) blendet\nWerkzeugleiste, Seitenleiste, Statusleiste, Minimap und alle Dialoge aus und passt das\nDiagramm vor dem Druck automatisch auf die Seite ein. Nach dem Druck wird der vorherige\nBildausschnitt wiederhergestellt.<\/p>\n<p>Für Pläne im Querformat stellen Sie die Ausrichtung im Druckdialog des Browsers um.\nÜber „Als PDF speichern“ erhalten Sie eine weitergabefähige Dokumentation.<\/p>\n\n<h3 id=\"k10-4\">10.4 Vertrauliche Angaben unkenntlich machen<\/h3>\n<p class=\"lead\">Ein Netzplan, der das Haus verlässt — als Anlage zum Angebot, als Folie, im\nTicketsystem — enthält oft mehr, als der Empfänger wissen muss. Das Programm kann Adressen,\nNamen und Notizen im Bild unkenntlich machen, ohne dass Sie Ihre Arbeitsdatei anfassen.<\/p>\n\n<h4>Der schnelle Weg<\/h4>\n<p><span class=\"ui\">Export<\/span> → <span class=\"ui\">Als Bild speichern (maskiert) …<\/span>\nfragt Format, Größe und Umfang der Maskierung in einem Dialog ab und speichert direkt. Ihre\nAuswahl bleibt am Projekt stehen; beim nächsten Mal steht sie wieder da.<\/p>\n\n<h4>Was maskiert werden kann<\/h4>\n<table>\n<thead><tr><th>Gruppe<\/th><th>Voreingestellt<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>IP-Adressen und Subnetze (IPv4, IPv6)<\/td><td>an<\/td><\/tr>\n<tr><td>MAC-Adressen<\/td><td>an<\/td><\/tr>\n<tr><td>Hostnamen und DNS-Namen<\/td><td>an<\/td><\/tr>\n<tr><td>Geräte- und Bereichsnamen — ersetzt durch Typ und Nummer, etwa „Firewall 2“<\/td><td>aus<\/td><\/tr>\n<tr><td>Portbezeichnungen an den Leitungen<\/td><td>aus<\/td><\/tr>\n<tr><td>Leitungsbeschriftungen (Geschwindigkeit, VLAN, Text)<\/td><td>aus<\/td><\/tr>\n<tr><td>Notizen und Textfelder<\/td><td>aus<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Die ersten drei Gruppen arbeiten <em>überall<\/em>, nicht nur in den dafür vorgesehenen\nFeldern: Eine IP-Adresse im Zusatz eines Bereichs, in einer Notiz oder in einer\nLeitungsbeschriftung wird genauso erkannt. Bei Hostnamen ist das eine Heuristik — sie sucht\nnach Namen mit Punkt und Endung („srv01.firma.local“) und kann in seltenen Fällen danebenliegen.<\/p>\n\n<h4>Vier Arten der Maskierung<\/h4>\n<table>\n<tbody>\n<tr><td><b>Punkte<\/b><\/td><td><code>•••.•••.•.••<\/code> — die Form bleibt erkennbar, der Wert nicht. Voreinstellung.<\/td><\/tr>\n<tr><td><b>Teilweise<\/b><\/td><td><code>192.168.x.x<\/code> — Netzanteil bleibt, Geräteanteil verschwindet. Bei MAC-Adressen bleiben die ersten drei Bytes stehen: die Herstellerkennung, oft genau das, was im Plan bleiben soll.<\/td><\/tr>\n<tr><td><b>Balken<\/b><\/td><td><code>██████<\/code> — der klassische Schwärzungsstrich.<\/td><\/tr>\n<tr><td><b>Weglassen<\/b><\/td><td>Die Angabe verschwindet ersatzlos.<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<h3 id=\"k10-5\">10.5 Maskierung dauerhaft einschalten<\/h3>\n<p>Über <span class=\"ui\">⚙<\/span> → <span class=\"ui\">Vertrauliche Angaben maskieren<\/span>\ngilt die Maskierung für die <strong>Zeichenfläche<\/strong> — und damit automatisch auch für\nAusdruck, SVG- und PNG-Export. Der aktive Zustand steht in der Statusleiste und am\nMenüeintrag. Auf der Einstellungsseite stellen Sie unter\n<span class=\"ui\">Vertrauliche Angaben maskieren<\/span> Umfang und Art ein; eine Beispielzeile\nzeigt dabei laufend, wie das Ergebnis aussieht.<\/p>\n<p>Das ist der ehrlichere Weg für eine Besprechung am Beamer: Sie sehen selbst, was der Raum\nsieht. Das Beispiel-Setup <span class=\"ui\">Weitergabe<\/span> schaltet genau das ein\n(siehe <a href=\"#k21-9\">21.9<\/a>).<\/p>\n\n<h3 id=\"k10-6\">10.6 Was die Maskierung leistet — und was nicht<\/h3>\n<div class=\"note\">\n<strong>Maskiert wird der Text selbst, nicht ein Balken darüber.<\/strong> Ein schwarzer\nBalken über echtem Text wäre in einer SVG-Datei bloße Dekoration — die Adresse stünde\nweiterhin im Quelltext und ließe sich mit einem Texteditor herauslesen. Hier steht nach dem\nExport nichts anderes mehr in der Datei. Dasselbe gilt für PNG: das Bild wird aus dem bereits\nmaskierten Diagramm gerechnet.\n<\/div>\n<p>Nicht erfasst wird:<\/p>\n<ul>\n<li><strong>Gerätefotos.<\/strong> Was auf einem Foto zu lesen ist — ein Aufkleber mit\n    Seriennummer, ein Display mit IP —, kann das Programm nicht erkennen. Prüfen Sie\n    Bilder selbst, oder schalten Sie für den Export unter\n    <span class=\"ui\">Einstellungen → Gerätedarstellung<\/span> die Bilder ab.<\/li>\n<li><strong>Der Projektname<\/strong> und die Kopfdaten aus den Projektinformationen.<\/li>\n<li><strong>Die JSON-Datei.<\/strong> Sie ist Ihre Arbeitsdatei und bleibt vollständig — sonst\n    wäre die Maskierung ein Datenverlust. Wer den Netzplan als Daten weitergeben will, gibt\n    kein maskiertes JSON weiter, sondern ein Bild.<\/li>\n<\/ul>\n<p>Die Einstellung gehört zum Projekt und reist in der JSON-Datei mit: ob dieser Plan\nKundendaten enthält, weiß der Plan selbst am besten.<\/p>\n<\/section>\n\n\n<section id=\"projektinfo\">\n<h2 id=\"k11\">11. Projektinformationen<\/h2>\n<p>Über <span class=\"ui\">?<\/span> → <span class=\"ui\">Projektinformationen<\/span> öffnen Sie die Kopfdaten des Projekts:\nProjektname, Beschreibung, Autor, Firma, Standort sowie die Rastergröße. Erstellungs- und\nÄnderungsdatum werden automatisch geführt und angezeigt.<\/p>\n<p>Projektname, Firma und Standort erscheinen oben links in der Kopfzeile und im Titel des\nBrowserfensters — hilfreich, wenn Sie mehrere Pläne parallel geöffnet haben.<\/p>\n<\/section>\n\n\n<section id=\"kuerzel\">\n<h2 id=\"k12\">12. Tastaturkürzel<\/h2>\n<p>Katalogeinträge sind mit Tab erreichbar; Enter oder Leertaste fügt sie ein.\nAuf der Zeichenfläche wählt Leertaste das fokussierte Gerät aus, Enter öffnet dessen\nEigenschaften. Mit den Pfeiltasten lassen sich ausgewählte Geräte verschieben.\nEinstellungen, Dashboard und Handbuch halten den Fokus innerhalb ihrer Ansicht und\ngeben ihn beim Schließen zurück. Enter bestätigt das Hauptformular eines Dialogs.<\/p>\n\n<table class=\"shortcuts\">\n<thead><tr><th>Kürzel<\/th><th>Funktion<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><kbd>Entf<\/kbd> / <kbd>Rücktaste<\/kbd><\/td><td>Auswahl löschen<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>S<\/kbd><\/td><td>Projekt im Browser speichern<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>O<\/kbd><\/td><td>Projekt laden<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>N<\/kbd><\/td><td>Neues Netzwerk<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>E<\/kbd><\/td><td>Projekt als JSON exportieren<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>Z<\/kbd><\/td><td>Rückgängig<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>Y<\/kbd> / <kbd>Strg<\/kbd>+<kbd>Umschalt<\/kbd>+<kbd>Z<\/kbd><\/td><td>Wiederholen<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>D<\/kbd><\/td><td>Auswahl duplizieren<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>A<\/kbd><\/td><td>Alles auswählen<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>G<\/kbd><\/td><td>Netzwerkbereich um die Auswahl erzeugen<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>F<\/kbd><\/td><td>Gerätesuche<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>Umschalt<\/kbd>+<kbd>D<\/kbd><\/td><td>Dashboard öffnen und schließen<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>,<\/kbd><\/td><td>Einstellungsseite öffnen und schließen<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>V<\/kbd><\/td><td>Bild aus der Zwischenablage als Gerätefoto einfügen<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>P<\/kbd><\/td><td>Drucken<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd> + Mausrad<\/td><td>Zoomen<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>+<\/kbd> / <kbd>−<\/kbd> / <kbd>0<\/kbd><\/td><td>Zoom vergrößern / verkleinern / 100&nbsp;%<\/td><\/tr>\n<tr><td><kbd>Strg<\/kbd>+<kbd>1<\/kbd><\/td><td>Alles einpassen<\/td><\/tr>\n<tr><td><kbd>V<\/kbd> / <kbd>C<\/kbd> / <kbd>H<\/kbd><\/td><td>Auswahl- / Verbindungs- / Hand-Modus<\/td><\/tr>\n<tr><td><kbd>G<\/kbd><\/td><td>Raster ein- und ausblenden<\/td><\/tr>\n<tr><td><kbd>Leertaste<\/kbd> + Ziehen<\/td><td>Zeichenfläche verschieben<\/td><\/tr>\n<tr><td>Mittlere Maustaste<\/td><td>Zeichenfläche verschieben<\/td><\/tr>\n<tr><td>Pfeiltasten<\/td><td>Auswahl um 1 Pixel verschieben<\/td><\/tr>\n<tr><td><kbd>Umschalt<\/kbd> + Pfeiltasten<\/td><td>Auswahl um eine Rasterweite verschieben<\/td><\/tr>\n<tr><td>Doppelklick<\/td><td>Eigenschaften öffnen<\/td><\/tr>\n<tr><td>Rechtsklick<\/td><td>Kontextmenü<\/td><\/tr>\n<tr><td><kbd>Umschalt<\/kbd> / <kbd>Strg<\/kbd> + Klick<\/td><td>Auswahl erweitern<\/td><\/tr>\n<tr><td><kbd>Esc<\/kbd><\/td><td>Aktion abbrechen, Auswahl aufheben, Dialog schließen<\/td><\/tr>\n<tr><td><kbd>F1<\/kbd> / <kbd>Umschalt<\/kbd>+<kbd>F1<\/kbd><\/td><td>Kurzhilfe / dieses Handbuch<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/section>\n\n\n<section id=\"tipps\">\n<h2 id=\"k13\">13. Hinweisfenster (Tooltips)<\/h2>\n\n<p>Beim Verweilen auf einer Schaltfläche, einer Katalogkachel, einem Gerät oder einer\nLeitung erscheint nach kurzer Zeit ein Hinweisfenster. Auf der Zeichenfläche ist das mehr\nals eine Beschriftung: für ein Gerät zeigt es Name, Typ, Status, IP, Hostname, MAC,\nStandort, VLAN und die Zahl der Ports; für eine Leitung Typ, Geschwindigkeit, VLAN und\nbeide Endpunkte samt Ports. So lesen Sie Dokumentationsdaten, ohne einen Dialog zu öffnen.<\/p>\n\n<p>Wer die Oberfläche kennt, empfindet Hinweisfenster mit der Zeit als störend. Das\nKontrollkästchen <span class=\"ui\">Tipps<\/span> in der Werkzeugleiste schaltet sie deshalb\nvollständig ab — auch die kurzen Beschriftungen der Schaltflächen. Die Einstellung gilt\nfür den Browser und bleibt über Sitzungen hinweg erhalten; sie wird <em>nicht<\/em> mit dem\nProjekt gespeichert und beim Weitergeben einer JSON-Datei nicht übertragen.<\/p>\n\n<div class=\"note\">\nWährend Sie ziehen, während ein Dialog offen ist oder solange das Kontextmenü angezeigt\nwird, erscheinen ohnehin keine Hinweisfenster.\n<\/div>\n<\/section>\n\n\n<section id=\"arbeitsweise\">\n<h2 id=\"k14\">14. Bewährte Arbeitsweisen<\/h2>\n\n<h3 id=\"k14-1\">14.1 Von oben nach unten zeichnen<\/h3>\n<p>Netzpläne lesen sich am besten hierarchisch: Internet oben, darunter Firewall und Router,\ndann die Verteilebene, ganz unten Server und Clients. Das Beispielnetzwerk folgt diesem\nAufbau und eignet sich als Vorlage.<\/p>\n\n<h3 id=\"k14-2\">14.2 Namensschema festlegen<\/h3>\n<p>Ein einheitliches Schema zahlt sich spätestens ab dem zwanzigsten Gerät aus, etwa\n<code>Standort-Rolle-Nummer<\/code>: <code>MUC-SW-01<\/code>, <code>MUC-SRV-03<\/code>,\n<code>BER-FW-01<\/code>. Die automatische Benennung ist nur als Startpunkt gedacht —\nbenennen Sie Geräte gleich beim Anlegen um.<\/p>\n\n<h3 id=\"k14-3\">14.3 Erst zeichnen, dann dokumentieren<\/h3>\n<p>Setzen Sie zuerst alle Geräte und Leitungen, bevor Sie Details eintragen. Das hält den\nAufbau flüssig; die Feldarbeit erledigen Sie danach in einem Durchgang mit Doppelklick,\nAusfüllen, <kbd>Esc<\/kbd>.<\/p>\n\n<h3 id=\"k14-4\">14.4 Ports von Anfang an pflegen<\/h3>\n<p>Die Portbelegung ist der Teil der Dokumentation, der im Alltag am meisten Zeit spart und\nam schnellsten veraltet. Tragen Sie sie direkt beim Anlegen der Verbindung ein — später\nlässt sich nicht mehr rekonstruieren, in welchem Switchport das Kabel steckte.<\/p>\n\n<h3 id=\"k14-5\">14.5 Ebenen statt zweiter Datei<\/h3>\n<p>Für eine geplante Erweiterung legen Sie besser eine zusätzliche Ebene an, statt eine\nKopie des Projekts zu pflegen. So bleibt der Bestand die einzige Quelle der Wahrheit, und\nSie sehen Planung und Bestand jederzeit gemeinsam oder getrennt.<\/p>\n\n<h3 id=\"k14-6\">14.6 Versionen ablegen<\/h3>\n<p>Exportieren Sie zu Meilensteinen eine JSON-Datei mit Datum im Namen, etwa\n<code>netz_hauptstandort_2026-08-17.json<\/code>. Diese Dateien sind reiner Text und lassen\nsich in einer Versionsverwaltung sinnvoll vergleichen.<\/p>\n<\/section>\n\n\n<section id=\"datenformat\">\n<h2 id=\"k15\">15. Datenformat<\/h2>\n\n<p>Exportierte Dateien sind normales, eingerücktes JSON und können auch von anderen\nWerkzeugen gelesen oder erzeugt werden.<\/p>\n\n<pre>{\n  \"name\": \"Netzwerk Labor 1\",\n  \"version\": 2,\n  \"info\":     { \"description\", \"author\", \"company\", \"location\",\n                \"created\", \"modified\" },\n  \"devices\": [\n    { \"id\": \"dev_001\", \"type\": \"switch_managed\", \"name\": \"Core Switch\",\n      \"x\": 434, \"y\": 460, \"layer\": \"lay_phys\", \"status\": \"active\",\n      \"ip\": \"192.168.1.2\", \"ipv6\": \"\", \"mac\": \"\", \"hostname\": \"sw01\",\n      \"manufacturer\": \"\", \"model\": \"\", \"location\": \"\", \"room\": \"Serverraum\",\n      \"rack\": \"R1\", \"vlan\": \"\", \"os\": \"\", \"protocol\": \"\",\n      \"description\": \"\", \"notes\": \"\",\n      \"image\": \"data:image/jpeg;base64,…\",\n      \"ports\": [ { \"name\": \"Port 1\" }, { \"name\": \"Port 2\" } ] },\n    { \"id\": \"dev_009\", \"type\": \"deco_rect\", \"name\": \"Abnahme offen\",\n      \"x\": 380, \"y\": 420, \"layer\": \"lay_phys\",\n      \"figure\": \"rect\", \"w\": 300, \"h\": 220, \"rot\": 0,\n      \"stroke\": \"#ea580c\", \"strokeWidth\": 2, \"dash\": \"6 4\",\n      \"fill\": \"none\", \"opacity\": 1, \"front\": false }\n  ],\n  \"connections\": [\n    { \"id\": \"con_001\", \"source\": \"dev_001\", \"target\": \"dev_002\",\n      \"sourcePort\": \"Port 5\", \"targetPort\": \"eth0\",\n      \"type\": \"gigabit\", \"speed\": \"1 Gbit/s\", \"vlan\": \"20\",\n      \"label\": \"\", \"description\": \"\", \"layer\": \"lay_phys\",\n      \"points\": [ { \"x\": 620, \"y\": 540 }, { \"x\": 620, \"y\": 700 } ] }\n  ],\n  \"areas\":  [ { \"id\": \"area_001\", \"label\": \"Serverraum\",\n                \"sublabel\": \"192.168.1.0/24 · VLAN 20\",\n                \"x\": 400, \"y\": 596, \"w\": 442, \"h\": 180,\n                \"color\": \"#7c3aed\", \"layer\": \"lay_phys\" } ],\n  \"layers\": [ { \"id\": \"lay_phys\", \"name\": \"Physisches Netzwerk\",\n                \"visible\": true } ],\n  \"customTypes\": [ { \"id\": \"custom_1\", \"label\": \"Hutschienen-Netzteil\",\n                     \"cat\": \"custom\", \"color\": \"#0f172a\",\n                     \"iconViewBox\": \"0 0 24 24\", \"iconInner\": \"&lt;rect …/&gt;\",\n                     \"iconImage\": \"\", \"ports\": [ \"230 V\", \"24 V\" ] } ],\n  \"settings\": { \"grid\": true, \"snap\": true, \"gridSize\": 20,\n                \"routing\": \"orthogonal\", \"zoom\": 1, \"panX\": 60, \"panY\": 60,\n                \"defaultConnType\": \"gigabit\", \"activeLayer\": \"lay_phys\",\n                \"photos\": true,\n                \"privacy\": { \"on\": false, \"style\": \"dots\",\n                             \"ip\": true, \"mac\": true, \"host\": true,\n                             \"names\": false, \"ports\": false,\n                             \"labels\": false, \"notes\": false } },\n  \"counters\": { \"switch_managed\": 1 },\n  \"seq\": 12\n}<\/pre>\n\n<p>Die wichtigsten Regeln:<\/p>\n<ul>\n<li><code>id<\/code> beginnt mit <code>dev_<\/code>, <code>con_<\/code> oder <code>area_<\/code>. Daran erkennt das Programm die Objektart.<\/li>\n<li><code>source<\/code> und <code>target<\/code> einer Verbindung müssen auf vorhandene Geräte verweisen, sonst wird die Verbindung beim Import verworfen.<\/li>\n<li><code>x<\/code> und <code>y<\/code> bezeichnen die linke obere Ecke der Gerätekachel (132 × 88 Pixel).<\/li>\n<li><code>seq<\/code> ist der Zähler für neue IDs und wird beim Import automatisch neu bestimmt.<\/li>\n<li><code>version<\/code> kennzeichnet das Format. Version 1 wird auf Version 2 migriert;\nunbekannte neuere Versionen werden zurückgewiesen. Geräte haben zusätzlich\n<code>interfaces<\/code> und <code>observations<\/code>, Verbindungen ebenfalls\n<code>observations<\/code> für Zeitpunkt, Methode und beobachteten Status.<\/li>\n<li><code>image<\/code> enthält das Gerätefoto vollständig als <code>data:<\/code>-URL. Dadurch ist\n    die Datei ohne Begleitdateien vollständig — und entsprechend groß.<\/li>\n<li>Grafikelemente stehen ebenfalls unter <code>devices<\/code>, tragen aber statt der\n    Netzwerkfelder ihre Darstellung: <code>figure<\/code>, <code>w<\/code>, <code>h<\/code>,\n    <code>rot<\/code>, <code>stroke<\/code>, <code>strokeWidth<\/code>, <code>dash<\/code>,\n    <code>fill<\/code>, <code>opacity<\/code> und <code>front<\/code>. Beim Import werden Farben\n    nur als Hex-Wert und Strichmuster nur aus Ziffern und Trennern übernommen — alles andere\n    wird verworfen.<\/li>\n<li><code>settings.privacy<\/code> hält fest, was beim Export unkenntlich gemacht wird\n    (siehe <a href=\"#k10-4\">10.4<\/a>). Die Datei selbst bleibt immer unmaskiert.<\/li>\n<li><code>points<\/code> einer Verbindung sind die selbst gesetzten Knoten\n    (siehe <a href=\"#k5-6\">5.6<\/a>). Fehlt die Liste oder ist sie leer, wird die Leitung\n    automatisch geführt. Beim Import werden höchstens 40 Punkte je Leitung übernommen.<\/li>\n<li>Ein Abzweig ist ein Gerät vom Typ <code>junction<\/code> — dadurch gelten Auswahl,\n    Ebenen und Verbindungen dafür unverändert.<\/li>\n<li>Textfeld, Notiz und Grafikbeschriftung tragen <code>font<\/code> (Schlüssel, nie ein\n    CSS-Wert), <code>fontSize<\/code>, <code>color<\/code>, <code>bold<\/code>,\n    <code>italic<\/code> und <code>align<\/code>. Fehlt ein Wert, gilt die Vorgabe — bei der\n    Farbe heißt das: sie folgt dem Design.<\/li>\n<\/ul>\n<p>Möchten Sie eine Projektdatei ohne Bilddaten weitergeben, entfernen Sie vor dem Export die\nFotos über das Kontextmenü, oder löschen Sie in einem Editor die <code>image<\/code>-Felder. Das\nProgramm liest eine Datei auch ohne diese Felder problemlos ein.<\/p>\n<\/section>\n\n\n<section id=\"fotos\">\n<h2 id=\"k16\">16. Gerätefotos<\/h2>\n\n<p class=\"lead\">Ein Symbol zeigt die Geräteart, ein Foto zeigt das Gerät. Bei einem Rundgang\ndurch den Serverraum oder an der Anlage sind echte Bilder oft die schnellste Dokumentation:\nSie erkennen Bauform, Beschriftung, Steckerbelegung und Zustand sofort wieder.<\/p>\n\n<h3 id=\"k16-1\">16.1 Foto hinzufügen<\/h3>\n<p>Drei Wege führen zum Ziel:<\/p>\n<ul>\n  <li><strong>Ziehen und Ablegen<\/strong> — eine Bilddatei aus dem Explorer direkt auf die\n      Gerätekachel ziehen. Das ist der schnellste Weg für mehrere Geräte hintereinander.<\/li>\n  <li><strong>Einfügen<\/strong> — Gerät markieren und mit <kbd>Strg<\/kbd>+<kbd>V<\/kbd> ein Bild aus\n      der Zwischenablage übernehmen. Praktisch für Bildschirmausschnitte und Handyfotos, die\n      Sie gerade kopiert haben.<\/li>\n  <li><strong>Dialog<\/strong> — Doppelklick auf das Gerät, Abschnitt <span class=\"ui\">Gerätefoto<\/span>,\n      dort <span class=\"ui\">Foto wählen …<\/span>. Auch über Rechtsklick →\n      <span class=\"ui\">Foto hinzufügen …<\/span> erreichbar.<\/li>\n<\/ul>\n\n<h3 id=\"k16-2\">16.2 Was gespeichert wird<\/h3>\n<p>Das Bild wird <strong>im Projekt selbst<\/strong> abgelegt, nicht als Verweis auf eine Datei.\nDamit reist es automatisch mit:<\/p>\n<table>\n<tbody>\n<tr><td>Browser-Speicher<\/td><td>Foto ist im gespeicherten Projekt enthalten<\/td><\/tr>\n<tr><td>Automatische Sicherung<\/td><td>Foto wird mitgesichert und nach dem Neustart wiederhergestellt<\/td><\/tr>\n<tr><td>JSON-Export<\/td><td>Foto steckt als <code>image<\/code>-Feld im Gerät (Base64-kodiert)<\/td><\/tr>\n<tr><td>SVG- und PNG-Export<\/td><td>Foto ist in der Grafik eingebettet, keine Begleitdateien nötig<\/td><\/tr>\n<tr><td>Druck<\/td><td>Foto wird mitgedruckt<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Eine weitergegebene JSON-Datei ist also vollständig — der Empfänger braucht keine\nBilddateien. Das ist der Grund für diese Bauweise und gleichzeitig ihr Preis: die Datei wächst.<\/p>\n\n<h3 id=\"k16-3\">16.3 Automatische Verkleinerung<\/h3>\n<p>Jedes Bild wird beim Übernehmen auf maximal <strong>640 Pixel<\/strong> längste Kante skaliert\nund als JPEG neu kodiert. Aus einem 4-MB-Handyfoto werden dadurch typischerweise 30–70 KB.<\/p>\n<div class=\"note\">\n<strong>Warum das nötig ist:<\/strong> Base64 vergrößert Binärdaten um etwa ein Drittel. Ein\nunverkleinertes 4-MB-Foto würde rund 5,4 MB belegen — und der gesamte Browser-Speicher fasst\nje nach Browser nur 5–10 MB für <em>alle<\/em> Projekte zusammen. Ein einziges Foto könnte also\ndas Speichern unmöglich machen.\n<\/div>\n<p>Ab etwa 1,6 MB Gesamtbildmenge weist das Programm einmalig darauf hin. Die belegte Menge\nsteht jederzeit im <a href=\"#k18\">Dashboard<\/a> unter <em>Bilddaten<\/em>.<\/p>\n\n<h3 id=\"k16-4\">16.4 Anzeige steuern<\/h3>\n<p>Ist ein Foto hinterlegt, wächst die Gerätekachel um einen Bildstreifen; Name, Typ und\nIP-Adresse bleiben darunter lesbar. Das Kontrollkästchen <span class=\"ui\">Fotos<\/span> in der\nWerkzeugleiste blendet alle Bilder auf der Zeichenfläche aus — die Kacheln werden wieder\nkompakt, die Fotos bleiben aber im Projekt gespeichert und im Eigenschaftenfenster sowie im\nHinweisfenster sichtbar.<\/p>\n<p>Diese Einstellung gehört zum Projekt und wird mitgespeichert: Sie können also eine\nbildreiche Arbeitsfassung pflegen und für den Ausdruck auf die kompakte Darstellung umschalten.<\/p>\n\n<h3 id=\"k16-5\">16.5 Empfehlungen<\/h3>\n<ul>\n  <li>Fotografieren Sie <strong>Frontblende und Rückseite<\/strong> getrennt — die Rückseite als\n      zweites Gerät mit dem Namenszusatz „(rückseitig)“ oder als Notiz daneben.<\/li>\n  <li>Ein Foto der <strong>Patchfeldbeschriftung<\/strong> im Bereich „Serverraum“ spart später viel Sucharbeit.<\/li>\n  <li>Fotos ersetzen keine Portdokumentation. Die Portliste bleibt durchsuchbar, ein Bild nicht.<\/li>\n  <li>Bei sehr vielen Geräten: Fotos nur für die Komponenten hinterlegen, die man selten sieht.<\/li>\n<\/ul>\n<\/section>\n\n\n<section id=\"analyse\">\n<h2 id=\"k17\">17. Netzwerkanalyse eines bestehenden Netzes<\/h2>\n\n<p class=\"lead\">Ein bestehendes Netz muss nicht von Hand abgetippt werden. Das Programm liest\ndie Ausgabe gängiger Analysewerkzeuge, leitet daraus Geräte, Typen und Verbindungen ab und\nfüllt das Dashboard automatisch.<\/p>\n\n<h3 id=\"k17-1\">17.1 Warum der Browser nicht selbst scannt<\/h3>\n<p>Aus Sicherheitsgründen darf eine Webseite — auch eine lokal geöffnete — grundsätzlich nicht:<\/p>\n<ul>\n  <li>ICMP-Echos (Ping) senden,<\/li>\n  <li>Rohsockets öffnen oder ARP-Tabellen lesen,<\/li>\n  <li>beliebige TCP-Ports ansprechen oder SNMP abfragen.<\/li>\n<\/ul>\n<p>Diese Beschränkungen sind sinnvoll: sonst könnte jede beliebige Seite Ihr Heim- oder\nFirmennetz ausspähen. Ein „Scanner im HTML“ wäre daher entweder unwirksam oder müsste raten —\nfür eine Dokumentation ist beides wertlos. Deshalb geht dieses Programm den belastbaren Weg\nund wertet aus, was Werkzeuge <em>mit<\/em> Ihren Rechten ermittelt haben.<\/p>\n\n<h3 id=\"k17-2\">17.2 Weg 1: mitgeliefertes Analyse-Skript<\/h3>\n<p><span class=\"ui\">Analyse<\/span> → <span class=\"ui\">Analyse-Skript anzeigen …<\/span> zeigt\nein fertiges Skript für Windows (PowerShell 5.1/7) und Linux/macOS (Bash mit Python 3.9+) — zum Kopieren oder\nHerunterladen. Es liegt zusätzlich als <code>netzwerk_analyse.ps1<\/code> bzw.\n<code>netzwerk_analyse.sh<\/code> neben dem Programm.<\/p>\n<p>Das Skript ermittelt mit begrenzter Parallelität:<\/p>\n<ol>\n  <li>die aktive LAN- oder WLAN-Schnittstelle über die Standardroute — und damit das Subnetz,\n      in dem Sie tatsächlich hängen,<\/li>\n  <li>welche Adressen auf ICMP antworten,<\/li>\n  <li>die MAC-Adressen aus der Nachbartabelle des Systems — <em>dafür muss ein Gerät nicht auf\n      Ping antworten<\/em>, viele Drucker und IoT-Geräte tun das nämlich nicht,<\/li>\n  <li>Hostnamen über die Namensauflösung des Systems,<\/li>\n  <li>optional eine kurze Liste gängiger TCP-Ports,<\/li>\n  <li>und daraus abgeleitete Verbindungen (siehe <a href=\"#k17-6\">17.6<\/a>).<\/li>\n<\/ol>\n<p>Geschrieben wird <code>netzwerk_scan.json<\/code>. Diese Datei laden Sie über\n<span class=\"ui\">Analyse<\/span> → <span class=\"ui\">Scan-Datei importieren …<\/span>.<\/p>\n<pre>powershell -ExecutionPolicy Bypass -File .\\netzwerk_analyse.ps1\npowershell -ExecutionPolicy Bypass -File .\\netzwerk_analyse.ps1 -Subnet 192.168.10.0/24\npowershell -ExecutionPolicy Bypass -File .\\netzwerk_analyse.ps1 -NoPorts\npowershell -ExecutionPolicy Bypass -File .\\netzwerk_analyse.ps1 -ListInterfaces\npowershell -ExecutionPolicy Bypass -File .\\netzwerk_analyse.ps1 -Subnet 10.0.0.0/16 -StartAddress 10.0.20.1 -MaxHosts 254 -PlanOnly\n\nchmod +x netzwerk_analyse.sh &amp;&amp; ./netzwerk_analyse.sh\nbash netzwerk_analyse.sh --subnet 10.0.0.0/16 --start-address 10.0.20.1 --max-hosts 254 --plan-only<\/pre>\n<p><code>-PlanOnly<\/code> bzw. <code>--plan-only<\/code> zeigt die Auswahl ohne Scan.\nMit <code>-InterfaceIndex<\/code> bzw. <code>--interface<\/code> wählen Sie die Schnittstelle;\n<code>-Concurrency<\/code>/<code>--concurrency<\/code> begrenzt parallele Prüfungen,\n<code>-Timeout<\/code>/<code>--timeout<\/code> die Wartezeit in Millisekunden.\nWindows beendet mit Q, Linux/macOS mit Strg+C und schreibt die abgeschlossenen Prüfungen.\nAuch <code>-CancelAfterSeconds<\/code> bzw. <code>--cancel-after-seconds<\/code> ist möglich.\nAusgewählte, ausgelassene und abgeschlossene Adressen stehen im Ergebnis.<\/p>\n<p>Zu jedem Gerät hält die Datei fest, <em>wie<\/em> es gefunden wurde — über ICMP, über die\nARP-Tabelle, über einen offenen Port oder als lokaler Rechner. Diese Angabe bleibt mit\nZeitpunkt und Status als Beobachtung am Gerät erhalten und ist oft aufschlussreicher als die Trefferliste\nselbst.<\/p>\n<div class=\"note\">\nDas Skript sendet Ping-, TCP- und Namensauflösungsanfragen für die Bestandsaufnahme.\nEs meldet sich nicht an Geräten an und verändert keine Gerätekonfiguration.\nDer Befund wird lokal als JSON geschrieben; nur freigegebene Netze scannen.\n<\/div>\n\n<h3 id=\"k17-3\">17.3 Weg 2: Ausgabe einfügen<\/h3>\n<p><span class=\"ui\">Analyse<\/span> → <span class=\"ui\">Netzwerkdaten einlesen …<\/span> öffnet ein\nTextfeld. Führen Sie einen Befehl aus und fügen Sie die komplette Ausgabe ein — das Format\nwird automatisch erkannt. Mehrere Ausgaben dürfen zusammen eingefügt werden; das Programm\nführt sie über IP- und MAC-Adressen zusammen.<\/p>\n\n<h3 id=\"k17-4\">17.4 Unterstützte Quellen<\/h3>\n<table>\n<thead><tr><th>Quelle<\/th><th>Befehl<\/th><th>Was daraus entsteht<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Nachbartabelle<\/td><td><code>arp -a<\/code> · <code>arp -n<\/code> · <code>ip neigh<\/code> · <code>Get-NetNeighbor<\/code><\/td><td>IP + MAC, Herstellerhinweis<\/td><\/tr>\n<tr><td>Eigene Konfiguration<\/td><td><code>ipconfig /all<\/code> · <code>ip addr<\/code><\/td><td>Gateway, DNS, Subnetzmaske<\/td><\/tr>\n<tr><td>nmap, Hostliste<\/td><td><code>nmap -sn 192.168.1.0/24<\/code><\/td><td>IP, Hostname, MAC, Hersteller<\/td><\/tr>\n<tr><td>nmap, Dienste<\/td><td><code>nmap -sV -oX scan.xml 192.168.1.0/24<\/code><\/td><td>zusätzlich offene Ports und Dienste — die beste Grundlage<\/td><\/tr>\n<tr><td>nmap, grepbar<\/td><td><code>nmap -oG - 192.168.1.0/24<\/code><\/td><td>IP, Hostname, offene Ports<\/td><\/tr>\n<tr><td>nmap, UDP<\/td><td><code>nmap -sU -p 15730,15731,21105 …<\/code><\/td><td>Modellbahnzentralen, die nur über UDP antworten<\/td><\/tr>\n<tr><td>Nachbarschaften<\/td><td><code>show lldp neighbors detail<\/code> · <code>show cdp neighbors detail<\/code> · <code>lldpctl<\/code><\/td><td><strong>echte Verbindungen<\/strong> samt Portbezeichnungen<\/td><\/tr>\n<tr><td>Portbelegung<\/td><td><code>show mac address-table<\/code><\/td><td>ordnet Geräte konkreten Switchports und VLANs zu<\/td><\/tr>\n<tr><td>Listen<\/td><td>CSV/Semikolon aus Inventar, DHCP-Leases, Router-Export<\/td><td>IP, MAC, Name, Raum, Rack<\/td><\/tr>\n<tr><td>Analyse-Skript<\/td><td><code>netzwerk_scan.json<\/code><\/td><td>alles zusammen, ohne Zusatzsoftware<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>LLDP/CDP ist die wertvollste Quelle: nur sie liefert die tatsächliche Verkabelung. Alles\nandere liefert Geräte, aber keine Topologie.<\/p>\n\n<h3 id=\"k17-5\">17.5 Typvorschläge und ihre Zuverlässigkeit<\/h3>\n<p>Für jeden gefundenen Host schlägt das Programm einen Gerätetyp vor und begründet ihn. Die\nReihenfolge der Merkmale:<\/p>\n<ol>\n  <li><strong>Offene Ports<\/strong> — das aussagekräftigste Merkmal (z. B. Port 9100 → Netzwerkdrucker,\n      Port 15471 → ESU ECoS). Zuverlässigkeit <em>hoch<\/em>.<\/li>\n  <li><strong>Hostname und Hersteller<\/strong> — z. B. „sw-keller“, „fritz.box“, „Raspberry Pi\n      Foundation“. Zuverlässigkeit <em>mittel<\/em>.<\/li>\n  <li><strong>Fallback<\/strong> — nur ein Webdienst oder SSH erreichbar. Zuverlässigkeit <em>niedrig<\/em>.<\/li>\n<\/ol>\n<p>Zusätzlich wird jeder Host mit dem Projekt abgeglichen — über MAC-Adresse, dann IP, dann\nName. Bekannte Geräte werden als <em>bekannt<\/em> markiert und nur ergänzt, neue als\n<em>neu<\/em>. Vorhandene Eingaben werden nicht überschrieben, solange Sie das nicht\nausdrücklich ankreuzen.<\/p>\n<div class=\"note note-warn\">\nDie Vorschläge sind Heuristiken, keine Tatsachen. Prüfen Sie die Liste, bevor Sie sie\nübernehmen — besonders bei Zuverlässigkeit <em>niedrig<\/em>.\n<\/div>\n\n<h3 id=\"k17-6\">17.6 Erkannte Verbindungen<\/h3>\n<p class=\"lead\">Das Analyse-Skript liefert nicht nur Geräte, sondern auch Verbindungen. Sie\nlanden im Dashboard in einer eigenen Liste und werden — wie alles andere — erst nach Ihrer\nBestätigung gezeichnet.<\/p>\n\n<h4>Was das Programm wissen kann und was nicht<\/h4>\n<p>Welches Kabel in welchem Switchport steckt, weiß ohne Auskunft der Switches (SNMP, LLDP)\nniemand. Ein Rechner sieht von seinem Platz aus nur, <em>dass<\/em> ein Gerät erreichbar ist,\nnicht <em>worüber<\/em>. Alle Verbindungen aus dem Skript sind deshalb begründete Ableitungen\nund tragen ihre Herkunft mit sich:<\/p>\n<table>\n<thead><tr><th>Methode<\/th><th>Was sie belegt<\/th><th>Zuverlässigkeit<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>ARP-Nachbar<\/td><td>Das Gerät war im selben Layer-2-Netz erreichbar. Der Switchport bleibt unbekannt.<\/td><td>65 %<\/td><\/tr>\n<tr><td>selbst beobachtet<\/td><td>Der Scan-Rechner hat das Gerät direkt gesehen.<\/td><td>55 %<\/td><\/tr>\n<tr><td>gleiches Subnetz<\/td><td>Nur die Adresse spricht dafür — die schwächste Aussage.<\/td><td>40 %<\/td><\/tr>\n<tr><td>LLDP / CDP<\/td><td>Die Geräte melden einander selbst. Das ist eine echte Nachbarschaft.<\/td><td>hoch<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Deshalb werden abgeleitete Verbindungen als <b>Logische Verbindung<\/b> eingetragen — grau\ngestrichelt, deutlich unterscheidbar von einer Leitung, die Sie selbst verlegt haben. Wo Sie\nes besser wissen, ändern Sie die Leitungsart per Doppelklick.<\/p>\n\n<h4>Warum aus vielen Ableitungen wenige Linien werden<\/h4>\n<p>Das Skript meldet jede Ableitung einzeln. Für 20 Geräte waren das zuletzt 56 Einträge:\ndasselbe Paar dreifach, dazu ein Stern vom Scan-Rechner zu jedem gesehenen Gerät. Ungefiltert\nübernommen ergäbe das einen unlesbaren Filz. Zwei Regeln machen daraus einen Plan:<\/p>\n<ol class=\"steps\">\n<li>Je Gerätepaar bleibt die <b>bestbelegte<\/b> Ableitung — die anderen sagen nichts Neues.<\/li>\n<li>Jedes Gerät behält <b>seine beste Verbindung<\/b>. Bei Gleichstand gewinnt das stärker\n    vernetzte Gegenüber: der Verteiler, an dem tatsächlich alles hängt.<\/li>\n<\/ol>\n<p>Aus „ich habe alle gesehen“ wird so „ich hänge am selben Verteiler wie alle anderen“ — die\nAussage, die die Daten hergeben, und keine darüber hinaus. Wie viele schwächere Ableitungen\ndabei entfallen sind, steht über der Liste.<\/p>\n<p>Aus derselben Auswertung ergibt sich auch die <b>Anordnung<\/b>: Verteiler kommen nach oben,\nwas daran hängt darunter. Ein Raster nach IP-Adresse wäre schneller gezeichnet, aber die\nLeitungen liefen kreuz und quer.<\/p>\n\n<h4>WLAN<\/h4>\n<p>Meldet das Skript, dass der Scan-Rechner über WLAN angebunden ist, wird genau diese eine\nVerbindung als <b>WLAN<\/b> eingetragen — mit der SSID in der Begründung. Für alle anderen\nGeräte lässt sich das vom Scan-Rechner aus nicht feststellen; sie bleiben deshalb bei der\nlogischen Verbindung.<\/p>\n\n<h3 id=\"k17-7\">17.7 Übernahme ins Projekt<\/h3>\n<p>Im Dashboard, Ansicht <span class=\"ui\">Erkennung<\/span>, wählen Sie mit den Kontrollkästchen\naus, was übernommen werden soll — oben die Geräte, darunter die Verbindungen.\n<span class=\"ui\">Nur neue<\/span> ist der übliche Fall. Drei Optionen steuern das Ergebnis:<\/p>\n<table>\n<tbody>\n<tr><td>Bereich anlegen<\/td><td>legt ein beschriftetes Rechteck „Automatisch erkannt“ um die neuen Geräte — so bleibt getrennt, was Sie selbst gezeichnet haben<\/td><\/tr>\n<tr><td>Felder überschreiben<\/td><td>ersetzt auch bereits gefüllte Felder. Standardmäßig aus.<\/td><\/tr>\n<tr><td>Neue verbinden mit<\/td><td>verbindet Geräte, die aus dem Scan keine Verbindung mitbringen, mit einem vorhandenen Gerät (in der Regel dem Switch). Liegt eine MAC-Adresstabelle vor, wird der richtige Switchport eingetragen.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Bereits vorhandene Geräte werden über MAC, IP oder Namen wiedererkannt und nur ergänzt.\nEine Verbindung, die es schon gibt, wird nicht doppelt angelegt.<\/p>\n<p>Die gesamte Übernahme ist <strong>ein einziger Schritt<\/strong> und mit\n<kbd>Strg<\/kbd>+<kbd>Z<\/kbd> vollständig zurücknehmbar.<\/p>\n\n<h3 id=\"k17-8\">17.8 Rechtlicher Hinweis<\/h3>\n<p>Analysieren Sie nur Netzwerke, für die Sie zuständig sind oder eine ausdrückliche Erlaubnis\nhaben. Ein Portscan in fremden Netzen kann unzulässig sein — unabhängig davon, mit welchem\nWerkzeug er ausgeführt wird.<\/p>\n<\/section>\n\n\n<section id=\"dashboard\">\n<h2 id=\"k18\">18. Dashboard<\/h2>\n<p>Das Analyse-Menü bietet außerdem <span class=\"ui\">Inventar<\/span> und\n<span class=\"ui\">Netzplan-Prüfung<\/span>: filterbare Tabellen für Geräte, Schnittstellen,\nPorts und Verbindungen mit Bearbeitung und CSV-Ausgabe. CSV exportiert die gesamte\ngewählte Tabelle. Die Prüfung meldet unter anderem doppelte IPs, ungültige Adressen,\nPortkonflikte und auffällige Netz-/VLAN-Zuordnungen. Hinweise können bei Bussen, Trunks\noder Routing berechtigte Ausnahmen sein und sperren das Projekt nicht.<\/p>\n<p>Scanstatus beschreibt den angegebenen Beobachtungszeitpunkt; das Frontend überwacht\nkeine Geräte live. Bei wiederholter Übernahme werden vorhandene Geräte anhand MAC/IP\nerneut abgeglichen. Fehlende Netzpräfixe sind als /24-Annahme gekennzeichnet.<\/p>\n\n<p><span class=\"ui\">Analyse<\/span> → <span class=\"ui\">Dashboard öffnen<\/span> oder\n<kbd>Strg<\/kbd>+<kbd>Umschalt<\/kbd>+<kbd>D<\/kbd>. Zwei Ansichten:<\/p>\n\n<h3 id=\"k18-1\">18.1 Übersicht<\/h3>\n<p>Wertet das Projekt aus, ohne dass Sie etwas eintragen müssen:<\/p>\n<ul>\n  <li><strong>Kennzahlen<\/strong> — Geräte, Verbindungen, Bereiche, Ebenen, Fotos, Bilddatenmenge.<\/li>\n  <li><strong>Geräte nach Kategorie<\/strong> und <strong>Betriebsstatus<\/strong> als Balken.<\/li>\n  <li><strong>IP-Netze<\/strong> — aus den erfassten Adressen abgeleitet, mit Anzahl und belegtem Bereich.<\/li>\n  <li><strong>VLANs<\/strong> — aus Geräten und Verbindungen zusammengetragen.<\/li>\n  <li><strong>Verbindungsarten<\/strong> — wie viel Gigabit, wie viel 10-Gigabit, wie viel WLAN.<\/li>\n  <li><strong>Dokumentationsgrad<\/strong> — Anteil der Geräte mit IP, Hostname, MAC, Standort,\n      Hersteller und Foto. Der schnellste Weg zu der Frage „was fehlt noch?“.<\/li>\n  <li><strong>Nicht verbundene Geräte<\/strong> — Klick springt zum Gerät. Meist vergessene Leitungen.<\/li>\n  <li><strong>Modellbahn<\/strong> — erscheint, sobald entsprechende Komponenten im Projekt sind.<\/li>\n<\/ul>\n\n<h3 id=\"k18-2\">18.2 Erkennung<\/h3>\n<p>Zeigt das Ergebnis der letzten Analyse: Kennzahlen, verwendete Quellen, erkanntes Gateway,\nNetze, gefundene Nachbarschaften und Switchport-Zuordnungen — darunter die vollständige\nHostliste mit Typvorschlag, Begründung, offenen Ports und Abgleichstatus. Nach jeder Analyse\nöffnet sich diese Ansicht automatisch.<\/p>\n<\/section>\n\n\n<section id=\"modellbahn\">\n<h2 id=\"k19\">19. Modellbahn-Digitalkomponenten<\/h2>\n\n<p class=\"lead\">Moderne Modellbahnsteuerungen sind vollwertige Netzwerkteilnehmer: Zentralen\nmit LAN und WLAN, Handregler über WLAN, Steuerrechner mit Automatikprogrammen, Booster und\nRückmelder über Bus-Gateways. Damit gilt für die Anlage dasselbe wie für ein Firmennetz — ohne\nPlan sucht man lange.<\/p>\n\n<h3 id=\"k19-1\">19.1 Verfügbare Komponenten<\/h3>\n<p>Die Kategorie <span class=\"ui\">Modellbahn (Digital)<\/span> in der Seitenleiste enthält:<\/p>\n<table>\n<thead><tr><th>Komponente<\/th><th>Typische Rolle im Netz<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>ESU ECoS<\/td><td>Digitalzentrale mit LAN, Webinterface und eigenem Steuerport<\/td><\/tr>\n<tr><td>Märklin CS3<\/td><td>Zentrale mit LAN/WLAN, Webinterface und CAN-Bus über Ethernet<\/td><\/tr>\n<tr><td>Roco/Fleischmann Z21<\/td><td>Zentrale mit LAN und WLAN, Handregler über App<\/td><\/tr>\n<tr><td>Uhlenbrock Intellibox<\/td><td>Zentrale mit LocoNet, per Gateway im Netz<\/td><\/tr>\n<tr><td>Digikeijs DR5000<\/td><td>Multibus-Zentrale mit LAN, WLAN, LocoNet und XpressNet<\/td><\/tr>\n<tr><td>ZIMO MX10<\/td><td>Zentrale mit LAN und CAN<\/td><\/tr>\n<tr><td>Tams MasterControl<\/td><td>Zentrale mit LAN-Anbindung<\/td><\/tr>\n<tr><td>DCC-EX Zentrale<\/td><td>Selbstbauzentrale, meist über WLAN<\/td><\/tr>\n<tr><td>Booster<\/td><td>Leistungsverstärker je Stromkreis<\/td><\/tr>\n<tr><td>Rückmeldemodul<\/td><td>Belegtmelder, häufig über S88 oder LocoNet<\/td><\/tr>\n<tr><td>Bus-Gateway<\/td><td>Übergang LocoNet/XpressNet ↔ Ethernet<\/td><\/tr>\n<tr><td>WLAN-Handregler<\/td><td>Handgerät oder Smartphone-App als Fahrpult<\/td><\/tr>\n<tr><td>Steuerrechner<\/td><td>JMRI, Rocrail, iTrain, TrainController, WinDigipet<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<h3 id=\"k19-2\">19.2 Ports, Busse und Protokolle<\/h3>\n<p>Jede Komponente bringt eine Portliste als <strong>Vorschlag<\/strong> mit — etwa\n<code>LAN<\/code>, <code>CAN 1<\/code>, <code>Gleisausgang<\/code>, <code>S88 In<\/code>. Passen Sie\nsie im Eigenschaftenfenster an Ihre Anlage an; es sind keine Herstellerangaben, sondern\nbearbeitbare Bezeichnungen.<\/p>\n<p>Für die Digitalprotokolle gibt es das Feld <span class=\"ui\">Protokoll / Bus<\/span>. Tragen Sie\ndort ein, was tatsächlich läuft, zum Beispiel:<\/p>\n<pre>DCC, mfx, MM2        (Zentrale mit Mehrformatbetrieb)\nDCC                  (Booster im Gleiskreis 2)\nS88-N                (Rückmelderkette Bahnhof)\nLocoNet              (Gateway zur Intellibox)<\/pre>\n<p>Das Dashboard zählt diese Angaben aus und zeigt sie in der Karte\n<em>Modellbahn-Digitalkomponenten<\/em>. So sehen Sie auf einen Blick, welche Protokolle im\nEinsatz sind und wo Mehrformatbetrieb nötig ist.<\/p>\n\n<h3 id=\"k19-3\">19.3 Erkennung im Netz<\/h3>\n<p>Die Netzwerkanalyse erkennt Digitalkomponenten an ihren Steuerports und Hostnamen:<\/p>\n<table>\n<thead><tr><th>Merkmal<\/th><th>Vorschlag<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>TCP 15471 offen<\/td><td>ESU ECoS<\/td><\/tr>\n<tr><td>UDP 15730/15731 offen<\/td><td>Märklin Central Station<\/td><\/tr>\n<tr><td>UDP 21105 offen<\/td><td>Roco/Fleischmann Z21<\/td><\/tr>\n<tr><td>TCP 2560 offen<\/td><td>DCC-EX Zentrale<\/td><\/tr>\n<tr><td>TCP 12080/12090 offen<\/td><td>Steuerrechner mit JMRI<\/td><\/tr>\n<tr><td>TCP 1234 offen<\/td><td>LocoNet über TCP (Gateway)<\/td><\/tr>\n<tr><td>Hostname mit „ecos“, „cs3“, „z21“, „dr5000“, „rocrail“ …<\/td><td>entsprechende Komponente<\/td><\/tr>\n<\/tbody>\n<\/table>\n<div class=\"note\">\n<strong>Wichtig für UDP:<\/strong> Märklin CS3 und Roco Z21 antworten auf UDP-Ports. Das\nmitgelieferte Analyse-Skript prüft nur TCP — diese Zentralen erscheinen dort zwar als\nerreichbarer Host, aber ohne Portmerkmal. Für die eindeutige Erkennung hilft zusätzlich:\n<pre>nmap -sU -p 15730,15731,21105 192.168.1.0/24 -oX udp.xml<\/pre>\nDie XML-Datei anschließend über <span class=\"ui\">Scan-Datei importieren<\/span> einlesen.\n<\/div>\n\n<h3 id=\"k19-4\">19.4 Empfohlener Aufbau der Dokumentation<\/h3>\n<ol class=\"steps\">\n<li>Zentrale, Steuerrechner und Switch als Kern zeichnen und verbinden.<\/li>\n<li>Booster mit Bereichen versehen — je Bereich ein Netzwerkbereich mit dem Gleiskreis als\n    Zusatztext, etwa „Kreis 2 · Bahnhof Nord“.<\/li>\n<li>Rückmelder und Gateways an die Zentrale hängen und im Feld <em>Protokoll / Bus<\/em>\n    dokumentieren, über welchen Bus sie laufen.<\/li>\n<li>Handregler auf eine eigene Ebene „WLAN“ legen — dann lässt sich die Funkseite separat zeigen.<\/li>\n<li>Fotos der Anschlussfelder hinterlegen. Bei Boostern und Rückmeldern ist ein Bild der\n    Klemmenreihe später Gold wert.<\/li>\n<\/ol>\n<\/section>\n\n\n<section id=\"symbole\">\n<h2 id=\"k20\">20. Eigene Symbole erstellen<\/h2>\n\n<p class=\"lead\">Reicht der eingebaute Katalog nicht — etwa für ein Hutschienen-Netzteil, einen\nspeziellen Sensor, ein Firmengerät oder eine Anlagenkomponente — legen Sie eigene Symbole an.\nSie erscheinen als vollwertige Komponenten in der linken Leiste und verhalten sich wie\neingebaute Typen: ziehen, verbinden, dokumentieren, exportieren.<\/p>\n\n<p>Der Editor öffnet sich über die Kachel <span class=\"ui\">+ Neues Symbol<\/span> in der\nKategorie <span class=\"ui\">Eigene Symbole<\/span> am Ende der Seitenleiste. Drei Wege führen\nzum Symbol.<\/p>\n\n<h3 id=\"k20-1\">20.1 Zeichnen<\/h3>\n<p>Der Reiter <span class=\"ui\">Zeichnen<\/span> bietet ein 24 × 24 großes Raster — dasselbe\nKoordinatensystem, das die eingebauten Symbole verwenden. Damit passt Ihr Symbol optisch zu\nden übrigen.<\/p>\n<table>\n<thead><tr><th>Werkzeug<\/th><th>Bedienung<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Linienzug<\/td><td>Klicken setzt Punkt für Punkt. <b>Doppelklick<\/b> oder <span class=\"ui\">Form abschließen<\/span> beendet den Zug. Danach beginnt ein neuer.<\/td><\/tr>\n<tr><td>Rechteck<\/td><td>Zwei Klicks: erste und gegenüberliegende Ecke.<\/td><\/tr>\n<tr><td>Kreis<\/td><td>Zwei Klicks: Mittelpunkt und ein Punkt auf dem Rand.<\/td><\/tr>\n<tr><td>Halbes Raster<\/td><td>Erlaubt Punkte auf halben Rasterschritten — nützlich für Schrägen und kleine Details.<\/td><\/tr>\n<tr><td>Zurück<\/td><td>Nimmt den letzten Punkt zurück, bei abgeschlossenen Formen die letzte Form.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Rechts sehen Sie das Ergebnis sofort zweimal: als Katalogkachel und als Gerätekachel in\nOriginalgröße der Zeichenfläche.<\/p>\n<div class=\"note\">\nDie eingebauten Symbole sind reine <em>Strichzeichnungen<\/em> ohne Füllung, mit Strichstärke\n1,6 und runden Enden. Wer sich daran hält, erhält ein Diagramm, das wie aus einem Guss wirkt.\nDrei bis sechs Formen genügen fast immer.\n<\/div>\n\n<h3 id=\"k20-2\">20.2 SVG einfügen<\/h3>\n<p>Haben Sie schon eine Vektorgrafik — vom Hersteller, aus einer Icon-Sammlung oder aus\nInkscape —, fügen Sie sie im Reiter <span class=\"ui\">SVG einfügen<\/span> als Text ein oder\nwählen eine <code>.svg<\/code>-Datei. <span class=\"ui\">Übernehmen &amp; Vorschau<\/span> zeigt das\nErgebnis.<\/p>\n<p>Am besten funktionieren einfache, einfarbige Strichsymbole. Verwendet die Grafik\n<code>currentColor<\/code> oder gar keine Farbangabe, übernimmt das Symbol automatisch die\neingestellte Gerätefarbe.<\/p>\n<div class=\"note note-warn\">\n<strong>Sicherheit:<\/strong> Eingefügtes SVG wird streng gefiltert. Erhalten bleiben\nausschließlich Geometrie-Elemente (<code>path<\/code>, <code>rect<\/code>, <code>circle<\/code>,\n<code>ellipse<\/code>, <code>line<\/code>, <code>polyline<\/code>, <code>polygon<\/code>,\n<code>g<\/code>) und eine feste Liste von Zeichenattributen. Skripte, Ereignis-Attribute,\neingebettete Bilder, Verweise auf externe Ressourcen und alles andere werden entfernt — auch\ndann, wenn das SVG aus einer fremden Projektdatei stammt.\n<\/div>\n\n<h3 id=\"k20-3\">20.3 Bilddatei verwenden<\/h3>\n<p>Im Reiter <span class=\"ui\">Bilddatei<\/span> ziehen Sie eine PNG-, JPG-, GIF- oder\nWebP-Datei in das Feld. Das Bild wird auf 128 Pixel verkleinert und als Symbol verwendet.\nFreigestellte Bilder mit transparentem Hintergrund wirken am besten.<\/p>\n<p>Für ein echtes <em>Gerätefoto<\/em> ist dieser Weg nicht gedacht — Fotos gehören an das\neinzelne Gerät (siehe <a href=\"#k16\">Kapitel 16<\/a>). Das Symbol steht für den <em>Typ<\/em>,\ndas Foto für das <em>Exemplar<\/em>.<\/p>\n\n<h3 id=\"k20-4\">20.4 Bezeichnung, Kategorie, Farbe, Ports<\/h3>\n<p>Rechts im Editor legen Sie fest:<\/p>\n<ul>\n  <li><strong>Bezeichnung<\/strong> — erscheint in der Kachel, im Gerätetyp-Feld und in der Suche.<\/li>\n  <li><strong>Kategorie<\/strong> — ordnet das Symbol in eine bestehende Gruppe der Seitenleiste\n      ein. Mit <em>Eigene Symbole<\/em> bleibt es am Ende gesammelt.<\/li>\n  <li><strong>Farbe<\/strong> — färbt Symbol, Farbstreifen der Kachel und Katalogeintrag.<\/li>\n  <li><strong>Ports<\/strong> — die Vorbelegung für neue Geräte dieses Typs, eine Zeile je Port.\n      Sie steht später im Verbindungsdialog zur Auswahl.<\/li>\n<\/ul>\n\n<h3 id=\"k20-5\">20.5 Speicherung und Weitergabe<\/h3>\n<p>Eigene Symbole gehören zum Projekt und liegen im Feld <code>customTypes<\/code>. Sie werden\ndaher mitgespeichert und mitexportiert:<\/p>\n<ul>\n  <li>Browser-Speicher und automatische Sicherung enthalten sie.<\/li>\n  <li>Eine exportierte JSON-Datei bringt sie beim Empfänger mit — dort erscheinen sie\n      automatisch in der Seitenleiste.<\/li>\n  <li>Der SVG-Export bettet sie in die Grafik ein.<\/li>\n<\/ul>\n<p>Möchten Sie einen Symbolsatz in ein anderes Projekt übernehmen, exportieren Sie das\nAusgangsprojekt als JSON und kopieren den <code>customTypes<\/code>-Abschnitt in die\nZieldatei — oder legen ein Vorlagenprojekt an, das nur die Symbole enthält.<\/p>\n\n<h3 id=\"k20-6\">20.6 Bearbeiten und Löschen<\/h3>\n<p>Ein eigenes Symbol wird über das kleine <span class=\"ui\">✎<\/span> auf der Kachel oder per\nDoppelklick darauf bearbeitet. Die Kacheln eigener Symbole sind an der gestrichelten Umrandung\nerkennbar.<\/p>\n<p>Beim Löschen erhalten alle Geräte, die das Symbol verwenden, den Typ <em>Desktop-PC<\/em>.\nDer Dialog nennt die betroffene Anzahl vorher, und der Vorgang ist mit\n<kbd>Strg<\/kbd>+<kbd>Z<\/kbd> zurücknehmbar.<\/p>\n<\/section>\n\n\n<section id=\"darstellung\">\n<h2 id=\"k21\">21. Darstellung und Einstellungen<\/h2>\n\n<p class=\"lead\">Alle Optionen des Programms liegen an einem Ort: der Einstellungsseite. Sie\nöffnet sich über das Zahnrad <span class=\"ui\">⚙<\/span> rechts in der Werkzeugleiste oder mit\n<kbd>Strg<\/kbd>+<kbd>,<\/kbd> und schließt mit <kbd>Esc<\/kbd>. Änderungen wirken sofort — es gibt\nkein „Übernehmen“.<\/p>\n\n<h3 id=\"k21-1\">21.1 Was wo gespeichert wird<\/h3>\n<p>Eine Unterscheidung, die im Alltag zählt:<\/p>\n<table>\n<thead><tr><th>Art<\/th><th>Beispiele<\/th><th>Wo<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><strong>Projekteinstellungen<\/strong><\/td>\n    <td>Raster, Rastergröße, Linienführung, Bilder, Hardware-Ansicht, Übersichtskarte,\n        Standard-Verbindungstyp, Zielebene<\/td>\n    <td>im Projekt — reisen mit einer exportierten JSON-Datei mit<\/td><\/tr>\n<tr><td><strong>Arbeitsplatzvorlieben<\/strong><\/td>\n    <td>Hinweisfenster (Tipps)<\/td>\n    <td>im Browser — gelten nur an diesem Rechner und werden nicht weitergegeben<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Wer einen Netzplan an einen Kollegen schickt, gibt also die Ansicht mit, aber nicht die\npersönliche Vorliebe, ob Hinweisfenster erscheinen.<\/p>\n\n<h3 id=\"k21-2\">21.2 Ansicht<\/h3>\n<ul>\n  <li><strong>Raster anzeigen<\/strong> und <strong>Am Raster ausrichten<\/strong> — dieselben\n      Schalter wie in der Werkzeugleiste.<\/li>\n  <li><strong>Rastergröße<\/strong> — 5 bis 200 Pixel, Standard 20. Bestimmt gleichzeitig die\n      Schrittweite von <kbd>Umschalt<\/kbd> + Pfeiltaste.<\/li>\n  <li><strong>Linienführung<\/strong> — orthogonal, gerade oder gebogen für alle Verbindungen.<\/li>\n  <li><strong>Übersichtskarte anzeigen<\/strong> — blendet die Minimap unten rechts vollständig\n      aus, wenn sie stört.<\/li>\n<\/ul>\n\n<h3 id=\"k21-3\">21.3 Gerätedarstellung: die Reihenfolge<\/h3>\n<p>Eine Gerätekachel kann statt des Strichsymbols einen Bildstreifen zeigen. Welches Bild das\nist, entscheidet eine feste Rangfolge — die erste zutreffende Quelle gewinnt:<\/p>\n<ol class=\"steps\">\n<li><strong>Eigenes Gerätefoto<\/strong> — das Foto genau dieses Exemplars\n    (siehe <a href=\"#k16\">Kapitel 16<\/a>).<\/li>\n<li><strong>Typbild<\/strong> — ein Bild, das für <em>alle<\/em> Geräte dieses Typs gilt.<\/li>\n<li><strong>Bildbibliothek<\/strong> — aus dem Ordner <code>bilder/<\/code> automatisch zugeordnet\n    (siehe <a href=\"#k21-6\">21.6<\/a>).<\/li>\n<li><strong>Hardware-Ansicht<\/strong> — die mitgelieferte gezeichnete Frontblende, sofern\n    eingeschaltet.<\/li>\n<li><strong>Strichsymbol<\/strong> — die schlichte Standarddarstellung.<\/li>\n<\/ol>\n<p>Zwei Schalter steuern das:<\/p>\n<table>\n<tbody>\n<tr><td>Bilder auf der Zeichenfläche<\/td>\n    <td>Schaltet Gerätefotos <em>und<\/em> Typbilder ab. Die Bilder bleiben im Projekt\n        gespeichert und im Eigenschaftenfenster sichtbar — nur die Zeichenfläche wird ruhiger.<\/td><\/tr>\n<tr><td>Hardware-Ansicht statt Symbol<\/td>\n    <td>Zeigt für rund 46 Gerätetypen eine gezeichnete Frontblende: Portreihen, LEDs, Displays,\n        Rack-Ohren, Laufwerksschächte.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<div class=\"note\">\nSobald eine Kachel einen Bildstreifen zeigt, entfällt das kleine Strichsymbol darunter — das\nBild sagt bereits, worum es geht. Die Kachel wächst dabei von 88 auf 108 Pixel Höhe. Wer viele\nGeräte auf engem Raum hat, schaltet die Bilder für den Ausdruck einfach ab.\n<\/div>\n\n<h3 id=\"k21-4\">21.4 Die Hardware-Ansicht<\/h3>\n<p>Die Frontblenden sind <strong>gezeichnete Darstellungen<\/strong>, keine Fotos. Sie zeigen die\nBauform: ein 19-Zoll-Server mit Laufwerksschächten und Rack-Ohren, ein Managed Switch mit zwei\nReihen zu je elf Ports und SFP-Käfigen, eine Firewall-Appliance mit LC-Display, ein NAS mit\nEinschüben, ein Access Point in Aufsicht, eine Digitalzentrale mit Display und zwei Drehreglern.<\/p>\n<p>Mehrere Gerätetypen teilen sich bewusst dieselbe Ansicht — ein Webserver und ein\nDatenbankserver sehen im Rack nun einmal gleich aus. Typen ohne Frontblende, etwa\n<em>Internet<\/em> oder <em>Cloud<\/em>, behalten ihr Strichsymbol; das ist beabsichtigt, denn für\neinen abstrakten Begriff gibt es keine Bauform.<\/p>\n<p>Die Ansichten sind Vektorgrafiken: sie bleiben bei jedem Zoom scharf, kosten kaum\nSpeicherplatz und erscheinen unverändert im SVG- und PNG-Export sowie im Ausdruck.<\/p>\n\n<h3 id=\"k21-5\">21.5 Gerätebilder je Typ<\/h3>\n<p>Im breiten Bereich unten auf der Einstellungsseite steht für jeden Gerätetyp eine Kachel.\nDort hinterlegen Sie ein eigenes Bild — per <span class=\"ui\">Bild wählen<\/span> oder indem Sie\neine Bilddatei direkt auf die Kachel ziehen. Dieses Bild gilt anschließend für <em>alle<\/em>\nGeräte dieses Typs.<\/p>\n<p>Das ist der schnellste Weg zu einem Plan mit echten Gerätebildern: Sie fotografieren jeden\nGerätetyp einmal statt jedes einzelne Gerät. Ein individuelles Foto am einzelnen Gerät hat\nweiterhin Vorrang — so dokumentieren Sie die Ausnahme, ohne die Regel aufzugeben.<\/p>\n<p>Der Schalter <span class=\"ui\">Nur verwendete Typen zeigen<\/span> beschränkt die Liste auf\nTypen, die im Projekt vorkommen. Ohne hinterlegtes Bild zeigt die Kachel als Vorschau die\ngezeichnete Hardware-Ansicht.<\/p>\n<p>Bilder werden wie Gerätefotos auf 640 Pixel verkleinert und im Projekt gespeichert. Die\nbelegte Menge steht direkt darunter und in der Karte <em>Speicher<\/em>.<\/p>\n\n<h3 id=\"k21-6\">21.6 Bildbibliothek: Bilder automatisch zuordnen<\/h3>\n<p>Wer viele Gerätebilder hat, will sie nicht einzeln zuweisen. Dafür gibt es die\nBildbibliothek — mit zwei Wegen, die sich ergänzen.<\/p>\n\n<h4>Weg 1: Ordner <code>bilder/<\/code> beim Bauen einbetten<\/h4>\n<p>Legen Sie Bilddateien in den Ordner <code>bilder/<\/code> neben dem Quellcode und bauen Sie\nmit <code>node build.js<\/code> neu. Die Bilder werden in die HTML-Datei eingebettet und stehen\ndanach in <strong>jedem<\/strong> Projekt zur Verfügung — ohne die Projektdatei zu vergrößern,\ndenn gespeichert wird nur der Dateiname der Zuordnung.<\/p>\n<p>Der Build meldet Anzahl und Gesamtgröße und warnt bei einzelnen Dateien über 80&nbsp;KB.\nFür einen 120 Pixel breiten Bildstreifen genügen rund 600 Pixel Kantenlänge; ein 1500 Pixel\nbreites Foto ist das Vierzehnfache des Nötigen und bläht die Auslieferungsdatei auf.<\/p>\n<div class=\"note\">\nDer Build kann Bilder <em>nicht<\/em> verkleinern — Node bringt ohne Zusatzpakete keinen\nBildskalierer mit, und ein solches Paket würde die Abhängigkeitsfreiheit des Projekts opfern.\nVerkleinern Sie die Dateien vorher, oder nutzen Sie Weg 2, der im Browser skaliert.\n<\/div>\n\n<h4>Weg 2: Ordner in der Anwendung einlesen<\/h4>\n<p>Auf der Einstellungsseite unter <span class=\"ui\">Bildbibliothek<\/span> →\n<span class=\"ui\">Bi
