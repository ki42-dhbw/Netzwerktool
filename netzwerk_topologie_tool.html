/* ======================= 10-persistence.js ======================= */
/* ============================================================
   10 — Persistenz: localStorage, Projektliste, Autosave
   ============================================================ */

NWT.Persistence = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const Model = NWT.Model;

  const K_INDEX = 'nwt.index';
  const K_PREFIX = 'nwt.project.';
  const K_AUTOSAVE = 'nwt.autosave';
  const K_PREFS = 'nwt.prefs';

  let dirty = false, lastSaved = '', failure = '', revision = 0;
  function status() { return { dirty: dirty, lastSaved: lastSaved, failure: failure, revision: revision }; }
  function publish() { NWT.emit('storage:status', status()); }
  function markDirty() { dirty = true; revision++; publish(); }
  function markSaved(recordTime) { dirty = false; failure = ''; lastSaved = recordTime === false ? '' : U.nowIso(); publish(); }

  function available() {
    try {
      const probe = '__nwt_probe__';
      window.localStorage.setItem(probe, '1');
      window.localStorage.removeItem(probe);
      return true;
    } catch (e) {
      return false;
    }
  }

  function warnUnavailable() {
    NWT.Modal.alert({
      title: 'Browser-Speicher nicht verfügbar',
      html: '<div class="msg-body"><p>Dieser Browser erlaubt keinen Zugriff auf <code>localStorage</code> ' +
            '(z. B. im privaten Modus oder bei geblockten Website-Daten).</p>' +
            '<p>Speichern und automatische Sicherung sind deaktiviert. ' +
            'Nutzen Sie stattdessen <b>Export</b>, um das Projekt als JSON-Datei zu sichern.</p></div>'
    });
  }

  function readIndex() {
    try {
      const raw = window.localStorage.getItem(K_INDEX);
      const list = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(list)) throw new Error('Ungültiger Index');
      return list.filter(e => e && typeof e.id === 'string' && typeof e.name === 'string');
    } catch (e) {
      const recovered = [];
      try {
        Object.keys(localStorage).filter(k => k.startsWith(K_PREFIX)).forEach(k => {
          try {
            const p = JSON.parse(localStorage.getItem(k));
            const meta = projectMeta(k.slice(K_PREFIX.length), String(p.name || 'Wiederhergestellt'), p);
            recovered.push(meta);
          } catch (err) { /* Einzelne beschädigte Projekte beeinflussen die übrigen nicht. */ }
        });
        writeIndex(recovered);
      } catch (err) { /* Lesen bleibt auch bei erschöpfter Schreibquote erlaubt. */ }
      return recovered;
    }
  }

  function writeIndex(list) {
    window.localStorage.setItem(K_INDEX, JSON.stringify(list));
  }

  function handleQuota(e) {
    failure = 'Speichern fehlgeschlagen — bitte JSON exportieren'; publish();
    const quota = e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
    NWT.Modal.alert({
      title: quota ? 'Speicherplatz erschöpft' : 'Speichern fehlgeschlagen',
      html: '<div class="msg-body"><p>' +
        (quota
          ? 'Der Browser-Speicher ist voll. Löschen Sie nicht mehr benötigte Projekte in der Ladeliste.'
          : 'Das Projekt konnte nicht im Browser gespeichert werden.') +
        '</p><p>Das Projekt lässt sich weiterhin über <b>Export → Projekt als JSON</b> sichern.</p>' +
        (e && e.message ? '<p><code>' + U.escapeHtml(e.message) + '</code></p>' : '') + '</div>'
    });
    return false;
  }

  function projectMeta(id, name, data) {
    return {
      id: id, name: name,
      saved: U.nowIso(),
      devices: data.devices.length,
      connections: data.connections.length
    };
  }

  /** Speichert das aktuelle Projekt unter einem Namen. */
  function saveProject(name) {
    const P = S.project;
    name = String(name || '').trim();
    if (!name) return false;
    const data = Model.serialize(P);
    data.name = name;

    const index = readIndex();
    let entry = index.find(e => e.name === name);
    const id = entry ? entry.id : (U.slugify(name) + '_' + Date.now().toString(36));

    let previous = null;
    const meta = projectMeta(id, name, data);
    if (entry) Object.assign(entry, meta);
    else index.push(meta);
    index.sort((a, b) => (b.saved || '').localeCompare(a.saved || ''));
    try {
      previous = window.localStorage.getItem(K_PREFIX + id);
      window.localStorage.setItem(K_PREFIX + id, JSON.stringify(data));
      try { writeIndex(index); }
      catch (err) {
        if (previous === null) window.localStorage.removeItem(K_PREFIX + id);
        else window.localStorage.setItem(K_PREFIX + id, previous);
        throw err;
      }
    } catch (e) {
      return handleQuota(e);
    }

    P.name = name;
    P.info.modified = data.info.modified;
    markSaved();
    if (NWT.Recovery) NWT.Recovery.capture('Manuell gespeichert').catch(() => {});
    NWT.emit('project:meta');
    return true;
  }

  function listProjects() { return readIndex(); }

  function loadProject(id) {
    const raw = window.localStorage.getItem(K_PREFIX + id);
    if (!raw) throw new Error('Das gespeicherte Projekt wurde nicht gefunden.');
    const result = Model.validate(JSON.parse(raw));
    return result;
  }

  function deleteProject(id) {
    try {
      const list = readIndex();
      writeIndex(list.filter(e => e.id !== id));
      try { window.localStorage.removeItem(K_PREFIX + id); }
      catch (e) { writeIndex(list); throw e; }
      failure = ''; publish();
      return true;
    } catch (e) { return handleQuota(e); }
  }

  /* ------------------------------------------------------------ Autosave */

  const autosave = U.debounce(function () {
    try {
      window.localStorage.setItem(K_AUTOSAVE, JSON.stringify(Model.serialize(S.project)));
      NWT.emit('ui:autosaved');
      failure = ''; lastSaved = U.nowIso(); publish();
      if (NWT.Recovery) NWT.Recovery.capture('Automatische Sicherung', true).catch(() => {});
    } catch (e) {
      failure = 'Automatische Sicherung fehlgeschlagen — bitte JSON exportieren'; publish();
      if (NWT.Recovery) NWT.Recovery.capture('Sicherung bei Speicherfehler').catch(() => {});
    }
  }, 900);

  function hasAutosave() {
    try { return !!window.localStorage.getItem(K_AUTOSAVE); } catch (e) { return false; }
  }

  function restoreAutosave() {
    try {
      const raw = window.localStorage.getItem(K_AUTOSAVE);
      if (!raw) return null;
      return Model.validate(JSON.parse(raw));
    } catch (e) {
      console.warn('[NWT] Automatische Sicherung unbrauchbar.', e);
      return null;
    }
  }

  function clearAutosave() {
    try { window.localStorage.removeItem(K_AUTOSAVE); } catch (e) { /* egal */ }
  }

  function init() {
    /* Jede inhaltliche Änderung stößt die verzögerte Sicherung an. */
    NWT.on('change', payload => {
      if (payload && payload.viewOnly) return;
      markDirty();
      autosave();
    });
    NWT.on('view', autosave);
    window.addEventListener('beforeunload', e => {
      autosave.flush();
      if (dirty && failure) { e.preventDefault(); e.returnValue = ''; }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) autosave.flush(); });
    window.addEventListener('storage', e => {
      if (e.key === K_AUTOSAVE && dirty) { failure = 'Anderes Fenster hat gesichert — eigene Änderungen bitte als JSON exportieren'; publish(); }
    });
  }

  /* --------------------------------------------------- Benutzereinstellungen
     Bedienvorlieben (z. B. Hinweisfenster) gehören zum Arbeitsplatz, nicht zum
     Projekt — sie werden getrennt abgelegt und nicht mit exportiert. */

  let prefsCache = null;

  function readPrefs() {
    if (prefsCache) return prefsCache;
    prefsCache = {};
    {
      try {
        const raw = window.localStorage.getItem(K_PREFS);
        const obj = raw ? JSON.parse(raw) : null;
        if (obj && typeof obj === 'object' && !Array.isArray(obj)) prefsCache = obj;
      } catch (e) {
        console.warn('[NWT] Benutzereinstellungen unlesbar, Standardwerte werden verwendet.', e);
      }
    }
    return prefsCache;
  }

  const Prefs = {
    get(key, fallback) {
      const p = readPrefs();
      return Object.prototype.hasOwnProperty.call(p, key) ? p[key] : fallback;
    },
    set(key, value) {
      const p = readPrefs();
      p[key] = value;
      try { window.localStorage.setItem(K_PREFS, JSON.stringify(p)); }
      catch (e) { /* Vorlieben sind entbehrlich — keine Meldung nötig */ }
    }
  };

  return {
    init, available, saveProject, listProjects, loadProject, deleteProject,
    hasAutosave, restoreAutosave, clearAutosave, autosave, warnUnavailable, Prefs,
    status, markDirty, markSaved
  };
})();

NWT.Prefs = NWT.Persistence.Prefs;


/* ======================= 11-exchange.js ======================= */
/* ============================================================
   11 — Austausch: JSON-Export/Import, SVG, PNG, Druck
   ============================================================ */

NWT.Exchange = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const Model = NWT.Model;

  /* --------------------------------------------------------------- JSON */

  function exportJson() {
    const data = Model.serialize(S.project);
    S.project.info.modified = data.info.modified;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
    U.downloadBlob(blob, U.slugify(S.project.name) + '.json');
    NWT.Persistence.markSaved();
    U.toast('Projekt als JSON exportiert', 'ok');
  }

  function importFile(file) {
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) {
      NWT.Modal.error('Die Datei ist zu groß (> 25 MB) und wird nicht geladen.');
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => NWT.Modal.error('Die Datei konnte nicht gelesen werden.');
    reader.onload = () => {
      let raw;
      try {
        raw = JSON.parse(String(reader.result));
      } catch (e) {
        NWT.Modal.error('Die Datei enthält kein gültiges JSON.', e.message);
        return;
      }
      let result;
      try {
        result = Model.validate(raw);
      } catch (e) {
        NWT.Modal.error('Die Datei ist keine gültige Projektdatei.', e.message);
        return;
      }
      applyImported(result, file.name);
    };
    reader.readAsText(file);
  }

  function applyImported(result, filename) {
    const doIt = () => {
      S.setProject(result.project);
      NWT.Viewport.apply();
      if (result.project.devices.length) NWT.Viewport.zoomToFit();
      NWT.emit('project:meta');
      NWT.emit('change', { structural: true });
      const w = result.warnings || [];
      if (w.length) {
        NWT.Modal.alert({
          title: 'Projekt importiert — mit Hinweisen',
          html: '<div class="msg-body"><p>Die Datei wurde geladen, dabei wurden Korrekturen vorgenommen:</p><ul>' +
                w.slice(0, 12).map(s => '<li>' + U.escapeHtml(s) + '</li>').join('') +
                (w.length > 12 ? '<li>… und ' + (w.length - 12) + ' weitere</li>' : '') + '</ul></div>'
        });
      } else {
        U.toast('Projekt importiert: ' + result.project.name, 'ok');
      }
    };

    return NWT.ProjectFlow.replace(doIt, 'Projekt importieren: ' + (filename || result.project.name));
  }

  /* ---------------------------------------------------------------- SVG */

  function diagramBounds(pad) {
    const vp = document.getElementById('viewport');
    try {
      const b = vp.getBBox();
      if (b.width > 0 && b.height > 0) {
        return { x: b.x - pad, y: b.y - pad, w: b.width + pad * 2, h: b.height + pad * 2, empty: false };
      }
    } catch (e) { /* Fallback unten */ }
    return S.contentBounds(pad);
  }

  function buildSvgString() {
    NWT.Render.clearOverlay();
    const b = diagramBounds(40);
    const ser = new XMLSerializer();

    /* Icon-Symbole UND der Zuschnitt der Gerätefotos müssen mit in die
       <defs>, sonst bleiben im Export Symbole leer bzw. Fotos unbeschnitten. */
    const defs = ['clip-node-photo', 'icon-defs', 'hw-defs', 'custom-defs']
      .map(id => {
        const el = document.getElementById(id);
        return el ? ser.serializeToString(el) : '';
      }).join('');

    const parts = [];
    ['#l-areas', '#l-deco', '#l-edges', '#l-nodes', '#l-deco-front'].forEach(sel => {
      const src = document.querySelector(sel);
      if (!src) return;
      const copy = src.cloneNode(true);
      copy.removeAttribute('id');
      copy.querySelectorAll('[tabindex], [role], [aria-label]').forEach(el => {
        el.removeAttribute('tabindex'); el.removeAttribute('role'); el.removeAttribute('aria-label');
      });
      /* Auswahl- und Interaktionszustände gehören nicht in den Export. */
      copy.querySelectorAll('.sel, .connect-src, .flash').forEach(el => {
        el.classList.remove('sel', 'connect-src', 'flash');
      });
      copy.querySelectorAll('.node-halo, .area-handle, .node-handle, .edge-point, .edge-hit, .node-hit')
        .forEach(el => el.remove());
      /* Ausgeblendete Alternativen (Symbol vs. Bildstreifen) gehören nicht
         in den Export — sonst stünden beide Varianten in der Datei. */
      copy.querySelectorAll('[style*="display: none"], [style*="display:none"]')
        .forEach(el => el.remove());
      parts.push(ser.serializeToString(copy));
    });

    const css = (window.__NWT_DIAGRAM_CSS__ || '').replace(/]]>/g, '');
    const w = Math.max(1, Math.round(b.w));
    const h = Math.max(1, Math.round(b.h));

    return '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" ' +
      'width="' + w + '" height="' + h + '" viewBox="' + b.x + ' ' + b.y + ' ' + b.w + ' ' + b.h + '">\n' +
      '<title>' + U.escapeHtml(S.project.name) + '</title>\n' +
      '<style type="text/css"><![CDATA[\n' + css + '\n]]></style>\n' +
      '<rect x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h + '" fill="#ffffff"/>\n' +
      '<defs>' + defs + '</defs>\n' +
      parts.join('\n') + '\n</svg>\n';
  }

  /**
   * Baut die SVG-Zeichenkette und die Maße in einem Zug — beides muss
   * denselben Zustand sehen. Maskierter Text ist unterschiedlich breit;
   * würde man die Maße danach ermitteln, passte der Rahmen nicht mehr.
   */
  function snapshot(masked) {
    return NWT.Privacy.withMasking(masked, () => ({
      svg: buildSvgString(), bounds: diagramBounds(40)
    }));
  }

  function nothingToExport() {
    if (S.project.devices.length) return false;
    NWT.Modal.alert({ title: 'Nichts zu exportieren', message: 'Die Zeichenfläche ist leer.' });
    return true;
  }

  function saveSvg(shot) {
    const blob = new Blob([shot.svg], { type: 'image/svg+xml;charset=utf-8' });
    U.downloadBlob(blob, U.slugify(S.project.name) + '.svg');
    U.toast('Diagramm als SVG exportiert', 'ok');
  }

  function exportSvg() {
    if (nothingToExport()) return;
    try {
      saveSvg(snapshot(NWT.Privacy.active()));
    } catch (e) {
      NWT.Modal.error('Der SVG-Export ist fehlgeschlagen.', e.message);
    }
  }

  /* ---------------------------------------------------------------- PNG */

  function exportPng(scale) {
    if (nothingToExport()) return;
    let shot;
    try { shot = snapshot(NWT.Privacy.active()); }
    catch (e) { NWT.Modal.error('Das Diagramm konnte nicht aufbereitet werden.', e.message); return; }
    savePng(shot, scale || 2);
  }

  function savePng(shot, factor) {
    const svgString = shot.svg;
    const b = shot.bounds;
    const w = Math.max(1, Math.round(b.w * factor));
    const h = Math.max(1, Math.round(b.h * factor));
    if (w * h > 40e6) {
      NWT.Modal.error('Das Diagramm ist für einen PNG-Export zu groß. Bitte SVG verwenden.');
      return;
    }

    const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();

    img.onload = function () {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(function (png) {
          URL.revokeObjectURL(url);
          if (!png) { NWT.Modal.error('Das PNG konnte nicht erzeugt werden.'); return; }
          U.downloadBlob(png, U.slugify(S.project.name) + '.png');
          U.toast('Diagramm als PNG exportiert (' + w + '×' + h + ')', 'ok');
        }, 'image/png');
      } catch (e) {
        URL.revokeObjectURL(url);
        NWT.Modal.error('Das PNG konnte nicht erzeugt werden.', e.message);
      }
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      NWT.Modal.error('Das Diagramm konnte für den PNG-Export nicht gerendert werden. Bitte SVG verwenden.');
    };
    img.src = url;
  }

  /* ------------------------------------------- Bild mit Maskierung */

  /**
   * Ein Bild speichern und dabei entscheiden, was darin lesbar bleibt.
   * Die Maskierung greift in das Rendering ein, nicht in die fertige
   * Datei: ein Balken über echtem Text wäre in einer SVG-Datei bloße
   * Deko — die Angabe stünde weiterhin im Quelltext.
   */
  function exportImage() {
    if (nothingToExport()) return;
    const P = NWT.Privacy;
    const pv = P.settings();
    const fields = [
      { key: 'format', label: 'Format', type: 'select', options: [
        { value: 'png', label: 'PNG — Rastergrafik für Bericht, Folie, E-Mail' },
        { value: 'svg', label: 'SVG — beliebig skalierbar, Text bleibt Text' }
      ] },
      { key: 'scale', label: 'PNG-Größe', type: 'select', options: [
        { value: '1', label: 'einfach (Bildschirm)' },
        { value: '2', label: 'doppelt (empfohlen)' },
        { value: '3', label: 'dreifach (Druck)' }
      ] },
      { section: 'Vertrauliche Angaben' },
      { key: 'mask', label: 'Unkenntlich machen', type: 'checkbox', wide: true },
      { key: 'style', label: 'Art', type: 'select', options: P.STYLES, wide: true }
    ];
    P.GROUPS.forEach(g => fields.push({ key: 'g_' + g.key, label: g.label, type: 'checkbox', wide: true }));
    fields.push({ key: '_hint', type: 'static', wide: true, label: '',
      value: 'Maskiert wird der Text selbst, nicht ein Balken darüber — in der Datei steht danach ' +
             'nichts anderes mehr. Was auf einem Gerätefoto zu lesen ist, kann das Programm nicht ' +
             'erkennen; solche Bilder bleiben unverändert.' });

    const values = { format: 'png', scale: '2', mask: !!pv.on, style: pv.style };
    P.GROUPS.forEach(g => { values['g_' + g.key] = !!pv[g.key]; });

    return NWT.Modal.form({
      title: 'Als Bild speichern',
      subtitle: P.hasSensitive() ? 'Der Plan enthält Adressangaben.' : '',
      fields: fields,
      values: values,
      width: '640px',
      submitLabel: 'Speichern'
    }).then(res => {
      if (!res) return null;
      /* Die getroffene Wahl bleibt am Projekt stehen — beim nächsten
         Export steht sie wieder da, und die Zeichenfläche zeigt sie,
         sobald die Maskierung eingeschaltet ist. */
      const st = S.project.settings;
      st.privacy = Object.assign({}, st.privacy || P.DEFAULTS, { style: res.style });
      P.GROUPS.forEach(g => { st.privacy[g.key] = !!res['g_' + g.key]; });
      S.touch();

      let shot;
      try { shot = snapshot(!!res.mask); }
      catch (e) { NWT.Modal.error('Das Diagramm konnte nicht aufbereitet werden.', e.message); return null; }

      if (res.format === 'svg') saveSvg(shot);
      else savePng(shot, Number(res.scale) || 2);
      return true;
    });
  }

  /* -------------------------------------------------------------- Druck */

  let printState = null;

  function print() {
    window.print();
  }

  function init() {
    window.addEventListener('beforeprint', () => {
      const st = S.project.settings;
      printState = { zoom: st.zoom, panX: st.panX, panY: st.panY,
                     theme: document.documentElement.getAttribute('data-theme') };
      /* Gedruckt wird immer hell — ein Netzplan auf Schwarz ist auf Papier
         unbrauchbar und kostet zudem sinnlos Toner. */
      document.documentElement.setAttribute('data-theme', 'light');
      NWT.Render.clearOverlay();
      NWT.Viewport.zoomToFit(30);
    });
    window.addEventListener('afterprint', () => {
      if (!printState) return;
      const st = S.project.settings;
      st.zoom = printState.zoom; st.panX = printState.panX; st.panY = printState.panY;
      if (printState.theme) document.documentElement.setAttribute('data-theme', printState.theme);
      printState = null;
      NWT.Viewport.apply();
    });
  }

  return { init, exportJson, importFile, exportSvg, exportPng, exportImage, buildSvgString, print };
})();


/* ======================= 12-commands.js ======================= */
/* ============================================================
   12 — Kommandos: alles, was Werkzeugleiste, Kontextmenü und
   Tastatur gemeinsam auslösen können.
   ============================================================ */

NWT.Commands = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const C = NWT.Catalog;
  const M = NWT.Modal;
  const V = NWT.Viewport;
  const R = NWT.Render;
  const Model = NWT.Model;
  const P10 = NWT.Persistence;

  function isEmptyProject() {
    return !S.project.devices.length && !S.project.areas.length && !S.project.connections.length;
  }

  /* ------------------------------------------------------------ Projekt */

  function newProject() {
    const go = () => {
      S.setProject(Model.emptyProject());
      P10.clearAutosave();
      V.apply();
      NWT.emit('project:meta');
      NWT.emit('change', { structural: true });
      U.toast('Neues Netzwerk angelegt');
      P10.markSaved(false);
    };
    return NWT.ProjectFlow.replace(go, 'Neues Netzwerk');
  }

  async function saveProject() {
    const name = await M.prompt({
      title: 'Projekt speichern',
      subtitle: 'Das Projekt wird im Browser-Speicher abgelegt.',
      label: 'Projektname',
      value: S.project.name,
      placeholder: 'z. B. Netzwerk Labor 1',
      submitLabel: 'Speichern'
    });
      if (name == null) return false;
      const clean = name.trim();
      if (!clean) { M.error('Bitte einen Projektnamen eingeben.'); return false; }
      const exists = P10.listProjects().some(e => e.name === clean && clean !== S.project.name);
      const write = () => {
        if (P10.saveProject(clean)) {
          NWT.emit('project:meta');
          U.toast('Gespeichert: ' + clean, 'ok');
          return true;
        }
        return false;
      };
      if (exists) {
        const confirmed = await M.confirm({
          title: 'Projekt überschreiben?',
          message: 'Es existiert bereits ein Projekt mit dem Namen „' + clean + '“. Überschreiben?',
          confirmLabel: 'Überschreiben', danger: true
        });
        return confirmed ? write() : false;
      } else return write();
  }

  function openProject() {
    const list = P10.listProjects();
    const body = list.length
      ? '<div class="plist">' + list.map(e =>
          '<div class="plist-item" data-id="' + U.escapeHtml(e.id) + '">' +
            '<div class="pi-main">' +
              '<div class="pi-name">' + U.escapeHtml(e.name) + '</div>' +
              '<div class="pi-meta">' + U.formatDate(e.saved) + ' · ' + (e.devices || 0) + ' Geräte · ' +
                (e.connections || 0) + ' Verbindungen</div>' +
            '</div>' +
            '<button class="pi-del" data-del="' + U.escapeHtml(e.id) + '" title="Projekt löschen">🗑</button>' +
          '</div>').join('') + '</div>'
      : '<div class="empty-note">Es sind noch keine Projekte im Browser gespeichert.</div>';

    M.open({
      title: 'Projekt laden',
      subtitle: list.length ? list.length + ' gespeicherte Projekte' : '',
      bodyHtml: body,
      width: '560px',
      buttons: [{ label: 'Schließen', value: null }],
      onMount: (root, api) => {
        root.querySelectorAll('.plist-item').forEach(item => {
          item.addEventListener('click', e => {
            if (e.target.closest('[data-del]')) return;
            api.close({ open: item.getAttribute('data-id') });
          });
        });
        root.querySelectorAll('[data-del]').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            const id = btn.getAttribute('data-del');
            const entry = list.find(x => x.id === id);
            api.close({ del: id, name: entry ? entry.name : '' });
          });
        });
      }
    }).then(res => {
      if (!res) return;
      if (res.del) {
        M.confirm({
          title: 'Projekt löschen',
          message: 'Das gespeicherte Projekt „' + res.name + '“ endgültig löschen?',
          confirmLabel: 'Löschen', danger: true
        }).then(ok => {
          if (ok && P10.deleteProject(res.del)) U.toast('Projekt gelöscht');
          openProject();
        });
        return;
      }
      if (res.open) doOpen(res.open);
    });
  }

  function doOpen(id) {
    let result;
    try {
      result = P10.loadProject(id);
    } catch (e) {
      M.error('Das Projekt konnte nicht geladen werden.', e.message);
      return;
    }
    if (!result) return;
    return NWT.ProjectFlow.replace(() => {
    S.setProject(result.project);
    V.apply();
    NWT.emit('project:meta');
    NWT.emit('change', { structural: true });
    if (result.warnings.length) {
      M.alert({
        title: 'Projekt geladen — mit Hinweisen',
        html: '<div class="msg-body"><ul>' + result.warnings.slice(0, 10)
          .map(s => '<li>' + U.escapeHtml(s) + '</li>').join('') + '</ul></div>'
      });
    } else {
      U.toast('Geladen: ' + result.project.name, 'ok');
    }
    P10.markSaved();
    }, 'Projekt laden');
  }

  function clearCanvas() {
    if (isEmptyProject()) { U.toast('Die Zeichenfläche ist bereits leer.'); return; }
    M.confirm({
      title: 'Zeichenfläche löschen',
      message: 'Möchten Sie wirklich alle Geräte und Verbindungen löschen?',
      confirmLabel: 'Alles löschen', danger: true
    }).then(ok => {
      if (!ok) return;
      NWT.History.record('Zeichenfläche löschen');
      S.project.devices = [];
      S.project.connections = [];
      S.project.areas = [];
      S.selection.clear();
      S.reindex();
      S.touch();
      NWT.emit('change', { structural: true });
      NWT.emit('selection');
      U.toast('Zeichenfläche geleert');
    });
  }

  /* ------------------------------------------------------------ Objekte */

  function deleteIds(ids) {
    const list = (ids && ids.length) ? ids.slice() : S.selectedIds();
    if (!list.length) return;
    const devCount = list.filter(id => id.startsWith('dev_')).length;
    const affected = new Set();
    list.filter(id => id.startsWith('dev_')).forEach(id => S.connectionsOf(id).forEach(c => affected.add(c)));
    list.filter(id => id.startsWith('con_')).forEach(id => affected.add(id));

    NWT.History.record(list.length > 1 ? 'Objekte löschen' : 'Objekt löschen');
    S.remove(list);
    NWT.emit('change', { structural: true });
    NWT.emit('selection');
    U.toast(list.length + ' Objekt(e) gelöscht' + (devCount && affected.size ? ' · ' + affected.size + ' Verbindung(en) entfernt' : ''));
  }

  /* ------------------------------------- Knoten und Abzweige */

  /**
   * Stützpunkt in eine Leitung einfügen. Er kommt in den Abschnitt,
   * der dem Klick am nächsten liegt — sonst spränge die Leitung an
   * eine völlig andere Stelle.
   */
  function addWaypoint(connId, world) {
    const c = S.con(connId);
    if (!c) return null;
    if (!Array.isArray(c.points)) c.points = [];
    if (c.points.length >= 40) { U.toast('Mehr als 40 Knoten je Leitung sind nicht vorgesehen.', 'warn'); return null; }
    NWT.History.record('Knoten einfügen');
    const at = NWT.Geometry.insertIndexFor(c, world);
    const pt = { x: Math.round(NWT.Viewport.snap(world.x)), y: Math.round(NWT.Viewport.snap(world.y)) };
    c.points.splice(at, 0, pt);
    S.touch();
    S.select(connId);
    NWT.emit('change', { structural: true });
    NWT.emit('selection');
    return pt;
  }

  function removeWaypoint(connId, idx) {
    const c = S.con(connId);
    if (!c || !c.points || !c.points[idx]) return;
    NWT.History.record('Knoten entfernen');
    c.points.splice(idx, 1);
    S.touch();
    NWT.emit('change', { structural: true });
  }

  function clearWaypoints(connId) {
    const c = S.con(connId);
    if (!c || !c.points || !c.points.length) return;
    NWT.History.record('Knoten entfernen');
    c.points = [];
    S.touch();
    NWT.emit('change', { structural: true });
    U.toast('Automatische Führung wiederhergestellt');
  }

  /**
   * Abzweig einfügen: An der Klickstelle entsteht ein Knotenpunkt,
   * die Leitung wird dort geteilt.
   *
   * Ein Abzweig ist bewusst ein echtes Objekt und keine Sonderform der
   * Verbindung. Dadurch gelten Auswahl, Ziehen, Ebenen, Löschen und
   * der Index unverändert — und ab dem Knoten lässt sich mit den
   * gewohnten Mitteln weiterverbinden.
   */
  function insertJunction(connId, world) {
    const c = S.con(connId);
    if (!c) return null;
    const half = NWT.Catalog.JUNCTION / 2;

    NWT.History.record('Abzweig einfügen');
    const j = S.addDevice('junction', Math.round(world.x - half), Math.round(world.y - half));
    j.layer = c.layer;

    /* Die beiden Hälften erben Art und Aussehen der geteilten Leitung —
       ein Abzweig ändert die Leitung nicht, er unterbricht sie nur. */
    const take = (n, isFirst) => {
      if (!n) return;
      n.speed = c.speed; n.vlan = c.vlan; n.layer = c.layer;
      n.description = c.description;
      if (c.style) n.style = U.clone(c.style);
      if (isFirst) { n.sourcePort = c.sourcePort; n.label = c.label; }
      else { n.targetPort = c.targetPort; }
    };
    const c1 = S.addConnection(c.source, j.id, c.type);
    const c2 = S.addConnection(j.id, c.target, c.type);
    take(c1, true);
    take(c2, false);

    S.remove([c.id]);
    S.touch();
    S.select(j.id);
    NWT.emit('change', { structural: true });
    NWT.emit('selection');
    U.toast('Abzweig eingefügt — jetzt mit „Verbinden" weiterzeichnen', 'ok', 4000);
    return j;
  }

  function duplicateSelection(ids) {
    const list = (ids && ids.length) ? ids : S.selectedIds();
    const dupable = list.filter(id => id.startsWith('dev_') || id.startsWith('area_'));
    if (!dupable.length) return;
    NWT.History.record('Duplizieren');
    const created = S.duplicate(dupable);
    S.select(created);
    NWT.emit('change', { structural: true });
    NWT.emit('selection');
    U.toast(created.length + ' Objekt(e) dupliziert');
  }

  function selectAll() {
    const ids = S.project.devices.filter(d => S.isVisible(d)).map(d => d.id)
      .concat(S.project.areas.filter(a => S.isVisible(a)).map(a => a.id));
    S.select(ids);
    R.selection();
  }

  function raise(toFront) {
    const ids = S.selectedDevices();
    if (!ids.length) return;
    NWT.History.record(toFront ? 'In den Vordergrund' : 'In den Hintergrund');
    S.raise(ids, toFront);
    NWT.emit('change', { structural: true });
  }

  /** Erzeugt einen Netzwerkbereich um die aktuelle Auswahl (oder frei). */
  function groupSelection() {
    const devIds = S.selectedDevices();
    let x, y, w, h;
    if (devIds.length) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      devIds.forEach(id => {
        const r = S.deviceRect(S.dev(id));
        minX = Math.min(minX, r.x); minY = Math.min(minY, r.y);
        maxX = Math.max(maxX, r.x + r.w); maxY = Math.max(maxY, r.y + r.h);
      });
      const pad = 34;
      x = minX - pad; y = minY - pad - 16; w = (maxX - minX) + pad * 2; h = (maxY - minY) + pad * 2 + 16;
    } else {
      const r = V.rect();
      const c = V.screenToWorld(r.left + r.width / 2, r.top + r.height / 2);
      x = c.x - 180; y = c.y - 120; w = 360; h = 240;
    }
    NWT.History.record('Bereich erstellen');
    const a = S.addArea(x, y, w, h);
    S.select(a.id);
    NWT.emit('change', { structural: true });
    NWT.emit('selection');
    NWT.Dialogs.editArea(a.id);
  }

  function focusDevice(id) {
    const d = S.dev(id);
    if (!d) return;
    const c = S.deviceCenter(d);
    V.centerOn(c.x, c.y);
    S.select(id);
    R.selection();
    R.flash(id);
  }

  /* --------------------------------------------------------- Ansicht */

  function toggleSetting(key, value) {
    const st = S.project.settings;
    st[key] = value !== undefined ? value : !st[key];
    V.apply();
    NWT.emit('change', { structural: false });
    NWT.emit('settings');
  }

  /* --------------------------------------------------- Beispielprojekt */

  function loadExample() {
    const build = () => {
      const P = Model.emptyProject('Beispielnetzwerk');
      S.setProject(P);
      P10.clearAutosave();

      const mk = (type, x, y, props) => {
        const d = S.addDevice(type, x, y);
        Object.assign(d, props || {});
        return d;
      };

      const internet = mk('internet', 434, 40, { name: 'Internet', status: 'active' });
      const fw = mk('firewall', 434, 210, { name: 'Firewall', ip: '192.168.1.254', hostname: 'fw01', manufacturer: 'pfSense', status: 'active', vlan: '1' });
      const rt = mk('router', 434, 380, { name: 'Router Zentrale', ip: '192.168.1.1', hostname: 'rt01', status: 'active' });
      const sw = mk('switch_managed', 434, 550, { name: 'Core Switch', ip: '192.168.1.2', hostname: 'sw01', status: 'active', room: 'Serverraum', rack: 'R1' });
      const ap = mk('accesspoint', 690, 550, { name: 'Access Point EG', ip: '192.168.1.20', status: 'active' });
      const pc = mk('pc', 190, 750, { name: 'Arbeitsplatz 1', ip: '192.168.1.50', hostname: 'pc01', os: 'Windows 11', status: 'active' });
      const srv = mk('server', 434, 750, { name: 'Server 1', ip: '192.168.1.10', hostname: 'srv01', os: 'Ubuntu 24.04', status: 'active', room: 'Serverraum', rack: 'R1' });
      const nas = mk('nas', 678, 750, { name: 'NAS Backup', ip: '192.168.1.11', hostname: 'nas01', status: 'warning', room: 'Serverraum', rack: 'R1' });

      const link = (a, b, type, sp, tp, vlan) => {
        const c = S.addConnection(a.id, b.id, type);
        if (!c) return null;
        c.sourcePort = sp || ''; c.targetPort = tp || '';
        if (vlan) c.vlan = vlan;
        return c;
      };

      link(internet, fw, 'wan', 'Uplink', 'WAN');
      link(fw, rt, 'gigabit', 'LAN', 'WAN');
      link(rt, sw, 'eth10g', 'Port 1', 'Uplink 1');
      link(sw, ap, 'gigabit', 'Port 8', 'LAN/PoE', '30');
      link(sw, pc, 'gigabit', 'Port 4', 'eth0', '10');
      link(sw, srv, 'eth10g', 'Uplink 2', 'eth0', '20');
      link(sw, nas, 'gigabit', 'Port 6', 'eth0', '20');

      const area = S.addArea(400, 712, 442, 180);
      area.label = 'Serverraum';
      area.sublabel = '192.168.1.0/24 · VLAN 20';
      area.color = '#7c3aed';

      S.reindex();
      S.touch();
      NWT.History.reset();
      NWT.emit('project:meta');
      NWT.emit('change', { structural: true });
      V.zoomToFit();
      U.toast('Beispielnetzwerk geladen', 'ok');
    };

    NWT.ProjectFlow.replace(build, 'Beispielnetzwerk laden');
  }

  return {
    newProject, saveProject, openProject, clearCanvas,
    deleteIds, duplicateSelection, selectAll, raise, groupSelection, focusDevice,
    toggleSetting, loadExample, isEmptyProject,
    addWaypoint, removeWaypoint, clearWaypoints, insertJunction
  };
})();


/* ======================= 13-sidebar.js ======================= */
/* ============================================================
   13 — Seitenleiste: Komponentenkatalog, Suche, Ebenen
   ============================================================ */

NWT.Sidebar = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const C = NWT.Catalog;

  let host, searchInput, layersHost, activeSelect;
  const collapsed = new Set();

  function init() {
    host = U.el('#catalog');
    searchInput = U.el('#catalog-search');
    layersHost = U.el('#layers');
    activeSelect = U.el('#active-layer');

    searchInput.addEventListener('input', () => renderCatalog(searchInput.value));
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Escape') { searchInput.value = ''; renderCatalog(''); e.stopPropagation(); }
    });

    U.el('#layer-add').addEventListener('click', addLayer);
    activeSelect.addEventListener('change', () => {
      S.project.settings.activeLayer = activeSelect.value;
      NWT.emit('change', { structural: false });
    });

    renderCatalog('');
    renderLayers();

    NWT.on('project:replaced', () => { renderLayers(); renderCatalog(searchInput.value); });
    NWT.on('customtypes', () => renderCatalog(searchInput.value));
    NWT.on('change', payload => { if (payload && payload.structural) renderLayers(); });
  }

  /* ------------------------------------------------------------ Katalog */

  function renderCatalog(filter) {
    const q = String(filter || '').trim().toLowerCase();
    host.innerHTML = '';
    let total = 0;

    C.CATEGORIES.forEach(cat => {
      const types = C.typesIn(cat.id).filter(id => {
        if (!q) return true;
        return C.type(id).label.toLowerCase().indexOf(q) >= 0 || id.indexOf(q) >= 0;
      });
      /* Die Kategorie „Eigene Symbole“ bleibt sichtbar — mit der Anlege-Kachel. */
      const isCustomCat = cat.id === 'custom';
      if (!types.length && !(isCustomCat && !q)) return;
      total += types.length;

      const group = document.createElement('div');
      group.className = 'cat-group' + (collapsed.has(cat.id) && !q ? ' collapsed' : '');

      const head = document.createElement('button');
      head.type = 'button';
      head.className = 'cat-head';
      head.innerHTML = '<span class="tw">▼</span><span>' + U.escapeHtml(cat.label) + '</span>';
      head.addEventListener('click', () => {
        if (collapsed.has(cat.id)) collapsed.delete(cat.id); else collapsed.add(cat.id);
        group.classList.toggle('collapsed');
      });
      group.appendChild(head);

      const items = document.createElement('div');
      items.className = 'cat-items';
      types.forEach(id => items.appendChild(catalogItem(id)));
      if (isCustomCat && !q) items.appendChild(newSymbolTile());
      group.appendChild(items);
      host.appendChild(group);
    });

    if (!total) {
      host.innerHTML = '<div class="cat-empty">Keine Komponente gefunden.</div>';
    }
  }

  /** Kachel „+ Neues Symbol“ am Ende der eigenen Symbole. */
  function newSymbolTile() {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'cat-item cat-new';
    el.dataset.tip = 'Eigenes Symbol erstellen';
    el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M12 5v14M5 12h14"/></svg><span>Neues Symbol</span>';
    el.addEventListener('click', () => NWT.Symbols.open());
    return el;
  }

  function catalogItem(typeId) {
    const t = C.type(typeId);
    const custom = !!t.custom;
    const el = document.createElement('div');
    el.className = 'cat-item' + (custom ? ' cat-custom' : '');
    el.setAttribute('role', 'button');
    el.tabIndex = 0;
    el.setAttribute('aria-label', t.label + ' einfügen');
    el.addEventListener('keydown', e => {
      if (e.target !== el || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault(); e.stopPropagation(); NWT.Interaction.addDeviceCentered(typeId);
    });
    el.draggable = true;
    el.dataset.type = typeId;
    el.dataset.tip = t.label;          /* Rohtext; das Hinweisfenster zeigt mehr */
    el.style.color = t.color;
    const ic = NWT.Symbols.iconFor(typeId);
    const graphic = ic.kind === 'image'
      ? '<img class="cat-img" src="' + U.escapeHtml(ic.href) + '" alt="">'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="' + U.escapeHtml(ic.href) + '"></use></svg>';
    el.innerHTML = graphic + '<span>' + U.escapeHtml(t.label) + '</span>' +
      (custom ? '<button type="button" class="cat-edit" title="Symbol bearbeiten">✎</button>' : '');

    if (custom) {
      el.querySelector('.cat-edit').addEventListener('click', e => {
        e.stopPropagation();
        NWT.Symbols.open(typeId);
      });
      el.addEventListener('dblclick', () => NWT.Symbols.open(typeId));
    }

    el.addEventListener('dragstart', e => {
      e.dataTransfer.effectAllowed = 'copy';
      try {
        e.dataTransfer.setData('application/x-nwt-type', typeId);
        e.dataTransfer.setData('text/plain', typeId);
      } catch (err) {
        e.dataTransfer.setData('text', typeId);
      }
    });
    el.addEventListener('click', () => NWT.Interaction.addDeviceCentered(typeId));
    return el;
  }

  /* ------------------------------------------------------------- Ebenen */

  function renderLayers() {
    if (!layersHost) return;
    const P = S.project;
    const counts = {};
    P.devices.forEach(d => { counts[d.layer] = (counts[d.layer] || 0) + 1; });
    P.areas.forEach(a => { counts[a.layer] = (counts[a.layer] || 0) + 1; });

    layersHost.innerHTML = '';
    P.layers.forEach(l => {
      const row = document.createElement('div');
      row.className = 'layer-row';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = l.visible !== false;
      cb.title = 'Ebene ein-/ausblenden';
      cb.addEventListener('change', () => {
        l.visible = cb.checked;
        NWT.emit('change', { structural: true });
      });

      const name = document.createElement('span');
      name.className = 'lname';
      name.textContent = l.name;
      name.title = 'Doppelklick zum Umbenennen';
      name.addEventListener('dblclick', () => renameLayer(l));

      const cnt = document.createElement('span');
      cnt.className = 'lcount';
      cnt.textContent = counts[l.id] || 0;

      const del = document.createElement('button');
      del.className = 'ldel';
      del.textContent = '✕';
      del.title = 'Ebene löschen';
      del.addEventListener('click', () => removeLayer(l));

      row.appendChild(cb); row.appendChild(name); row.appendChild(cnt); row.appendChild(del);
      layersHost.appendChild(row);
    });

    activeSelect.innerHTML = P.layers
      .map(l => '<option value="' + U.escapeHtml(l.id) + '">' + U.escapeHtml(l.name) + '</option>').join('');
    activeSelect.value = P.settings.activeLayer;
    if (!activeSelect.value && P.layers.length) {
      P.settings.activeLayer = P.layers[0].id;
      activeSelect.value = P.layers[0].id;
    }
  }

  function addLayer() {
    NWT.Modal.prompt({ title: 'Neue Ebene', label: 'Name der Ebene', placeholder: 'z. B. Gebäude B' })
      .then(name => {
        if (!name) return;
        NWT.History.record('Ebene hinzufügen');
        const id = 'lay_' + U.slugify(name) + '_' + (S.project.layers.length + 1);
        S.project.layers.push({ id: id, name: name, visible: true });
        S.project.settings.activeLayer = id;
        S.touch();
        NWT.emit('change', { structural: true });
      });
  }

  function renameLayer(layer) {
    NWT.Modal.prompt({ title: 'Ebene umbenennen', label: 'Name', value: layer.name })
      .then(name => {
        if (!name) return;
        NWT.History.record('Ebene umbenennen');
        layer.name = name;
        S.touch();
        NWT.emit('change', { structural: true });
      });
  }

  function removeLayer(layer) {
    const P = S.project;
    if (P.layers.length <= 1) {
      NWT.Modal.error('Die letzte Ebene kann nicht gelöscht werden.');
      return;
    }
    const used = P.devices.filter(d => d.layer === layer.id).length +
                 P.areas.filter(a => a.layer === layer.id).length;
    const fallback = P.layers.find(l => l.id !== layer.id).id;
    const msg = used
      ? 'Die Ebene „' + layer.name + '“ enthält ' + used + ' Objekt(e). Diese werden auf die Ebene „' +
        (S.layer(fallback) || {}).name + '“ verschoben.'
      : 'Ebene „' + layer.name + '“ löschen?';

    NWT.Modal.confirm({ title: 'Ebene löschen', message: msg, confirmLabel: 'Löschen', danger: true })
      .then(ok => {
        if (!ok) return;
        NWT.History.record('Ebene löschen');
        P.devices.forEach(d => { if (d.layer === layer.id) d.layer = fallback; });
        P.areas.forEach(a => { if (a.layer === layer.id) a.layer = fallback; });
        P.connections.forEach(c => { if (c.layer === layer.id) c.layer = fallback; });
        P.layers = P.layers.filter(l => l.id !== layer.id);
        if (P.settings.activeLayer === layer.id) P.settings.activeLayer = fallback;
        S.touch();
        NWT.emit('change', { structural: true });
      });
  }

  return { init, renderCatalog, renderLayers };
})();


/* ======================= 14-minimap.js ======================= */
/* ============================================================
   14 — Minimap: Übersicht und Schnellnavigation
   ============================================================ */

NWT.Minimap = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const V = NWT.Viewport;

  const W = 200, H = 130;
  let svg, content, viewRect, box, transform = null, dragging = false;

  function init() {
    box = U.el('#minimap');
    svg = U.el('#minimap-svg');
    content = U.el('#mm-content');
    viewRect = U.el('#mm-view');

    U.el('#minimap-toggle').addEventListener('click', () => {
      box.classList.toggle('collapsed');
      U.el('#minimap-toggle').textContent = box.classList.contains('collapsed') ? '▴' : '▾';
    });

    svg.addEventListener('pointerdown', e => {
      dragging = true;
      svg.setPointerCapture(e.pointerId);
      jump(e);
    });
    svg.addEventListener('pointermove', e => { if (dragging) jump(e); });
    svg.addEventListener('pointerup', e => {
      dragging = false;
      if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId);
    });

    const redraw = U.rafThrottle(render);
    NWT.on('change', redraw);
    NWT.on('view', redraw);
    NWT.on('ui:minimap', redraw);
    NWT.on('project:replaced', () => { applyVisibility(); redraw(); });
    NWT.on('settings', () => { applyVisibility(); redraw(); });
    applyVisibility();
    render();
  }

  /** Die Übersichtskarte lässt sich in den Einstellungen ganz abschalten. */
  function applyVisibility() {
    if (!box) return;
    box.hidden = S.project.settings.minimap === false;
  }

  function bounds() {
    const b = S.contentBounds(60);
    const r = V.rect();
    const st = S.project.settings;
    /* Auch den aktuellen Ausschnitt einbeziehen, damit der Rahmen sichtbar bleibt. */
    const vx = -st.panX / st.zoom, vy = -st.panY / st.zoom;
    const vw = r.width / st.zoom, vh = Math.max(50, r.height - 24) / st.zoom;
    const minX = Math.min(b.x, vx), minY = Math.min(b.y, vy);
    const maxX = Math.max(b.x + b.w, vx + vw), maxY = Math.max(b.y + b.h, vy + vh);
    return { x: minX, y: minY, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) };
  }

  function render() {
    if (!svg || box.hidden || box.classList.contains('collapsed')) return;
    const b = bounds();
    const k = Math.min(W / b.w, H / b.h);
    const ox = (W - b.w * k) / 2, oy = (H - b.h * k) / 2;
    transform = { k: k, ox: ox, oy: oy, b: b };

    const mx = x => (x - b.x) * k + ox;
    const my = y => (y - b.y) * k + oy;

    let html = '';
    S.project.areas.forEach(a => {
      if (!S.isVisible(a)) return;
      html += '<rect class="mm-area" x="' + mx(a.x) + '" y="' + my(a.y) +
              '" width="' + (a.w * k) + '" height="' + (a.h * k) + '" rx="2"/>';
    });
    S.project.devices.forEach(d => {
      if (!S.isVisible(d)) return;
      const r = S.deviceRect(d);
      html += '<rect class="mm-node" x="' + mx(r.x) + '" y="' + my(r.y) +
              '" width="' + Math.max(1.5, r.w * k) + '" height="' + Math.max(1.5, r.h * k) +
              '" rx="1" fill="' + (S.selection.has(d.id) ? '#2563eb' : '#94a3b8') + '"/>';
    });
    content.innerHTML = html;

    const r = V.rect();
    const st = S.project.settings;
    const vx = -st.panX / st.zoom, vy = -st.panY / st.zoom;
    const vw = r.width / st.zoom, vh = Math.max(50, r.height - 24) / st.zoom;
    viewRect.setAttribute('x', mx(vx));
    viewRect.setAttribute('y', my(vy));
    viewRect.setAttribute('width', Math.max(2, vw * k));
    viewRect.setAttribute('height', Math.max(2, vh * k));
  }

  function jump(e) {
    if (!transform) return;
    const r = svg.getBoundingClientRect();
    /* Bildschirmkoordinaten → viewBox-Koordinaten (preserveAspectRatio: meet). */
    const scale = Math.min(r.width / W, r.height / H);
    const offX = (r.width - W * scale) / 2, offY = (r.height - H * scale) / 2;
    const vbX = (e.clientX - r.left - offX) / scale;
    const vbY = (e.clientY - r.top - offY) / scale;
    const wx = (vbX - transform.ox) / transform.k + transform.b.x;
    const wy = (vbY - transform.oy) / transform.k + transform.b.y;
    V.centerOn(wx, wy);
  }

  return { init, render };
})();


/* ======================= 15-ui.js ======================= */
/* ============================================================
   15 — Bedienoberfläche: Werkzeugleiste, Kontextmenü,
   Tastaturkürzel, Suche, Statusleiste
   ============================================================ */

NWT.UI = (function () {
  const U = NWT.Util;
  const S = NWT.Store;
  const C = NWT.Catalog;
  const V = NWT.Viewport;
  const R = NWT.Render;
  const Cmd = NWT.Commands;

  let ctxEl, searchEl, resultsEl, exportMenu, helpMenu, fileInput;
  let searchIndexActive = -1;
  let searchMatches = [];

  function init() {
    ctxEl = U.el('#contextmenu');
    searchEl = U.el('#device-search');
    resultsEl = U.el('#search-results');
    exportMenu = U.el('#export-menu');
    helpMenu = U.el('#help-menu');
    fileInput = U.el('#file-input');

    bindToolbar();
    bindOptions();
    bindSearch();
    bindKeyboard();
    bindContextMenu();

    NWT.on('mode', updateModeButtons);
    NWT.on('history', updateHistoryButtons);
    NWT.on('selection', updateStatus);
    NWT.on('change', updateStatus);
    NWT.on('project:meta', updateTitle);
    NWT.on('project:replaced', () => { updateTitle(); updateOptions(); });
    NWT.on('settings', updateOptions);
    NWT.on('setups', renderSetupMenu);
    NWT.on('theme', updateOptions);
    NWT.on('ui:coords', w => {
      U.el('#st-coords').textContent = 'x ' + Math.round(w.x) + ' · y ' + Math.round(w.y);
    });
    NWT.on('ui:connecthint', text => {
      const h = U.el('#connect-hint');
      if (!text) { h.hidden = true; return; }
      h.textContent = text;
      h.hidden = false;
    });
    NWT.on('ui:closemenus', closeMenus);
    const storageStatus = () => {
      const el = U.el('#st-storage');
      const st = NWT.Persistence.status();
      el.textContent = st.failure || (st.dirty ? 'Änderungen · ' : '') + (st.lastSaved ? 'Sicherung ' + new Date(st.lastSaved).toLocaleTimeString('de-DE') : 'Noch nicht gesichert');
      el.dataset.failed = st.failure ? 'true' : 'false';
    };
    NWT.on('storage:status', storageStatus);
    storageStatus();

    window.addEventListener('resize', U.rafThrottle(() => { V.apply(); NWT.emit('ui:minimap'); }));
    document.addEventListener('click', e => {
      if (!e.target.closest('#contextmenu')) hideContext();
      if (!e.target.closest('.tb-menu-wrap')) hideDropdowns();
      if (!e.target.closest('.tb-search')) resultsEl.hidden = true;
    });

    updateModeButtons(S.mode);
    updateHistoryButtons();
    updateStatus();
    updateTitle();
    updateOptions();
    renderSetupMenu();
    if (!NWT.Persistence.available()) {
      U.el('#st-storage').textContent = 'Browser-Speicher nicht verfügbar — bitte per Export sichern';
    }
  }

  /* ------------------------------------------------------ Werkzeugleiste */

  const ACTIONS = {
    'new': () => Cmd.newProject(),
    'save': () => Cmd.saveProject(),
    'load': () => Cmd.openProject(),
    'import': () => fileInput.click(),
    'print': () => NWT.Exchange.print(),
    'export-menu': () => toggleDropdown(exportMenu),
    'help-menu': () => toggleDropdown(helpMenu),
    'analysis-menu': () => toggleDropdown(U.el('#analysis-menu')),
    'analysis-paste': () => NWT.Analysis.pasteDialog(),
    'analysis-file': () => NWT.Analysis.pickFile(),
    'analysis-script': () => NWT.Analysis.showScript(),
    'dashboard': () => NWT.Dashboard.open('overview'),
    'export-json': () => NWT.Exchange.exportJson(),
    'recovery': () => NWT.Recovery.open(),
    'review': () => NWT.Workbench.open('checks'),
    'inventory': () => NWT.Workbench.open('devices'),
    'layout': () => NWT.Layout.open(),
    'report': () => NWT.Workbench.exportReport(),
    'export-svg': () => NWT.Exchange.exportSvg(),
    'export-png': () => NWT.Exchange.exportPng(2),
    'export-image': () => NWT.Exchange.exportImage(),
    'clear': () => Cmd.clearCanvas(),
    'mode-select': () => S.setMode('select'),
    'mode-connect': () => S.setMode('connect'),
    'mode-pan': () => S.setMode('pan'),
    'undo': () => NWT.History.undo(),
    'redo': () => NWT.History.redo(),
    'zoom-in': () => V.zoomBy(1.2),
    'zoom-out': () => V.zoomBy(1 / 1.2),
    'zoom-reset': () => V.resetZoom(),
    'zoom-fit': () => V.zoomToFit(),
    'info': () => NWT.Dialogs.projectInfo(),
    'handbook': () => NWT.HelpDoc.open(),
    'settings-menu': () => toggleDropdown(U.el('#settings-menu')),
    'settings': () => NWT.Settings.open(),
    'theme': () => {
      const next = NWT.Theme.cycle();
      U.toast('Design: ' + NWT.Theme.LABELS[next]);
    },
    'privacy': () => NWT.Privacy.toggle(),
    'setup-save': () => saveSetupDialog(),
    'help': () => NWT.Dialogs.help()
  };

  /** Fragt nach einem Namen und sichert die aktuellen Einstellungen. */
  function saveSetupDialog() {
    NWT.Modal.prompt({
      title: 'Einstellungen als Setup sichern',
      subtitle: 'Ansicht, Darstellung, Verbindungsarten, Design und Hinweisfenster — ohne den Netzplan.',
      label: 'Name des Setups',
      value: NWT.Setups.active(),
      placeholder: 'z. B. Präsentation',
      submitLabel: 'Sichern'
    }).then(name => {
      if (!name) return;
      const exists = NWT.Setups.names().indexOf(name.trim()) >= 0;
      const write = () => {
        try {
          NWT.Setups.save(name);
          U.toast('Setup „' + name.trim() + '“ gesichert', 'ok');
        } catch (e) {
          NWT.Modal.error('Das Setup konnte nicht gesichert werden.', e.message);
        }
      };
      if (!exists) { write(); return; }
      NWT.Modal.confirm({
        title: 'Setup überschreiben?',
        message: 'Es gibt bereits ein Setup namens „' + name.trim() + '“. Überschreiben?',
        confirmLabel: 'Überschreiben', danger: true
      }).then(ok => { if (ok) write(); });
    });
  }

  /** Baut die Setup-Einträge im Zahnrad-Menü. */
  function renderSetupMenu() {
    const host = U.el('#setup-list');
    if (!host) return;
    const names = NWT.Setups.names();
    const act = NWT.Setups.active();
    host.innerHTML = names.length
      ? names.map(n => '<button data-setup="' + U.escapeHtml(n) + '">' +
          (n === act ? '● ' : '') + U.escapeHtml(n) + '</button>').join('')
      : '<div class="tb-menu-empty">noch keine gesichert</div>';
    host.querySelectorAll('[data-setup]').forEach(b =>
      b.addEventListener('click', () => {
        hideDropdowns();
        NWT.Setups.apply(b.getAttribute('data-setup'));
      }));
  }

  const DROPDOWN_ACTS = { 'export-menu': 1, 'help-menu': 1, 'analysis-menu': 1, 'settings-menu': 1 };

  function hideDropdowns() {
    U.els('.tb-menu').forEach(m => { m.hidden = true; });
  }

  function toggleDropdown(menu) {
    const wasHidden = menu.hidden;
    hideDropdowns();
    menu.hidden = !wasHidden;
  }

  function bindToolbar() {
    U.el('#toolbar').addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.getAttribute('data-act');
      /* Ein Menüeintrag schließt sein Menü, ein Menüknopf schaltet nur um. */
      if (!DROPDOWN_ACTS[act]) hideDropdowns();
      const fn = ACTIONS[act];
      if (fn) fn();
    });

    fileInput.addEventListener('change', () => {
      const f = fileInput.files && fileInput.files[0];
      if (f) NWT.Exchange.importFile(f);
      fileInput.value = '';
    });
  }

  /** Füllt die Typliste neben „Verbinden“ — gruppiert wie im Dialog. */
  function fillConnTypes() {
    const sel = U.el('#opt-conntype');
    let html = '';
    let group = null;
    C.connTypeOptions().forEach(o => {
      if (o.group !== group) {
        if (group !== null) html += '</optgroup>';
        html += '<optgroup label="' + U.escapeHtml(o.group) + '">';
        group = o.group;
      }
      html += '<option value="' + U.escapeHtml(o.value) + '">' + U.escapeHtml(o.label) + '</option>';
    });
    if (group !== null) html += '</optgroup>';
    sel.innerHTML = html;
  }

  function bindOptions() {
    fillConnTypes();
    U.el('#opt-conntype').addEventListener('change', e => {
      S.project.settings.defaultConnType = e.target.value;
      /* Wer hier auswählt, will gleich zeichnen. */
      S.setMode('connect');
      NWT.emit('change', { structural: false });
      NWT.emit('settings');
    });

    U.el('#opt-grid').addEventListener('change', e => Cmd.toggleSetting('grid', e.target.checked));
    U.el('#opt-snap').addEventListener('change', e => Cmd.toggleSetting('snap', e.target.checked));
    U.el('#opt-photos').addEventListener('change', e => {
      NWT.History.record('Fotoanzeige');
      S.project.settings.photos = e.target.checked;
      NWT.emit('change', { structural: true });
    });
    U.el('#opt-tips').addEventListener('change', e => {
      NWT.Tooltip.setEnabled(e.target.checked);
      U.toast(e.target.checked ? 'Hinweisfenster eingeschaltet' : 'Hinweisfenster ausgeschaltet');
    });
    U.el('#opt-routing').addEventListener('change', e => {
      NWT.History.record('Linienführung');
      S.project.settings.routing = e.target.value;
      NWT.emit('change', { structural: true });
    });
  }

  function updateOptions() {
    const st = S.project.settings;
    U.el('#opt-grid').checked = !!st.grid;
    U.el('#opt-snap').checked = !!st.snap;
    U.el('#opt-routing').value = st.routing;
    U.el('#opt-photos').checked = st.photos !== false;
    U.el('#opt-tips').checked = NWT.Tooltip.isEnabled();
    const pb = U.el('#settings-menu [data-act="privacy"]');
    if (pb) pb.textContent = (NWT.Privacy.active() ? '● ' : '') + 'Vertrauliche Angaben maskieren';

    const type = C.CONNECTION_TYPES[st.defaultConnType] ? st.defaultConnType : 'gigabit';
    U.el('#opt-conntype').value = type;
    const eff = S.edgeStyle({ type: type });
    const line = U.el('#conn-swatch');
    line.setAttribute('stroke', eff.color);
    line.setAttribute('stroke-width', Math.min(6, eff.width));
    if (eff.dash) line.setAttribute('stroke-dasharray', eff.dash);
    else line.removeAttribute('stroke-dasharray');
  }

  function updateModeButtons(mode) {
    U.els('.tb-btn.mode').forEach(b => b.classList.toggle('active', b.getAttribute('data-mode') === mode));
    const names = { select: 'Auswahl', connect: 'Verbinden', pan: 'Hand' };
    U.el('#st-mode').textContent = names[mode] || mode;
    NWT.emit('ui:connecthint', mode === 'connect' ? 'Erstes Gerät wählen …' : null);
  }

  function updateHistoryButtons() {
    U.el('[data-act="undo"]').disabled = !NWT.History.canUndo();
    U.el('[data-act="redo"]').disabled = !NWT.History.canRedo();
  }

  function updateTitle() {
    U.el('#project-title').textContent = S.project.name || 'Unbenannt';
    const info = S.project.info || {};
    const bits = [info.company, info.location].filter(Boolean).join(' · ');
    U.el('#project-sub').textContent = bits || 'Netzwerk-Topologie-Tool';
    document.title = (S.project.name || 'Unbenannt') + ' — Netzwerk-Topologie-Tool';
  }

  const updateStatus = U.rafThrottle(function () {
    const P = S.project;
    const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
    /* Text, Grafik und Abzweige sind keine Geräte — sie getrennt zu
       zählen hält die Gerätezahl aussagekräftig. */
    let geraete = 0, deco = 0, abzweige = 0;
    P.devices.forEach(d => {
      const sh = C.shapeOf(d.type);
      if (sh === 'device') geraete++;
      else if (sh === 'junction') abzweige++;
      else deco++;
    });
    const parts = [
      plural(geraete, 'Gerät', 'Geräte'),
      plural(P.connections.length, 'Verbindung', 'Verbindungen'),
      plural(P.areas.length, 'Bereich', 'Bereiche')
    ];
    if (abzweige) parts.push(plural(abzweige, 'Abzweig', 'Abzweige'));
    if (deco) parts.push(plural(deco, 'Text/Grafik', 'Text/Grafik'));
    if (NWT.Privacy.active()) parts.push('maskiert');
    U.el('#st-counts').textContent = parts.join(' · ');
    const sel = S.selectedIds();
    let text = 'Keine Auswahl';
    if (sel.length === 1) {
      const o = S.obj(sel[0]);
      if (o) {
        const kind = S.kindOf(sel[0]);
        text = kind === 'device' ? (o.name + ' · ' + C.typeLabel(o.type) + (o.ip ? ' · ' + o.ip : ''))
             : kind === 'connection' ? ('Verbindung ' + C.connType(o.type).label + (o.vlan ? ' · VLAN ' + o.vlan : ''))
             : ('Bereich ' + o.label);
      }
    } else if (sel.length > 1) {
      text = sel.length + ' Objekte ausgewählt';
    }
    U.el('#st-selection').textContent = text;
    updateHistoryButtons();
  });

  /* --------------------------------------------------------------- Suche */

  function bindSearch() {
    searchEl.addEventListener('input', () => runSearch(searchEl.value));
    searchEl.addEventListener('focus', () => { if (searchEl.value) runSearch(searchEl.value); });
    searchEl.addEventListener('keydown', e => {
      if (e.key === 'Escape') { searchEl.value = ''; resultsEl.hidden = true; searchEl.blur(); return; }
      if (!searchMatches.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); moveSearch(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveSearch(-1); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        const pick = searchMatches[Math.max(0, searchIndexActive)];
        if (pick) { Cmd.focusDevice(pick.id); resultsEl.hidden = true; }
      }
    });
  }

  function moveSearch(delta) {
    searchIndexActive = U.clamp(searchIndexActive + delta, 0, searchMatches.length - 1);
    Array.from(resultsEl.children).forEach((el, i) => el.classList.toggle('on', i === searchIndexActive));
  }

  function runSearch(q) {
    q = String(q || '').trim().toLowerCase();
    if (!q) { resultsEl.hidden = true; searchMatches = []; return; }
    searchMatches = S.project.devices.filter(d => {
      return [d.name, d.ip, d.ipv6, d.hostname, d.mac, d.room, d.rack, d.location, d.vlan,
              d.protocol, d.manufacturer, d.model, C.typeLabel(d.type)]
        .some(v => String(v || '').toLowerCase().indexOf(q) >= 0);
    }).slice(0, 40);
    searchIndexActive = searchMatches.length ? 0 : -1;

    resultsEl.innerHTML = searchMatches.length
      ? searchMatches.map((d, i) =>
          '<div class="sr-item' + (i === 0 ? ' on' : '') + '" data-id="' + d.id + '">' +
            '<b>' + U.escapeHtml(d.name) + '</b>' +
            '<small>' + U.escapeHtml(C.typeLabel(d.type)) +
            (d.ip ? ' · ' + U.escapeHtml(d.ip) : '') +
            (d.room ? ' · ' + U.escapeHtml(d.room) : '') + '</small>' +
          '</div>').join('')
      : '<div class="sr-empty">Kein Gerät gefunden.</div>';
    resultsEl.hidden = false;

    Array.from(resultsEl.querySelectorAll('.sr-item')).forEach(item => {
      item.addEventListener('click', () => {
        Cmd.focusDevice(item.getAttribute('data-id'));
        resultsEl.hidden = true;
      });
    });
  }

  /* -------------------------------------------------------- Kontextmenü */

  function bindContextMenu() {
    NWT.on('ui:contextmenu', showContext);
  }

  function closeMenus() {
    hideContext();
    hideDropdowns();
    if (resultsEl) resultsEl.hidden = true;
  }

  function hideContext() { if (ctxEl) ctxEl.hidden = true; }

  function item(label, kbd, fn, danger) {
    return { label: label, kbd: kbd, fn: fn, danger: danger };
  }

  function showContext(ev) {
    const hit = ev.hit;
    const sel = S.selectedIds();
    let title = '';
    let entries = [];

    if (hit.kind === 'device') {
      const d = S.dev(hit.id);
      title = sel.length > 1 ? sel.length + ' Objekte' : (d ? d.name : 'Gerät');
      const hasPhoto = !!(d && d.image);
      /* Fotos ergeben nur auf einer Gerätekachel Sinn — ein Abzweig,
         ein Textfeld oder ein Rahmen tragen keines. */
      const shape = d ? C.shapeOf(d.type) : 'device';
      const echtesGeraet = shape === 'device';
      entries = [
        item('Eigenschaften …', '⏎⏎', () => NWT.Dialogs.editDevice(hit.id)),
        shape === 'shape' ? false : item('Verbinden ab hier', 'C', () => NWT.Interaction.startConnectFrom(hit.id)),
        item('Duplizieren', 'Strg+D', () => Cmd.duplicateSelection()),
        null,
        echtesGeraet ? item(hasPhoto ? 'Foto ersetzen …' : 'Foto hinzufügen …', '', () => NWT.Images.pickFor(hit.id)) : false,
        hasPhoto ? item('Foto entfernen', '', () => NWT.Images.remove(hit.id)) : false,
        item('In den Vordergrund', '', () => Cmd.raise(true)),
        item('In den Hintergrund', '', () => Cmd.raise(false)),
        item('Bereich um Auswahl', 'Strg+G', () => Cmd.groupSelection()),
        null,
        item('Löschen', 'Entf', () => Cmd.deleteIds(), true)
      ];
    } else if (hit.kind === 'connection') {
      const c = S.con(hit.id);
      title = c ? C.connType(c.type).label : 'Verbindung';
      const hatKnoten = !!(c && c.points && c.points.length);
      entries = [
        item('Eigenschaften …', '⏎⏎', () => NWT.Dialogs.editConnection(hit.id)),
        item('Beschriftung ändern …', '', () => changeLabel(hit.id)),
        item('Verbindungstyp ändern …', '', () => changeConnType(hit.id)),
        item('Darstellung ändern …', '', () => changeConnStyle(hit.id)),
        null,
        item('Knoten hier einfügen', '', () => Cmd.addWaypoint(hit.id, ev.world)),
        item('Abzweig hier einfügen', '', () => Cmd.insertJunction(hit.id, ev.world))
      ];
      /* Nur anbieten, wenn es etwas zu entfernen gibt — ein toter
         Eintrag im Menü ist schlimmer als ein fehlender. */
      if (hatKnoten) {
        entries.push(item('Alle Knoten entfernen (' + c.points.length + ')', '',
                          () => Cmd.clearWaypoints(hit.id)));
      }
      entries.push(null);
      entries.push(item('Löschen', 'Entf', () => Cmd.deleteIds([hit.id]), true));
    } else if (hit.kind === 'area' || hit.kind === 'area-handle') {
      const a = S.area(hit.id);
      title = a ? a.label : 'Bereich';
      entries = [
        item('Eigenschaften …', '⏎⏎', () => NWT.Dialogs.editArea(hit.id)),
        item('Duplizieren', 'Strg+D', () => Cmd.duplicateSelection([hit.id])),
        null,
        item('Löschen', 'Entf', () => Cmd.deleteIds([hit.id]), true)
      ];
    } else {
      title = 'Zeichenfläche';
      entries = [
        item('Alles auswählen', 'Strg+A', () => Cmd.selectAll()),
        item('Netzwerkbereich einfügen', 'Strg+G', () => Cmd.groupSelection()),
        null,
        item('Alles einpassen', 'Strg+1', () => V.zoomToFit()),
        item('Zoom 100 %', 'Strg+0', () => V.resetZoom()),
        null,
        item('Raster ' + (S.project.settings.grid ? 'ausblenden' : 'anzeigen'), '', () => Cmd.toggleSetting('grid')),
        item('Am Raster ausrichten ' + (S.project.settings.snap ? 'aus' : 'ein'), '', () => Cmd.toggleSetting('snap')),
        null,
        item('Zeichenfläche löschen', '', () => Cmd.clearCanvas(), true)
      ];
    }

    /* Doppelte oder führende Trenner entfernen. */
    /* false heißt „gibt es hier nicht", null heißt Trennlinie. Erst
       das Nichtvorhandene raus, dann doppelte und führende Trenner. */
    entries = entries.filter(e => e !== false);
    entries = entries.filter((e, i, a) => e !== null || (i > 0 && a[i - 1] !== null));
    while (entries.length && entries[entries.length - 1] === null) entries.pop();

    ctxEl.innerHTML = '<div class="ctx-title">' + U.escapeHtml(title) + '</div>' +
      entries.map((e, i) => e
        ? '<button data-i="' + i + '"' + (e.danger ? ' class="danger"' : '') + '>' +
          '<span>' + U.escapeHtml(e.label) + '</span>' +
          (e.kbd ? '<kbd>' + U.escapeHtml(e.kbd) + '</kbd>' : '') + '</button>'
        : '<div class="sep"></div>').join('');

    ctxEl.hidden = false;
    /* Innerhalb des Fensters halten. */
    const w = ctxEl.offsetWidth, h = ctxEl.offsetHeight;
    ctxEl.style.left = Math.min(ev.x, window.innerWidth - w - 8) + 'px';
    ctxEl.style.top = Math.min(ev.y, window.innerHeight - h - 8) + 'px';

    ctxEl.querySelectorAll('button[data-i]').forEach(btn => {
      btn.addEventListener('click', () => {
        const e = entries[parseInt(btn.getAttribute('data-i'), 10)];
        hideContext();
        if (e && e.fn) e.fn();
      });
    });
  }

  function changeLabel(id) {
    const c = S.con(id);
    if (!c) return;
    NWT.Modal.prompt({ title: 'Beschriftung ändern', label: 'Beschriftung', value: c.label })
      .then(v => {
        if (v == null) return;
        NWT.History.record('Beschriftung ändern');
        c.label = v;
        S.touch();
        NWT.emit('change', { structural: true });
      });
  }

  /** Schnellzugriff aus dem Kontextmenü: nur Farbe, Stärke und Muster. */
  function changeConnStyle(id) {
    const c = S.con(id);
    if (!c) return;
    const eff = S.edgeStyle(c);
    NWT.Modal.form({
      title: 'Darstellung der Verbindung',
      subtitle: C.connType(c.type).label,
      fields: [
        { key: 'color', label: 'Farbe', type: 'color' },
        { key: 'width', label: 'Linienstärke', type: 'number', min: 0.5, max: 12, step: 0.1 },
        { key: 'dash', label: 'Strichmuster', wide: true, type: 'select',
          options: C.DASH_PRESETS.map(p => ({ value: p.value, label: p.label })) }
      ],
      values: { color: eff.color, width: eff.width, dash: eff.dash },
      width: '460px',
      extraButtons: [{ label: 'Auf Typ zurücksetzen', left: true, value: { __reset: true } }]
    }).then(res => {
      if (!res) return;
      NWT.History.record('Darstellung ändern');
      if (res.__reset) {
        delete c.style;
      } else {
        const base = S.edgeStyle({ type: c.type });
        const chosen = { color: res.color, width: Number(res.width) || base.width, dash: res.dash };
        if (chosen.color.toLowerCase() === base.color.toLowerCase() &&
            Math.abs(chosen.width - base.width) < 0.001 && chosen.dash === base.dash) {
          delete c.style;
        } else {
          c.style = chosen;
        }
      }
      S.touch();
      NWT.emit('change', { structural: true });
    });
  }

  function changeConnType(id) {
    const c = S.con(id);
    if (!c) return;
    NWT.Modal.form({
      title: 'Verbindungstyp ändern',
      fields: [{ key: 'type', label: 'Typ', wide: true, type: 'select', options: C.connTypeOptions() }],
      values: { type: c.type },
      width: '420px'
    }).then(res => {
      if (!res) return;
      NWT.History.record('Verbindungstyp ändern');
      const prevSpeed = C.connType(c.type).speed;
      c.type = res.type;
      if (!c.speed || c.speed === prevSpeed) c.speed = C.connType(c.type).speed;
      S.touch();
      NWT.emit('change', { structural: true });
    });
  }

  /* ---------------------------------------------------- Tastaturkürzel */

  function isTyping(t) {
    return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  }

  function bindKeyboard() {
    window.addEventListener('keydown', e => {
      const mod = e.ctrlKey || e.metaKey;

      if (e.key === 'Escape') {
        if (NWT.Modal.isOpen()) return;          // Dialog behandelt ESC selbst
        if (NWT.Settings.isOpen()) { NWT.Settings.close(); return; }
        if (NWT.Dashboard.isOpen()) { NWT.Dashboard.close(); return; }
        if (NWT.HelpDoc.isOpen()) { NWT.HelpDoc.close(); return; }
        if (!ctxEl.hidden) { hideContext(); return; }
        if (NWT.Interaction.cancel()) return;
        S.clearSelection();
        R.selection();
        return;
      }

      if (e.key === 'F1') {
        e.preventDefault();
        if (e.shiftKey) NWT.HelpDoc.open(); else NWT.Dialogs.help();
        return;
      }
      if (mod && e.shiftKey && e.key.toLowerCase() === 'd') {
        e.preventDefault();
        if (NWT.Dashboard.isOpen()) NWT.Dashboard.close(); else NWT.Dashboard.open('overview');
        return;
      }
      if (mod && (e.key === ',' || e.code === 'Comma')) {
        e.preventDefault();
        if (NWT.Settings.isOpen()) NWT.Settings.close(); else NWT.Settings.open();
        return;
      }
      if (NWT.Modal.isOpen() || NWT.HelpDoc.isOpen() ||
          NWT.Dashboard.isOpen() || NWT.Settings.isOpen()) return;

      if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); Cmd.saveProject(); return; }
      if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); Cmd.openProject(); return; }
      if (mod && e.key.toLowerCase() === 'f') { e.preventDefault(); searchEl.focus(); searchEl.select(); return; }

      if (isTyping(e.target)) return;

      if (mod && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) NWT.History.redo(); else NWT.History.undo();
        return;
      }
      if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); NWT.History.redo(); return; }
      if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); Cmd.duplicateSelection(); return; }
      if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); Cmd.selectAll(); return; }
      if (mod && e.key.toLowerCase() === 'g') { e.preventDefault(); Cmd.groupSelection(); return; }
      if (mod && e.key.toLowerCase() === 'e') { e.preventDefault(); NWT.Exchange.exportJson(); return; }
      if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); Cmd.newProject(); return; }

      if (mod && (e.key === '+' || e.key === '=')) { e.preventDefault(); V.zoomBy(1.2); return; }
      if (mod && e.key === '-') { e.preventDefault(); V.zoomBy(1 / 1.2); return; }
      if (mod && e.key === '0') { e.preventDefault(); V.resetZoom(); return; }
      if (mod && e.key === '1') { e.preventDefault(); V.zoomToFit(); return; }

      if (mod) return;

      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (S.selection.size) { e.preventDefault(); Cmd.deleteIds(); }
        return;
      }
      const k = e.key.toLowerCase();
      if (k === 'v') S.setMode('select');
      else if (k === 'c') S.setMode('connect');
      else if (k === 'h') S.setMode('pan');
      else if (k === 'g') Cmd.toggleSetting('grid');
      else if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown'].indexOf(k) >= 0) {
        const ids = S.selectedIds().filter(id => id.startsWith('dev_') || id.startsWith('area_'));
        if (!ids.length) return;
        e.preventDefault();
        const step = e.shiftKey ? S.project.settings.gridSize : 1;
        const dx = k === 'arrowleft' ? -step : k === 'arrowright' ? step : 0;
        const dy = k === 'arrowup' ? -step : k === 'arrowdown' ? step : 0;
        NWT.History.record('Objekt verschieben');
        ids.forEach(id => {
          const o = S.obj(id);
          if (o) { o.x += dx; o.y += dy; }
        });
        S.touch();
        NWT.emit('change', { structural: false });
        ids.forEach(id => { if (id.startsWith('dev_')) R.moveNode(id); else R.moveArea(id); });
        R.updateEdgesFor(ids.filter(id => id.startsWith('dev_')));
      }
    });
  }

  return { init, updateStatus, updateTitle, closeMenus };
})();


/* ======================= 16-theme.js ======================= */
/* ============================================================
   16 — Design (hell / dunkel / automatisch)

   Das Design ist eine Arbeitsplatzvorliebe und liegt in
   NWT.Prefs, nicht im Projekt: wer eine JSON-Datei weitergibt,
   zwingt dem Empfänger nicht sein dunkles Design auf.

   Das Attribut wird bereits beim Einlesen dieser Datei gesetzt,
   nicht erst in init() — sonst blitzt beim Start kurz die helle
   Oberfläche auf.
   ============================================================ */

NWT.Theme = (function () {
  const MODES = ['light', 'dark', 'auto'];
  const LABELS = { light: 'Hell', dark: 'Dunkel', auto: 'Automatisch (System)' };

  let media = null;

  function stored() {
    /* NWT.Prefs liegt in 10-persistence.js und ist hier noch nicht geladen —
       deshalb einmal direkt lesen. */
    try {
      const raw = window.localStorage.getItem('nwt.prefs');
      const obj = raw ? JSON.parse(raw) : null;
      const v = obj && obj.theme;
      return MODES.indexOf(v) >= 0 ? v : 'light';
    } catch (e) {
      return 'light';
    }
  }

  function systemDark() {
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  /** Der tatsächlich wirksame Zustand: 'light' oder 'dark'. */
  function effective(mode) {
    const m = mode || get();
    return m === 'auto' ? (systemDark() ? 'dark' : 'light') : m;
  }

  function paint(mode) {
    document.documentElement.setAttribute('data-theme', effective(mode));
  }

  function get() {
    if (NWT.Prefs) return NWT.Prefs.get('theme', 'light');
    return stored();
  }

  function set(mode) {
    const m = MODES.indexOf(mode) >= 0 ? mode : 'light';
    if (NWT.Prefs) NWT.Prefs.set('theme', m);
    paint(m);
    NWT.emit('theme', m);
    NWT.emit('settings');
  }

  /** Reihum hell → dunkel → automatisch. */
  function cycle() {
    const next = MODES[(MODES.indexOf(get()) + 1) % MODES.length];
    set(next);
    return next;
  }

  function toggle() {
    set(effective() === 'dark' ? 'light' : 'dark');
  }

  function init() {
    paint(get());
    /* Im Modus „automatisch“ auf den Systemwechsel reagieren. */
    if (window.matchMedia) {
      media = window.matchMedia('(prefers-color-scheme: dark)');
      const onChange = () => { if (get() === 'auto') paint('auto'); };
      if (media.addEventListener) media.addEventListener('change', onChange);
      else if (media.addListener) media.addListener(onChange);
    }
  }

  /* Sofort anwenden, noch bevor die Oberfläche steht. */
  paint(stored());

  return { init, get, set, cycle, toggle, effective, MODES, LABELS };
})();
